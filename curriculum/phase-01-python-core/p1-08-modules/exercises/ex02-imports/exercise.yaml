id: p1-08-ex02
kind: fill
title:
  en: "Fill in: imports and standard-library calls"
  vi: "Điền chỗ trống: import và hàm thư viện chuẩn"
difficulty: 1
tags: [modules, stdlib]
hints:
  en:
    - |
      This uses §2 (three ways to import) and §3 (the tour of modules). Every `___` is either a module name, a name to import, or a function/attribute inside a module.
      For example `top_words("a b a", 1)` must return `[("a", 2)]`, and `days_until` must return a plain number of days.
    - |
      Plan:
      1. The first three lines import `random`, `Counter` (from `collections`) and `timedelta` (from `datetime`).
      2. `top_words`: build a `Counter` of the words, then ask it for the `most_common`.
      3. `days_until`: subtracting two dates gives a `timedelta`; its `.days` is the number.
      4. `deadline_after`: `timedelta(days=...)` is a span of time you can add to a date.
      5. `pick`: `random.Random(seed)` makes a private generator, and `.choice(items)` picks from the list.
    - |
      Code shape, shown on other names (not the answers):
      ```python
      from statistics import median      # one name imported from a module
      import math

      median([3, 1, 2])                  # call a name you imported
      math.floor(2.7)                    # call a function through its module
      Counter("banana").most_common(1)   # count, then ask for the top ones
      (date(2025, 4, 1) - date(2025, 3, 1)).days   # subtract dates, read .days
      date(2025, 1, 1) + timedelta(days=3)         # add a span of time to a date
      rng = random.Random(5)             # a private generator with a seed
      rng.randint(1, 6)                  # then call a method on it
      ```
      Now work out which name fits each `...` in the skeleton.
  vi:
    - |
      Bài này dùng §2 (ba cách import) và §3 (tour các module). Mỗi `___` là tên module, tên cần import, hoặc hàm/thuộc tính bên trong một module.
      Ví dụ `top_words("a b a", 1)` phải trả về `[("a", 2)]`, và `days_until` phải trả về một số nguyên (số ngày), không phải `timedelta`.
    - |
      Kế hoạch:
      1. Ba dòng đầu import `random`, `Counter` (từ `collections`) và `timedelta` (từ `datetime`).
      2. `top_words`: tạo một `Counter` từ các từ, rồi hỏi nó `most_common`.
      3. `days_until`: trừ hai ngày cho ra một `timedelta`; `.days` của nó là con số cần lấy.
      4. `deadline_after`: `timedelta(days=...)` là một khoảng thời gian bạn cộng được vào một ngày.
      5. `pick`: `random.Random(seed)` tạo bộ sinh số riêng, và `.choice(items)` chọn một phần tử trong list.
    - |
      Khung code, minh họa trên tên khác (không phải đáp án):
      ```python
      from statistics import median      # import một tên từ module
      import math

      median([3, 1, 2])                  # gọi tên đã import
      math.floor(2.7)                    # gọi hàm qua tên module
      Counter("banana").most_common(1)   # đếm, rồi hỏi các phần tử đứng đầu
      (date(2025, 4, 1) - date(2025, 3, 1)).days   # trừ hai ngày, lấy .days
      date(2025, 1, 1) + timedelta(days=3)         # cộng một khoảng thời gian vào ngày
      rng = random.Random(5)             # bộ sinh riêng có seed
      rng.randint(1, 6)                  # rồi gọi method của nó
      ```
      Giờ hãy tự tìm tên hợp với mỗi `...` trong khung.
