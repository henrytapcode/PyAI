questions:
  - id: p4-04-q01
    type: mcq
    tags: [plotting]
    difficulty: 1
    answer: 1
    en:
      prompt: "In matplotlib, what is the difference between a `Figure` and an `Axes`?"
      options:
        - "A `Figure` holds one line and an `Axes` holds the legend only"
        - "A `Figure` is the outer canvas, while an `Axes` is one individual plot area inside it"
        - "A `Figure` is only for bar charts and an `Axes` is only for line charts"
        - "They are two names for the exact same object"
      explanation: "The `Figure` is the whole outer window or canvas; an `Axes` is a single chart inside that canvas with its own x-axis, y-axis, title, and data."
    vi:
      prompt: "Trong matplotlib, `Figure` và `Axes` khác nhau thế nào?"
      options:
        - "`Figure` chỉ chứa một đường vẽ, còn `Axes` chỉ chứa hộp chú thích"
        - "`Figure` là khung canvas bên ngoài, còn `Axes` là một vùng biểu đồ cụ thể nằm bên trong nó"
        - "`Figure` chỉ dùng cho biểu đồ cột, còn `Axes` chỉ dùng cho biểu đồ đường"
        - "Đây chỉ là hai tên gọi khác nhau của cùng một đối tượng"
      explanation: "`Figure` là toàn bộ khung chứa bên ngoài; `Axes` là một biểu đồ đơn nằm bên trong khung đó với trục x, trục y, tiêu đề và dữ liệu riêng."

  - id: p4-04-q02
    type: output
    tags: [plotting]
    difficulty: 1
    code: |
      import matplotlib.pyplot as plt
      fig, ax = plt.subplots()
      ax.plot([1, 2, 3], [0.9, 0.5, 0.3])
      ax.set_title("Training loss")
      print(ax.get_title())
    answer: "Training loss"
    en:
      prompt: "What does this code print?"
      explanation: "`ax.set_title(\"Training loss\")` stores the title string on `ax`, and `ax.get_title()` returns `\"Training loss\"`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`ax.set_title(\"Training loss\")` đặt tiêu đề cho `ax`, nên `ax.get_title()` trả về chuỗi `\"Training loss\"`."

  - id: p4-04-q03
