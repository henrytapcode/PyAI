    url: "https://scikit-learn.org/stable/getting_started.html"
  - title: { en: "scikit-learn: Pipelines and composite estimators", vi: "scikit-learn: Pipelines and composite estimators (EN)" }
    url: "https://scikit-learn.org/stable/modules/compose.html"
  - title: { en: "scikit-learn: Common pitfalls and recommended practices", vi: "scikit-learn: Common pitfalls and recommended practices (EN)" }
    url: "https://scikit-learn.org/stable/common_pitfalls.html"
