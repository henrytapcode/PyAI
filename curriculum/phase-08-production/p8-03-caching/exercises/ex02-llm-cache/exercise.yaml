              ...
      ```
  vi:
    - |
      Kết hợp cách tạo key ở §3 (`json.dumps(..., sort_keys=True)` + `hashlib.sha256`) với logic kiểm tra hết hạn ở §6 (`now >= expires_at`). Với `make_key("mini", [{"role": "user", "content": "  Hi   there "}], temperature=0.0, max_tokens=50)`, khi đảo thành `max_tokens=50, temperature=0.0` vẫn phải trả về cùng chuỗi hex 64 ký tự.
    - |
      Kế hoạch:
      1. Trong `make_key`, tạo bản sao cho từng dict message để không làm biến đổi danh sách gốc, gộp khoảng trắng trong chuỗi `content`, gom `model`, danh sách message đã làm sạch và `params` vào một dict, tuần tự hóa với khóa được sắp xếp rồi trả về chuỗi hex SHA-256.
      2. Trong `TTLCache`, kiểm tra `ttl` dương, khởi tạo biến đếm hit/miss và dict lưu trữ, lưu giá trị kèm mốc hết hạn khi `set`, và khi `get` thì coi mục thiếu hoặc đã hết hạn là miss (xóa mục hết hạn).
      3. Trong `hit_rate()`, chia số hit cho tổng số lượt tra cứu và trả về `0.0` khi chưa có lượt nào.
