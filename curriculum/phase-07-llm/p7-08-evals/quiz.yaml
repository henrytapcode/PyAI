questions:
  - id: p7-08-q01
    type: mcq
    tags: [evaluation, testing]
    difficulty: 1
    answer: 1
    en:
      prompt: "How does an eval differ from a unit test?"
      options:
        - "An eval only checks syntax before Python imports a file"
        - "An eval scores overall AI behavior on a question set"
        - "A unit test always calls a live LLM across thirty prompts"
        - "A unit test replaces all metrics with manual reading"
      explanation: "A unit test verifies that one deterministic Python helper follows its contract, whereas an eval runs a collection of realistic questions through the AI system and measures quality metrics such as hit rate or faithfulness."
    vi:
      prompt: "Eval khác unit test ở điểm nào?"
      options:
        - "Eval chỉ kiểm tra cú pháp trước khi Python nạp file"
        - "Eval chấm chất lượng hệ thống AI trên tập câu hỏi"
        - "Unit test luôn gọi LLM thật qua ba mươi prompt khác nhau"
        - "Unit test thay mọi chỉ số đo bằng việc đọc thử bằng mắt"
      explanation: "Unit test kiểm tra một hàm Python tất định có chạy đúng giao kèo không, còn eval chạy một tập câu hỏi qua hệ thống AI để đo các chỉ số chất lượng như hit rate hay faithfulness."

  - id: p7-08-q02
    type: mcq
    tags: [evaluation, rag]
    difficulty: 1
    answer: 2
    en:
      prompt: "Why should a RAG eval score retrieval and answer generation separately?"
      options:
        - "Because FakeLLM refuses to run embed and chat together"
        - "Because Python cannot store two metrics in one dictionary"
        - "To pinpoint whether missing context or generation failed"
        - "To double the number of API tokens spent per question"
      explanation: "Separating retrieval (`hit@k`) from answer scoring (`facts` and `faithful`) tells you whether to tune chunking/retrieval or fix the prompt and generator."
    vi:
      prompt: "Vì sao eval cho RAG nên chấm riêng tầng retrieval và tầng trả lời?"
      options:
        - "Vì FakeLLM không cho phép chạy embed và chat cùng lúc"
        - "Vì Python không thể lưu hai chỉ số trong cùng một dict"
        - "Để biết lỗi nằm ở khâu tìm tài liệu hay khâu sinh câu trả lời"
        - "Để tăng gấp đôi số lượng token tiêu tốn cho mỗi câu hỏi"
      explanation: "Tách riêng retrieval (`hit@k`) và chấm câu trả lời (`facts`, `faithful`) giúp bạn biết cần chỉnh bước chia chunk/truy xuất hay sửa prompt và model."

  - id: p7-08-q03
    type: mcq
    tags: [evaluation, rag]
    difficulty: 1
    answer: 0
    en:
      prompt: "A 4-question eval has 3 retrieval hits, 1 miss, and 1 extra question with `expected_source=None`. What is `hit@2`?"
      options:
        - "0.75 (3 out of 4)"
        - "0.60 (3 out of 5)"
        - "0.25 (1 out of 4)"
        - "1.00 (4 out of 4)"
      explanation: "Rows with `expected_source=None` are unanswerable and skipped from the denominator, leaving 4 answerable rows with 3 hits: `3 / 4 = 0.75`."
    vi:
      prompt: "Một tập eval có 4 câu trả lời được (3 câu trúng, 1 câu trượt) và 1 câu thêm có `expected_source=None`. Giá trị `hit@2` là bao nhiêu?"
      options:
        - "0.75 (3 trên 4)"
        - "0.60 (3 trên 5)"
        - "0.25 (1 trên 4)"
        - "1.00 (4 trên 4)"
      explanation: "Các câu có `expected_source=None` là câu không trả lời được nên bị loại khỏi mẫu số, chỉ còn 4 câu có nguồn với 3 câu trúng: `3 / 4 = 0.75`."

  - id: p7-08-q04
    type: output
    tags: [evaluation, rag]
    difficulty: 1
    code: |
      rows = [
          {"expected_source": "a.md", "retrieved": ["b.md", "a.md"]},
          {"expected_source": "c.md", "retrieved": ["d.md", "c.md"]},
          {"expected_source": None, "retrieved": ["a.md", "b.md"]},
      ]
      hits = sum(
          1 for r in rows
          if r["expected_source"] is not None
          and r["expected_source"] in r["retrieved"][:1]
      )
      total = sum(1 for r in rows if r["expected_source"] is not None)
      print(f"{hits}/{total}")
    answer: "0/2"
    en:
      prompt: "What does this code print?"
      explanation: "The slice `retrieved[:1]` checks only the top-1 source (`'b.md'` and `'d.md'`), missing both `'a.md'` and `'c.md'`, while the `None` row is skipped, giving `0/2`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Lát cắt `retrieved[:1]` chỉ kiểm tra nguồn hạng 1 (`'b.md'` và `'d.md'`), nên trượt cả `'a.md'` lẫn `'c.md'`, còn dòng `None` bị bỏ qua nên kết quả là `0/2`."

  - id: p7-08-q05
    type: fill
    tags: [evaluation, lists]
    difficulty: 1
    code: |
      rows = [
          {"expected_source": "a.md", "retrieved": ["b.md", "a.md"]},
          {"expected_source": None, "retrieved": ["a.md"]},
      ]
      hits = 0
      total = 0
      for r in rows:
          if r["expected_source"] is ___:
              continue
          total += 1
          if r["expected_source"] in r["retrieved"][:___]:
              hits += 1
      print(hits, total)
    answer: ["None", "2"]
    en:
      prompt: "Fill in the blanks to skip unanswerable rows and compute `hit@2`."
      explanation: "Checking `is None` skips rows without an expected source, and slicing `[:2]` checks the top 2 retrieved sources, printing `1 1`."
    vi:
      prompt: "Điền vào chỗ trống để bỏ qua câu không trả lời được và tính `hit@2`."
      explanation: "Kiểm tra `is None` bỏ qua các dòng không có nguồn kỳ vọng, còn lát cắt `[:2]` kiểm tra 2 nguồn đầu bảng, in ra `1 1`."

  - id: p7-08-q06
    type: mcq
    tags: [evaluation, rag]
    difficulty: 2
    answer: 3
    en:
      prompt: "Why do we exclude `expected_source=None` questions from the `hit_rate` denominator?"
      options:
        - "Because Python raises a KeyError when slicing None"
        - "Because unanswerable questions always have empty retrieved lists"
        - "Because FakeLLM skips embedding any question without a source"
        - "Because there is no target document to count as a hit"
      explanation: "An unanswerable question has no correct document in the corpus, so counting it in `hit_rate` would guarantee a miss and artificially lower the retrieval score."
    vi:
      prompt: "Vì sao cần bỏ câu `expected_source=None` khỏi mẫu số của `hit_rate`?"
      options:
        - "Vì Python sẽ báo lỗi KeyError khi cắt lát giá trị None"
        - "Vì câu không trả lời được luôn có danh sách retrieved rỗng"
        - "Vì FakeLLM bỏ qua việc embed những câu không có nguồn"
        - "Vì không có tài liệu đích nào để tính là truy xuất trúng"
      explanation: "Câu hỏi không có đáp án trong kho tài liệu thì không có tài liệu đích để tìm trúng; đưa vào mẫu số sẽ luôn bị tính là trượt và kéo tụt điểm retrieval một cách giả tạo."

  - id: p7-08-q07
    type: mcq
    tags: [evaluation, rag]
    difficulty: 2
    answer: 1
    en:
      prompt: "Context says `'Refunds take 30 days.'` and the bot replies `'I don't know based on the provided context.'` What are `facts` and `faithful`?"
      options:
        - "`facts=1.0`, `faithful=False`"
        - "`facts=0.0`, `faithful=True`"
        - "`facts=1.0`, `faithful=True`"
        - "`facts=0.0`, `faithful=False`"
      explanation: "For an answerable question expecting `'30 days'`, refusing scores `facts=0.0`, yet refusing to guess does not invent claims outside context so `faithful=True`."
    vi:
      prompt: "Ngữ cảnh ghi `'Refunds take 30 days.'` nhưng bot đáp `'I don't know based on the provided context.'`. Giá trị `facts` và `faithful` là gì?"
      options:
        - "`facts=1.0`, `faithful=False`"
        - "`facts=0.0`, `faithful=True`"
        - "`facts=1.0`, `faithful=True`"
        - "`facts=0.0`, `faithful=False`"
      explanation: "Với câu hỏi có đáp án `'30 days'`, việc từ chối làm `facts=0.0`, nhưng bot không tự bịa chi tiết ngoài ngữ cảnh nên vẫn được tính `faithful=True`."

  - id: p7-08-q08
    type: mcq
    tags: [evaluation, rag]
    difficulty: 2
    answer: 0
    en:
      prompt: "Context says `'Refunds take 30 days.'` and the bot replies `'Refunds take 30 days with free courier pickup.'` What does `score_answer` return?"
      options:
        - "`facts=1.0`, `faithful=False`"
        - "`facts=0.0`, `faithful=True`"
        - "`facts=1.0`, `faithful=True`"
        - "`facts=0.0`, `faithful=False`"
      explanation: "The reply contains `'30 days'` (`facts=1.0`), yet introduces `'with'`, `'free'`, `'courier'`, and `'pickup'` which are absent from the context (`faithful=False`)."
    vi:
      prompt: "Ngữ cảnh ghi `'Refunds take 30 days.'` còn bot đáp `'Refunds take 30 days with free courier pickup.'`. Hàm `score_answer` trả về thế nào?"
      options:
        - "`facts=1.0`, `faithful=False`"
        - "`facts=0.0`, `faithful=True`"
        - "`facts=1.0`, `faithful=True`"
        - "`facts=0.0`, `faithful=False`"
      explanation: "Câu trả lời có chứa `'30 days'` (`facts=1.0`), nhưng lại thêm `'with'`, `'free'`, `'courier'`, `'pickup'` không có trong ngữ cảnh (`faithful=False`)."

  - id: p7-08-q09
    type: output
    tags: [evaluation, strings]
    difficulty: 2
    code: |
      import re

      text = "[1] Refunds take 30 days for any item."
      cleaned = re.sub(r"\[\d+\]", "", text.lower())
      words = [w for w in re.findall(r"[a-z0-9]+", cleaned) if len(w) >= 4]
      print(words)
    answer: "['refunds', 'take', 'days', 'item']"
    en:
      prompt: "What does this content-word tokenizer print?"
      explanation: "Citation `[1]` is stripped first, then `30`, `for`, and `any` are dropped because each has fewer than 4 characters, leaving `['refunds', 'take', 'days', 'item']`."
    vi:
      prompt: "Bộ tách từ nội dung này in ra gì?"
      explanation: "Trích dẫn `[1]` bị xóa trước, sau đó `30`, `for` và `any` bị loại vì ngắn hơn 4 ký tự, chỉ còn `['refunds', 'take', 'days', 'item']`."

  - id: p7-08-q10
    type: fill
    tags: [evaluation, strings]
    difficulty: 2
    code: |
      facts = ["Monday to Friday", "9 AM to 6 PM"]
      answer = "support hours are monday to friday."
      matched = sum(1 for f in facts if f.___() in answer.___())
      print(round(matched / len(facts), 3))
    answer: ["lower", "lower"]
    en:
      prompt: "Fill in the two string method calls so fact matching ignores letter casing."
      explanation: "Calling `.lower()` on both `f` and `answer` lets `'Monday to Friday'` match `'monday to friday'`, printing `0.5`."
    vi:
      prompt: "Điền hai lời gọi phương thức chuỗi để việc so khớp fact không phân biệt chữ hoa chữ thường."
      explanation: "Gọi `.lower()` cho cả `f` và `answer` giúp `'Monday to Friday'` khớp `'monday to friday'`, in ra `0.5`."

  - id: p7-08-q11
    type: parsons
    tags: [evaluation, rag]
    difficulty: 2
    lines:
      - 'rows = [{"expected_source": "a.md", "retrieved": ["a.md"]}, {"expected_source": None, "retrieved": ["b.md"]}]'
      - "answerable = [r for r in rows if r['expected_source'] is not None]"
      - "hits = sum(1 for r in answerable if r['expected_source'] in r['retrieved'][:2])"
      - "rate = hits / len(answerable) if answerable else 0.0"
      - "print(round(rate, 3))"
    en:
      prompt: "Arrange these lines to filter out unanswerable rows, compute `hit@2`, and print the rate."
      explanation: "Define `rows`, filter `answerable` rows first, count `hits` inside `retrieved[:2]`, divide safely by `len(answerable)`, and print `rate`."
    vi:
      prompt: "Sắp xếp các dòng sau để lọc bỏ câu không trả lời được, tính `hit@2` và in ra kết quả."
      explanation: "Khai báo `rows`, lọc ra `answerable` trước, đếm `hits` trong `retrieved[:2]`, chia an toàn cho `len(answerable)` rồi in `rate`."

  - id: p7-08-q12
    type: mcq
    tags: [evaluation]
    difficulty: 2
    answer: 2
    en:
      prompt: "Why are 1-question differences on a 5-question eval set hard to trust?"
      options:
        - "Because Python floats round every fifth to zero"
        - "Because eval scores only work on multiples of ten"
        - "Because one question shifts the score by twenty percent"
        - "Because FakeLLM randomizes outputs even at temperature zero"
      explanation: "With only 5 questions, a single flip moves the rate by `1/5 = 20%`, so small eval sets have high variance and need dozens or hundreds of cases for reliable comparisons."
    vi:
      prompt: "Vì sao chênh lệch 1 câu trên tập eval 5 câu rất khó tin cậy?"
      options:
        - "Vì số thực Python làm tròn mọi phần năm về không"
        - "Vì điểm eval chỉ có nghĩa khi chia hết cho mười"
        - "Vì chỉ một câu đã làm điểm lệch tới hai mươi phần trăm"
        - "Vì FakeLLM tự ngẫu nhiên hóa đầu ra dù temperature bằng không"
      explanation: "Khi chỉ có 5 câu, một câu đổi kết quả làm tỉ lệ nhảy tới `1/5 = 20%`, nên tập eval nhỏ rất nhiễu và cần vài chục tới vài trăm câu mới kết luận chắc chắn."

  - id: p7-08-q13
    type: mcq
    tags: [evaluation, llm]
    difficulty: 2
    answer: 1
    en:
      prompt: "What happens if you keep tuning prompts and `k` until a 6-question eval set hits 100%?"
      options:
        - "The bot automatically generalizes to every unseen query"
        - "You overfit the eval set and hide real failures"
        - "Retrieval latency drops to zero on all documents"
        - "The eval set permanently turns into a unit test"
      explanation: "Just like tuning on the test set in `p5-04-evaluation`, optimizing directly for a small eval set memorizes its quirks while new user questions still fail."
    vi:
      prompt: "Chuyện gì xảy ra nếu bạn cứ chỉnh prompt và `k` tới khi tập eval 6 câu đạt 100%?"
      options:
        - "Bot sẽ tự động tổng quát hóa tốt cho mọi câu hỏi mới"
        - "Bạn làm hệ thống overfit tập eval và che khuất lỗi thật"
        - "Độ trễ truy xuất sẽ giảm về không trên mọi tài liệu"
        - "Tập eval sẽ tự động biến thành unit test cho hàm Python"
      explanation: "Giống như chỉnh tham số trên tập test ở `p5-04-evaluation`, tối ưu trực tiếp theo một tập eval nhỏ khiến hệ thống khớp vẹt các ca cũ nhưng vẫn hỏng với câu hỏi mới."

  - id: p7-08-q14
    type: mcq
    tags: [evaluation, llm]
    difficulty: 3
    answer: 3
    en:
      prompt: "What is a key limitation of using an LLM-as-judge to grade RAG answers?"
      options:
        - "An LLM judge can only return Python booleans and never text"
        - "An LLM judge refuses to read prompts that include a rubric"
        - "An LLM judge requires retraining weights before every single question"
        - "An LLM judge can be biased and needs calibration checks"
      explanation: "LLM judges can favor longer or confident-sounding answers or miss subtle errors, so teams calibrate them against human-labeled examples before trusting their scores."
    vi:
      prompt: "Hạn chế quan trọng của việc dùng LLM-as-judge để chấm câu trả lời RAG là gì?"
      options:
        - "Model giám khảo chỉ trả về được bool chứ không trả về chữ"
        - "Model giám khảo từ chối đọc prompt nếu bên trong có rubric"
        - "Model giám khảo phải train lại trọng số trước mỗi câu hỏi"
        - "Model giám khảo có thể thiên lệch nên cần kiểm định lại"
      explanation: "LLM-as-judge có thể thiên vị câu trả lời dài hoặc viết trôi chảy nhưng sai ngầm, vì vậy đội kỹ sư phải đối chiếu điểm của judge với mẫu do người chấm."

  - id: p7-08-q15
    type: output
    tags: [evaluation, rag, llm]
    difficulty: 3
    code: |
      from pyai_llm import FakeLLM

      client = FakeLLM()
      ctx = "[1] Refunds are issued within 30 days of purchase."
      ans = client.chat([
          {"role": "system", "content": "Context:\n" + ctx},
          {"role": "user", "content": "Can I get money back quickly?"},
      ]).content
      print(ans)
    answer: "I don't know based on the provided context."
    en:
      prompt: "What does this `FakeLLM` RAG call print even though `refunds` is in the context?"
      explanation: "Unlike `embed()`, `FakeLLM.chat()` RAG mode does not map `'money back'` to `'refunds'` and requires at least 2 shared words of length `>= 3`, so it returns `'I don't know based on the provided context.'`."
    vi:
      prompt: "Lời gọi RAG bằng `FakeLLM` này in ra gì dù câu hỏi nói về tiền hoàn lại?"
      explanation: "Khác với `embed()`, chế độ RAG của `FakeLLM.chat()` không đổi `'money back'` thành `'refunds'` và đòi hỏi trùng ít nhất 2 từ dài `>= 3`, nên nó trả về `'I don't know based on the provided context.'`."

  - id: p7-08-q16
    type: parsons
    tags: [evaluation, testing]
    difficulty: 3
    lines:
      - "def check_eval(hits: int, total: int, min_hit: float = 0.8) -> str:"
      - "    rate = hits / total if total else 0.0"
      - '    status = "PASS" if rate >= min_hit else "FAIL"'
      - '    return f"{status} ({round(rate, 3)})"'
      - "print(check_eval(3, 5))"
    en:
      prompt: "Arrange these lines to build a regression gate function and print its verdict for `(3, 5)`."
      explanation: "Define `check_eval`, compute `rate` first, derive `status` from `rate >= min_hit`, return the formatted string, and print `check_eval(3, 5)`."
    vi:
      prompt: "Sắp xếp các dòng sau để tạo hàm kiểm tra hồi quy và in kết quả cho `(3, 5)`."
      explanation: "Định nghĩa `check_eval`, tính `rate` trước, suy ra `status` từ `rate >= min_hit`, trả về chuỗi định dạng rồi gọi `print(check_eval(3, 5))`."

flashcards:
  - id: p7-08-f01
    tags: [evaluation]
    en:
      front: "Eval set"
      back: "A fixed collection of realistic inputs paired with expected sources or golden facts, re-run after every change to measure quality numerically."
    vi:
      front: "Eval set (tập câu hỏi đánh giá)"
      back: "Tập cố định các câu hỏi thực tế kèm nguồn kỳ vọng hoặc đáp án chuẩn, chạy lại sau mỗi thay đổi để đo chất lượng bằng con số."

  - id: p7-08-f02
    tags: [evaluation, rag]
    en:
      front: "Hit rate (hit@k)"
      back: "Fraction of answerable eval questions where the expected source appears inside the top k retrieved chunks; rows with expected_source=None are skipped."
    vi:
      front: "Hit rate (tỉ lệ truy xuất trúng, hit@k)"
      back: "Tỉ lệ câu hỏi có nguồn kỳ vọng mà tài liệu đúng nằm trong top k chunk truy xuất được; các câu expected_source=None được bỏ khỏi mẫu số."
    code: |
      hits = sum(1 for r in ans_rows if r["expected_source"] in r["retrieved"][:k])
      rate = hits / len(ans_rows)

  - id: p7-08-f03
    tags: [evaluation, rag]
    en:
      front: "Faithfulness (groundedness)"
      back: "Whether every claim in an LLM's answer is supported by the retrieved context rather than fabricated outside it."
    vi:
      front: "Faithfulness / Groundedness (độ trung thực bám nguồn)"
      back: "Mức độ mọi thông tin trong câu trả lời đều có căn cứ từ ngữ cảnh đã truy xuất thay vì bịa thêm bên ngoài."

  - id: p7-08-f04
    tags: [evaluation, llm]
    en:
      front: "LLM-as-judge"
      back: "Using a separate LLM with a grading rubric to score open-ended answers; flexible, yet biased unless calibrated against human-labeled examples."
    vi:
      front: "LLM-as-judge (dùng LLM làm giám khảo)"
      back: "Dùng một LLM khác kèm thang chấm rubric để chấm câu trả lời mở; linh hoạt nhưng có thể thiên lệch nên cần kiểm định lại bằng mẫu chuẩn."

  - id: p7-08-f05
    tags: [evaluation]
    en:
      front: "Eval overfitting"
      back: "Repeatedly tweaking prompts or k until a small eval set hits 100%, turning it into a tuning set that fails on unseen user queries."
    vi:
      front: "Overfit tập eval"
      back: "Chỉnh prompt hay k liên tục cho tới khi tập eval nhỏ đạt 100%, khiến hệ thống chỉ khớp vẹt ca cũ và trượt khi gặp câu hỏi mới."

  - id: p7-08-f06
    tags: [evaluation, testing]
    en:
      front: "Regression check"
      back: "Automated threshold assertion (such as hit_rate >= 0.8) run before shipping changes to catch quality drops early."
