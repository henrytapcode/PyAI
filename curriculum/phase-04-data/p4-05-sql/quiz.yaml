  - id: p4-05-q10
    type: output
    tags: [sql]
    difficulty: 2
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE feedback (model TEXT, rating INTEGER)")
      with conn:
          conn.executemany(
              "INSERT INTO feedback (model, rating) VALUES (?, ?)",
              [("gpt-4o", 5), ("gpt-4o", 4), ("mini", 3), ("claude", 5)],
          )
      rows = conn.execute("""
          SELECT model, ROUND(AVG(rating), 2)
          FROM feedback
          GROUP BY model
          HAVING COUNT(*) >= 2
          ORDER BY model ASC
      """).fetchall()
      print(rows)
      conn.close()
    answer: "[('gpt-4o', 4.5)]"
    en:
      prompt: "What does this code print?"
      explanation: "Only `gpt-4o` has `COUNT(*) >= 2` (ratings 5 and 4, average `4.5`). `mini` and `claude` each have 1 row, so `HAVING` filters them out."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Chỉ `gpt-4o` có `COUNT(*) >= 2` (điểm 5 và 4, trung bình `4.5`). `mini` và `claude` chỉ có 1 dòng nên bị `HAVING` loại."

  - id: p4-05-q11
    type: mcq
    tags: [sql]
    difficulty: 2
    answer: 1
    en:
      prompt: "Why does `WHERE` reject aggregate functions like `COUNT(*)` while `HAVING` allows them?"
      options:
        - "Because `WHERE` only works on `TEXT` columns and `HAVING` only works on `INTEGER` columns"
        - "Because SQL runs `WHERE` on individual rows before `GROUP BY` forms groups, whereas `HAVING` runs after `GROUP BY`"
        - "Because `HAVING` is just a pandas method, not a SQL clause"
        - "Because `WHERE` runs after `LIMIT` when the count is already forgotten"
      explanation: "SQL's execution order is `FROM` -> `WHERE` -> `GROUP BY` -> `HAVING` -> `SELECT` -> `ORDER BY` -> `LIMIT`. Group aggregates exist only after `GROUP BY`, so `HAVING` can filter on them."
    vi:
      prompt: "Vì sao `WHERE` không dùng được hàm tổng hợp như `COUNT(*)` còn `HAVING` thì được?"
      options:
        - "Vì `WHERE` chỉ chạy trên cột `TEXT`, còn `HAVING` chỉ chạy trên cột `INTEGER`"
        - "Vì SQL chạy `WHERE` trên từng dòng riêng lẻ trước khi `GROUP BY` tạo nhóm, còn `HAVING` chạy sau `GROUP BY`"
        - "Vì `HAVING` là phương thức của pandas chứ không phải mệnh đề SQL"
        - "Vì `WHERE` chạy sau `LIMIT` khi kết quả đếm đã bị xóa"
      explanation: "Thứ tự chạy của SQL là `FROM` -> `WHERE` -> `GROUP BY` -> `HAVING` -> `SELECT` -> `ORDER BY` -> `LIMIT`. Giá trị tổng hợp chỉ tồn tại sau `GROUP BY`, nên `HAVING` mới lọc được theo chúng."

