title:
  en: "Write: TinyClassifier and accuracy helper"
  vi: "Viết code: TinyClassifier và hàm accuracy"
difficulty: 2
tags: [pytorch, dl]
hints:
  en:
    - |
      This combines `nn.Module` from §1 with `model.eval()` and `torch.no_grad()` from §5. For `in_features=2, hidden=8, classes=3`, `TinyClassifier` creates `Linear(2, 8)`, `ReLU()`, and `Linear(8, 3)` — 51 parameters in total.
    - |
      The plan:
      1. In `TinyClassifier.__init__`, call `super().__init__()`, then store `nn.Linear(in_features, hidden)`, `nn.ReLU()`, and `nn.Linear(hidden, classes)` as attributes on `self`.
      2. In `TinyClassifier.forward(self, x)`, pass `x` through the hidden linear layer, then `relu`, then the output linear layer, and return the logits.
      3. In `accuracy(model, xs, ys)`, call `model.eval()`, open `with torch.no_grad():`, compute `preds = model(xs).argmax(dim=1)`, and return `round((preds == ys).to(torch.float32).mean().item(), 3)`.
    - |
      The shape of the solution:
      ```python
      class TinyClassifier(nn.Module):
          def __init__(self, in_features: int, hidden: int, classes: int) -> None:
              super().__init__()
              self.hidden = nn.Linear(in_features, hidden)
              self.relu = ...
              self.out = ...

          def forward(self, x: torch.Tensor) -> torch.Tensor:
              return self.out(self.relu(self.hidden(x)))


      def accuracy(model: nn.Module, xs: torch.Tensor, ys: torch.Tensor) -> float:
          model.eval()
          with torch.no_grad():
              preds = ...
              return round((preds == ys).to(torch.float32).mean().item(), 3)
      ```
      Remember to pass `dim=1` to `.argmax(dim=1)` so you get one predicted class index per row.
  vi:
    - |
      Bài này kết hợp `nn.Module` ở §1 với `model.eval()` và `torch.no_grad()` ở §5. Với `in_features=2, hidden=8, classes=3`, `TinyClassifier` tạo `Linear(2, 8)`, `ReLU()` và `Linear(8, 3)` — tổng cộng 51 tham số.
    - |
      Kế hoạch:
      1. Trong `TinyClassifier.__init__`, gọi `super().__init__()`, rồi lưu `nn.Linear(in_features, hidden)`, `nn.ReLU()` và `nn.Linear(hidden, classes)` làm thuộc tính trên `self`.
      2. Trong `TinyClassifier.forward(self, x)`, cho `x` đi qua tầng tuyến tính ẩn, rồi `relu`, rồi tầng tuyến tính đầu ra, và trả về logits.
      3. Trong `accuracy(model, xs, ys)`, gọi `model.eval()`, mở `with torch.no_grad():`, tính `preds = model(xs).argmax(dim=1)` rồi trả về `round((preds == ys).to(torch.float32).mean().item(), 3)`.
    - |
      Hình dạng của lời giải:
      ```python
      class TinyClassifier(nn.Module):
          def __init__(self, in_features: int, hidden: int, classes: int) -> None:
              super().__init__()
              self.hidden = nn.Linear(in_features, hidden)
              self.relu = ...
              self.out = ...

          def forward(self, x: torch.Tensor) -> torch.Tensor:
              return self.out(self.relu(self.hidden(x)))


      def accuracy(model: nn.Module, xs: torch.Tensor, ys: torch.Tensor) -> float:
          model.eval()
          with torch.no_grad():
              preds = ...
              return round((preds == ys).to(torch.float32).mean().item(), 3)
      ```
      Nhớ truyền `dim=1` vào `.argmax(dim=1)` để lấy một nhãn dự đoán cho mỗi hàng.
