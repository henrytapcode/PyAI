    en:
      front: "How should you store and load a real LLM API key?"
      back: "Put it in a `.env` file listed in `.gitignore`, read it via `os.environ[\"LLM_API_KEY\"]`, and never print, log, hardcode, or commit it."
    vi:
      front: "Nên lưu và nạp API key thật của LLM như thế nào?"
      back: "Lưu trong file `.env` đã thêm vào `.gitignore`, đọc qua `os.environ[\"LLM_API_KEY\"]`, và tuyệt đối không in, ghi log, dán vào code hay commit."
