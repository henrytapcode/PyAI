kind: project
title:
  en: "Prepare and encode support ticket splits"
  vi: "Chuẩn bị và mã hóa các tập dữ liệu ticket"
difficulty: 2
tags: [huggingface, pytorch, dl]
hints:
  en:
    - |
      This follows §2: shuffle indices reproducibly with `torch.randperm` and a seeded `torch.Generator`, then tokenize batches with `padding`, `truncation`, `max_length`, and PyTorch tensors. For `class_counts([0, 1, 0])`, return `{0: 2, 1: 1}`.
    - |
      Step-by-step plan:
      1. In `split_data`, compute integer counts for validation and test from their fractions, and assign the remaining count to train so every item is kept.
      2. Shuffle indices reproducibly using `torch.randperm` with a seeded `torch.Generator`, slice the index list into three disjoint ranges, and gather the matching text and label lists.
      3. In `encode`, tokenize `texts` into padded, truncated PyTorch tensors capped at `max_length`, and return a dictionary containing only `input_ids` and `attention_mask`.
      4. In `class_counts`, count occurrences of each integer label into a dictionary and return it.
    - |
      Skeleton:
      ```python
      def split_data(texts, labels, val_frac, test_frac, seed):
          n = len(texts)
          n_val = int(n * val_frac)
          n_test = int(n * test_frac)
          n_train = n - n_val - n_test
          gen = torch.Generator().manual_seed(seed)
          idx = torch.randperm(n, generator=gen).tolist()
          tr, va, te = ...
          return (
              [texts[i] for i in tr], [labels[i] for i in tr],
              [texts[i] for i in va], [labels[i] for i in va],
              [texts[i] for i in te], [labels[i] for i in te],
          )


      def encode(texts, max_length):
          batch = tokenizer(texts, ...)
          return {"input_ids": batch["input_ids"], "attention_mask": batch["attention_mask"]}


      def class_counts(labels):
          counts: dict[int, int] = {}
          for label in labels:
              counts[label] = counts.get(label, 0) + 1
          return counts
      ```
      Make sure your three slices cover `idx` from start to finish without gaps or overlaps, and pass the padding/truncation/`max_length`/`return_tensors` keyword arguments to `tokenizer`.
  vi:
    - |
      Bài này đi theo §2: xáo chỉ số tái lập được bằng `torch.randperm` với `torch.Generator` đặt seed, rồi tokenize theo batch có `padding`, `truncation`, `max_length` và tensor PyTorch. Với `class_counts([0, 1, 0])`, hàm phải trả về `{0: 2, 1: 1}`.
    - |
      Kế hoạch từng bước:
      1. Trong `split_data`, tính số lượng phần tử nguyên cho tập validation và test từ tỉ lệ tương ứng, rồi phần còn lại dành cho tập train để không bị rơi mất mẫu do làm tròn.
      2. Xáo hoán vị chỉ số bằng `torch.randperm` kèm `torch.Generator` đã đặt seed, cắt thành ba đoạn rời nhau rồi gom các danh sách văn bản và nhãn tương ứng.
      3. Trong `encode`, gọi `tokenizer` có padding, cắt bớt theo `max_length` và trả về tensor PyTorch, sau đó trả dictionary chỉ gồm `input_ids` và `attention_mask`.
      4. Trong `class_counts`, đếm số lần xuất hiện của từng nhãn số nguyên vào một dictionary và trả về.
    - |
      Khung lời giải:
      ```python
      def split_data(texts, labels, val_frac, test_frac, seed):
