  - id: p4-01-q12
    type: parsons
    tags: [numpy, booleans]
    difficulty: 2
    lines:
      - "import numpy as np"
      - "scores = np.array([0.4, 0.9, 0.7])"
      - "mask = scores >= 0.5"
      - "passed = scores[mask]"
      - "print(int(mask.sum()), float(passed.mean()))"
    en:
      prompt: "Put the lines in order so the program counts passing scores and prints their average (`2 0.8`)."
      explanation: "Import `numpy`, define `scores`, build `mask` from `scores`, filter `passed` with `mask`, then print the count and mean."
    vi:
      prompt: "Sắp xếp các dòng để chương trình đếm số điểm đạt và in trung bình của chúng (`2 0.8`)."
      explanation: "Import `numpy`, tạo `scores`, tạo `mask` từ `scores`, lọc `passed` bằng `mask`, rồi in số lượng và trung bình."

  - id: p4-01-q13
    type: fill
    tags: [numpy, booleans]
    difficulty: 2
    code: |
      import numpy as np
      a = np.array([1, 4, 6, 9])
      print(a[(a > 2) ___ (a < 8)])  # [4 6]
    answer: ["&"]
    en:
      prompt: "Fill in the operator to keep elements that are both greater than `2` and less than `8`."
      explanation: "NumPy uses `&` (with parentheses around each condition) for element-wise 'and', not the Python keyword `and`."
    vi:
      prompt: "Điền toán tử để giữ các phần tử vừa lớn hơn `2` vừa nhỏ hơn `8`."
      explanation: "NumPy dùng `&` (kèm ngoặc đơn quanh mỗi điều kiện) cho phép 'và' theo từng phần tử, không dùng từ khóa `and` của Python."

  - id: p4-01-q14
    type: mcq
    tags: [numpy, booleans]
    difficulty: 3
    answer: 0
    code: |
      import numpy as np
      a = np.array([0, 3, 6])
      a[a > 1 & a < 5]
    en:
      prompt: "Why does `a[a > 1 & a < 5]` fail?"
      options:
        - "`&` runs before `>` and `<`, so parentheses are required around each comparison"
        - "NumPy arrays cannot be filtered with two conditions at once"
        - "`&` only works on strings, not numbers"
        - "Indexing with `[...]` only accepts integer indices"
      explanation: "In Python, `&` has higher precedence than `<` and `>`, so `a > 1 & a < 5` is parsed incorrectly. Writing `(a > 1) & (a < 5)` fixes it."
    vi:
      prompt: "Vì sao `a[a > 1 & a < 5]` bị lỗi?"
      options:
        - "`&` được tính trước `>` và `<`, nên cần dấu ngoặc đơn quanh mỗi phép so sánh"
        - "Mảng NumPy không lọc được bằng hai điều kiện cùng lúc"
        - "`&` chỉ dùng cho chuỗi, không dùng cho số"
        - "Truy cập bằng `[...]` chỉ nhận chỉ số nguyên"
      explanation: "Trong Python, `&` có độ ưu tiên cao hơn `<` và `>`, nên `a > 1 & a < 5` bị hiểu sai thứ tự. Viết `(a > 1) & (a < 5)` sẽ sửa được lỗi."

  - id: p4-01-q15
    type: output
    tags: [numpy]
    difficulty: 3
    code: |
      import numpy as np
      a = np.array([10, 20, 30, 40])
      b = a[1:3]
      b[0] = 99
      print(a.tolist())
    answer: "[10, 99, 30, 40]"
    en:
      prompt: "What does this code print?"
      explanation: "Slicing a NumPy array returns a **view** sharing the same memory, not a copy. Changing `b[0]` updates `a[1]` to `99`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Cắt slice từ mảng NumPy trả về một **view** dùng chung bộ nhớ chứ không phải bản sao. Sửa `b[0]` làm `a[1]` đổi thành `99`."

  - id: p4-01-q16
    type: parsons
    tags: [numpy, performance]
    difficulty: 3
    lines:
      - "import numpy as np"
      - "raw = np.array([10, 20, 30, 40])"
      - "part = raw[1:3].copy()"
      - "part[0] = 99"
      - "scaled = part * 2"
      - "print(raw.tolist(), scaled.tolist())"
    en:
      prompt: "Put the lines in order so `raw` stays unchanged while `scaled` becomes `[198, 60]`."
      explanation: "Import `numpy`, create `raw`, copy the slice before editing `part[0]`, multiply `part` by `2`, and print both lists at the end."
    vi:
      prompt: "Sắp xếp các dòng để `raw` không đổi còn `scaled` thành `[198, 60]`."
      explanation: "Import `numpy`, tạo `raw`, sao chép slice trước khi sửa `part[0]`, nhân `part` với `2`, và cuối cùng in cả hai list."

flashcards:
  - id: p4-01-f01
    tags: [numpy]
    code: "a.shape, a.dtype, a.ndim"
    en: { front: "What do `.shape`, `.dtype`, and `.ndim` tell you about a NumPy array?", back: "`.shape` is the tuple of sizes per dimension, `.dtype` is the single data type of all elements, and `.ndim` is the number of dimensions." }
    vi: { front: "`.shape`, `.dtype` và `.ndim` cho biết điều gì về một mảng NumPy?", back: "`.shape` là tuple kích thước từng chiều, `.dtype` là kiểu dữ liệu chung của mọi phần tử, và `.ndim` là số chiều của mảng." }
  - id: p4-01-f02
    tags: [numpy, performance]
    code: "a * 2 + 1"
    en: { front: "What is vectorization (and scalar broadcasting) in NumPy?", back: "Writing math directly on whole arrays without Python loops. Scalar broadcasting stretches a single number across every element." }
    vi: { front: "Vectorization (và scalar broadcasting) trong NumPy là gì?", back: "Là viết phép toán trực tiếp trên cả mảng mà không cần vòng lặp Python. Scalar broadcasting tự trải một con số ra mọi phần tử." }
  - id: p4-01-f03
    tags: [numpy]
    code: "grid.mean(axis=0), grid.mean(axis=1)"
    en: { front: "In a 2D array, what is the difference between `axis=0` and `axis=1`?", back: "`axis=0` aggregates down each column (collapsing rows). `axis=1` aggregates across each row (collapsing columns)." }
    vi: { front: "Trên mảng 2D, `axis=0` và `axis=1` khác nhau thế nào?", back: "`axis=0` tổng hợp dọc theo từng cột (gộp các hàng). `axis=1` tổng hợp ngang theo từng hàng (gộp các cột)." }
  - id: p4-01-f04
    tags: [numpy, booleans]
    code: "a[(a > 2) & (a < 8)]"
    en: { front: "How do you combine two conditions in a NumPy boolean mask?", back: "Use `&` (and) or `|` (or) instead of `and`/`or`, and wrap every comparison in parentheses `( ... )`." }
    vi: { front: "Làm sao kết hợp hai điều kiện trong một boolean mask của NumPy?", back: "Dùng `&` (và) hoặc `|` (hoặc) thay cho `and`/`or`, và bọc mỗi phép so sánh trong ngoặc đơn `( ... )`." }
  - id: p4-01-f05
    tags: [numpy]
    code: "scores.argmax()"
    en: { front: "What does `argmax()` return?", back: "The **index** of the largest element (the first index if there is a tie), not the value itself." }
    vi: { front: "`argmax()` trả về gì?", back: "**Chỉ số** (index) của phần tử lớn nhất (chỉ số đầu tiên nếu hòa điểm), không phải giá trị đó." }
  - id: p4-01-f06
    tags: [numpy]
    code: "part = a[1:3].copy()"
    en: { front: "Why might changing a NumPy slice change the original array?", back: "Slicing returns a **view** sharing the same memory. Call `.copy()` when you want an independent array you can mutate safely." }
    vi: { front: "Vì sao sửa một slice của NumPy có thể làm đổi mảng gốc?", back: "Phép cắt slice trả về một **view** dùng chung bộ nhớ. Hãy gọi `.copy()` khi cần bản sao độc lập để sửa an toàn." }
