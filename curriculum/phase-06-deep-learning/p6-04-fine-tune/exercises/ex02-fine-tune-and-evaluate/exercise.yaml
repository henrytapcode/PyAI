      Complete the four `...` parts: compute `preds` from the model logits, run the `AdamW` training step producing `out`, map `pred_ids` via `id2label`, and write the tie-breaking comparison.
  vi:
    - |
      Làm theo §4 và §5: `accuracy` và `predict` chạy trong `model.eval()` và `torch.no_grad()`, `fine_tune` dùng `model.train()` cùng `AdamW`, còn `pick_epoch` chọn theo bộ `(epoch, val_acc, val_loss)`. Với `epochs=0`, `fine_tune` trả về `[]` không đổi trọng số, và `pick_epoch([(1, 0.9, 0.5), (2, 0.9, 0.3)])` trả về `2`.
    - |
      Kế hoạch từng bước:
      1. Trong `accuracy` và `predict`, gọi `model.eval()`, tokenize `texts` có padding, truncation và tensor PyTorch, rồi chạy suy luận trong `torch.no_grad()`; `accuracy` so ID argmax với nhãn số nguyên và làm tròn 3 chữ số, còn `predict` tra nhãn qua `model.config.id2label`.
      2. Trong `fine_tune`, trả ngay danh sách rỗng khi `epochs <= 0`; ngược lại tokenize một lần, tạo tensor nhãn nguyên, khởi tạo `torch.optim.AdamW`, và ở mỗi epoch bật `model.train()`, xóa gradient, tính loss với `labels=y`, lan truyền ngược, cập nhật trọng số và lưu loss làm tròn 4 chữ số.
      3. Trong `pick_epoch`, duyệt qua các bộ `(epoch, val_acc, val_loss)` để lấy `val_acc` cao nhất, hòa thì chọn `val_loss` thấp hơn và nếu hòa cả hai thì giữ epoch sớm hơn.
    - |
