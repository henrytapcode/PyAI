id: p6-03-ex02
kind: code
title:
  en: "Write: classify feedback and filter negatives"
  vi: "Viết code: phân loại phản hồi và lọc câu tiêu cực"
difficulty: 2
tags: [huggingface, pytorch, dl]
hints:
  en:
    - |
      This combines tokenization with `padding=True, truncation=True, return_tensors="pt"` from §2 with manual inference (`model.eval()`, `torch.no_grad()`, `softmax`, `argmax`, `id2label`) from §3. For `["Great answer!"]`, `classify` returns `[("POSITIVE", 1.0)]` (score rounded to 3 decimals).
    - |
      The plan:
      1. In `classify(texts)`: if `not texts`, return `[]` right away; otherwise tokenize `texts` with `padding=True, truncation=True, return_tensors="pt"`.
      2. Call `model.eval()`, run `with torch.no_grad(): logits = model(**batch).logits`, compute `probs = torch.softmax(logits, dim=1)` and `pred_ids = logits.argmax(dim=1)`.
      3. Build and return `[(model.config.id2label[idx], round(prob_row[idx], 3)) for prob_row, idx in zip(probs.tolist(), pred_ids.tolist())]`.
      4. In `negatives(texts, threshold)`: call `classify(texts)` and keep each `text` whose `(label, score)` satisfies `label == "NEGATIVE" and score >= threshold`.
    - |
      The shape of the solution:
      ```python
      def classify(texts: list[str]) -> list[tuple[str, float]]:
          if not texts:
              return []
          batch = tokenizer(texts, padding=True, truncation=True, return_tensors="pt")
          model.eval()
          with torch.no_grad():
              logits = ...
          probs = torch.softmax(logits, dim=1)
          pred_ids = ...
          return [
              (model.config.id2label[idx], round(prob_row[idx], 3))
              for prob_row, idx in zip(probs.tolist(), pred_ids.tolist())
          ]


      def negatives(texts: list[str], threshold: float) -> list[str]:
          return [
              text for text, (label, score) in zip(texts, classify(texts))
              if ...
          ]
      ```
      Remember to check `if not texts: return []` before calling `tokenizer(...)` so an empty input never crashes.
