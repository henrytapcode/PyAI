id: p6-03-ex02
kind: code
title:
  en: "Write: classify feedback and filter negatives"
  vi: "Viết code: phân loại phản hồi và lọc câu tiêu cực"
difficulty: 2
tags: [huggingface, pytorch, dl]
hints:
  en:
    - |
      This combines tokenization (`padding`, `truncation`, PyTorch tensors) from §2 with manual inference (`model.eval()`, `torch.no_grad()`, softmax, argmax, `id2label`) from §3. For `["Great answer!"]`, `classify` returns `[("POSITIVE", 1.0)]`.
    - |
      The plan:
      1. In `classify`, return an empty list right away when `texts` is empty; otherwise tokenize the whole list as padded, truncated PyTorch tensors.
      2. Switch the model with `model.eval()` and run the forward pass inside `torch.no_grad()` to get logits, then compute row-wise probabilities and predicted class indices.
      3. Pair each row's winning label string from `model.config.id2label` with its rounded 3-decimal probability.
      4. In `negatives`, pair each original text with its `(label, score)` from `classify` and keep only `"NEGATIVE"` predictions meeting `threshold`.
    - |
      The shape of the solution:
      ```python
      def classify(texts: list[str]) -> list[tuple[str, float]]:
          if not texts:
              return []
          batch = tokenizer(texts, padding=True, truncation=True, return_tensors="pt")
          model.eval()
          with torch.no_grad():
              logits = model(**batch).logits
          probs = ...
          pred_ids = logits.argmax(dim=1)
          return [
              (model.config.id2label[idx], round(prob_row[idx], 3))
              for prob_row, idx in zip(probs.tolist(), pred_ids.tolist())
          ]


      def negatives(texts: list[str], threshold: float) -> list[str]:
          return [
              text for text, (label, score) in zip(texts, classify(texts))
              if ...
          ]
      ```
      Remember that softmax normalizes along the class dimension (`dim=1`), and boundary scores equal to `threshold` must be kept.
  vi:
    - |
      Bài này kết hợp bước tokenize (`padding`, `truncation`, tensor PyTorch) ở §2 và bước tự chạy model (`model.eval()`, `torch.no_grad()`, softmax, argmax, `id2label`) ở §3. Với `["Great answer!"]`, `classify` trả về `[("POSITIVE", 1.0)]`.
    - |
      Kế hoạch:
      1. Trong `classify`, trả ngay danh sách rỗng nếu `texts` rỗng; ngược lại tokenize cả danh sách thành batch tensor PyTorch có padding và truncation.
      2. Bật `model.eval()` và chạy suy luận trong `torch.no_grad()` để lấy logits, rồi tính xác suất theo từng hàng cùng chỉ số lớp dự đoán.
      3. Ghép tên nhãn từ `model.config.id2label` với xác suất làm tròn 3 chữ số cho mỗi câu.
      4. Trong `negatives`, ghép từng câu gốc với cặp `(label, score)` từ `classify` và giữ lại các câu có nhãn `"NEGATIVE"` đạt ngưỡng `threshold`.
    - |
      Hình dạng của lời giải:
      ```python
      def classify(texts: list[str]) -> list[tuple[str, float]]:
          if not texts:
              return []
          batch = tokenizer(texts, padding=True, truncation=True, return_tensors="pt")
          model.eval()
          with torch.no_grad():
              logits = model(**batch).logits
          probs = ...
          pred_ids = logits.argmax(dim=1)
          return [
              (model.config.id2label[idx], round(prob_row[idx], 3))
              for prob_row, idx in zip(probs.tolist(), pred_ids.tolist())
          ]


      def negatives(texts: list[str], threshold: float) -> list[str]:
          return [
              text for text, (label, score) in zip(texts, classify(texts))
              if ...
          ]
      ```
      Nhớ chuẩn hóa softmax theo chiều lớp (`dim=1`) và giữ cả trường hợp điểm bằng đúng `threshold`.
