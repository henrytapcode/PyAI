id: p6-03-ex01
kind: fill
title:
  en: "Fill: count non-special tokens"
  vi: "Điền khuyết: đếm số token không tính token đặc biệt"
difficulty: 1
tags: [huggingface, strings]
hints:
  en:
    - |
      This follows §2, which contrasts calling the tokenizer directly (adds `[CLS]` and `[SEP]`) against splitting raw subword pieces. For `["Great!", "Chatbot logs!"]` you must return `[2, 4]`.
    - |
      The plan:
      1. Loop over every string in `texts`.
      2. Call the tokenizer method that returns subword pieces without `[CLS]` or `[SEP]`, count how many pieces are returned as a Python `int`, and collect the counts in a list.
      3. Return the list of integer counts.
    - |
      Equivalent loop structure (can also be written as a one-line comprehension for the starter):
      ```python
      counts = []
      for text in texts:
          pieces = ...  # call the tokenizer's subword-splitting method on text
          counts.append(len(pieces))
      return counts
      ```
      Use the method on `tokenizer` introduced in §2 that returns string token pieces rather than padded ID tensors.
  vi:
    - |
      Bài này đi theo §2, nơi phân biệt việc gọi trực tiếp tokenizer (tự thêm `[CLS]` và `[SEP]`) với việc tách mảnh subword thuần túy. Với `["Great!", "Chatbot logs!"]` hàm phải trả về `[2, 4]`.
    - |
      Kế hoạch:
      1. Duyệt qua từng chuỗi trong `texts`.
      2. Gọi method của `tokenizer` trả về danh sách mảnh subword mà không thêm `[CLS]` hay `[SEP]`, đếm số phần tử dạng `int` Python và gom vào một danh sách.
      3. Trả về danh sách các số nguyên vừa đếm được.
    - |
      Cấu trúc vòng lặp tương đương (cũng có thể điền thành list comprehension ở starter):
      ```python
      counts = []
      for text in texts:
          pieces = ...  # gọi method tách mảnh subword của tokenizer trên text
          counts.append(len(pieces))
      return counts
      ```
      Hãy dùng method của `tokenizer` đã học ở §2 để nhận danh sách chuỗi token thay vì tensor ID có token đặc biệt.
