questions:
  - id: p6-02-q01
    type: mcq
    tags: [pytorch, dl]
    difficulty: 1
    answer: 2
    en:
      prompt: "What does `super().__init__()` accomplish in a subclass of `nn.Module`?"
      options:
        - "Automatically trains the model for one full epoch right at creation"
        - "Converts every parameter weight tensor from `float32` into `float64`"
        - "Initialises `nn.Module` tracking to register layers and weights"
        - "Freezes every parameter tensor so `requires_grad` becomes `False`"
      explanation: "`super().__init__()` sets up `nn.Module`'s internal dictionaries so attributes like `nn.Linear` layers appear in `model.parameters()` and `model.state_dict()`."
    vi:
      prompt: "Lệnh `super().__init__()` làm gì trong class kế thừa `nn.Module`?"
      options:
        - "Tự động huấn luyện model hết một epoch ngay khi vừa khởi tạo"
        - "Chuyển đổi toàn bộ tensor trọng số từ `float32` sang `float64`"
        - "Khởi tạo bộ theo dõi của `nn.Module` để ghi nhận các tầng"
        - "Đóng băng mọi tensor tham số khiến `requires_grad` thành `False`"
      explanation: "`super().__init__()` thiết lập các cấu trúc bên trong của `nn.Module` để những tầng như `nn.Linear` được ghi nhận vào `model.parameters()` và `model.state_dict()`."

  - id: p6-02-q02
    type: output
    tags: [pytorch]
    difficulty: 1
    code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(0)
      net = nn.Sequential(nn.Linear(2, 4), nn.ReLU(), nn.Linear(4, 2))
      print(sum(p.numel() for p in net.parameters()))
    answer: "22"
    en:
      prompt: "What does this code print?"
      explanation: "`nn.Linear(2, 4)` has `2 * 4 + 4 = 12` parameters, `nn.ReLU()` has `0`, and `nn.Linear(4, 2)` has `4 * 2 + 2 = 10`, for a total of `22`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`nn.Linear(2, 4)` có `2 * 4 + 4 = 12` tham số, `nn.ReLU()` có `0`, và `nn.Linear(4, 2)` có `4 * 2 + 2 = 10`, tổng cộng là `22`."

  - id: p6-02-q03
    type: fill
    tags: [pytorch, dl]
    difficulty: 1
    code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(0)

      class SmallNet(nn.Module):
          def __init__(self) -> None:
              ___().__init__()
              self.hidden = nn.Linear(2, 4)
              self.act = nn.___()
              self.out = nn.Linear(4, 2)

          def forward(self, x: torch.Tensor) -> torch.Tensor:
              return self.out(self.act(self.hidden(x)))

      print(tuple(SmallNet()(torch.zeros(3, 2)).shape))
    answer: ["super", "ReLU"]
    en:
      prompt: "Fill in the blanks to initialise the parent `nn.Module` and add a ReLU activation layer."
      explanation: "Call `super().__init__()` at the start of `__init__` and instantiate `nn.ReLU()` for the activation."
    vi:
      prompt: "Điền vào hai chỗ trống để khởi tạo lớp cha `nn.Module` và thêm tầng kích hoạt ReLU."
      explanation: "Gọi `super().__init__()` ở đầu `__init__` và tạo `nn.ReLU()` cho tầng kích hoạt."

  - id: p6-02-q04
    type: mcq
    tags: [pytorch, dl]
    difficulty: 1
    answer: 0
    en:
      prompt: "What does `nn.ReLU()` do between two `nn.Linear` layers?"
      options:
        - "Keeps positive values unchanged and zeroes out negative values"
        - "Converts raw logits into probabilities whose row sum equals `1.0`"
        - "Resets every parameter's accumulated `.grad` tensor back to zero"
        - "Splits a `TensorDataset` into shuffled training mini-batches"
      explanation: "ReLU (`max(0, x)`) introduces non-linearity by keeping positive values and zeroing negatives, so stacked linear layers do not collapse into a single line."
    vi:
      prompt: "`nn.ReLU()` làm gì khi đặt giữa hai tầng `nn.Linear`?"
      options:
        - "Giữ nguyên các số dương và đổi mọi số âm thành `0`"
        - "Chuyển các logits thô thành xác suất có tổng bằng `1.0`"
        - "Đặt lại toàn bộ tensor `.grad` của các tham số về `0`"
        - "Chia tập `TensorDataset` thành các mini-batch đã xáo trộn"
      explanation: "ReLU (`max(0, x)`) tạo tính phi tuyến bằng cách giữ số dương và đặt số âm về `0`, giúp nhiều tầng tuyến tính xếp chồng không bị gộp thành một đường thẳng duy nhất."

  - id: p6-02-q05
    type: parsons
    tags: [pytorch]
    difficulty: 1
    lines:
      - "import torch"
      - "x = torch.zeros(4, 2)"
      - "h = torch.nn.ReLU()(torch.nn.Linear(2, 4)(x))"
      - "out = torch.nn.Linear(4, 2)(h)"
      - "print(tuple(out.shape))"
    en:
      prompt: "Arrange these lines in order to run a `(4, 2)` batch through `Linear(2, 4) -> ReLU -> Linear(4, 2)` and print the output shape."
      explanation: "Import `torch`, create input `x`, compute hidden tensor `h` from `x`, compute `out` from `h`, and print `tuple(out.shape)` (`(4, 2)`)."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để đưa batch `(4, 2)` qua `Linear(2, 4) -> ReLU -> Linear(4, 2)` và in shape đầu ra."
      explanation: "Import `torch`, tạo đầu vào `x`, tính tensor ẩn `h` từ `x`, tính `out` từ `h`, rồi in `tuple(out.shape)` (`(4, 2)`)."

  - id: p6-02-q06
    type: mcq
    tags: [pytorch, dl]
    difficulty: 2
    answer: 1
    en:
      prompt: "After computing `loss = loss_fn(logits, yb)`, what is the correct order of the next three calls in a PyTorch training step?"
      options:
        - "`loss.backward()` -> `optimizer.zero_grad()` -> `optimizer.step()`"
        - "`optimizer.zero_grad()` -> `loss.backward()` -> `optimizer.step()`"
        - "`optimizer.step()` -> `loss.backward()` -> `optimizer.zero_grad()`"
        - "`loss.backward()` -> `optimizer.step()` -> `model.eval()`"
      explanation: "First clear old gradients (`zero_grad()`), then compute fresh gradients (`backward()`), and finally update weights using those gradients (`step()`)."
    vi:
      prompt: "Sau khi tính `loss = loss_fn(logits, yb)`, thứ tự đúng của ba lệnh tiếp theo trong một bước train PyTorch là gì?"
      options:
        - "`loss.backward()` -> `optimizer.zero_grad()` -> `optimizer.step()`"
        - "`optimizer.zero_grad()` -> `loss.backward()` -> `optimizer.step()`"
        - "`optimizer.step()` -> `loss.backward()` -> `optimizer.zero_grad()`"
        - "`loss.backward()` -> `optimizer.step()` -> `model.eval()`"
      explanation: "Trước hết xóa gradient cũ (`zero_grad()`), rồi tính gradient mới (`backward()`), và cuối cùng cập nhật trọng số dựa trên gradient đó (`step()`)."

  - id: p6-02-q07
    type: mcq
    tags: [pytorch, dl]
    difficulty: 2
    answer: 3
    en:
      prompt: "What does `nn.CrossEntropyLoss()` expect as its first argument, and how do you extract predicted class labels from a model?"
      options:
        - "Softmax probabilities `(N, C)`, and `probs.sum(dim=1)`"
        - "Integer class labels `(N,)`, and `labels.round()`"
        - "One-hot encoded vectors `(N, C)`, and `logits.mean(dim=1)`"
        - "Raw **logits** `(N, C)`, and `logits.argmax(dim=1)`"
      explanation: "`nn.CrossEntropyLoss()` applies log-softmax internally so it takes raw logits `(N, C)`, and the highest-scoring class index per row is `logits.argmax(dim=1)`."
    vi:
      prompt: "`nn.CrossEntropyLoss()` nhận gì ở đối số đầu tiên, và bạn lấy nhãn dự đoán từ model bằng cách nào?"
      options:
        - "Xác suất sau softmax `(N, C)`, và `probs.sum(dim=1)`"
        - "Nhãn lớp kiểu số nguyên `(N,)`, và `labels.round()`"
        - "Các vector one-hot `(N, C)`, và `logits.mean(dim=1)`"
        - "**Logits** thô `(N, C)`, và `logits.argmax(dim=1)`"
      explanation: "`nn.CrossEntropyLoss()` tự áp dụng log-softmax bên trong nên nhận thẳng logits thô `(N, C)`, còn chỉ số lớp có điểm cao nhất mỗi hàng là `logits.argmax(dim=1)`."

  - id: p6-02-q08
    type: parsons
    tags: [pytorch, dl]
    difficulty: 2
    lines:
      - "import torch"
      - "w = torch.tensor(1.0, requires_grad=True)"
      - "opt = torch.optim.SGD([w], lr=0.1)"
      - "for _ in range(2):"
      - "    opt.zero_grad()"
      - "    ((w * 2.0 - 6.0) ** 2).backward()"
      - "    opt.step()"
      - "print(round(w.item(), 3), round(w.grad.item(), 3))"
    en:
      prompt: "Arrange these lines in order to run two optimizer steps (`zero_grad` -> `backward` -> `step`) and print `w` and `w.grad`."
      explanation: "Create `w` and `opt`, then inside the loop call `opt.zero_grad()` before `.backward()` and `opt.step()` so `w` updates twice and `w.grad` holds the second step's gradient when printed."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để chạy hai bước optimizer (`zero_grad` -> `backward` -> `step`) và in `w` cùng `w.grad`."
      explanation: "Tạo `w` và `opt`, rồi trong vòng lặp gọi `opt.zero_grad()` trước `.backward()` và `opt.step()` để `w` cập nhật hai lần và `w.grad` giữ gradient bước thứ hai khi in ra."

  - id: p6-02-q09
    type: output
    tags: [pytorch, dl]
    difficulty: 2
    code: |
      import torch

      logits = torch.tensor([[2.1, 0.4, -1.0], [0.2, 1.8, 0.9]])
      print(logits.argmax(dim=1).tolist())
    answer: "[0, 1]"
    en:
      prompt: "What does this code print?"
      explanation: "`dim=1` finds the index of the largest logit in each row: row 0 peaks at index `0` (`2.1`) and row 1 peaks at index `1` (`1.8`), giving `[0, 1]`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`dim=1` tìm chỉ số của logit lớn nhất ở từng hàng: hàng 0 lớn nhất tại chỉ số `0` (`2.1`), hàng 1 lớn nhất tại chỉ số `1` (`1.8`), kết quả là `[0, 1]`."

  - id: p6-02-q10
    type: fill
    tags: [pytorch, dl]
    difficulty: 2
    code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(0)
      model = nn.Linear(1, 1)
      loss_fn = nn.MSELoss()
      optimizer = torch.optim.SGD(model.parameters(), lr=0.05)

      loss = loss_fn(model(torch.tensor([[2.0]])), torch.tensor([[5.0]]))
      optimizer.___()
      loss.___()
      optimizer.___()
      print(round(loss.item(), 3))
    answer: ["zero_grad", "backward", "step"]
    en:
      prompt: "Fill in the three method names that clear old gradients, compute new ones, and update the parameters."
      explanation: "Every PyTorch training step calls `optimizer.zero_grad()`, then `loss.backward()`, then `optimizer.step()`."
    vi:
      prompt: "Điền tên ba phương thức lần lượt dùng để xóa gradient cũ, tính gradient mới và cập nhật tham số."
      explanation: "Mỗi bước huấn luyện trong PyTorch đều gọi `optimizer.zero_grad()`, rồi `loss.backward()`, rồi `optimizer.step()`."

  - id: p6-02-q11
    type: mcq
    tags: [pytorch, dl]
    difficulty: 2
    answer: 0
    en:
      prompt: "How do an **epoch** and a **batch** differ when training with `DataLoader`?"
      options:
        - "An **epoch** is one full dataset pass; a **batch** is one slice of samples"
        - "A **batch** is one full dataset pass; an **epoch** is just one single sample"
        - "An **epoch** iterates over validation data; a **batch** uses only test data"
        - "An **epoch** and a **batch** are identical whenever `shuffle=True` is set"
      explanation: "A `DataLoader` splits the dataset into mini-batches; iterating over all batches once completes one epoch."
    vi:
      prompt: "**Epoch** và **batch** khác nhau như thế nào khi train bằng `DataLoader`?"
      options:
        - "**Epoch** là một lượt qua hết tập train; **batch** là một nhóm nhỏ mẫu"
        - "**Batch** là một lượt qua toàn bộ dữ liệu; **epoch** là một mẫu đơn lẻ"
        - "**Epoch** chỉ duyệt trên dữ liệu validation; **batch** chỉ dùng dữ liệu test"
        - "Hai khái niệm trùng nhau hoàn toàn mỗi khi bật `shuffle=True` trong loader"
      explanation: "`DataLoader` chia tập dữ liệu thành nhiều mini-batch; duyệt hết toàn bộ các batch đó một lần chính là xong một epoch."

  - id: p6-02-q12
    type: output
    tags: [pytorch]
    difficulty: 2
    code: |
      import torch
      from torch.utils.data import DataLoader, TensorDataset

      torch.manual_seed(0)
      xs = torch.randn(50, 2)
      ys = torch.zeros(50, dtype=torch.int64)
      gen = torch.Generator().manual_seed(0)
      loader = DataLoader(TensorDataset(xs, ys), batch_size=16, shuffle=True, num_workers=0, generator=gen)
      print(len(loader))
    answer: "4"
    en:
      prompt: "What does this code print?"
      explanation: "50 samples divided into batches of 16 produce three full batches of 16 (`48` samples) plus one remainder batch of `2`, so `len(loader)` is `4`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "50 mẫu chia theo kích thước batch 16 cho ba batch đủ 16 (`48` mẫu) và một batch dư `2` mẫu, nên `len(loader)` bằng `4`."

  - id: p6-02-q13
    type: mcq
    tags: [pytorch, dl]
    difficulty: 2
    answer: 2
    en:
      prompt: "What do `model.eval()` and `with torch.no_grad():` do when measuring validation accuracy?"
      options:
        - "`model.eval()` writes `state_dict` to disk while `torch.no_grad()` runs `optimizer.step()`"
        - "`model.eval()` casts labels to `int64` while `torch.no_grad()` catches `float32` label errors"
        - "`model.eval()` switches layers like dropout to eval mode; `torch.no_grad()` skips graph tracking"
        - "`torch.no_grad()` resets layer weights to zero and `model.eval()` shuffles validation batches"
      explanation: "`model.eval()` controls layer behaviour during inference and `torch.no_grad()` disables autograd tracking to save memory and time. Remember to call `model.train()` before resuming training."
    vi:
      prompt: "Hai lệnh `model.eval()` và `with torch.no_grad():` làm gì khi đo validation accuracy?"
      options:
        - "`model.eval()` lưu `state_dict` xuống đĩa còn `torch.no_grad()` gọi `optimizer.step()`"
        - "`model.eval()` ép kiểu nhãn về `int64` còn `torch.no_grad()` bắt lỗi nhãn `float32`"
        - "`model.eval()` đặt dropout về chế độ đánh giá; `torch.no_grad()` tắt dựng đồ thị"
        - "`torch.no_grad()` đặt lại trọng số về 0 và `model.eval()` xáo trộn các batch validation"
      explanation: "`model.eval()` điều chỉnh hành vi của các tầng khi suy đoán và `torch.no_grad()` tắt theo dõi autograd để tiết kiệm bộ nhớ và thời gian. Nhớ gọi `model.train()` trước khi quay lại train tiếp."

  - id: p6-02-q14
    type: fill
    tags: [pytorch, dl]
    difficulty: 3
    code: |
