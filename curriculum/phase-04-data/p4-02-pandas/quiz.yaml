      explanation: "Import pandas, create `df`, build `mask`, assign through `df.loc[mask, \"tier\"] = \"high\"` (avoiding chained indexing), and print `df[\"tier\"].tolist()`."
    vi:
      prompt: "Sắp xếp các dòng để cập nhật an toàn cột `tier` thành `\"high\"` ở những hàng có `score >= 0.8` và in `['low', 'high']`."
      explanation: "Import pandas, tạo `df`, tạo `mask`, gán bằng `df.loc[mask, \"tier\"] = \"high\"` (tránh chained indexing), rồi in `df[\"tier\"].tolist()`."

flashcards:
  - id: p4-02-f01
    tags: [pandas]
    code: 'df["score"]  # Series vs DataFrame'
    en: { front: "How are a `DataFrame` and a `Series` related?", back: "A `DataFrame` is a 2D labelled table of rows and columns; a single column (like `df[\"score\"]`) is a 1D `Series` sharing the same row index." }
    vi: { front: "`DataFrame` và `Series` liên quan với nhau thế nào?", back: "`DataFrame` là bảng 2 chiều có nhãn hàng và cột; một cột đơn lẻ (như `df[\"score\"]`) là một `Series` 1 chiều dùng chung index hàng." }
  - id: p4-02-f02
    tags: [pandas, json]
    code: "pd.read_csv(io.StringIO(text))"
    en: { front: "Why wrap a CSV string in `io.StringIO(text)` before passing it to `pd.read_csv`?", back: "`io.StringIO` turns an in-memory string into a file-like object so `pd.read_csv` can parse it without an external file on disk." }
    vi: { front: "Vì sao bọc chuỗi CSV trong `io.StringIO(text)` trước khi truyền vào `pd.read_csv`?", back: "`io.StringIO` biến chuỗi trong bộ nhớ thành đối tượng giả file để `pd.read_csv` đọc được mà không cần file thật trên ổ đĩa." }
  - id: p4-02-f03
    tags: [pandas]
    code: 'df.loc["r2"] vs df.iloc[1]'
    en: { front: "When do you use `.loc` versus `.iloc`?", back: "Use `.loc[...]` to select by row/column **labels** (index names and column names), and `.iloc[...]` to select by 0-based integer **positions**." }
    vi: { front: "Khi nào dùng `.loc` và khi nào dùng `.iloc`?", back: "Dùng `.loc[...]` để chọn theo **nhãn** hàng/cột (tên index và tên cột), còn `.iloc[...]` chọn theo **vị trí** số nguyên đếm từ `0`." }
  - id: p4-02-f04
    tags: [pandas]
    code: 'df.sort_values("score", ascending=False).reset_index(drop=True)'
    en: { front: "What does `.reset_index(drop=True)` do after filtering or sorting?", back: "It renumbers row labels to `0, 1, 2, ...` and drops the old index instead of inserting it as an extra column." }
    vi: { front: "`.reset_index(drop=True)` làm gì sau khi lọc hoặc sắp xếp?", back: "Nó đánh lại nhãn hàng thành `0, 1, 2, ...` và vứt bỏ index cũ thay vì chèn thành một cột thừa." }
  - id: p4-02-f05
    tags: [pandas, data]
    code: 'df.groupby("model")["score"].agg(["mean", "count"])'
    en: { front: "What are the three steps of `groupby`?", back: "**Split** rows into groups by key, **apply** an aggregation (like `mean` or `count`) to each group, and **combine** the results into one table." }
    vi: { front: "Ba bước của `groupby` là gì?", back: "**Split** (tách) hàng theo khóa nhóm, **apply** (áp dụng) phép tổng hợp như `mean`/`count` lên từng nhóm, và **combine** (ghép) thành một bảng kết quả." }
  - id: p4-02-f06
    tags: [pandas, debugging]
    code: 'df.loc[df["x"] > 0, "y"] = 1'
    en: { front: "Why should you assign to filtered rows with `df.loc[mask, \"col\"] = value` instead of `df[mask][\"col\"] = value`?", back: "Chained indexing (`df[mask][\"col\"] = ...`) updates a temporary copy and triggers `SettingWithCopyWarning`, leaving `df` unchanged. Single-step `.loc` modifies `df` directly." }
    vi: { front: "Vì sao nên gán vào hàng đã lọc bằng `df.loc[mask, \"col\"] = value` thay vì `df[mask][\"col\"] = value`?", back: "Chained indexing (`df[mask][\"col\"] = ...`) sửa trên bản sao tạm và bật `SettingWithCopyWarning`, khiến `df` không đổi. Dùng `.loc` một bước sẽ sửa thẳng `df`." }
