  - id: p7-test-q15
    type: mcq
    tags: [agents, llm]
    difficulty: 3
    answer: 1
    code: |
      from pyai_llm import FakeLLM

      client = FakeLLM()
      tools = [{"name": "lookup_order", "description": "lookup order", "parameters": {"type": "object", "properties": {"id": {"type": "string"}}}}]
      msgs = [{"role": "user", "content": "lookup order '1042'"}]
      seen = []
      for _ in range(3):
          reply = client.chat(msgs, tools=tools)
          if not reply.tool_calls:
              print("final:", reply.content)
              break
          tc = reply.tool_calls[0]
          if (tc.name, tc.arguments) in seen:
              print("stopped: repeat")
              break
          seen.append((tc.name, tc.arguments))
          msgs.append({"role": "assistant", "content": None, "tool_calls": [{"id": tc.id, "name": tc.name, "arguments": tc.arguments}]})
    en:
      prompt: "This loop prints `stopped: repeat` on iteration 2 instead of finishing with a text reply. Which missing step causes the model to repeat `lookup_order`?"
      options:
        - "Resetting `seen.clear()` before starting the second loop turn"
        - "Appending the `tool` result message with `tc.id` to `msgs`"
        - "Passing `temperature=0.8` to vary the tool name each turn"
        - "Removing the `assistant` message from `msgs` after step 1"
      explanation: "Because no `{\"role\": \"tool\", \"tool_call_id\": tc.id, \"content\": ...}` observation was appended to `msgs`, the model never receives the tool output and proposes the exact same `lookup_order` call again on turn 2."
    vi:
      prompt: "Vòng lặp này in `stopped: repeat` ngay ở lượt 2 thay vì trả lời xong bằng văn bản. Thiếu bước nào khiến model cứ gọi lặp lại `lookup_order`?"
      options:
        - "Gọi `seen.clear()` để xóa lịch sử trước khi bắt đầu lượt thứ hai"
        - "Nối message kết quả `tool` kèm `tc.id` vào danh sách `msgs`"
        - "Truyền `temperature=0.8` để model đổi sang tên tool khác ở lượt sau"
        - "Xóa message `assistant` vừa thêm khỏi `msgs` sau khi xong bước 1"
      explanation: "Do chưa nối message quan sát `{\"role\": \"tool\", \"tool_call_id\": tc.id, \"content\": ...}` vào `msgs`, model không thấy kết quả chạy tool nên ở lượt 2 lại đề xuất đúng lệnh `lookup_order` cũ."

