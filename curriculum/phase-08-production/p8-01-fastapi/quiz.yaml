    difficulty: 2
    code: |
      from fastapi import FastAPI, HTTPException
      from fastapi.testclient import TestClient
      from pydantic import BaseModel

      app = FastAPI()


      class Item(BaseModel):
          name: str


      @app.post("/items/{item_id}")
      def get_or_fail(item_id: int, body: Item):
          if item_id == 99:
              raise HTTPException(status_code=___, detail="missing")
          return {"id": item_id, "name": body.name}


      r = TestClient(app).post("/items/99", ___={"name": "box"})
      print(r.status_code)
    answer: ["404", "json"]
    en:
      prompt: "Fill in the missing HTTP status code for a missing item and the `TestClient.post` keyword argument that sends a JSON body so the snippet prints `404`."
      explanation: "Raise `HTTPException(status_code=404, ...)` for missing items and pass `json={\"name\": \"box\"}` in `TestClient.post` so FastAPI reaches your route handler instead of failing with `422`."
    vi:
      prompt: "Điền mã trạng thái cho mục không tìm thấy và tham số có tên của `TestClient.post` để gửi JSON body sao cho đoạn code in ra `404`."
      explanation: "Raise `HTTPException(status_code=404, ...)` khi thiếu tài nguyên và truyền `json={\"name\": \"box\"}` trong `TestClient.post` để request qua được Pydantic và chạy vào hàm."

