id: p8-01-ex01
kind: fill
title:
  en: "Fill: notes API routes and status codes"
  vi: "Điền khuyết: các route và status code cho API ghi chú"
difficulty: 1
tags: [production, apis, typing]
hints:
  en:
    - |
      Review §2–§4 on FastAPI route decorators, creation status codes, typed path parameters, and `HTTPException`. For `POST /notes` with `{"text": "hi"}`, the response status is `201` and body is `{"id": 1, "text": "hi"}`.
    - |
      The plan:
      1. Name the string field on `NoteCreate` to match the attribute read inside `create_note`.
      2. Choose the read-only HTTP method decorator for `list_notes`, and pass the "Created" status code on `create_note`.
      3. Type `note_id` as a whole number so non-numeric path segments fail validation, and pass the "not found" status code to `HTTPException` when the ID is missing.
    - |
      For the missing-note lookup, follow this pattern:
      ```python
      @app.get("/items/{item_id}")
      def read_item(item_id: ...):
          if item_id not in items:
              raise HTTPException(status_code=..., detail="...")
          return ...
      ```
      Use Python's integer type for the URL ID and the standard HTTP status code for a missing resource.
  vi:
    - |
      Xem lại §2–§4 về decorator route trong FastAPI, mã trạng thái khi tạo mới, type hint cho path parameter và `HTTPException`. Với `POST /notes` gửi `{"text": "hi"}`, status trả về phải là `201` và body là `{"id": 1, "text": "hi"}`.
    - |
      Kế hoạch:
      1. Đặt tên trường chuỗi trong `NoteCreate` khớp với thuộc tính được đọc trong `create_note`.
      2. Chọn decorator HTTP chỉ đọc cho `list_notes`, và đặt mã trạng thái "đã tạo mới" trên `create_note`.
      3. Khai báo `note_id` là kiểu số nguyên để URL không phải số bị chặn lại, rồi truyền mã "không tìm thấy" vào `HTTPException` khi thiếu ID.
    - |
      Với nhánh tra cứu ghi chú có thể bị thiếu, hãy theo mẫu sau:
      ```python
      @app.get("/items/{item_id}")
      def read_item(item_id: ...):
          if item_id not in items:
              raise HTTPException(status_code=..., detail="...")
          return ...
      ```
      Dùng kiểu số nguyên của Python cho ID trong URL và mã trạng thái HTTP chuẩn khi không tìm thấy tài nguyên.
