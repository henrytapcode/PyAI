  - id: cap-01-q08
    type: mcq
    tags: [rag, debugging]
    difficulty: 3
    answer: 3
    en:
      prompt: "What goes wrong over 3+ turns if `ChatBot.ask` appends `rewritten` instead of the raw `question` to `self.history`?"
      options:
        - "`FakeLLM.chat` raises `IndexError` when a turn has two question marks"
        - "`retrieve` refuses to score any query that matches two FAQ pages"
        - "`trim_history` counts only the first sentence of every user turn"
        - "Later turns prepend stale concatenated queries and waste tokens"
      explanation: "Storing `rewritten` in `self.history` causes each new follow-up to prepend all earlier rewritten questions, snowballing unrelated topic words into retrieval and filling the token budget."
    vi:
      prompt: "Lỗi gì xảy ra qua từ 3 lượt trở lên nếu `ChatBot.ask` lưu `rewritten` thay vì `question` gốc vào `self.history`?"
      options:
