id: p7-08-evals
phase: p7
order: 8
kind: lesson
title:
  en: "Evals"
  vi: "Eval"
summary:
  en: "Build a small eval set, score retrieval hit rate and answer faithfulness separately, compare two RAG configurations honestly with counts, and turn evals into regression checks."
  vi: "Xây dựng tập eval nhỏ, chấm tách biệt tỉ lệ truy xuất trúng và độ trung thực câu trả lời, so sánh hai cấu hình RAG bằng số đếm, và biến eval thành bài kiểm tra hồi quy."
level: beginner
tags: [llm, rag, evaluation]
prerequisites: [p7-05-rag, p5-04-evaluation]
duration_min: 15
outcomes:
  en:
    - "Build small eval datasets with expected facts"
    - "Score retrieval hit rate and answer faithfulness"
    - "Compare two RAG configurations on the same eval set"
  vi:
    - "Tạo tập eval nhỏ kèm thông tin kỳ vọng"
    - "Chấm tỉ lệ truy xuất trúng và độ trung thực câu trả lời"
    - "So sánh hai cấu hình RAG trên cùng một tập eval"
