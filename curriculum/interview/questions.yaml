  - id: iv-05
    topic: iterators
    level: mid
    kind: concept
    code: |
      def read_batches(items, size):
          for i in range(0, len(items), size):
              yield items[i:i + size]
    en:
      question: "What is a generator and why is it useful for AI workloads?"
      answer: |
        A generator function contains `yield`. Calling it does not run the body: it returns a generator object, which is an iterator. Each `next()` (or each loop step) runs the body up to the next `yield`, then pauses with its local variables kept.
        Values are produced lazily, one at a time, so you never need the whole result in memory. That suits streaming a large file line by line, producing batches for embedding or training (the example yields one slice per step; for data too big for RAM, yield from a file or database cursor instead of a list), and streaming LLM tokens.
        Trade-off: a generator can be consumed only once and has no `len()` or indexing. Wrap it in `list(...)` if you need those and the data fits in memory.
      tip: "Define it precisely (function with `yield` returns an iterator), then give two AI-flavoured uses and the one-pass limitation."
    vi:
      question: "Generator là gì và vì sao hữu ích trong các tác vụ AI?"
      answer: |
        Generator function là hàm có chứa `yield`. Gọi nó không chạy thân hàm ngay: nó trả về một generator object, vốn là một iterator. Mỗi lần `next()` (hoặc mỗi bước của vòng lặp) chạy thân hàm tới `yield` kế tiếp rồi tạm dừng, giữ nguyên biến cục bộ.
        Giá trị được sinh lười (lazy), từng cái một, nên bạn không cần giữ toàn bộ kết quả trong bộ nhớ. Rất hợp để đọc file lớn theo từng dòng, tạo batch cho embedding hoặc training (ví dụ trên yield từng lát cắt; với dữ liệu quá lớn so với RAM, hãy yield từ file hoặc cursor của database thay vì list), và stream token từ LLM.
        Đánh đổi: generator chỉ duyệt được một lần và không có `len()` hay truy cập theo chỉ số. Cần những thứ đó và dữ liệu vừa bộ nhớ thì bọc bằng `list(...)`.
      tip: "Định nghĩa chính xác (hàm có `yield` trả về iterator), rồi đưa hai ứng dụng gắn với AI và giới hạn chỉ duyệt một lần."

