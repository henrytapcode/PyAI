  - id: p4-05-q08
    type: mcq
    tags: [sql]
    difficulty: 2
    answer: 0
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE users (name TEXT)")
      conn.execute("SELECT * FROM users WHERE name = ?", ("ab"))
    en:
      prompt: "Why does `conn.execute(\"SELECT * FROM users WHERE name = ?\", (\"ab\"))` raise `sqlite3.ProgrammingError`?"
      options:
        - "Because `(\"ab\")` without a trailing comma is a 2-character string, so SQLite sees 2 bindings (`'a'` and `'b'`) for 1 `?`; write `(\"ab\",)`"
        - "Because `SELECT *` cannot be used with a `WHERE` clause"
        - "Because SQLite requires double quotes around `?` like `\"?\"`"
        - "Because `:memory:` databases do not support `SELECT` queries"
      explanation: "In Python, parentheses alone do not make a tuple: `(\"ab\")` is just `\"ab\"` (length 2). Adding a trailing comma `(\"ab\",)` creates a 1-element tuple."
    vi:
      prompt: "Vì sao `conn.execute(\"SELECT * FROM users WHERE name = ?\", (\"ab\"))` báo lỗi `sqlite3.ProgrammingError`?"
      options:
        - "Vì `(\"ab\")` thiếu dấu phẩy là một chuỗi 2 ký tự, nên SQLite nhận 2 giá trị (`'a'` và `'b'`) cho 1 dấu `?`; phải viết `(\"ab\",)`"
        - "Vì `SELECT *` không dùng chung được với mệnh đề `WHERE`"
        - "Vì SQLite bắt buộc bọc `?` trong ngoặc kép thành `\"?\"`"
        - "Vì database `:memory:` không hỗ trợ câu lệnh `SELECT`"
      explanation: "Trong Python, cặp ngoặc tròn đơn thuần không tạo tuple: `(\"ab\")` chỉ là chuỗi `\"ab\"` (độ dài 2). Thêm dấu phẩy `(\"ab\",)` mới tạo tuple một phần tử."

