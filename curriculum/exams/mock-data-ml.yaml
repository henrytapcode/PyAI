id: mock-data-ml
kind: mock
title:
  en: "Mock exam: Data & ML"
  vi: "Thi thử: Dữ liệu & ML"
description:
  en: "24 interview-style questions on NumPy, pandas, cleaning, plotting, SQL, and machine learning. Aim for 80% or more."
  vi: "24 câu hỏi kiểu phỏng vấn về NumPy, pandas, làm sạch dữ liệu, biểu đồ, SQL và machine learning. Mục tiêu từ 80% trở lên."
duration_min: 35
pass_score: 0.8
questions:
  # ---- data
  - id: mock2-q01
    type: output
    tags: [numpy]
    difficulty: 2
    code: |
      import numpy as np

      base_ms = np.array([[100], [200], [300]])
      region_ms = np.array([15, 40])
      total_ms = base_ms + region_ms
      print(total_ms.shape, total_ms.tolist())
    answer: "(3, 2) [[115, 140], [215, 240], [315, 340]]"
    en:
      prompt: "When estimating API latency across 3 model tiers and 2 regions, what does this broadcasting code print?"
      explanation: "NumPy broadcasts `(3, 1)` with `(2,)` by stretching the size-1 column across 2 columns and the 1D array across 3 rows, yielding shape `(3, 2)`."
    vi:
      prompt: "Khi ước lượng độ trễ API cho 3 bậc model và 2 vùng máy chủ, đoạn code broadcasting này in ra gì?"
      explanation: "NumPy broadcast mảng `(3, 1)` với `(2,)` bằng cách trải chiều kích thước 1 ra 2 cột và trải mảng 1D xuống 3 hàng, cho kết quả shape `(3, 2)`."

  - id: mock2-q02
    type: mcq
    tags: [numpy]
    difficulty: 3
    answer: 1
    code: |
      # X has shape (100, 4): 100 chatbot requests, 4 numeric features
      X_norm = (X - X.mean(axis=...)) / X.std(axis=...)
    en:
      prompt: "In a technical interview, `X` has shape `(100, 4)` (100 requests by 4 features). How should you compute z-score normalization so each feature has mean 0 and std 1?"
      options:
        - "Use `axis=1` to compute one mean and std per feature"
        - "Use `axis=0` to compute one mean and std per feature"
        - "Use `axis=1` to compute one mean and std per request"
        - "Omit `axis` to compute one global mean and std across `X`"
      explanation: "Features sit in the 4 columns, so `axis=0` aggregates down the 100 rows to return shape `(4,)`—one mean and std per feature column—which broadcasts cleanly across `(100, 4)`. Using `axis=1` aggregates per request row (`(100,)`), and omitting `axis` mixes unrelated feature scales."
    vi:
      prompt: "Trong buổi phỏng vấn, ma trận `X` có shape `(100, 4)` (100 request và 4 feature số). Bạn cần chuẩn hóa z-score thế nào để mỗi feature có trung bình 0 và độ lệch chuẩn 1?"
      options:
        - "Dùng `axis=1` để tính trung bình và độ lệch chuẩn theo từng feature"
        - "Dùng `axis=0` để tính trung bình và độ lệch chuẩn theo từng feature"
        - "Dùng `axis=1` để tính trung bình và độ lệch chuẩn theo từng request"
        - "Bỏ `axis` để tính chung một trung bình và độ lệch chuẩn cho cả `X`"
      explanation: "Các feature nằm theo 4 cột, nên `axis=0` tổng hợp dọc qua 100 hàng để ra mảng shape `(4,)`—mỗi feature một trung bình và độ lệch chuẩn—rồi broadcast khớp với `(100, 4)`. Dùng `axis=1` là tính theo từng hàng request (`(100,)`), còn bỏ `axis` thì gộp lẫn các đơn vị đo."

  - id: mock2-q03
    type: output
    tags: [numpy]
    difficulty: 3
    code: |
      import numpy as np

      tokens = np.array([120, 300, 450, 200])
      window = tokens[1:3]
      safe = tokens[1:3].copy()
      window[0] = 999
      safe[1] = 111
      print(tokens.tolist(), safe.tolist())
    answer: "[120, 999, 450, 200] [300, 111]"
    en:
      prompt: "You inspect a slice of token counts from an inference batch. What does this code print?"
      explanation: "Slicing `tokens[1:3]` returns a view sharing memory with `tokens`, so `window[0] = 999` overwrites `tokens[1]`. Calling `.copy()` creates an independent array `safe`, so modifying `safe[1]` leaves `tokens[2]` untouched."
    vi:
      prompt: "Bạn kiểm tra một lát cắt số token từ lô dữ liệu suy luận. Đoạn code này in ra gì?"
      explanation: "Cắt slice `tokens[1:3]` trả về một view dùng chung bộ nhớ với `tokens`, nên `window[0] = 999` làm đổi `tokens[1]`. Gọi `.copy()` tạo mảng `safe` độc lập, nên sửa `safe[1]` không ảnh hưởng tới `tokens[2]`."

  - id: mock2-q04
    type: output
    tags: [pandas]
    difficulty: 2
    code: |
      import pandas as pd

      logs = pd.DataFrame({
          "model": ["mini", "pro", "mini", "base", "pro"],
          "cost": [0.02, 0.45, 0.04, 0.12, 0.55],
      })
      summary = logs.groupby("model")["cost"].mean().round(3).to_dict()
      print(summary)
    answer: "{'base': 0.12, 'mini': 0.03, 'pro': 0.5}"
    en:
      prompt: "You summarize LLM API token spend per model from request logs. What does this code print?"
      explanation: "`groupby(\"model\")` sorts group keys alphabetically (`base`, `mini`, `pro`) and averages `cost` within each group: `0.12`, `(0.02 + 0.04) / 2 = 0.03`, and `(0.45 + 0.55) / 2 = 0.5`."
    vi:
      prompt: "Bạn tổng hợp chi phí token API trung bình theo từng model từ log request. Đoạn code này in ra gì?"
      explanation: "`groupby(\"model\")` sắp xếp tên nhóm theo thứ tự chữ cái (`base`, `mini`, `pro`) rồi tính trung bình `cost` từng nhóm: `0.12`, `(0.02 + 0.04) / 2 = 0.03` và `(0.45 + 0.55) / 2 = 0.5`."

  - id: mock2-q05
    type: output
    tags: [pandas]
    difficulty: 3
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "route": ["chat", "search", "embed", "summary"],
          "calls": [100, 300, 500, 150],
          "unit_cost": [0.02, 0.01, 0.002, 0.03],
      })
      df["total"] = df["calls"] * df["unit_cost"]
      top2 = df.sort_values("total", ascending=False).head(2)
      print(top2["route"].tolist())
    answer: "['summary', 'search']"
    en:
      prompt: "To find which two AI service routes drive the highest total spend, what does this code print?"
      explanation: "Vectorized multiplication gives `total`: `chat=2.0`, `search=3.0`, `embed=1.0`, `summary=4.5`. Passing `ascending=False` puts the largest two first (`['summary', 'search']`); omitting it would sort ascending and print the two lowest."
    vi:
      prompt: "Để tìm hai endpoint AI tốn tổng chi phí cao nhất, đoạn code này in ra gì?"
      explanation: "Phép nhân vector hóa cho `total`: `chat=2.0`, `search=3.0`, `embed=1.0`, `summary=4.5`. Truyền `ascending=False` xếp hai tuyến tốn nhất lên đầu (`['summary', 'search']`); nếu quên tham số này, bảng sẽ xếp tăng dần và in ra hai tuyến thấp nhất."

  - id: mock2-q06
    type: fill
    tags: [pandas, data-cleaning]
    difficulty: 2
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "label": ["ok", "spam", "ok", "ok", "spam", "ok", "ok", "ok"],
      })
      ratios = (df["label"].___() / len(df)).round(3).to_dict()
      print(ratios)
    answer: ["value_counts"]
    en:
      prompt: "To check class imbalance on support tickets, fill in the pandas method so `ratios` prints `{'ok': 0.75, 'spam': 0.25}`."
      explanation: "`df[\"label\"].value_counts()` returns the frequency of each unique label (`ok: 6`, `spam: 2`); dividing by `len(df)` (`8`) turns counts into class proportions."
    vi:
      prompt: "Để kiểm tra mức độ lệch lớp của các ticket hỗ trợ, điền tên phương thức pandas để `ratios` in ra `{'ok': 0.75, 'spam': 0.25}`."
      explanation: "`df[\"label\"].value_counts()` đếm tần suất mỗi nhãn duy nhất (`ok: 6`, `spam: 2`); chia cho `len(df)` (`8`) biến số đếm thành tỉ lệ từng nhãn."

  - id: mock2-q07
    type: output
    tags: [data-cleaning, pandas]
    difficulty: 2
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "endpoint": ["/ask", "/ask", "/ask", "/ask", "/ask"],
          "latency_ms": ["120", "timeout", "240", "N/A", "180"],
      })
      df["latency_ms"] = pd.to_numeric(df["latency_ms"], errors="coerce")
      clean = df.dropna(subset=["latency_ms"])
      print(len(clean), round(float(clean["latency_ms"].mean()), 3))
    answer: "3 180.0"
    en:
      prompt: "A latency log column arrives as mixed strings. What does this cleaning snippet print?"
      explanation: "`pd.to_numeric(..., errors=\"coerce\")` turns `\"timeout\"` and `\"N/A\"` into `NaN`, `dropna` leaves `3` valid rows (`120.0`, `240.0`, `180.0`), and their mean is `180.0`."
    vi:
      prompt: "Một cột log độ trễ chứa lẫn lộn số và chuỗi chữ. Đoạn code làm sạch này in ra gì?"
      explanation: "`pd.to_numeric(..., errors=\"coerce\")` biến `\"timeout\"` và `\"N/A\"` thành `NaN`, `dropna` giữ lại `3` dòng hợp lệ (`120.0`, `240.0`, `180.0`), và trung bình của chúng là `180.0`."

  - id: mock2-q08
    type: mcq
    tags: [data-cleaning, pandas]
    difficulty: 3
    answer: 2
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "name": [" Alice", "alice", "ALICE "],
          "plan": ["free", "pro", "pro"],
      })
    en:
      prompt: "These three rows represent the same customer with hidden whitespace and casing differences. Which step sequence deduplicates them into a single Alice row?"
      options:
        - "Call `drop_duplicates(subset=[\"name\"])` first, then `.str.strip().str.lower()`"
        - "Run `.str.strip().str.lower()`, then `drop_duplicates(subset=[\"name\"], keep=False)`"
        - "Run `.str.strip().str.lower()`, then `drop_duplicates(subset=[\"name\"])`"
        - "Run `.str.strip().str.lower()`, then `df.dropna(subset=[\"name\"], how=\"any\")`"
      explanation: "You must strip spaces and lowercase **before** `drop_duplicates`; otherwise all three look distinct and survive. `keep=False` drops every duplicate leaving zero rows, and `dropna` only removes missing (`NaN`) values."
    vi:
      prompt: "Ba dòng trên là cùng một khách hàng nhưng bị lẫn khoảng trắng và chữ hoa thường. Trình tự nào khử trùng đúng để chỉ giữ một dòng cho Alice?"
      options:
        - "Gọi `drop_duplicates(subset=[\"name\"])` trước, rồi `.str.strip().str.lower()`"
        - "Chạy `.str.strip().str.lower()`, rồi `drop_duplicates(subset=[\"name\"], keep=False)`"
        - "Chạy `.str.strip().str.lower()`, rồi `drop_duplicates(subset=[\"name\"])`"
        - "Chạy `.str.strip().str.lower()`, rồi `df.dropna(subset=[\"name\"], how=\"any\")`"
      explanation: "Phải cắt khoảng trắng và hạ chữ thường **trước** khi gọi `drop_duplicates`; nếu không cả ba chuỗi vẫn khác nhau và bị giữ lại hết. `keep=False` xóa sạch các dòng trùng khiến không còn dòng nào, còn `dropna` chỉ bỏ giá trị `NaN`."

