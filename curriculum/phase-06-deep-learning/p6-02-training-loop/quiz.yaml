      )
    en:
      front: "What is the difference between an **epoch** and a **batch**?"
      back: "An **epoch** is one full pass through the entire training dataset; a **batch** is a small subset of samples processed together for one optimizer update."
    vi:
      front: "**Epoch** và **batch** khác nhau ở điểm nào?"
      back: "**Epoch** là một lượt đi qua toàn bộ tập huấn luyện; **batch** là một nhóm nhỏ mẫu được xử lý cùng lúc cho một bước cập nhật của optimizer."

  - id: p6-02-f05
    tags: [pytorch, dl]
    code: |
      model.eval()
      with torch.no_grad():
          preds = model(X_val).argmax(dim=1)
    en:
      front: "Why use both `model.eval()` and `with torch.no_grad():` during evaluation?"
      back: "`model.eval()` puts layers like dropout into evaluation mode, while `torch.no_grad()` disables graph recording to save memory and time. Call `model.train()` before training again."
    vi:
      front: "Vì sao khi đánh giá cần dùng cả `model.eval()` và `with torch.no_grad():`?"
      back: "`model.eval()` chuyển các tầng như dropout sang chế độ đánh giá, còn `torch.no_grad()` tắt ghi đồ thị để tiết kiệm bộ nhớ và thời gian. Nhớ gọi `model.train()` trước khi train tiếp."

  - id: p6-02-f06
    tags: [pytorch, dl]
    code: |
      torch.save(model.state_dict(), path)
      reloaded = TinyNet()
      reloaded.load_state_dict(torch.load(path, weights_only=True))
    en:
      front: "What does `model.state_dict()` save, and why must you still instantiate `TinyNet()` first?"
      back: "`state_dict()` saves only the learned weight and bias tensors, not the Python class code, so you must recreate the model class instance before calling `load_state_dict(...)`."
    vi:
      front: "`model.state_dict()` lưu gì, và vì sao vẫn phải khởi tạo `TinyNet()` trước khi nạp?"
      back: "`state_dict()` chỉ lưu các tensor trọng số và bias chứ không lưu code của class, nên bạn phải tạo một instance của class đó trước rồi mới gọi `load_state_dict(...)`."
