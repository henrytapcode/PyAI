      explanation: "`plt.subplots()` tạo ra một `Figure` và một `Axes` (hoặc lưới nhiều `Axes`) rồi trả về cặp `(fig, ax)`."

  - id: p4-04-q04
    type: mcq
    tags: [plotting]
    difficulty: 1
    answer: 2
    en:
      prompt: "Which chart method is best for showing whether prompt token count and response latency increase together across individual requests?"
      options:
        - "`ax.bar(tokens, latency)`"
        - "`ax.barh(tokens, latency)`"
        - "`ax.scatter(tokens, latency)`"
        - "`ax.legend()`"
      explanation: "`ax.scatter(x, y)` plots each `(x, y)` observation as a separate dot so you can inspect the relationship between two numeric measurements."
    vi:
      prompt: "Phương thức biểu đồ nào phù hợp nhất để xem số token prompt và độ trễ phản hồi có cùng tăng ở từng request hay không?"
      options:
        - "`ax.bar(tokens, latency)`"
        - "`ax.barh(tokens, latency)`"
        - "`ax.scatter(tokens, latency)`"
        - "`ax.legend()`"
      explanation: "`ax.scatter(x, y)` chấm từng cặp `(x, y)` thành các điểm riêng lẻ để bạn quan sát mối liên hệ giữa hai đại lượng số."

  - id: p4-04-q05
    type: output
    tags: [plotting]
    difficulty: 1
    code: |
      import matplotlib.pyplot as plt
      fig, ax = plt.subplots()
      ax.plot([1, 2, 3], [0.9, 0.6, 0.4], label="train")
      ax.plot([1, 2, 3], [0.95, 0.7, 0.6], label="val")
      print(len(ax.lines))
    answer: "2"
    en:
      prompt: "What does this code print?"
      explanation: "Each call to `ax.plot(...)` adds one `Line2D` artist to `ax.lines`, so two calls give `2`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Mỗi lần gọi `ax.plot(...)` thêm một đường vào `ax.lines`, nên gọi hai lần cho kết quả là `2`."

