          else:
              cached = False
              payload, p_tok, c_tok = _run_rag(body.question, body.top_k)
              cache[key] = ...

          latency_ms = ...
          cost = ...
          records.append({"latency_ms": latency_ms, "cost": cost, "cached": cached})
          return {**payload, "usage": {"prompt_tokens": p_tok, "completion_tokens": c_tok}, "cached": cached}

      @app.get("/metrics")
      def metrics() -> dict[str, object]:
          if not records:
              return {"requests": 0, "cache_hit_rate": 0.0, "p95_ms": 0.0, "total_cost": 0.0}
          ordered = sorted(r["latency_ms"] for r in records)
          p95_ms = ...
          return {"requests": len(records), "cache_hit_rate": sum(r["cached"] for r in records) / len(records), "p95_ms": p95_ms, "total_cost": round(sum(r["cost"] for r in records), 6)}
