        - "`retrieve` từ chối chấm điểm mọi truy vấn khớp với từ hai trang FAQ"
        - "`trim_history` chỉ đếm mỗi câu đầu tiên của từng lượt người dùng hỏi"
        - "Lượt sau ghép dây chuyền các câu cũ làm nhiễu truy xuất và tốn token"
      explanation: "Nếu lưu `rewritten` vào `self.history`, mỗi câu nối tiếp mới sẽ nối thêm cả chuỗi câu đã ghép từ trước, làm loãng từ khóa truy xuất và nhanh chóng ngốn hết ngân sách token."

  - id: cap-01-q09
    type: mcq
    tags: [evaluation, testing]
    difficulty: 1
    answer: 1
    en:
      prompt: "Why must `run_dialog_eval(make_bot, dialogs)` instantiate a fresh bot via `make_bot()` for each dialog?"
      options:
