id: p1-06-ex01
kind: project
title:
  en: "Grade report: average, grade, report"
  vi: "Bảng điểm: trung bình, xếp loại, báo cáo"
difficulty: 2
tags: [functions, lists, dicts, loops, conditions]
hints:
  en:
    - "Build it bottom-up: get `average` passing first, then `letter_grade`, then `build_report`, which calls both."
    - "In `build_report`, make a list of `(name, avg)` pairs, sort it with `key=lambda row: (-row[1], row[0])`, then build one f-string per row."
    - "Shape: `rows = []`; `for s in students: rows.append((s['name'], average(s['scores'])))`; `rows.sort(key=...)`; `return [f\"{name}: {avg:.2f} ({letter_grade(avg)})\" for name, avg in rows]`."
  vi:
    - "Làm từ dưới lên: cho `average` qua test trước, rồi `letter_grade`, rồi `build_report` gọi cả hai."
    - "Trong `build_report`, tạo list các cặp `(name, avg)`, sắp xếp bằng `key=lambda row: (-row[1], row[0])`, rồi tạo một f-string cho mỗi dòng."
    - "Khung: `rows = []`; `for s in students: rows.append((s['name'], average(s['scores'])))`; `rows.sort(key=...)`; `return [f\"{name}: {avg:.2f} ({letter_grade(avg)})\" for name, avg in rows]`."
