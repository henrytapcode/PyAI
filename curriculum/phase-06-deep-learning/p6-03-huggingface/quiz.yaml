flashcards:
  - id: p6-03-f01
    tags: [huggingface]
    code: |
      tok = AutoTokenizer.from_pretrained(REPO, revision=REV, local_files_only=True)
      model = AutoModelForSequenceClassification.from_pretrained(REPO, revision=REV, local_files_only=True)
      clf = pipeline("sentiment-analysis", model=model, tokenizer=tok)
    en:
      front: "How do you load a pinned Hugging Face model safely offline, and why pin `revision`?"
      back: "Pass `revision=REV, local_files_only=True` to `from_pretrained(...)` and pass the loaded `model` and `tokenizer` into `pipeline()`. Pinning the commit hash prevents future Hub edits from changing outputs."
    vi:
      front: "Làm sao nạp model Hugging Face an toàn khi offline, và vì sao phải ghim `revision`?"
      back: "Truyền `revision=REV, local_files_only=True` vào `from_pretrained(...)` rồi đưa `model` và `tokenizer` đã nạp vào `pipeline()`. Ghim mã commit giúp thay đổi sau này trên Hub không làm sai lệch kết quả."

  - id: p6-03-f02
    tags: [huggingface]
    code: |
      tok.tokenize("Chatbot logs!")   # ['chat', '##bot', 'logs', '!']
      tok("Chatbot logs!")["input_ids"]  # [101, 11834, 18384, 15664, 999, 102]
    en:
      front: "What do `##`, `[CLS]`, and `[SEP]` mean in a DistilBERT tokenizer output?"
      back: "`##` marks a subword continuation piece inside a split word; `[CLS]` and `[SEP]` are special start and end tokens added when encoding `input_ids`."
    vi:
      front: "Ký hiệu `##`, `[CLS]` và `[SEP]` trong đầu ra của tokenizer DistilBERT nghĩa là gì?"
      back: "`##` đánh dấu mảnh từ nối tiếp bên trong một từ bị tách nhỏ; `[CLS]` và `[SEP]` là hai token đặc biệt đánh dấu đầu và cuối câu khi mã hóa `input_ids`."

  - id: p6-03-f03
    tags: [huggingface]
    code: |
      batch = tokenizer(texts, padding=True, truncation=True, return_tensors="pt")
    en:
      front: "Why pass `padding=True`, `truncation=True`, and `return_tensors=\"pt\"` when tokenizing a batch?"
      back: "`padding=True` pads shorter sentences to the longest width (marking `0` in `attention_mask`), `truncation=True` caps overly long texts, and `return_tensors=\"pt\"` outputs PyTorch tensors instead of lists."
    vi:
      front: "Vì sao khi tokenize một batch cần truyền `padding=True`, `truncation=True` và `return_tensors=\"pt\"`?"
      back: "`padding=True` đệm câu ngắn cho bằng câu dài nhất (đánh dấu `0` trong `attention_mask`), `truncation=True` cắt câu quá dài, và `return_tensors=\"pt\"` trả về tensor PyTorch thay vì list."

  - id: p6-03-f04
    tags: [huggingface, pytorch]
    code: |
      model.eval()
      with torch.no_grad():
          logits = model(**batch).logits
    en:
      front: "Why write `model(**batch)` (with `**`) inside `model.eval()` and `torch.no_grad()`?"
      back: "`**batch` unpacks `input_ids` and `attention_mask` as keyword arguments; `eval()` and `no_grad()` disable training layers and gradient tracking for fast, memory-safe inference."
    vi:
      front: "Vì sao viết `model(**batch)` (có dấu `**`) bên trong `model.eval()` và `torch.no_grad()`?"
      back: "`**batch` bung `input_ids` và `attention_mask` thành tham số có tên; `eval()` và `no_grad()` tắt chế độ train và đồ thị gradient để suy đoán nhanh và nhẹ bộ nhớ."

  - id: p6-03-f05
    tags: [huggingface, pytorch]
    code: |
      probs = torch.softmax(logits, dim=1)
      pred_ids = logits.argmax(dim=1)
      labels = [model.config.id2label[i] for i in pred_ids.tolist()]
    en:
      front: "How do you turn raw `logits` of shape `(N, 2)` into labels and confidence scores?"
      back: "Apply `torch.softmax(logits, dim=1)` to get probabilities summing to 1 per row, take `logits.argmax(dim=1)` for the winning class index, and look up `model.config.id2label[idx]`."
    vi:
      front: "Làm sao chuyển `logits` thô shape `(N, 2)` thành tên nhãn và điểm xác suất?"
      back: "Gọi `torch.softmax(logits, dim=1)` để lấy xác suất cộng lại bằng 1 trên từng hàng, dùng `logits.argmax(dim=1)` chọn chỉ số cao nhất, rồi tra `model.config.id2label[idx]`."

  - id: p6-03-f06
    tags: [huggingface]
    en:
      front: "Why can a pretrained sentiment model output `score: 0.996` and still be wrong?"
      back: "A high softmax score only means one logit beat the other — binary models have no neutral/unknown class and fail on sarcasm, error logs, or different languages. Always evaluate on your own data first."
    vi:
      front: "Vì sao một model cảm xúc có sẵn có thể trả về `score: 0.996` mà vẫn dự đoán sai?"
      back: "Điểm softmax cao chỉ cho thấy một logit lớn hơn logit kia — model hai lớp không có nhãn trung tính và hay đoán sai câu mỉa mai, log lỗi hay ngôn ngữ khác. Luôn đánh giá trên dữ liệu của bạn trước."
