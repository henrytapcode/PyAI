    en: { front: "How do you place two charts side by side without overlapping labels?", back: "Create `fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(8, 3))`, draw onto `ax1` and `ax2` separately, and call `fig.tight_layout()`." }
    vi: { front: "Làm sao đặt hai biểu đồ cạnh nhau mà nhãn không bị đè lên nhau?", back: "Tạo `fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(8, 3))`, vẽ riêng lên `ax1` và `ax2`, rồi gọi `fig.tight_layout()`." }
