    - |
      Kế hoạch:
      1. Trong `slope_at`, tạo một leaf tensor mới `w = torch.tensor(float(w_value), requires_grad=True)`, tính `loss = ((w * xs - ys) ** 2).mean()`, gọi `loss.backward()` và trả về `round(w.grad.item(), 3)`.
      2. Trong `fit_slope`, khởi tạo `w = torch.tensor(0.0, requires_grad=True)`.
      3. Lặp `steps` lần: tính MSE loss, gọi `loss.backward()`, cập nhật `w -= lr * w.grad` bên trong `with torch.no_grad():`, rồi xóa gradient bằng `w.grad.zero_()`.
      4. Sau vòng lặp, trả về `round(w.item(), 3)` dưới dạng `float` Python.
    - |
      Hình dạng của `fit_slope`:
      ```python
      w = torch.tensor(0.0, requires_grad=True)
      for _ in range(steps):
          loss = ...
          loss.backward()
          with torch.no_grad():
              w -= ...
          ...
      return round(w.item(), 3)
      ```
      Đừng quên viết cả hàm `slope_at` bằng một tensor mới ở mỗi lần gọi để gradient không bị cộng dồn giữa các lần.
