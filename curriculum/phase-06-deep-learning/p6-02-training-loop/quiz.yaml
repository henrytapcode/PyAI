      from pathlib import Path
      import torch
      import torch.nn as nn

      torch.manual_seed(0)
      model = nn.Linear(2, 2)
      with tempfile.TemporaryDirectory() as tmp:
          path = Path(tmp) / "weights.pt"
          torch.save(model.state_dict(), path)
          reloaded = nn.Linear(2, 2)
          reloaded.load_state_dict(torch.load(path, ___=True))
          reloaded.___()
          print(reloaded.training)
    answer: ["weights_only", "eval"]
    en:
      prompt: "Fill in both blanks to load saved weights safely and switch the reloaded model to evaluation mode."
      explanation: "Pass `weights_only=True` to `torch.load(...)` for safe tensor loading, and call `reloaded.eval()` before running inference."
    vi:
      prompt: "Điền vào hai chỗ trống để nạp trọng số an toàn và chuyển model vừa nạp sang chế độ đánh giá."
      explanation: "Truyền `weights_only=True` cho `torch.load(...)` để nạp tensor an toàn, rồi gọi `reloaded.eval()` trước khi dự đoán."

  - id: p6-02-q15
    type: mcq
    tags: [pytorch, dl]
    difficulty: 3
    answer: 1
    en:
      prompt: "You want to compare `lr=0.05` vs `lr=0.2` and choose between 20 or 40 epochs. How should you use the test set?"
      options:
        - "Evaluate test accuracy after every epoch and stop when test accuracy peaks"
        - "Pick `lr` and epochs on validation, then score test **once** at the end"
        - "Merge the test split into the training `DataLoader` for the final epochs"
        - "Compare test accuracy across learning rates and keep the highest score"
      explanation: "Using the test set to pick hyperparameters or stopping epochs leaks test information into your decisions; tune on validation and evaluate test once at the end."
    vi:
      prompt: "Bạn muốn so sánh `lr=0.05` với `lr=0.2` và chọn giữa 20 hoặc 40 epoch. Bạn nên dùng tập test như thế nào?"
      options:
        - "Tính test accuracy sau mỗi epoch và dừng ngay khi điểm test lên đỉnh"
        - "Chọn `lr` và số epoch bằng validation, rồi chấm test **một lần** cuối"
        - "Gộp toàn bộ tập test vào `DataLoader` huấn luyện trong vài epoch cuối"
        - "Chấm điểm test cho từng mức learning rate rồi chọn mức có điểm test cao"
      explanation: "Dùng tập test để chọn siêu tham số hay số epoch sẽ làm rò rỉ thông tin từ test vào quyết định của bạn; luôn chỉnh bằng validation và chấm test đúng một lần ở cuối."

  - id: p6-02-q16
    type: output
    tags: [pytorch, dl]
    difficulty: 3
    code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(0)
      model = nn.Linear(2, 2)
      x = torch.randn(3, 2)
      a = model(x).requires_grad
      model.eval()
      with torch.no_grad():
          b = model(x).requires_grad
      print(a, b)
    answer: "True False"
    en:
      prompt: "What does this code print?"
      explanation: "By default `model(x)` tracks operations because model parameters have `requires_grad=True`, so `a` is `True`. Inside `with torch.no_grad():`, graph tracking is off, so `b` is `False`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Mặc định `model(x)` ghi lại phép tính vì các tham số có `requires_grad=True`, nên `a` là `True`. Bên trong `with torch.no_grad():`, việc dựng đồ thị bị tắt nên `b` là `False`."

