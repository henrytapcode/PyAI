id: p7-02-ex01
kind: fill
title:
  en: "Fill: validate a parsed JSON reply"
  vi: "Điền chỗ trống: kiểm tra phản hồi JSON đã parse"
difficulty: 1
tags: [llm, json]
hints:
  en:
    - |
      This extends the schema validation pattern from §3 with an optional `"enum"` list check. For `data={"name": "Lan", "status": "pending"}` where `status` allows `["open", "closed"]`, you must return `["status: must be one of ['open', 'closed']"]`.
    - |
      The plan:
      1. Keep the required-key and type-validation loops from §3 (remembering that `bool` must be rejected before checking `int` or `float`), and skip further checks on a field once its type fails.
      2. After the type check passes, read the optional allowed-values list from the field's spec dictionary.
      3. When that allowed list is present and the field's value is not a member of it, append the formatted error message in order.
    - |
      Shape of the hardest blank inside the property loop:
      ```python
      allowed = spec.get(___)
      if allowed is not None and ...:
          errors.append(f"{key}: must be one of {___}")
      ```
      The condition on the `if` line checks membership of `value` in `allowed` so values outside the permitted list are flagged after type validation succeeds.
  vi:
    - |
      Bài này mở rộng mẫu kiểm tra schema ở §3 thêm quy tắc `"enum"` tùy chọn. Với `data={"name": "Lan", "status": "pending"}` khi `status` chỉ cho phép `["open", "closed"]`, hàm phải trả về `["status: must be one of ['open', 'closed']"]`.
    - |
      Kế hoạch:
      1. Giữ nguyên bước kiểm tra khóa bắt buộc và kiểu dữ liệu ở §3 (nhớ loại trường hợp nhận giá trị kiểu `bool` trước khi kiểm tra số nguyên/số thực), và bỏ qua bước sau cho trường đó nếu đã sai kiểu.
      2. Sau khi qua kiểm tra kiểu, đọc danh sách giá trị cho phép tùy chọn từ spec của trường đó.
      3. Khi danh sách cho phép tồn tại và giá trị của trường không nằm trong đó, nối thông báo lỗi đúng định dạng theo thứ tự.
    - |
      Hình dạng chỗ trống khó nhất trong vòng lặp trường:
      ```python
      allowed = spec.get(___)
      if allowed is not None and ...:
          errors.append(f"{key}: must be one of {___}")
      ```
      Điều kiện ở dòng `if` kiểm tra xem `value` có nằm ngoài danh sách `allowed` hay không sau khi đã kiểm tra đúng kiểu.
