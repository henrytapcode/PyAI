id: p1-01-ex02
kind: debug
title:
  en: "Debug: messy form data"
  vi: "Debug: dữ liệu form lộn xộn"
difficulty: 2
tags: [conversion, types, strings]
hints:
  en:
    - "This is §6 (converting types). Press **Run** first: the error message names the line that crashes. There are 3 bugs, one on each of the lines that create `age`, `height` and `summary`."
    - |
      Fix them in this order:
      1. `age` is still the text `"29"`. Convert it to a whole number.
      2. `height_text` is `"1.72"`, a decimal. `int()` cannot read decimals: which function can?
      3. `summary` joins text and numbers with `+`, which crashes. Rebuild it with an f-string.
    - |
      The fixed lines look like this:
      ```python
      age = int(age_text)
      height = ...(height_text)
      summary = f"Age {age}, height {...}m"
      ```
  vi:
    - "Bài này thuộc §6 (chuyển kiểu). Bấm **Run** trước: thông báo lỗi chỉ ra dòng bị lỗi. Có 3 lỗi, mỗi lỗi nằm ở một dòng tạo `age`, `height` và `summary`."
    - |
      Sửa theo thứ tự này:
      1. `age` vẫn đang là văn bản `"29"`. Hãy chuyển nó thành số nguyên.
      2. `height_text` là `"1.72"`, một số thập phân. `int()` không đọc được số thập phân: hàm nào đọc được?
      3. `summary` nối văn bản với số bằng `+` nên bị lỗi. Viết lại bằng f-string.
    - |
      Các dòng sau khi sửa trông như sau:
      ```python
      age = int(age_text)
      height = ...(height_text)
      summary = f"Age {age}, height {...}m"
      ```
