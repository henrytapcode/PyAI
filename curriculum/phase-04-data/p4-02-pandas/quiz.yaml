  - id: p4-02-q03
    type: mcq
    tags: [pandas, numpy]
    difficulty: 1
    answer: 0
    en:
      prompt: "How does a pandas `DataFrame` differ from a 2D NumPy `array`?"
      options:
        - "A `DataFrame` gives columns names and lets each column have its own `dtype`, whereas an `array` requires one `dtype` for all elements"
        - "A `DataFrame` can only store text strings, whereas a NumPy `array` stores numbers"
        - "A `DataFrame` has no row index, whereas a NumPy `array` labels every row by name"
        - "A `DataFrame` cannot run vectorised arithmetic like `col * 2`"
      explanation: "DataFrames are built on NumPy so vectorised math still works, while adding named columns, a row index, and per-column dtypes."
    vi:
      prompt: "`DataFrame` của pandas khác gì với `array` 2D của NumPy?"
      options:
        - "`DataFrame` đặt tên cho cột và cho phép mỗi cột có `dtype` riêng, còn `array` bắt mọi phần tử dùng chung một `dtype`"
        - "`DataFrame` chỉ lưu được chuỗi văn bản, còn `array` của NumPy chỉ lưu số"
        - "`DataFrame` không có chỉ mục hàng, còn `array` của NumPy gắn nhãn tên cho mọi hàng"
        - "`DataFrame` không chạy được phép tính vector hóa như `col * 2`"
      explanation: "DataFrame xây trên NumPy nên vẫn tính toán vector hóa được, đồng thời thêm tên cột, index hàng và kiểu dữ liệu riêng cho từng cột."

