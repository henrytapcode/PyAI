  - id: p5-05-q11
    type: mcq
    tags: [model-evaluation]
    difficulty: 2
    answer: 1
    en:
      prompt: "Which summary is the most honest report for a classifier tested on 58 holdout tickets (14 urgent)?"
      options:
        - "\"Our ML model achieves 93% urgent-ticket detection across production logs!\""
        - "\"On 58 holdout tickets (14 urgent), threshold 0.2 gives recall 0.929 and precision 0.500 vs baseline F1 0.000 (acc 0.759).\""
        - "\"Logistic regression scored 0.759 accuracy, beating a random coin flip by 25.9 percentage points.\""
        - "\"We tested 12 thresholds on the test set and chose 0.25 because it scored 0.667 F1.\""
      explanation: "An honest report states the test sample size (`58`, `14` urgent), both recall and precision trade-offs, and the baseline on the same split without tuning on test."
    vi:
      prompt: "Câu báo cáo nào trung thực nhất cho một bộ phân loại được kiểm tra trên 58 ticket test (14 ticket khẩn cấp)?"
      options:
        - "\"Mô hình ML của chúng tôi đạt 93% phát hiện ticket khẩn cấp trên toàn bộ hệ thống!\""
        - "\"Trên 58 ticket test (14 khẩn cấp), ngưỡng 0.2 đạt recall 0.929 và precision 0.500 so với baseline F1 0.000 (acc 0.759).\""
        - "\"Logistic regression đạt accuracy 0.759, vượt xa tung đồng xu 50% tới 25.9 điểm phần trăm.\""
        - "\"Chúng tôi thử 12 ngưỡng trên tập test và chọn 0.25 vì nó đạt F1 0.667.\""
      explanation: "Báo cáo trung thực nêu rõ cỡ mẫu test (`58`, `14` ca khẩn cấp), cả recall lẫn precision, so sánh với baseline và không chỉnh ngưỡng trên tập test."

  - id: p5-05-q12
    type: mcq
    tags: [data-cleaning]
    difficulty: 2
    answer: 3
    en:
      prompt: "When cleaning `tokens`, why do we write `df[\"tokens\"].astype(str).str.replace(\",\", \"\", regex=False)` instead of `df[\"tokens\"].str.replace(...)` directly?"
      options:
        - "Because `.astype(str)` automatically removes commas and spaces at the same time"
        - "Because `pd.to_numeric` only accepts columns whose dtype is explicitly `str`"
        - "Because `.str.replace` converts `NaN` values into `0` automatically when `.astype(str)` is called"
        - "Because if a new batch of tickets has only plain integers (no commas), pandas reads it as numeric and `.str` raises `AttributeError`"
      explanation: "Calling `.str` on a numeric column raises `AttributeError`; `.astype(str)` ensures string operations never crash on clean numeric batches."
    vi:
      prompt: "Khi làm sạch `tokens`, vì sao ta viết `df[\"tokens\"].astype(str).str.replace(\",\", \"\", regex=False)` thay vì gọi thẳng `df[\"tokens\"].str.replace(...)`?"
      options:
        - "Vì `.astype(str)` tự động xóa luôn dấu phẩy và khoảng trắng"
        - "Vì `pd.to_numeric` chỉ nhận cột có kiểu dữ liệu là `str`"
        - "Vì `.str.replace` tự động đổi `NaN` thành `0` nếu gọi `.astype(str)` trước"
        - "Vì nếu một lô dữ liệu mới toàn số nguyên trơn (không có dấu phẩy), pandas đọc thành cột số và gọi `.str` sẽ bị `AttributeError`"
      explanation: "Gọi `.str` trên cột số gây `AttributeError`; ép `.astype(str)` trước bảo đảm thao tác chuỗi không bao giờ văng lỗi dù lô mới không có chuỗi."

  - id: p5-05-q13
    type: mcq
    tags: [model-evaluation, sklearn]
    difficulty: 3
    answer: 0
    en:
      prompt: "What happens if you sweep thresholds `[0.5, 0.4, 0.3, 0.25, 0.2]` on `X_test` to pick the one with the highest test F1 and report that score as your final performance?"
      options:
        - "You leak test-set labels into the threshold choice, producing an optimistic score with no unseen data left to verify it"
        - "Cross-validation automatically re-runs on `X_test` to correct the bias"
        - "Scikit-learn raises a `DataLeakageWarning` when `predict_proba` is called on `X_test`"
        - "Precision and recall become identical regardless of class imbalance"
      explanation: "Picking a hyperparameter or threshold based on `X_test` fits to that specific test sample's noise; thresholds must be chosen on training CV (`cross_val_predict`) before scoring `X_test` once."
    vi:
      prompt: "Điều gì xảy ra nếu bạn thử các ngưỡng `[0.5, 0.4, 0.3, 0.25, 0.2]` ngay trên `X_test` để chọn ngưỡng cho F1 cao nhất rồi báo cáo điểm đó làm kết quả cuối?"
      options:
        - "Bạn làm rò rỉ nhãn tập test vào quyết định chọn ngưỡng, tạo con số lạc quan mà không còn dữ liệu chưa từng thấy để kiểm chứng"
        - "Cross-validation sẽ tự động chạy lại trên `X_test` để khử sai lệch"
        - "Scikit-learn sẽ phát `DataLeakageWarning` khi gọi `predict_proba` trên `X_test`"
        - "Precision và recall sẽ tự động bằng nhau bất chấp độ lệch lớp"
      explanation: "Chọn tham số hay ngưỡng dựa trên `X_test` là khớp theo nhiễu của đúng mẫu test đó; ngưỡng phải được chọn trên CV tập train (`cross_val_predict`) trước khi chấm `X_test` một lần."

  - id: p5-05-q14
    type: output
    tags: [model-evaluation]
    difficulty: 3
    code: |
      import numpy as np
      from sklearn.metrics import precision_score, recall_score

      oof_probs = np.array([0.85, 0.45, 0.30, 0.25, 0.10])
      y_train = np.array([1, 1, 0, 1, 0])
      preds = (oof_probs >= 0.3).astype("int64")
      print(round(float(precision_score(y_train, preds, zero_division=0)), 3), round(float(recall_score(y_train, preds)), 3))
    answer: "0.667 0.667"
    en:
      prompt: "What does this code print?"
      explanation: "At threshold `0.3`, `preds = [1, 1, 1, 0, 0]`, giving `TP = 2`, `FP = 1`, `FN = 1`, so both `precision = 2/3 = 0.667` and `recall = 2/3 = 0.667`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Ở ngưỡng `0.3`, `preds = [1, 1, 1, 0, 0]`, nên `TP = 2`, `FP = 1`, `FN = 1`; cả `precision = 2/3 = 0.667` lẫn `recall = 2/3 = 0.667`."

  - id: p5-05-q15
    type: fill
    tags: [model-evaluation, sklearn]
    difficulty: 3
    code: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import StratifiedKFold, cross_val_predict
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X_train = np.array([[0.0], [0.2], [0.4], [0.6], [1.8], [2.0], [2.2], [2.4], [2.6], [2.8]])
      y_train = np.array([0, 0, 0, 0, 1, 1, 1, 1, 0, 1])
      skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=0)
      pipe = make_pipeline(StandardScaler(), LogisticRegression())
      probs = ___(pipe, X_train, y_train, cv=skf, method="___")[:, 1]
      print(len(probs), round(float(probs.mean()), 3))
    answer: ["cross_val_predict", "predict_proba"]
    en:
      prompt: "Fill in the scikit-learn helper and `method` string to get out-of-fold class-1 probabilities on `X_train` without touching a test set."
      explanation: "`cross_val_predict(..., method=\"predict_proba\")` generates clean out-of-fold probability estimates for every training row so threshold tuning stays strictly inside `X_train`."
    vi:
      prompt: "Điền tên hàm của scikit-learn và chuỗi `method` để lấy xác suất out-of-fold cho lớp 1 ngay trên `X_train` mà không đụng tới tập test."
      explanation: "`cross_val_predict(..., method=\"predict_proba\")` sinh xác suất ngoài-fold sạch sẽ cho từng dòng train để việc chọn ngưỡng nằm hoàn toàn trong `X_train`."

  - id: p5-05-q16
