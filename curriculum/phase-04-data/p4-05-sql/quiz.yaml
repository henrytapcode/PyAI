  - id: p4-05-q14
    type: mcq
    tags: [sql]
    difficulty: 3
    answer: 3
    en:
      prompt: "What happens if you build a SQL query with an f-string like `f\"SELECT * FROM users WHERE name = '{name}'\"` instead of using a `?` placeholder?"
      options:
        - "SQLite automatically escapes quotes so it behaves identically to `?`"
        - "It runs faster because SQLite skips parsing the SQL statement"
        - "SQLite converts the query into a pandas DataFrame automatically"
        - "Apostrophes like `O'Brien` cause a syntax error, and malicious input can trigger SQL injection to alter the query"
      explanation: "Interpolating untrusted text into SQL mixes code and data: single quotes break syntax, and crafted input can inject arbitrary SQL commands. Using `?` placeholders separates SQL syntax from data."
    vi:
      prompt: "Điều gì xảy ra nếu bạn ghép câu SQL bằng f-string như `f\"SELECT * FROM users WHERE name = '{name}'\"` thay vì dùng placeholder `?`?"
      options:
        - "SQLite tự động xử lý dấu nháy nên chạy y hệt như dùng `?`"
        - "Câu lệnh chạy nhanh hơn vì SQLite bỏ qua bước phân tích cú pháp SQL"
        - "SQLite tự động chuyển kết quả sang pandas DataFrame"
        - "Chuỗi có dấu nháy như `O'Brien` sẽ gây lỗi cú pháp, và đầu vào độc hại có thể gây SQL injection làm thay đổi cấu trúc truy vấn"
      explanation: "Nhúng thẳng text vào chuỗi SQL làm trộn lẫn code và dữ liệu: dấu nháy đơn phá vỡ cú pháp, còn chuỗi độc hại có thể chèn lệnh SQL ngoài ý muốn. Placeholder `?` tách biệt hoàn toàn cú pháp và dữ liệu."

  - id: p4-05-q15
    type: output
    tags: [sql, pandas]
    difficulty: 3
    code: |
      import sqlite3
      import pandas as pd

      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE evals (model TEXT, score REAL)")
      with conn:
          conn.executemany(
              "INSERT INTO evals (model, score) VALUES (?, ?)",
              [("mini", 0.70), ("gpt-4o", 0.90), ("claude", 0.85), ("mini", 0.80)],
          )
      df = pd.read_sql_query(
          "SELECT model, score FROM evals WHERE score >= ? ORDER BY score DESC, model ASC LIMIT 2",
          conn,
          params=(0.75,),
      )
      print(list(df["model"]))
      conn.close()
    answer: "['gpt-4o', 'claude']"
    en:
      prompt: "What does this code print?"
      explanation: "`WHERE score >= 0.75` keeps 0.90 (`gpt-4o`), 0.85 (`claude`), and 0.80 (`mini`); `ORDER BY score DESC` + `LIMIT 2` selects the top two models."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`WHERE score >= 0.75` giữ lại 0.90 (`gpt-4o`), 0.85 (`claude`) và 0.80 (`mini`); `ORDER BY score DESC` cùng `LIMIT 2` lấy hai model đứng đầu."

