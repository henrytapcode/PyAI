                      ROUND(AVG(rating), 2) AS avg_rating
                  FROM requests
                  -- 2. add GROUP BY and ORDER BY clauses:
                  ...
              """
              return pd.read_sql_query(sql, conn)
          finally:
              conn.close()


      def plot_report(report: pd.DataFrame) -> tuple:
          fig, ax = plt.subplots()
          # 3. draw bars and set title ("Tokens by model") and y-axis label ("tokens"):
          ...
          return fig, ax
