  - id: p8-01-q06
    type: mcq
    tags: [apis, typing]
    difficulty: 2
    answer: 0
    en:
      prompt: "How does HTTP `422` differ from HTTP `400` in a FastAPI service?"
      options:
        - "`422` is Pydantic rejecting bad types or bounds; `400` is your handler rejecting valid types on a business rule"
        - "`422` is raised only by `GET` routes; `400` is raised only by `POST` routes with a JSON body"
        - "`422` means the server crashed with an unhandled exception; `400` means a path ID was missing"
        - "`422` runs after your handler returns; `400` runs inside Pydantic before your handler executes"
      explanation: "FastAPI and Pydantic automatically return `422` when path, query, or JSON body types/constraints fail before your function runs; you raise `HTTPException(status_code=400, ...)` inside your handler when the payload types are valid but violate a business rule."
    vi:
      prompt: "Mã HTTP `422` khác mã HTTP `400` thế nào trong một dịch vụ FastAPI?"
      options:
        - "`422` do Pydantic chặn sai kiểu hoặc ngưỡng; `400` do hàm của bạn chặn dữ liệu đúng kiểu nhưng sai nghiệp vụ"
        - "`422` chỉ xuất hiện trên các route `GET`; `400` chỉ xuất hiện trên các route `POST` có JSON body"
        - "`422` nghĩa là server gặp lỗi chưa bắt; `400` nghĩa là ID trong đường dẫn không tồn tại"
        - "`422` chạy sau khi hàm trả kết quả; `400` chạy trong Pydantic trước khi hàm xử lý bắt đầu"
      explanation: "FastAPI và Pydantic tự động trả `422` trước khi hàm chạy khi path, query hay JSON body sai kiểu/ràng buộc; bạn chủ động `raise HTTPException(status_code=400, ...)` trong hàm khi dữ liệu đúng kiểu nhưng vi phạm quy tắc nghiệp vụ."

  - id: p8-01-q07
    type: output
    tags: [typing, apis]
    difficulty: 2
    code: |
      from fastapi import FastAPI
      from fastapi.testclient import TestClient
      from pydantic import BaseModel, Field

      app = FastAPI()


      class Ask(BaseModel):
          q: str = Field(min_length=1)
          top_k: int = Field(default=3, ge=1, le=5)


      @app.post("/ask")
      def ask(body: Ask):
          return {"top_k": body.top_k}


      c = TestClient(app)
      r1 = c.post("/ask", json={"q": "RAG"})
      r2 = c.post("/ask", json={"q": "RAG", "top_k": 9})
      print(r1.status_code, r1.json()["top_k"], r2.status_code, r2.json()["detail"][0]["type"])
    answer: "200 3 422 less_than_equal"
    en:
      prompt: "What does this code print?"
      explanation: "The first request omits `top_k`, so Pydantic fills the default `3` and returns `200`; the second passes `top_k=9`, violating `le=5`, so FastAPI returns `422` with error type `less_than_equal`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Request đầu bỏ qua `top_k` nên Pydantic dùng mặc định `3` và trả `200`; request thứ hai gửi `top_k=9` vi phạm `le=5` nên FastAPI trả `422` với loại lỗi `less_than_equal`."

  - id: p8-01-q08
    type: mcq
    tags: [testing, apis]
    difficulty: 2
    answer: 3
    en:
      prompt: "What happens when you call `client.post(\"/ask\", data={\"question\": \"Hi\"})` on a route expecting a Pydantic `BaseModel`?"
      options:
        - "FastAPI converts the form fields to JSON and returns `200`"
        - "TestClient skips validation and passes an empty dictionary"
        - "Python raises a `TypeError` before sending the test request"
        - "FastAPI rejects it as `422` (`model_attributes_type`)"
      explanation: "Passing `data=` sends form-encoded data rather than a JSON request body, so Pydantic cannot parse the body as JSON and returns `422`. Use `json=` instead."
    vi:
      prompt: "Điều gì xảy ra khi bạn gọi `client.post(\"/ask\", data={\"question\": \"Hi\"})` tới một route nhận Pydantic `BaseModel`?"
      options:
        - "FastAPI tự chuyển dữ liệu form sang JSON và trả về mã `200`"
        - "TestClient bỏ qua bước kiểm tra và truyền vào một dict rỗng"
        - "Python ném lỗi `TypeError` trước khi gửi request kiểm thử"
        - "FastAPI trả về mã `422` kèm lỗi `model_attributes_type`"
      explanation: "Truyền `data=` gửi dữ liệu dạng form thay vì JSON request body, khiến Pydantic không parse được và trả `422`. Hãy dùng `json=`."

  - id: p8-01-q09
    type: fill
