    - |
      This builds directly on §2 (`accuracy`) and §3 (`score >= t`). For `scores = np.array([0.2, 0.6, 0.8])` and `labels = np.array([0, 1, 1])`, `t = 0.6` predicts `[0, 1, 1]` and gives `(0.6, 1.0)`.
    - |
      The plan:
      1. In `accuracy`, return `0.0` when `preds` is empty; otherwise compute the fraction of matching elements and convert it to a Python `float`.
      2. In `best_threshold`, return `(0.0, 0.0)` if `scores` is empty; otherwise use `np.unique` (which returns the sorted unique values of an array) to visit candidate thresholds from smallest to largest.
      3. For each candidate threshold, classify scores at or above the threshold as `1` and the rest as `0`, then evaluate accuracy against `labels`.
      4. Update your best threshold and accuracy only when the new accuracy is strictly greater (so ties keep the smallest threshold), then return both as Python `float`s with accuracy rounded to 3 decimal places.
    - |
      The shape for `best_threshold`:
      ```python
      if len(scores) == 0:
          return (0.0, 0.0)
      best_t = 0.0
      best_acc = -1.0
      for t in np.unique(scores):
          preds = ...
          acc = ...
          if acc > best_acc:
              ...
      return (float(best_t), round(float(best_acc), 3))
      ```
      Remember to also implement `accuracy(preds, labels)` above `best_threshold` and guard against empty arrays.
