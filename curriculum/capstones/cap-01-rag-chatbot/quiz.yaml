        - "Because `pass_rate` below `0.8` converts fixed turns into broken"
        - "Because `pass_rate` hides that `('d2', 2)` regressed to failing"
        - "Because `compare_to_baseline` only passes when `pass_rate` is `1.0`"
      explanation: "Equal aggregate `pass_rate` masks regressions whenever one fix cancels out a newly broken turn; the gate fails whenever `broken` is non-empty."
    vi:
      prompt: "Lần chạy mới đạt `pass_rate = 0.75` (bằng baseline `0.75`), với `fixed = [('d1', 2)]` và `broken = [('d2', 2)]`. Vì sao cổng hồi quy phải đánh trượt?"
      options:
        - "Vì danh sách `fixed` bắt buộc phải rỗng trước khi bản phát hành đạt"
        - "Vì `pass_rate` dưới `0.8` sẽ tự chuyển mọi ca `fixed` thành `broken`"
        - "Vì `pass_rate` che mất việc `('d2', 2)` đã bị hỏng từ đạt sang trượt"
        - "Vì `compare_to_baseline` chỉ cho qua khi `pass_rate` đạt đúng `1.0`"
      explanation: "Tỉ lệ `pass_rate` tổng bằng nhau sẽ che giấu lỗi hồi quy khi một ca sửa được bù cho một ca hỏng mới; cổng luôn trượt khi `broken` khác rỗng."

  - id: cap-01-q11
    type: fill
    tags: [evaluation, testing]
    difficulty: 2
    code: |
      def compare_runs(
          current: dict[tuple[str, int], bool],
          baseline: dict[tuple[str, int], bool],
          min_pass_rate: float = 0.8,
      ) -> dict:
          fixed = [k for k, ok in current.items() if k in baseline and ok and not baseline[k]]
          broken = [k for k, ok in current.items() if k in baseline and not ok and baseline[k]]
          pass_rate = round(sum(current.values()) / len(current), 3)
          gate_ok = not ___ and pass_rate >= ___
          return {"pass_rate": pass_rate, "fixed": fixed, "broken": broken, "gate_ok": gate_ok}


      cur = {("d1", 1): True, ("d1", 2): False, ("d2", 1): True}
      base = {("d1", 1): True, ("d1", 2): True}
      print(compare_runs(cur, base))
    answer: ["broken", "min_pass_rate"]
    en:
      prompt: "Fill in the blanks to enforce the regression gate: zero broken turns and `pass_rate` at least `min_pass_rate`."
      explanation: "`gate_ok` requires `not broken` (zero baseline regressions) and `pass_rate >= min_pass_rate`, while new turns absent from `baseline` stay out of `fixed`/`broken`."
    vi:
      prompt: "Điền vào chỗ trống để kiểm tra cổng hồi quy: không có ca hỏng mới và `pass_rate` đạt ít nhất `min_pass_rate`."
      explanation: "`gate_ok` đòi hỏi `not broken` (không có ca hồi quy so với baseline) và `pass_rate >= min_pass_rate`, còn ca mới chưa có trong `baseline` không tính vào `fixed`/`broken`."

