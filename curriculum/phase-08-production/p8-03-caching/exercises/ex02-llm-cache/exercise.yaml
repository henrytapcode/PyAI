              self.hits = 0
              self.misses = 0
              self._entries: dict = {}

          def get(self, key: str, now: float):
              # check missing, delete if now >= expires_at, otherwise count hit and return value
              ...
      ```
  vi:
    - |
      Kết hợp cách tạo key ở §3 (`json.dumps(..., sort_keys=True)` + `hashlib.sha256`) với logic kiểm tra hết hạn ở §6 (`now >= expires_at`). Với `make_key("mini", [{"role": "user", "content": "  Hi   there "}], temperature=0.0, max_tokens=50)`, khi đảo thành `max_tokens=50, temperature=0.0` vẫn phải trả về cùng chuỗi hex 64 ký tự.
    - |
      Kế hoạch:
      1. Trong `make_key`, tạo danh sách dict mới với `content` dạng chuỗi được chuẩn hóa bằng `" ".join(msg["content"].strip().split())`, gom `model`, danh sách message đã chuẩn hóa và `params` vào một dict, gọi `json.dumps(..., sort_keys=True)` rồi băm SHA-256 `hexdigest()`.
      2. Trong `TTLCache`, khởi tạo `self.ttl`, `self.hits = 0`, `self.misses = 0` và dict lưu entry. Khi `set(key, value, now)`, lưu cùng mốc `now + self.ttl`. Khi `get(key, now)`, xóa entry nếu `now >= expires_at`, cập nhật `hits`/`misses` và xử lý `total == 0` trong `hit_rate()`.
