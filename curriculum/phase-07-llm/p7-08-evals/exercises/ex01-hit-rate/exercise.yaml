id: p7-08-ex01
kind: fill
title:
  en: "Fill: compute retrieval hit@k"
  vi: "Điền chỗ trống: tính tỉ lệ truy xuất trúng hit@k"
difficulty: 1
tags: [evaluation, rag, lists]
hints:
  en:
    - |
      This implements `hit@k` from §3. For `[{"expected_source": "a.md", "retrieved": ["b.md", "a.md"]}]`, `hit_rate(..., k=2)` must return `1.0`, while `hit_rate(..., k=1)` returns `0.0`.
    - |
      The plan:
      1. Initialize counters for hits and answerable rows.
      2. Loop through every result row and read its expected source.
      3. Skip any row whose expected source is missing so unanswerable questions stay out of the denominator.
      4. Increment the answerable counter, and increment the hit counter whenever the expected source appears within the first `k` retrieved items.
      5. Divide hits by the answerable count, returning zero when no answerable rows exist.
    - |
      Function skeleton:
      ```python
      def hit_rate(results: list[dict], k: int) -> float:
          if k <= 0:
              return 0.0
          hits = 0
          total = 0
          for row in results:
              expected = row["expected_source"]
              if expected is None:
                  continue
              total += 1
              if ...:
                  hits += 1
          return hits / total if total else 0.0
      ```
  vi:
    - |
      Bài này cài đặt `hit@k` ở §3. Với `[{"expected_source": "a.md", "retrieved": ["b.md", "a.md"]}]`, `hit_rate(..., k=2)` phải trả về `1.0`, còn `hit_rate(..., k=1)` trả về `0.0`.
    - |
      Kế hoạch:
      1. Khởi tạo hai biến đếm cho số câu trúng và tổng số câu có nguồn kỳ vọng.
      2. Duyệt từng dòng kết quả và đọc tên nguồn kỳ vọng.
      3. Bỏ qua những dòng có nguồn kỳ vọng bằng rỗng để câu không trả lời được không nằm trong mẫu số.
      4. Tăng biến đếm tổng, và tăng biến đếm trúng nếu nguồn kỳ vọng nằm trong `k` kết quả truy xuất đầu tiên.
      5. Chia số câu trúng cho tổng số câu có nguồn, trả về không nếu không còn câu nào hợp lệ.
    - |
      Khung hàm:
      ```python
      def hit_rate(results: list[dict], k: int) -> float:
          if k <= 0:
              return 0.0
          hits = 0
          total = 0
          for row in results:
              expected = row["expected_source"]
              if expected is None:
                  continue
              total += 1
              if ...:
                  hits += 1
          return hits / total if total else 0.0
      ```
