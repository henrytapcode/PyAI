  - id: cap-01-q14
    type: output
    tags: [production, dicts]
    difficulty: 2
    code: |
      class FakeClock:
          def __init__(self, start: float = 0.0) -> None:
              self.t = start

          def __call__(self) -> float:
              return self.t

          def advance(self, seconds: float) -> None:
              self.t += seconds


      def purge_expired(sessions: dict[str, dict], now: float, ttl: float) -> None:
          for sid in [k for k, v in sessions.items() if now - v["last_seen"] >= ttl]:
              del sessions[sid]


      clock = FakeClock()
      sessions = {"s1": {"last_seen": clock()}}
      clock.advance(20.0)
      sessions["s2"] = {"last_seen": clock()}
      clock.advance(40.0)
      purge_expired(sessions, clock(), ttl=60.0)
      print(clock(), sorted(sessions))
    answer: "60.0 ['s2']"
    en:
      prompt: "What does this `FakeClock` TTL expiration snippet print at `t=60.0`?"
      explanation: "At `t=60.0`, `s1` has age `60.0 - 0.0 >= 60.0` so it expires and is deleted, while `s2` (`last_seen=20.0`, age `40.0 < 60.0`) remains active."
    vi:
      prompt: "Đoạn code hết hạn TTL dùng `FakeClock` này in ra gì tại `t=60.0`?"
      explanation: "Tại `t=60.0`, `s1` có tuổi `60.0 - 0.0 >= 60.0` nên hết hạn và bị xóa, còn `s2` (`last_seen=20.0`, tuổi `40.0 < 60.0`) vẫn còn hiệu lực."

