questions:
  - id: cap-01-q01
    type: mcq
    tags: [llm, rag]
    difficulty: 1
    answer: 2
    en:
      prompt: "Why must the `system` prompt stay pinned outside `self.history` when trimming to `max_history_tokens`?"
      options:
        - "Because `count_tokens` raises `ValueError` on `system` role strings"
        - "Because `pop(0)` always removes the newest element from the right end"
        - "So dropping old turns never erases the grounding instructions"
        - "So `FakeLLM` automatically translates `system` text into citations"
      explanation: "Putting `system` at index `0` inside the trimmed list causes `pop(0)` to delete your grounding instructions once the conversation exceeds the token budget."
    vi:
      prompt: "Vì sao phải giữ `system` prompt cố định bên ngoài `self.history` khi cắt lịch sử theo `max_history_tokens`?"
      options:
        - "Vì `count_tokens` báo `ValueError` khi gặp chuỗi có vai trò `system`"
        - "Vì `pop(0)` luôn xóa phần tử mới nhất nằm ở cuối danh sách"
        - "Để việc bỏ lượt cũ không xóa mất chỉ dẫn bám nguồn của bot"
        - "Để `FakeLLM` tự động chuyển nội dung `system` thành trích dẫn"
      explanation: "Nếu đặt `system` ở vị trí `0` trong cùng danh sách bị cắt, lệnh `pop(0)` sẽ xóa mất chỉ dẫn bám nguồn ngay khi hội thoại vượt ngân sách token."

  - id: cap-01-q02
    type: output
    tags: [llm, lists]
    difficulty: 2
    code: |
      from pyai_llm import count_tokens

      sys_msg = {"role": "system", "content": "Answer from FAQ only."}
      turns = [
          {"role": "user", "content": "How long do refunds take?"},
          {"role": "assistant", "content": "Refunds take 30 days."},
          {"role": "user", "content": "What about express?"},
      ]
      rest = list(turns)
      while rest and count_tokens(sys_msg["content"]) + sum(count_tokens(m["content"]) for m in rest) > 16:
          rest.pop(0)
      kept = [sys_msg, *rest]
      print([m["role"] for m in kept], sum(count_tokens(m["content"]) for m in kept))
    answer: "['system', 'assistant', 'user'] 14"
    en:
      prompt: "What does this pinned-system history trimming snippet print?"
      explanation: "`sys_msg` (`4` tokens) stays pinned; dropping the oldest user turn (`5` tokens) brings `4 + 5 + 5 = 14 <= 16`, leaving `['system', 'assistant', 'user']` and `14`."
    vi:
      prompt: "Đoạn code cắt lịch sử có ghim `system` này in ra gì?"
      explanation: "`sys_msg` (`4` token) được giữ cố định; bỏ lượt user cũ nhất (`5` token) đưa tổng về `4 + 5 + 5 = 14 <= 16`, còn lại `['system', 'assistant', 'user']` và `14`."

  - id: cap-01-q03
    type: fill
    tags: [llm, rag]
    difficulty: 2
    code: |
      from pyai_llm import count_tokens


      def trim_turns(system_prompt: str, history: list[dict], budget: int) -> list[dict]:
          kept = list(history)
          sys_tokens = count_tokens(system_prompt)
          while len(kept) > ___ and sys_tokens + sum(count_tokens(m["content"]) for m in kept) > budget:
              kept.pop(___)
          return kept


      turns = [
          {"role": "user", "content": "How long do refunds take?"},
          {"role": "assistant", "content": "Refunds take 30 days."},
          {"role": "user", "content": "What about opened software?"},
          {"role": "assistant", "content": "Opened software is not eligible."},
      ]
      trimmed = trim_turns("Answer from FAQ.", turns, budget=18)
      print(len(trimmed), trimmed[0]["role"])
    answer: ["2", "0"]
    en:
      prompt: "Fill in the blanks to keep at least the latest user/assistant turn pair while dropping the oldest message from the front."
      explanation: "`len(kept) > 2` preserves the newest pair of turns even under a tight budget, and `kept.pop(0)` removes the oldest message from the front."
    vi:
      prompt: "Điền vào chỗ trống để luôn giữ lại ít nhất cặp lượt hỏi/đáp mới nhất và xóa tin nhắn cũ nhất ở đầu danh sách."
      explanation: "`len(kept) > 2` bảo toàn cặp lượt mới nhất dù ngân sách hẹp, còn `kept.pop(0)` loại bỏ tin nhắn cũ nhất ở đầu danh sách."

  - id: cap-01-q04
    type: mcq
    tags: [rag, production]
    difficulty: 3
    answer: 1
    en:
      prompt: "In `ChatBot.ask`, what happens when `retrieve` returns `[]` because no chunk clears `min_score`?"
      options:
        - "Call `client.chat` once to confirm refusal and skip updating history"
        - "Skip `client.chat`, return `REFUSAL` with `[]`, and record both turns"
        - "Return `REFUSAL` with the top raw chunk source and empty history"
        - "Raise `ValueError` so the HTTP endpoint converts it into status `404`"
      explanation: "When retrieval finds no chunk >= `min_score`, refusing before calling `client.chat` saves a wasted LLM call, sets `sources = []`, and still appends the user/assistant pair to `self.history`."
    vi:
      prompt: "Trong `ChatBot.ask`, điều gì xảy ra khi `retrieve` trả về `[]` vì không có chunk nào đạt `min_score`?"
      options:
        - "Gọi `client.chat` một lần để xác nhận từ chối và bỏ qua lưu lịch sử"
        - "Không gọi `client.chat`, trả `REFUSAL` kèm `[]` và vẫn lưu cặp lượt"
        - "Trả `REFUSAL` kèm nguồn của chunk đầu bảng và để trống lịch sử"
        - "Raise `ValueError` để endpoint HTTP chuyển thành mã lỗi `404`"
      explanation: "Khi không có chunk nào đạt `min_score`, từ chối ngay trước khi gọi `client.chat` giúp tránh gọi LLM thừa, đặt `sources = []` và vẫn ghi nhận cặp lượt vào `self.history`."

  - id: cap-01-q05
    type: mcq
    tags: [rag, llm]
    difficulty: 1
    answer: 0
    en:
      prompt: "Why does `ChatBot` rewrite `\"What about express?\"` with the previous user question before calling `retrieve` and `chat`?"
      options:
        - "Raw follow-ups lack topic words for retrieval and overlap checks"
        - "Because `FakeLLM.embed` rejects every query under five words"
        - "Because `client.chat` raises an error on strings ending with `?`"
        - "To strip punctuation so `count_tokens` returns zero tokens"
      explanation: "Short follow-ups omit nouns like `'delivery'` or `'shipping'`, so embedding search scores poorly or pulls the wrong document and `FakeLLM.chat` fails its 2-word overlap check."
    vi:
      prompt: "Vì sao `ChatBot` viết lại `\"What about express?\"` cùng câu hỏi người dùng trước đó trước khi gọi `retrieve` và `chat`?"
      options:
        - "Câu nối tiếp thô thiếu từ khóa chủ đề cho truy xuất và kiểm tra trùng"
        - "Vì `FakeLLM.embed` từ chối mọi câu truy vấn có ít hơn năm từ tiếng Anh"
        - "Vì `client.chat` sẽ báo lỗi ngay với chuỗi kết thúc bằng dấu chấm hỏi `?`"
        - "Để xóa toàn bộ dấu câu giúp `count_tokens` đếm về giá trị không token"
      explanation: "Câu nối tiếp ngắn thiếu danh từ chủ đề như `'delivery'` hay `'shipping'`, khiến tìm kiếm embedding chấm điểm thấp hoặc kéo nhầm tài liệu và `FakeLLM.chat` trượt ngưỡng trùng 2 từ."

  - id: cap-01-q06
    type: output
    tags: [rag, strings]
    difficulty: 2
    code: |
      def rewrite_query(question, history):
          prev = next((m["content"] for m in reversed(history) if m["role"] == "user"), "")
          if not prev:
              return question
          low = question.lower().strip()
          if len(question.split()) <= 4 or low.startswith(("what about ", "and ", "how about ")):
              return f"{prev} {question}"
          return question


      hist = [{"role": "user", "content": "How much is shipping?"}]
      print(rewrite_query("And express?", hist), "|", rewrite_query("Does hardware warranty cover water damage?", hist))
    answer: "How much is shipping? And express? | Does hardware warranty cover water damage?"
    en:
      prompt: "What does this deterministic follow-up rewriter print for a short follow-up and a standalone question?"
      explanation: "`'And express?'` has 2 words and starts with `'and '`, so it prepends `'How much is shipping?'`; the 6-word warranty question is not a follow-up and stays unchanged."
    vi:
      prompt: "Hàm viết lại câu nối tiếp tất định này in ra gì cho một câu nối tiếp ngắn và một câu hỏi độc lập?"
      explanation: "`'And express?'` chỉ có 2 từ và bắt đầu bằng `'and '` nên được ghép `'How much is shipping?'` vào trước; câu hỏi bảo hành 6 từ không phải câu nối tiếp nên giữ nguyên."

