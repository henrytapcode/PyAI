  - id: p4-04-q08
    type: mcq
    tags: [plotting]
    difficulty: 2
    answer: 0
    code: |
      import matplotlib.pyplot as plt
      fig, ax = plt.subplots()
      ax.title("Loss")
    en:
      prompt: "Why does `ax.title(\"Loss\")` raise `TypeError: 'Text' object is not callable`?"
      options:
        - "Because `ax.title` is already a `Text` object, not a method; use `ax.set_title(\"Loss\")`"
        - "Because titles in matplotlib must be integers, not strings"
        - "Because you must call `plt.show()` before setting a title"
        - "Because `ax.title` only works on bar charts"
      explanation: "On an `Axes`, `ax.title` is the `Text` artist itself. To change its string, call the setter method `ax.set_title(\"Loss\")`."
    vi:
      prompt: "Vì sao `ax.title(\"Loss\")` báo lỗi `TypeError: 'Text' object is not callable`?"
      options:
        - "Vì `ax.title` đã là một đối tượng `Text` chứ không phải hàm; phải dùng `ax.set_title(\"Loss\")`"
        - "Vì tiêu đề trong matplotlib phải là số nguyên, không được dùng chuỗi"
        - "Vì bạn phải gọi `plt.show()` trước khi đặt tiêu đề"
        - "Vì `ax.title` chỉ dùng được cho biểu đồ cột"
      explanation: "Trên `Axes`, `ax.title` là đối tượng `Text` giữ tiêu đề. Muốn đặt nội dung tiêu đề, bạn phải gọi phương thức `ax.set_title(\"Loss\")`."

