    code: |
      import re

      rows = [
          {"expected": "a.md", "top": ["b.md", "a.md", "c.md"]},
          {"expected": "c.md", "top": ["a.md", "b.md", "c.md"]},
          {"expected": None, "top": ["a.md"]},
      ]
      ans = [r for r in rows if r["expected"] is not None]
      hit2 = sum(r["expected"] in r["top"][:2] for r in ans) / len(ans)
      ctx = ["Refunds take 30 days."]
      reply = "Refunds take 30 days. [1]"
      cites_ok = all(1 <= int(n) <= len(ctx) for n in re.findall(r"\[(\d+)\]", reply))
      words_ok = set(re.findall(r"[a-z]+", reply.lower())) <= set(re.findall(r"[a-z]+", " ".join(ctx).lower()))
      print(round(hit2, 3), cites_ok and words_ok)
    answer: "0.5 True"
    en:
      prompt: "What does this retrieval and faithfulness check print?"
      explanation: "Skipping the `expected=None` row leaves 2 answerable rows; only row 0 has its expected source in `top[:2]`, so `hit2 = 1 / 2 = 0.5`. Citation `[1]` is within `1..len(ctx)` and every word in `reply` appears in `ctx`, giving `True`."
    vi:
      prompt: "Đoạn code chấm retrieval và độ trung thực bám nguồn này in ra gì?"
      explanation: "Bỏ dòng `expected=None` còn 2 câu trả lời được; chỉ dòng 0 có nguồn đúng trong `top[:2]` nên `hit2 = 1 / 2 = 0.5`. Trích dẫn `[1]` nằm trong `1..len(ctx)` và mọi từ trong `reply` đều có trong `ctx`, nên cho kết quả `True`."

