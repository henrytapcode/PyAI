id: p6-02-ex01
kind: debug
title:
  en: "Debug: fix the training loop"
  vi: "Debug: sửa lỗi vòng lặp training"
difficulty: 1
tags: [pytorch, dl, debugging]
hints:
  en:
    - |
      This follows §2 and §3. The function already runs, so check two places: how gradients behave across epochs, and what type and precision `losses` records (a correctly trained loop on `y = 2 * x + 1` drives losses down to plain floats under `0.05`).
    - |
      The plan:
      1. Clear stale gradients from previous epochs right before calling `loss.backward()`.
      2. Extract the scalar Python float from each epoch's loss tensor and round it to four decimal places before appending to `losses`.
    - |
      The shape inside the loop:
      ```python
      for _ in range(epochs):
          preds = model(xs)
          loss = loss_fn(preds, ys)
          ...
          loss.backward()
          optimizer.step()
          losses.append(round(..., 4))
      ```
      Notice both fixes sit on the gradient reset step and the `losses.append(...)` call.
  vi:
    - |
      Bài này đi theo §2 và §3. Hàm hiện chạy không báo lỗi, nên hãy kiểm tra hai chỗ: gradient qua các epoch có bị cộng dồn không, và `losses` đang lưu kiểu dữ liệu cùng độ chính xác nào (với `y = 2 * x + 1`, loss cuối phải là số `float` Python giảm xuống dưới `0.05`).
    - |
      Kế hoạch:
      1. Xóa gradient tích lũy từ các epoch trước ngay trước khi gọi `loss.backward()`.
      2. Rút số `float` Python từ tensor loss của mỗi epoch và làm tròn 4 chữ số thập phân trước khi đưa vào `losses`.
    - |
      Hình dạng bên trong vòng lặp:
      ```python
      for _ in range(epochs):
          preds = model(xs)
          loss = loss_fn(preds, ys)
          ...
          loss.backward()
          optimizer.step()
          losses.append(round(..., 4))
      ```
      Để ý rằng cả hai chỗ cần sửa nằm ở bước xóa gradient và lời gọi `losses.append(...)`.
