      explanation: "`model.eval()` disables dropout layers, and `with torch.no_grad():` avoids building a computation graph during evaluation."
    vi:
      prompt: "Điền tên hai phương thức/context cần dùng để đánh giá ổn định và không tạo gradient."
      explanation: "`model.eval()` tắt các tầng dropout, còn `with torch.no_grad():` không dựng đồ thị tính toán khi đánh giá."

  - id: p6-04-q09
    type: mcq
    tags: [huggingface, pytorch]
    difficulty: 2
    answer: 3
    en:
      prompt: "What happens when you call `out = model(**batch, labels=train_y)` on `AutoModelForSequenceClassification`?"
      options:
        - "The model updates its weights automatically without calling `optimizer.step()`"
        - "The model saves the checkpoint to disk using `save_pretrained()`"
        - "The model turns off dropout just like `model.eval()`"
        - "The model computes cross-entropy loss internally against `train_y` and exposes it as `out.loss`"
      explanation: "Passing `labels=...` asks the classification model to compute cross-entropy loss between its `logits` and `labels`, returning `out.loss` ready for `out.loss.backward()`."
    vi:
      prompt: "Điều gì xảy ra khi bạn gọi `out = model(**batch, labels=train_y)` trên `AutoModelForSequenceClassification`?"
      options:
        - "Model tự động cập nhật trọng số mà không cần gọi `optimizer.step()`"
        - "Model tự lưu checkpoint xuống đĩa bằng `save_pretrained()`"
        - "Model tự tắt dropout giống như khi gọi `model.eval()`"
        - "Model tự tính cross-entropy loss so với `train_y` và trả về trong `out.loss`"
      explanation: "Truyền thêm `labels=...` khiến model phân loại tự tính cross-entropy loss giữa `logits` và `labels`, trả sẵn `out.loss` để bạn gọi `out.loss.backward()`."

