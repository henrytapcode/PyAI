    - |
      Kế hoạch:
      1. Trong `classify(texts)`: nếu `not texts` thì trả ngay `[]`; ngược lại tokenize `texts` với `padding=True, truncation=True, return_tensors="pt"`.
      2. Gọi `model.eval()`, chạy `with torch.no_grad(): logits = model(**batch).logits`, tính `probs = torch.softmax(logits, dim=1)` và `pred_ids = logits.argmax(dim=1)`.
      3. Trả về `[(model.config.id2label[idx], round(prob_row[idx], 3)) for prob_row, idx in zip(probs.tolist(), pred_ids.tolist())]`.
      4. Trong `negatives(texts, threshold)`: gọi `classify(texts)` rồi giữ lại các câu có `label == "NEGATIVE" and score >= threshold`.
    - |
