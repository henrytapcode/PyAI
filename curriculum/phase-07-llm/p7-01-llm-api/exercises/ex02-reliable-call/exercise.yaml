id: p7-01-ex02
kind: code
title:
  en: "Write: reliable LLM call and cost estimator"
  vi: "Viết code: gọi LLM có retry và ước tính chi phí"
difficulty: 2
tags: [llm, exceptions]
hints:
  en:
    - |
      This combines token cost calculation from §5 with the `RateLimitError` retry loop from §6. For `FakeLLM(fail_times=2)` and `max_attempts=3`, `ask_with_retry` returns `(content, 3)`; for `Usage(1000, 500, 1500)` at `$0.50` / `$1.50` per million, `estimate_cost` returns `0.00125`.
    - |
      The plan:
      1. In `ask_with_retry`, loop from attempt 1 up to the maximum number of attempts.
      2. Inside each pass, call `client.chat` in a `try` block and immediately return the reply text and current attempt count when it succeeds.
      3. Catch only `RateLimitError` so other exceptions propagate at once; when the current attempt equals the maximum, re-raise the error.
      4. In `estimate_cost`, divide input and output token counts by one million, multiply each by its per-million price, sum them, and round to 6 decimal places.
    - |
      The shape of the solution:
      ```python
      def ask_with_retry(
          client: FakeLLM,
          messages: list[dict[str, str]],
          max_attempts: int = 3,
      ) -> tuple[str, int]:
          for attempt in range(1, max_attempts + 1):
              try:
                  resp = client.chat(messages)
                  return resp.content or "", attempt
              except RateLimitError:
                  ...
          raise RuntimeError("max_attempts must be at least 1")


      def estimate_cost(
          usage: Usage,
          price_in_per_m: float,
          price_out_per_m: float,
      ) -> float:
          return round(..., 6)
      ```
      Remember to re-raise only when the final attempt fails, and combine both prompt and completion token costs before rounding.
  vi:
    - |
      Bài này kết hợp cách tính chi phí token ở §5 với vòng lặp retry `RateLimitError` ở §6. Với `FakeLLM(fail_times=2)` và `max_attempts=3`, `ask_with_retry` trả về `(content, 3)`; với `Usage(1000, 500, 1500)` ở giá `$0.50` / `$1.50` mỗi triệu token, `estimate_cost` trả về `0.00125`.
    - |
      Kế hoạch:
      1. Trong `ask_with_retry`, lặp từ lượt thử thứ 1 đến số lượt thử tối đa.
      2. Ở mỗi lượt, gọi `client.chat` bên trong khối `try` và trả về ngay nội dung trả lời cùng số lượt đã thử nếu thành công.
      3. Chỉ bắt `RateLimitError` để các lỗi khác đi thẳng ra ngoài; khi lượt hiện tại đã là lượt cuối cùng thì ném lại lỗi.
      4. Trong `estimate_cost`, chia số token đầu vào và đầu ra cho một triệu, nhân với đơn giá tương ứng, cộng lại rồi làm tròn đến 6 chữ số thập phân.
    - |
      Hình dạng của lời giải:
      ```python
      def ask_with_retry(
          client: FakeLLM,
          messages: list[dict[str, str]],
          max_attempts: int = 3,
      ) -> tuple[str, int]:
          for attempt in range(1, max_attempts + 1):
              try:
                  resp = client.chat(messages)
                  return resp.content or "", attempt
              except RateLimitError:
                  ...
          raise RuntimeError("max_attempts must be at least 1")


      def estimate_cost(
          usage: Usage,
          price_in_per_m: float,
          price_out_per_m: float,
      ) -> float:
          return round(..., 6)
      ```
      Nhớ chỉ ném lại lỗi khi đã hết lượt thử, và cộng cả phần chi phí prompt lẫn completion trước khi làm tròn.
