  - id: p6-04-q08
    type: fill
    tags: [pytorch, huggingface]
    difficulty: 2
    code: |
      import torch
      import torch.nn as nn

      model = nn.Sequential(nn.Linear(2, 2), nn.Dropout(0.5))
      model.___()
      with torch.___():
          preds = model(torch.ones(2, 2)).argmax(dim=1)
