# AI Engineer interview bank (junior / mid). `topic` must be a tag from curriculum/topics.yaml.
# kind: concept (explain an idea) | coding (a code snippet to read, fix or write)
#       | scenario (a practical situation, answer with steps) | system (a small design)
# tip: what the interviewer is really checking and how to structure the answer.
questions:
  # ============================================================ Python core
  - id: iv-01
    topic: types
    level: junior
    kind: concept
    en:
      question: "What is the difference between mutable and immutable types in Python? Give examples."
      answer: |
        Immutable objects cannot be changed after creation: `int`, `float`, `str`, `bool`, `tuple`, `frozenset`. "Changing" them really creates a new object. Mutable objects can be modified in place: `list`, `dict`, `set`, and most user-defined classes.
        This matters for three things: aliasing (`b = a` makes both names point to the same mutable object, so an edit shows through both), function arguments (a function can modify a list you pass in), and dictionary keys (keys must be hashable, which in practice means immutable).
      tip: "Define the term in one sentence, then connect it to a real bug (shared list, mutable default argument). Interviewers want to see that you know why it matters, not only the list of types."
    vi:
      question: "Mutable và immutable trong Python khác nhau thế nào? Cho ví dụ."
      answer: |
        Immutable là đối tượng không thể thay đổi sau khi tạo: `int`, `float`, `str`, `bool`, `tuple`, `frozenset`. "Sửa" chúng thực chất là tạo ra đối tượng mới. Mutable có thể sửa tại chỗ: `list`, `dict`, `set` và hầu hết class tự định nghĩa.
        Sự khác biệt này ảnh hưởng đến ba thứ: aliasing (`b = a` khiến hai tên cùng trỏ tới một đối tượng mutable, nên sửa ở tên này sẽ thấy ở tên kia), tham số hàm (hàm có thể sửa list bạn truyền vào), và key của dictionary (key phải hashable, trên thực tế nghĩa là immutable).
      tip: "Định nghĩa ngắn gọn một câu, rồi nối với một lỗi thật (list dùng chung, default argument mutable). Người phỏng vấn muốn thấy bạn hiểu vì sao điều này quan trọng, không chỉ liệt kê các kiểu."

  - id: iv-02
    topic: lists
    level: junior
    kind: concept
    en:
      question: "When would you use a tuple instead of a list?"
      answer: |
        Use a tuple for a fixed group of values that should not change, such as a coordinate `(x, y)` or one database row, and when you need a hashable value (a dict key or a set member). A tuple tells the reader "this does not change", is slightly smaller and faster, and cannot be modified by accident.
        Use a list when the collection grows, shrinks or is reordered. A tuple is only shallowly immutable: if it contains a list, that list can still change.
      tip: "Answer with a rule of thumb plus one concrete example. Mentioning 'shallow immutability' shows you know the edge case."
    vi:
      question: "Khi nào nên dùng tuple thay vì list?"
      answer: |
        Dùng tuple cho một nhóm giá trị cố định, không nên thay đổi, như tọa độ `(x, y)` hoặc một dòng dữ liệu từ database, và khi cần giá trị hashable (key của dict, phần tử của set). Tuple cho người đọc biết "cái này không đổi", nhỏ và nhanh hơn một chút, và không bị sửa nhầm.
        Dùng list khi tập hợp có thể tăng, giảm hoặc đổi thứ tự. Tuple chỉ immutable ở mức nông: nếu bên trong có một list thì list đó vẫn sửa được.
      tip: "Trả lời bằng một quy tắc ngắn kèm một ví dụ cụ thể. Nhắc đến 'immutable ở mức nông' cho thấy bạn biết trường hợp biên."

  - id: iv-03
    topic: dicts
    level: junior
    kind: concept
    en:
      question: "How fast is a dictionary lookup, and what is the difference between `d[key]` and `d.get(key)`?"
      answer: |
        A dict is a hash table, so lookup, insert and delete are O(1) on average, no matter how many items it has. `key in d` is also O(1) on average, while `x in some_list` is O(n) because Python scans the list.
        `d[key]` raises `KeyError` if the key is missing. `d.get(key)` returns `None` instead, or a default you give: `d.get(key, 0)`. Use `[]` when a missing key is a bug you want to see, and `get` when absence is normal.
      tip: "State the complexity and say why (hash table). Then show you can choose between the two access styles based on whether a missing key is an error."
    vi:
      question: "Tra cứu dictionary nhanh cỡ nào, và `d[key]` khác `d.get(key)` thế nào?"
      answer: |
        Dict là hash table nên tra cứu, thêm và xóa trung bình đều là O(1), bất kể có bao nhiêu phần tử. `key in d` cũng trung bình O(1), trong khi `x in some_list` là O(n) vì Python phải duyệt list.
        `d[key]` báo `KeyError` nếu key không có. `d.get(key)` thì trả về `None`, hoặc giá trị mặc định bạn đưa vào: `d.get(key, 0)`. Dùng `[]` khi thiếu key là lỗi bạn muốn thấy, dùng `get` khi việc thiếu key là bình thường.
      tip: "Nêu độ phức tạp và lý do (hash table). Sau đó cho thấy bạn chọn cách truy cập tùy việc thiếu key có phải là lỗi hay không."

  - id: iv-04
    topic: functions
    level: junior
    kind: coding
    code: |
      def log(msg, *args, **kwargs):
          print(msg, args, kwargs)

      log("hi", 1, 2, level="info")
    en:
      question: "What do `*args` and `**kwargs` do? What does the call below print?"
      answer: |
        `*args` collects extra positional arguments into a tuple, and `**kwargs` collects extra keyword arguments into a dict. The call prints `hi (1, 2) {'level': 'info'}`.
        They are used for wrappers and decorators that forward arguments unchanged, and for flexible APIs. The same symbols also unpack when calling: `f(*items, **options)`. In public functions prefer explicit parameters, because `**kwargs` hides the real signature from readers and editors.
      tip: "Trace the output out loud, then name one real use (decorator forwarding arguments). Adding the 'prefer explicit parameters' caveat shows judgement."
    vi:
      question: "`*args` và `**kwargs` dùng để làm gì? Lời gọi dưới đây in ra gì?"
      answer: |
        `*args` gom các đối số vị trí thừa thành một tuple, `**kwargs` gom các đối số keyword thừa thành một dict. Lời gọi in ra `hi (1, 2) {'level': 'info'}`.
        Chúng hay dùng cho wrapper, decorator chuyển tiếp nguyên đối số, và cho API linh hoạt. Cùng ký hiệu đó còn dùng để giải nén khi gọi hàm: `f(*items, **options)`. Với hàm public nên ưu tiên tham số tường minh, vì `**kwargs` che mất chữ ký thật của hàm khỏi người đọc và editor.
      tip: "Nói to từng bước để ra output, rồi nêu một ứng dụng thật (decorator chuyển tiếp đối số). Thêm lưu ý 'nên ưu tiên tham số tường minh' cho thấy bạn có phán đoán."

  - id: iv-08
    topic: functions
    level: junior
    kind: coding
    code: |
      def add_item(item, items=[]):
          items.append(item)
          return items
    en:
      question: "What is wrong with this function, and how do you fix it?"
      answer: |
        Default values are evaluated once, when `def` runs, not on every call. The single default list is stored on the function and shared by every call that omits `items`. So `add_item(1)` returns `[1]`, and then `add_item(2)` returns `[1, 2]`.
        Fix it with a `None` sentinel and create the list inside the function:
        ```python
        def add_item(item, items=None):
            if items is None:
                items = []
            items.append(item)
            return items
        ```
        The same applies to any mutable default (`dict`, `set`, custom objects). If `None` is itself a valid argument, use a private sentinel object instead. `ruff` flags this pattern (rule B006).
      tip: "Explain WHEN the default is evaluated, because that is the root cause. Then give the fix and say it applies to all mutable defaults."
    vi:
      question: "Hàm này sai ở đâu và sửa thế nào?"
      answer: |
        Giá trị mặc định được tính một lần, lúc `def` chạy, chứ không phải mỗi lần gọi hàm. Một list mặc định duy nhất được lưu trong hàm và dùng chung cho mọi lời gọi bỏ qua `items`. Vì vậy `add_item(1)` trả về `[1]`, rồi `add_item(2)` trả về `[1, 2]`.
        Sửa bằng giá trị canh `None` và tạo list bên trong hàm:
        ```python
        def add_item(item, items=None):
            if items is None:
                items = []
            items.append(item)
            return items
        ```
        Quy tắc này áp dụng cho mọi default mutable (`dict`, `set`, đối tượng tự định nghĩa). Nếu bản thân `None` là đối số hợp lệ thì dùng một đối tượng sentinel riêng. `ruff` cảnh báo mẫu này (rule B006).
      tip: "Giải thích default được tính KHI NÀO vì đó là nguyên nhân gốc. Sau đó đưa cách sửa và nói nó áp dụng cho mọi default mutable."

  - id: iv-09
    topic: types
    level: junior
    kind: concept
    en:
      question: "What is the difference between `==` and `is`?"
      answer: |
        `==` compares values (it calls `__eq__`). `is` compares identity: whether two names point to the exact same object in memory.
        `[1] == [1]` is `True`, but `[1] is [1]` is `False`, because they are two separate list objects. Use `is` only for singletons, mainly `x is None` and `x is not None`. Do not use it to compare numbers or strings: CPython sometimes reuses small objects, so the result depends on the implementation and can change.
      tip: "Give the one-line distinction, then the single legitimate use of `is` (None). Saying why numbers and strings are a trap shows depth."
    vi:
      question: "`==` và `is` khác nhau thế nào?"
      answer: |
        `==` so sánh giá trị (gọi `__eq__`). `is` so sánh danh tính: hai tên có trỏ tới cùng một đối tượng trong bộ nhớ hay không.
        `[1] == [1]` là `True`, nhưng `[1] is [1]` là `False` vì đó là hai đối tượng list riêng. Chỉ dùng `is` cho singleton, chủ yếu là `x is None` và `x is not None`. Đừng dùng để so sánh số hay chuỗi: CPython đôi khi tái sử dụng đối tượng nhỏ, nên kết quả phụ thuộc vào cài đặt và có thể thay đổi.
      tip: "Nêu khác biệt trong một câu, rồi trường hợp duy nhất nên dùng `is` (None). Giải thích vì sao số và chuỗi là cái bẫy cho thấy bạn hiểu sâu."

  - id: iv-10
    topic: files
    level: junior
    kind: concept
    code: |
      with open("notes.txt", encoding="utf-8") as f:
          text = f.read()
    en:
      question: "Why use a `with` statement when opening files?"
      answer: |
        `with` uses a context manager: when the block ends, Python calls its `__exit__`, which closes the file. This happens whether the block finishes normally or an exception is raised (the exception still propagates afterwards). The manual equivalent is `try` / `finally: f.close()`.
        Without it, a forgotten file stays open. CPython often closes unreferenced files when they are garbage collected, but that is not guaranteed on every implementation, and buffered writes may not be flushed when you expect.
        The same pattern is used for database connections, locks and HTTP sessions. Write your own with `contextlib.contextmanager` or `__enter__` / `__exit__`. Also pass `encoding="utf-8"` explicitly: the default encoding depends on the platform and locale (often not UTF-8 on Windows).
      tip: "Explain what `with` guarantees (cleanup on success AND on error), then name the encoding detail. The encoding remark is what makes the answer sound practical."
    vi:
      question: "Vì sao nên dùng `with` khi mở file?"
      answer: |
        `with` dùng context manager: khi khối kết thúc, Python gọi `__exit__` của nó để đóng file. Điều này xảy ra dù khối chạy xong bình thường hay có exception (exception vẫn được ném tiếp ra ngoài). Cách viết tay tương đương là `try` / `finally: f.close()`.
        Nếu không dùng, file bị quên sẽ vẫn mở. CPython thường đóng file không còn được tham chiếu khi dọn rác, nhưng không đảm bảo trên mọi bản cài đặt, và dữ liệu ghi trong buffer có thể không được flush đúng lúc bạn nghĩ.
        Cùng mẫu này dùng cho kết nối database, lock và HTTP session. Bạn có thể tự viết bằng `contextlib.contextmanager` hoặc `__enter__` / `__exit__`. Cũng nên truyền `encoding="utf-8"` rõ ràng: encoding mặc định phụ thuộc nền tảng và locale (trên Windows thường không phải UTF-8).
      tip: "Giải thích `with` đảm bảo điều gì (dọn dẹp cả khi thành công LẪN khi lỗi), rồi nhắc chi tiết về encoding. Chi tiết encoding làm câu trả lời nghe rất thực tế."

  - id: iv-31
    topic: strings
    level: junior
    kind: coding
    code: |
      s = "  Hello, World  "
      print(s.strip().lower().split(","))
      print("abc"[::-1], "a-b-c".replace("-", ""))
      s.upper()
      print(s)
    en:
      question: "What does this code print, and why does the last line not show an uppercase string?"
      answer: |
        The output is:
        ```
        ['hello', ' world']
        cba abc
          Hello, World
        ```
        `strip()` removes the outer spaces, `lower()` lowercases, and `split(",")` cuts at the comma, leaving a leading space in `' world'`. `[::-1]` reverses a string. Strings are immutable: `s.upper()` returns a new string and leaves `s` unchanged, so you must assign it (`s = s.upper()`). Methods can be chained because each returns a new string.
      tip: "Walk through the chain one method at a time. The 'strings are immutable, the result must be assigned' point is the real thing being tested."
    vi:
      question: "Đoạn code này in ra gì, và vì sao dòng cuối không hiện chuỗi viết hoa?"
      answer: |
        Kết quả:
        ```
        ['hello', ' world']
        cba abc
          Hello, World
        ```
        `strip()` bỏ khoảng trắng hai đầu, `lower()` chuyển chữ thường, `split(",")` cắt tại dấu phẩy nên `' world'` còn một dấu cách ở đầu. `[::-1]` đảo ngược chuỗi. Chuỗi là immutable: `s.upper()` trả về chuỗi mới và không đổi `s`, nên bạn phải gán lại (`s = s.upper()`). Có thể nối chuỗi các method vì mỗi method trả về một chuỗi mới.
      tip: "Đi qua chuỗi method từng bước một. Điểm 'chuỗi immutable nên phải gán lại kết quả' mới là thứ thật sự được kiểm tra."

  - id: iv-32
    topic: dicts
    level: junior
    kind: coding
    code: |
      prices = {"apple": 1.2, "pear": 0.8, "plum": 2.0}
      for name in prices:
          if prices[name] < 1:
              del prices[name]
    en:
      question: "This code is meant to remove items cheaper than 1. What happens when you run it, and how do you fix it?"
      answer: |
        It raises `RuntimeError: dictionary changed size during iteration`. A dict cannot grow or shrink while you loop over it.
        Fix 1: build a new dict with a comprehension, which is the clearest option:
        ```python
        prices = {name: p for name, p in prices.items() if p >= 1}
        ```
        Fix 2: loop over a snapshot of the keys and delete from the original: `for name in list(prices): ...`.
        The same trap exists for lists, where removing items while looping silently skips elements.
      tip: "Name the exact error, then offer the idiomatic fix (build a new collection). Mentioning the list version shows you see the general pattern."
    vi:
      question: "Code này định xóa các món rẻ hơn 1. Chạy sẽ xảy ra gì, và sửa thế nào?"
      answer: |
        Nó báo `RuntimeError: dictionary changed size during iteration`. Dict không được tăng hay giảm kích thước khi bạn đang lặp qua nó.
        Cách 1: tạo dict mới bằng comprehension, rõ ràng nhất:
        ```python
        prices = {name: p for name, p in prices.items() if p >= 1}
        ```
        Cách 2: lặp qua bản chụp của các key rồi xóa trên dict gốc: `for name in list(prices): ...`.
        Cái bẫy tương tự có ở list: xóa phần tử khi đang lặp sẽ âm thầm bỏ sót phần tử.
      tip: "Gọi đúng tên lỗi, rồi đưa cách sửa chuẩn (tạo collection mới). Nhắc đến phiên bản với list cho thấy bạn nhìn ra quy luật chung."

  - id: iv-33
    topic: comprehensions
    level: junior
    kind: coding
    code: |
      nums = [1, 2, 3, 4, 5, 6]
      evens_squared = [n * n for n in nums if n % 2 == 0]
      lookup = {n: n * n for n in nums}
      remainders = {n % 3 for n in nums}
      print(evens_squared, remainders)
    en:
      question: "What does this print? When is a comprehension a good idea, and when is it not?"
      answer: |
        It prints `[4, 16, 36] {0, 1, 2}`. The first is a list comprehension with a filter, `lookup` is a dict comprehension, and `remainders` is a set comprehension (duplicates removed).
        Comprehensions are good for one simple transform or filter: shorter and usually faster than an append loop. Stop using them when you need several conditions, nested loops with side effects, or a long expression. A plain `for` loop is more readable then. Do not use a comprehension only for its side effects (like `[print(x) for x in xs]`).
      tip: "Give the output, then show taste: a comprehension is for readability, not cleverness. Interviewers like candidates who say when NOT to use a feature."
    vi:
      question: "Đoạn code này in ra gì? Khi nào nên dùng comprehension, khi nào không?"
      answer: |
        Nó in `[4, 16, 36] {0, 1, 2}`. Cái đầu là list comprehension có điều kiện lọc, `lookup` là dict comprehension, `remainders` là set comprehension (loại bỏ giá trị trùng).
        Comprehension phù hợp cho một phép biến đổi hoặc lọc đơn giản: ngắn hơn và thường nhanh hơn vòng lặp có append. Đừng dùng khi có nhiều điều kiện, vòng lặp lồng nhau có tác dụng phụ, hoặc biểu thức quá dài; lúc đó vòng `for` thường dễ đọc hơn. Cũng đừng dùng comprehension chỉ để gây tác dụng phụ (như `[print(x) for x in xs]`).
      tip: "Cho kết quả, rồi thể hiện gu code: comprehension để dễ đọc chứ không phải để khoe. Người phỏng vấn thích ứng viên biết khi nào KHÔNG nên dùng một tính năng."

  - id: iv-43
    topic: lists
    level: junior
    kind: coding
    code: |
      items = [2, 4, 6, 1]
      for x in items:
          if x % 2 == 0:
              items.remove(x)
      print(items)
    en:
      question: "The goal is to remove all even numbers. What does this print, and why is it wrong?"
      answer: |
        It prints `[4, 1]`, not `[1]`. Removing an item shifts the later items left, but the loop's hidden index keeps moving right, so it skips the element that slid into the removed slot.
        Safe fixes:
        ```python
        items = [x for x in items if x % 2 != 0]   # build a new list (preferred)
        # or loop over a copy
        for x in items[:]:
            if x % 2 == 0:
                items.remove(x)
        ```
        Rule: never change the size of a collection while iterating over it.
      tip: "Trace the first two iterations to show WHY the element is skipped. Then offer the comprehension fix as the default."
    vi:
      question: "Mục tiêu là xóa mọi số chẵn. Code này in ra gì, và sai ở đâu?"
      answer: |
        Nó in `[4, 1]` chứ không phải `[1]`. Khi xóa một phần tử, các phần tử sau dồn sang trái, nhưng chỉ số ẩn của vòng lặp vẫn tiến sang phải, nên phần tử vừa dồn vào chỗ bị xóa bị bỏ qua.
        Cách sửa an toàn:
        ```python
        items = [x for x in items if x % 2 != 0]   # tạo list mới (nên dùng)
        # hoặc lặp trên bản sao
        for x in items[:]:
            if x % 2 == 0:
                items.remove(x)
        ```
        Quy tắc: không thay đổi kích thước collection khi đang lặp qua nó.
      tip: "Lần theo hai vòng lặp đầu để cho thấy VÌ SAO phần tử bị bỏ qua. Sau đó đưa comprehension làm cách mặc định."

  - id: iv-45
    topic: functions
    level: junior
    kind: coding
    code: |
      users = [
          {"name": "An", "score": 80},
          {"name": "Binh", "score": 95},
          {"name": "Chi", "score": 80},
      ]
      print(sorted(users, key=lambda u: (-u["score"], u["name"])))
    en:
      question: "What order does this print, and what does the `key` argument do?"
      answer: |
        It prints Binh (95) first, then An and Chi (both 80, ordered by name):
        `[{'name': 'Binh', 'score': 95}, {'name': 'An', 'score': 80}, {'name': 'Chi', 'score': 80}]`
        `key` is a function that turns each item into the value used for comparison. Returning a tuple sorts by the first element, then breaks ties with the second. The minus sign on the score gives descending order for numbers while the name stays ascending.
        `sorted` returns a new list; `list.sort()` sorts in place and returns `None`. Python's sort is stable, so equal keys keep their original order.
      tip: "Explain `key` as 'a function that says what to sort by'. The tuple-for-tie-break trick and the `sorted` vs `.sort()` difference are common follow-ups."
    vi:
      question: "Đoạn code này in ra thứ tự nào, và tham số `key` làm gì?"
      answer: |
        Nó in Binh (95) trước, rồi An và Chi (cùng 80, sắp theo tên):
        `[{'name': 'Binh', 'score': 95}, {'name': 'An', 'score': 80}, {'name': 'Chi', 'score': 80}]`
        `key` là hàm biến mỗi phần tử thành giá trị dùng để so sánh. Trả về tuple thì sắp theo phần tử đầu, và dùng phần tử thứ hai để phân định khi bằng nhau. Dấu trừ trước điểm cho thứ tự giảm dần với số, trong khi tên vẫn tăng dần.
        `sorted` trả về list mới; `list.sort()` sắp tại chỗ và trả về `None`. Sắp xếp của Python là stable nên các phần tử có key bằng nhau giữ nguyên thứ tự ban đầu.
      tip: "Giải thích `key` là 'hàm cho biết sắp xếp theo cái gì'. Mẹo tuple để phân định và khác biệt `sorted` với `.sort()` là các câu hỏi nối tiếp rất hay gặp."

  - id: iv-60
    topic: performance
    level: junior
    kind: scenario
    en:
      question: "A function that checks `if user_id in seen_ids` got much slower as the data grew. `seen_ids` is a list. What do you do?"
      answer: |
        1. Recognize the cause: `x in list` scans the list, so each check is O(n) and a loop of n checks is O(n squared).
        2. Change the container: `seen_ids = set(ids)`. Membership in a set (or dict) is O(1) on average.
        3. Measure before and after with `time.perf_counter()` or `timeit` on realistic data, instead of guessing.
        4. If you also need order, keep the list and add a set next to it, or use a `dict` (insertion-ordered).
        Trade-off: a set uses more memory and needs hashable items. For 20 items a list is perfectly fine; this only matters when the data is large or the check is in a hot loop.
      tip: "Show the diagnose-then-measure habit: name the complexity, apply the fix, then prove the speedup. Avoid premature optimisation talk without numbers."
    vi:
      question: "Một hàm kiểm tra `if user_id in seen_ids` chạy chậm hẳn khi dữ liệu lớn lên. `seen_ids` là một list. Bạn làm gì?"
      answer: |
        1. Nhận ra nguyên nhân: `x in list` phải duyệt cả list, nên mỗi lần kiểm tra là O(n) và vòng lặp n lần kiểm tra là O(n bình phương).
        2. Đổi cấu trúc dữ liệu: `seen_ids = set(ids)`. Kiểm tra thuộc về trong set (hoặc dict) trung bình là O(1).
        3. Đo trước và sau bằng `time.perf_counter()` hoặc `timeit` trên dữ liệu thực tế, đừng đoán.
        4. Nếu cần giữ thứ tự, giữ list và thêm một set đi kèm, hoặc dùng `dict` (giữ thứ tự thêm vào).
        Đánh đổi: set tốn bộ nhớ hơn và yêu cầu phần tử hashable. Với 20 phần tử thì list hoàn toàn ổn; chỉ cần quan tâm khi dữ liệu lớn hoặc phép kiểm tra nằm trong vòng lặp nóng.
      tip: "Cho thấy thói quen chẩn đoán rồi đo: nêu độ phức tạp, áp dụng cách sửa, rồi chứng minh bằng số liệu. Tránh nói tối ưu sớm mà không có số đo."

  - id: iv-46
    topic: files
    level: junior
    kind: scenario
    en:
      question: "Your script reads a 5 GB log file and the machine runs out of memory. How do you fix it?"
      answer: |
        1. Find the cause: `f.read()` or `f.readlines()` loads the whole file into RAM.
        2. Stream it instead. A file object is an iterator over lines, so only one line is in memory at a time:
        ```python
        from collections import Counter

        errors = Counter()
        with open("app.log", encoding="utf-8") as f:
            for line in f:
                if "ERROR" in line:
                    errors[line.split()[2]] += 1
        ```
        3. Keep only small summaries (counters, running totals, a few matching lines), not every line.
        4. For tabular files use `pandas.read_csv(..., chunksize=100_000)` or select only the needed columns.
        5. If it is still slow, split the file and use `multiprocessing`, or filter first with `grep`.
        Trade-off: streaming gives one pass; if you need random access or several passes, load a reduced version or use a database.
      tip: "Lead with the cause (reading everything at once), then the streaming pattern with a small code sketch. Mention what you keep in memory: summaries, not raw data."
    vi:
      question: "Script của bạn đọc file log 5 GB và máy hết bộ nhớ. Bạn xử lý thế nào?"
      answer: |
        1. Tìm nguyên nhân: `f.read()` hoặc `f.readlines()` nạp cả file vào RAM.
        2. Đọc theo luồng. File object là iterator theo từng dòng nên mỗi lúc chỉ có một dòng trong bộ nhớ:
        ```python
        from collections import Counter

        errors = Counter()
        with open("app.log", encoding="utf-8") as f:
            for line in f:
                if "ERROR" in line:
                    errors[line.split()[2]] += 1
        ```
        3. Chỉ giữ các bản tóm tắt nhỏ (counter, tổng chạy, vài dòng khớp), không giữ mọi dòng.
        4. Với file dạng bảng, dùng `pandas.read_csv(..., chunksize=100_000)` hoặc chỉ đọc các cột cần thiết.
        5. Nếu vẫn chậm, chia nhỏ file và dùng `multiprocessing`, hoặc lọc trước bằng `grep`.
        Đánh đổi: đọc theo luồng chỉ đi một lượt; nếu cần truy cập ngẫu nhiên hoặc nhiều lượt, hãy nạp bản đã rút gọn hoặc dùng database.
      tip: "Mở đầu bằng nguyên nhân (đọc hết một lần), rồi mẫu đọc theo luồng với đoạn code ngắn. Nói rõ bạn giữ gì trong bộ nhớ: bản tóm tắt chứ không phải dữ liệu thô."

  - id: iv-38
    topic: exceptions
    level: junior
    kind: coding
    code: |
      def parse_age(text):
          try:
              return int(text)
          except:
              return 0
    en:
      question: "What is wrong with this exception handling? Rewrite it."
      answer: |
        A bare `except:` catches everything, including `KeyboardInterrupt` and `SystemExit`, and hides real bugs (a typo inside `try` would also return 0). Returning `0` silently turns bad input into a believable value, which corrupts data later.
        Catch the specific exception, and decide on purpose what failure means:
        ```python
        import logging

        logger = logging.getLogger(__name__)

        def parse_age(text):
            try:
                return int(text)
            except ValueError:
                logger.warning("Invalid age: %r", text)
                return None   # or: raise ValueError(f"Invalid age: {text!r}")
        ```
        Rule: catch only what you can handle, keep the `try` body small, and never swallow errors without logging them.
      tip: "Say what the bare except hides, then show the narrow version. Bonus: explain that 'return a default' vs 'raise' is a design choice, not a default habit."
    vi:
      question: "Cách xử lý exception này sai ở đâu? Hãy viết lại."
      answer: |
        `except:` trần bắt mọi thứ, kể cả `KeyboardInterrupt` và `SystemExit`, và che mất lỗi thật (gõ nhầm tên biến trong `try` cũng trả về 0). Trả về `0` một cách âm thầm biến đầu vào sai thành một giá trị trông hợp lý, làm hỏng dữ liệu về sau.
        Hãy bắt exception cụ thể, và quyết định có chủ đích thất bại nghĩa là gì:
        ```python
        import logging

        logger = logging.getLogger(__name__)

        def parse_age(text):
            try:
                return int(text)
            except ValueError:
                logger.warning("Invalid age: %r", text)
                return None   # hoặc: raise ValueError(f"Invalid age: {text!r}")
        ```
        Quy tắc: chỉ bắt thứ bạn xử lý được, giữ thân `try` nhỏ, và không bao giờ nuốt lỗi mà không log.
      tip: "Nói bare except che giấu điều gì, rồi đưa phiên bản bắt cụ thể. Điểm cộng: giải thích 'trả giá trị mặc định' hay 'raise' là một quyết định thiết kế chứ không phải thói quen."

  - id: iv-39
    topic: json
    level: junior
    kind: coding
    code: |
      import json
      from pathlib import Path

      def load_config(path):
          ...
    en:
      question: "Write `load_config(path)` that reads a JSON file. A missing file should give an empty dict, and invalid JSON should raise a clear error."
      answer: |
        ```python
        import json
        from pathlib import Path

        def load_config(path):
            p = Path(path)
            try:
                with p.open(encoding="utf-8") as f:
                    return json.load(f)
            except FileNotFoundError:
                return {}
            except json.JSONDecodeError as e:
                raise ValueError(f"Invalid JSON in {p} (line {e.lineno})") from e
        ```
        Points: use `with` and an explicit encoding; catch the two specific exceptions; `raise ... from e` keeps the original cause in the traceback. To write JSON back use `json.dump(data, f, indent=2, ensure_ascii=False)`, where `ensure_ascii=False` keeps Vietnamese text readable. Validate the structure (required keys) after loading, because valid JSON can still have the wrong shape.
      tip: "Interviewers check for `with`, specific exceptions and a useful error message. Mention validating the shape of the data to go beyond the minimum."
    vi:
