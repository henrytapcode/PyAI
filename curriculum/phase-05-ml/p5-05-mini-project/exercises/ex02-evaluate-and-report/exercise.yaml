          return results


      def write_report(results: dict[str, tuple[float, float]], n_test: int) -> list[str]:
          non_baseline = [(name, stats) for name, stats in results.items() if name != "baseline"]
          if not non_baseline:
              raise ValueError("need at least one non-baseline model")
          # 2. format model lines, pick best via (-mean, name), append test size:
          lines = [...]
