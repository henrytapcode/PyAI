  - id: p6-04-q14
    type: mcq
    tags: [dl, huggingface]
    difficulty: 3
    answer: 2
    en:
      prompt: "Suppose your test split has 16 tickets and your fine-tuned model scores `100%` (16/16) vs. `93.8%` (15/16). Why should you report the split size and avoid bragging about `100%`?"
      options:
        - "Because `accuracy` cannot reach `1.0` unless the model runs on a GPU"
        - "Because `save_pretrained()` drops accuracy by 5% when reloading from disk"
        - "Because with 16 test tickets, a single borderline ticket swings accuracy by 6.25 percentage points"
        - "Because `id2label` rounds every confidence score up to `1.0` on small batches"
      explanation: "With only 15–20 test samples, one single prediction flip changes accuracy by 5–7 percentage points, so `100%` on 16 synthetic tickets is noisy and does not guarantee perfection on real user traffic."
    vi:
      prompt: "Giả sử tập test có 16 ticket và model sau fine-tune đạt `100%` (16/16) so với `93.8%` (15/16). Vì sao bạn nên báo rõ kích thước tập test và tránh khoe `100%`?"
      options:
        - "Vì `accuracy` không thể đạt `1.0` nếu model không chạy trên GPU"
        - "Vì `save_pretrained()` làm giảm 5% accuracy sau khi nạp lại từ đĩa"
        - "Vì với 16 câu test, chỉ một câu lật nhãn đã làm accuracy dao động tới 6,25 điểm phần trăm"
        - "Vì `id2label` làm tròn mọi điểm xác suất lên `1.0` trên batch nhỏ"
      explanation: "Khi tập test chỉ có 15–20 mẫu, mỗi câu đoán sai kéo tỉ lệ đúng đi 5–7 điểm phần trăm, nên `100%` trên 16 câu nhỏ dao động rất mạnh và không bảo chứng cho dữ liệu thật."

