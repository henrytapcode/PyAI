  # ---- ml
  - id: mock2-q13
    type: fill
    tags: [ml-math, numpy]
    difficulty: 2
    code: |
      import numpy as np

      q = np.array([3.0, 4.0])
      d = np.array([4.0, 3.0])
      q_unit = q / ___(q)
      d_unit = d / ___(d)
      print(round(float(q_unit @ d_unit), 3))
    answer: ["np.linalg.norm", "np.linalg.norm"]
    en:
      prompt: "Fill in the NumPy function that returns a vector's length in both blanks to normalize both vectors to unit length so their dot product equals cosine similarity (`0.96`)."
      explanation: "Dividing each vector by its Euclidean length `np.linalg.norm(...)` produces unit vectors of length `1.0`, so `q_unit @ d_unit` directly equals cosine similarity (`0.6*0.8 + 0.8*0.6 = 0.96`)."
    vi:
      prompt: "Điền hàm NumPy trả về độ dài của vector vào cả hai chỗ trống để chuẩn hóa hai vector về độ dài 1, sao cho tích vô hướng của chúng bằng cosine similarity (`0.96`)."
      explanation: "Chia mỗi vector cho độ dài Euclid `np.linalg.norm(...)` tạo các vector đơn vị có độ dài `1.0`, nên `q_unit @ d_unit` chính là cosine similarity (`0.6*0.8 + 0.8*0.6 = 0.96`)."

  - id: mock2-q14
    type: output
    tags: [ml-math]
    difficulty: 3
    code: |
      w = 0.0
      lr = 0.25
      for _ in range(3):
          grad = 2 * (w - 3)
          w = w - lr * grad
          print(round(w, 3))
    answer: "1.5\n2.25\n2.625"
    en:
      prompt: "You minimize the loss `(w - 3) ** 2` (whose slope is `2 * (w - 3)`) using 3 gradient descent steps. What does this code print?"
      explanation: "Starting at `w = 0.0`, `grad = -6.0` steps `w` to `0.0 - 0.25 * (-6.0) = 1.5`; next `grad = -3.0` moves `w` to `2.25`; third step `grad = -1.5` moves `w` to `2.625`, steadily approaching the minimum at `w = 3`."
    vi:
      prompt: "Bạn tối thiểu hóa hàm loss `(w - 3) ** 2` (có đạo hàm `2 * (w - 3)`) qua 3 bước gradient descent. Đoạn code này in ra gì?"
      explanation: "Bắt đầu tại `w = 0.0`, `grad = -6.0` đưa `w` tới `1.5`; bước hai `grad = -3.0` đưa `w` tới `2.25`; bước ba `grad = -1.5` đưa `w` tới `2.625`, tiến dần về đáy tại `w = 3`."

  - id: mock2-q15
    type: mcq
    tags: [supervised-learning, data-prep]
    difficulty: 2
    answer: 3
    en:
      prompt: "In an ML interview, a candidate calls `StandardScaler().fit_transform(X)` on all API log rows before calling `train_test_split`. Why is this order wrong?"
      options:
        - "`StandardScaler` raises a `ValueError` if fitted before splitting"
        - "Fitting on all rows forces `train` and `test` to have equal size"
        - "Unscaled test rows cannot be passed into `predict` after training"
        - "Test-set mean and std leak into the training feature scaling"
      explanation: "Calling `fit_transform(X)` before splitting computes the mean and standard deviation using test rows as well, leaking test distribution information into training. Always split first, then fit the scaler on `train` only."
    vi:
      prompt: "Khi phỏng vấn ML, một ứng viên gọi `StandardScaler().fit_transform(X)` trên toàn bộ log API rồi mới gọi `train_test_split`. Vì sao thứ tự này sai?"
      options:
        - "`StandardScaler` sẽ báo `ValueError` nếu fit trước khi chia tập"
        - "Fit trên toàn bộ bảng ép tập `train` và `test` phải bằng nhau"
        - "Các hàng test chưa chuẩn hóa sẽ không truyền vào `predict` được"
        - "Trung bình và độ lệch chuẩn của test bị rò rỉ vào tập train"
      explanation: "Gọi `fit_transform(X)` trước khi tách tập làm trung bình và độ lệch chuẩn tính cả phần test, gây rò rỉ thông tin tập test vào quá trình huấn luyện. Luôn chia tập trước rồi chỉ fit scaler trên `train`."

  - id: mock2-q16
    type: parsons
