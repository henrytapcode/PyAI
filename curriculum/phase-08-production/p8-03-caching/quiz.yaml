      explanation: "Import `OrderedDict`, create `od` with `'a'`, `'b'`, `'c'`, call `move_to_end('a')` before inserting `'d'`, then evict the oldest key `'b'` if `len(od) > 3`, and print `['c', 'a', 'd']`."
    vi:
      prompt: "Sắp xếp các dòng sau sao cho `'a'` được dùng lại trước khi thêm `'d'` và kết quả in ra `['c', 'a', 'd']`."
      explanation: "Import `OrderedDict`, khởi tạo `od` gồm `'a'`, `'b'`, `'c'`, gọi `move_to_end('a')` trước khi chèn `'d'`, rồi loại bỏ key cũ nhất `'b'` nếu `len(od) > 3` và in `['c', 'a', 'd']`."

  - id: p8-03-q16
    type: mcq
    tags: [production, llm]
    difficulty: 3
    answer: 2
    en:
      prompt: "A bot answers questions about each user's private orders. Why is a shared `(model, question)` key unsafe?"
      options:
        - "Adding `user_id` prevents `json.dumps` from sorting keys"
        - "SHA-256 produces shorter hashes for private user strings"
        - "User B could receive User A's cached private order details"
        - "Private answers force `FakeLLM` to ignore `temperature=0`"
      explanation: "If two users ask `'Where is my last order?'` and the key omits `user_id`, User B hits User A's cached entry and leaks User A's private data. Add `user_id` to the key or skip caching."
    vi:
      prompt: "Một bot trả lời câu hỏi về đơn hàng riêng của từng người dùng. Vì sao key dùng chung `(model, question)` gây rủi ro?"
      options:
        - "Thêm `user_id` sẽ làm `json.dumps` không sắp xếp được key"
        - "SHA-256 tạo ra mã băm ngắn hơn với chuỗi dữ liệu riêng"
        - "Người dùng B có thể nhận nhầm đơn hàng riêng của người dùng A"
        - "Dữ liệu riêng làm `FakeLLM` tự bỏ qua `temperature=0`"
      explanation: "Nếu hai người cùng hỏi `'Đơn gần nhất của tôi đâu?'` mà key thiếu `user_id`, người B sẽ trúng cache của người A và lộ thông tin riêng tư. Hãy thêm `user_id` vào key hoặc không cache."

flashcards:
  - id: p8-03-f01
    tags: [production, performance]
    en:
      front: "Cache hit, cache miss, and hit rate"
      back: "A cache hit finds a stored result without calling the underlying function; a cache miss computes and stores it. Hit rate = `hits / (hits + misses)`."
    vi:
      front: "Cache hit, cache miss và hit rate"
      back: "Cache hit là tìm thấy sẵn kết quả trong cache; cache miss là chưa có nên phải gọi hàm thật rồi lưu lại. Hit rate = `hits / (hits + misses)`."

  - id: p8-03-f02
    tags: [production, performance]
    en:
      front: "Limits of `functools.lru_cache` for LLM apps"
      back: "`lru_cache` only accepts hashable arguments (no `list`/`dict`), has no TTL expiration, and should not wrap functions whose output varies over time or has side effects."
    vi:
      front: "Giới hạn của `functools.lru_cache` với ứng dụng LLM"
      back: "`lru_cache` chỉ nhận đối số hashable (không nhận `list`/`dict`), không có TTL hết hạn và không dùng cho hàm có kết quả đổi theo thời gian hay side effect."

  - id: p8-03-f03
    tags: [production, llm]
    code: |
      raw = json.dumps(
          {"model": model, "messages": clean_msgs, "temperature": 0.0},
          sort_keys=True,
      )
      key = hashlib.sha256(raw.encode("utf-8")).hexdigest()
    en:
      front: "What belongs in an LLM prompt cache key?"
      back: "Include `model`, full `messages` (including `system`), `temperature` (cache only at `0`), generation params (`max_tokens`, `response_format`), and `user_id` or version tags when needed—serialized with `sort_keys=True`."
    vi:
      front: "Cần đưa gì vào cache key của prompt LLM?"
      back: "Đưa `model`, toàn bộ `messages` (gồm `system`), `temperature` (chỉ cache khi `0`), tham số sinh (`max_tokens`, `response_format`), cùng `user_id` hoặc version khi cần—tuần tự hóa với `sort_keys=True`."

  - id: p8-03-f04
    tags: [production, llm]
    en:
      front: "Embedding cache rule and model changes"
      back: "Cache embeddings by `(model, text)`, batch only missing texts in one `embed()` call, reassemble in original order, and discard old vectors whenever switching embedding models."
    vi:
      front: "Quy tắc cache embedding và khi đổi model"
      back: "Cache theo `(model, text)`, chỉ gom các văn bản thiếu gửi một lần vào `embed()`, ghép lại đúng thứ tự ban đầu và bỏ toàn bộ cache cũ nếu đổi sang model embedding khác."

  - id: p8-03-f05
    tags: [production, dicts]
    en:
      front: "How `OrderedDict` implements LRU eviction"
      back: "Call `move_to_end(key)` on hits and updates to mark a key most recently used, and call `popitem(last=False)` to evict the oldest key when `len > maxsize`."
    vi:
      front: "Cách dùng `OrderedDict` để cài đặt LRU eviction"
      back: "Gọi `move_to_end(key)` khi trúng hoặc cập nhật để đẩy key thành mới nhất, và gọi `popitem(last=False)` để xóa key lâu chưa dùng nhất khi vượt `maxsize`."

  - id: p8-03-f06
    tags: [production, performance]
    en:
      front: "TTL, monotonic clocks, and key versioning"
      back: "Store `expires_at = now + ttl` and delete when `now >= expires_at`. Inject a clock in tests (`time.monotonic` in production—never system time, which can jump backward) and bump `index_version`/`prompt_version` in keys when source data changes."
    vi:
      front: "TTL, đồng hồ monotonic và gắn phiên bản vào key"
      back: "Lưu `expires_at = now + ttl` và xóa khi `now >= expires_at`. Tiêm đồng hồ khi test (dùng `time.monotonic` ở production—không dùng giờ hệ thống vì có thể bị chỉnh lùi) và tăng `index_version`/`prompt_version` trong key khi nguồn dữ liệu đổi."
