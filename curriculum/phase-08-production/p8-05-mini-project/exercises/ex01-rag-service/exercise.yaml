kind: project
title:
  en: "Build: RAG FastAPI service"
  vi: "Dự án: dịch vụ RAG bằng FastAPI"
difficulty: 2
tags: [production, rag, apis, testing]
hints:
  en:
    - |
      Follow §2 (Part 1) and §3 (Part 2) of the lesson, then extend them with `GET /documents/{doc_id}`, rounded `scores`, and empty citations if the model itself refuses. For `GET /health` on 6 docs, return `{"status": "ok", "docs": 6}`; for an unknown document id, raise a `404` `HTTPException`.
    - |
      The plan:
      1. Inside `create_app`, embed all document texts once and build a lookup dictionary keyed by document id.
      2. Define the request schema with `question` length bounds and `top_k` integer bounds.
      3. Register the health route and the document lookup route, raising a 404 error with `"document not found"` when an id is missing.
      4. In `/ask`, embed the question, sort documents by descending cosine similarity with original-index tie-breaking, keep up to `top_k` entries meeting `min_score`, and short-circuit on empty hits.
      5. Otherwise format numbered context chunks for `client.chat`, and clear `sources` and `scores` if the model replies with the exact refusal sentence; round remaining scores to 3 decimal places.
    - |
      Follow this route and refusal-gating skeleton inside `create_app`:
      ```python
      class AskRequest(BaseModel):
          question: str = Field(min_length=1, max_length=300)
          top_k: int = Field(default=2, ge=1, le=5)


      def create_app(docs: list[dict], client, min_score: float = 0.2) -> FastAPI:
          app = FastAPI()
          docs_by_id = {d["id"]: d for d in docs}
          doc_vecs = client.embed([d["text"] for d in docs])

          @app.get("/documents/{doc_id}")
          def get_document(doc_id: str) -> dict[str, str]:
              ...

          @app.post("/ask")
          def ask(body: AskRequest) -> dict[str, object]:
              # rank and filter hits, short-circuiting with REFUSAL and [] if empty
              ...
              resp = client.chat(...)
              answer = resp.content or ""
              if answer == REFUSAL:
                  sources, scores = [], []
              else:
                  ...
              return {
                  "answer": answer,
                  "sources": sources,
                  "scores": scores,
                  "usage": {"prompt_tokens": resp.usage.prompt_tokens, "completion_tokens": resp.usage.completion_tokens},
              }

          return app
      ```
  vi:
    - |
      Làm theo §2 (Part 1) và §3 (Part 2) trong bài học, rồi mở rộng thêm `GET /documents/{doc_id}`, trường `scores` làm tròn 3 chữ số và xóa nguồn khi chính model từ chối. Với `GET /health` trên 6 tài liệu, trả `{"status": "ok", "docs": 6}`; với `doc_id` không tồn tại, ném `HTTPException` mã `404`.
    - |
      Kế hoạch:
      1. Trong `create_app`, embed toàn bộ văn bản tài liệu đúng một lần và dựng dictionary tra cứu theo id.
      2. Định nghĩa schema request với giới hạn độ dài `question` và khoảng số nguyên `top_k`.
      3. Đăng ký route kiểm tra sức khỏe và route lấy tài liệu theo id, trả lỗi 404 với chi tiết `"document not found"` nếu thiếu.
      4. Trong `/ask`, embed câu hỏi, xếp hạng tài liệu theo cosine giảm dần (hòa thì giữ thứ tự gốc), lấy tối đa `top_k` mục đạt `min_score` và trả từ chối ngay nếu rỗng.
      5. Ngược lại dựng các đoạn context đánh số cho `client.chat`, rồi xóa `sources` và `scores` về rỗng nếu câu trả lời của model trùng đúng câu từ chối; nếu có nguồn thì làm tròn điểm tới 3 chữ số thập phân.
    - |
      Dùng bộ khung route và kiểm tra từ chối sau trong `create_app`:
