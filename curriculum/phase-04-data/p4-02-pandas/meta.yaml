    - "Group and aggregate with groupby"
    - "Add vectorised columns and avoid chained-indexing bugs"
  vi:
    - "Tạo DataFrame từ dict và CSV"
    - "Chọn hàng, cột bằng loc và bộ lọc"
    - "Gom nhóm và tổng hợp bằng groupby"
    - "Thêm cột vector hóa và tránh lỗi chained indexing"
