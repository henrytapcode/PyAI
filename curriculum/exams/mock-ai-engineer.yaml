      prompt: "In a FastAPI service, what happens if you define an `async def` endpoint that calls a synchronous, blocking HTTP client or `time.sleep(2)` directly?"
      options:
        - "FastAPI automatically runs the blocking call inside a separate worker process"
        - "The blocking call stalls the asyncio event loop and delays concurrent requests"
        - "Python converts `time.sleep(2)` into `await asyncio.sleep(2)` at runtime"
        - "Uvicorn kills the worker thread immediately and returns HTTP `504` to clients"
      explanation: "An `async def` route runs directly on the single-threaded asyncio event loop. Blocking calls inside it freeze the entire event loop for all concurrent requests; use `await` with async clients or a regular `def` route (which FastAPI runs in a threadpool)."
    vi:
      prompt: "Trong dịch vụ FastAPI, điều gì xảy ra nếu bạn định nghĩa một endpoint `async def` nhưng bên trong lại gọi trực tiếp thư viện HTTP đồng bộ gây chặn hoặc `time.sleep(2)`?"
      options:
        - "FastAPI tự động đẩy lời gọi gây chặn đó sang một tiến trình worker riêng"
        - "Lời gọi gây chặn làm treo event loop asyncio và làm chậm các request khác"
        - "Python tự chuyển `time.sleep(2)` thành `await asyncio.sleep(2)` khi chạy"
        - "Uvicorn ngắt luồng worker ngay lập tức và trả về mã HTTP `504` cho client"
      explanation: "Route `async def` chạy trực tiếp trên event loop asyncio đơn luồng. Gọi hàm chặn bên trong sẽ làm đứng toàn bộ event loop cho mọi request đồng thời; cần dùng `await` với client bất đồng bộ hoặc dùng `def` thường (FastAPI chạy trong threadpool)."

