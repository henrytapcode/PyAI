hints:
  en:
    - |
      This combines `GET` / `POST` routes (§2, §4), `AskRequest` with `Field(...)` bounds (§4), and `HTTPException` (§3, §5). For `{"question": "FastAPI tests"}` with default `top_k=2`, `POST /ask` returns `{"question": "FastAPI tests", "sources": [3, 4]}`.
    - |
      The plan:
      1. Restrict `question` length and `top_k` bounds/default inside `AskRequest` using `Field`.
      2. Return the status dictionary from `health()`.
      3. In `ask`, build a set of lowercased words from the question, count shared words with each document's lowercased word set, and raise a `404` `HTTPException` when no document matches.
      4. Sort matches by shared word count descending with smaller document IDs breaking ties, keep up to `top_k` IDs, and return the response dictionary.
    - |
      Use this skeleton for `ask` and leave the overlap counting and ranking key to fill in:
      ```python
      @app.post("/ask")
      def ask(body: AskRequest) -> dict[str, object]:
          q_words = set(body.question.lower().split())
          scored: list[tuple[int, int]] = []
          for doc_id, text in DOCS.items():
              overlap = ...
              if overlap > 0:
                  scored.append((overlap, doc_id))
          if not scored:
              raise HTTPException(status_code=404, detail="no matching documents")
          scored.sort(key=...)
          sources = ...
          return {"question": body.question, "sources": sources}
      ```
      Remember to also add `Field(...)` constraints on `AskRequest` and return the health payload in `health()`.
