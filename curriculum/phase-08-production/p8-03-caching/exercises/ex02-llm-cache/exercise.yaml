hints:
  en:
    - |
      Combine the key builder from §3 (`json.dumps(..., sort_keys=True)` + `hashlib.sha256`) with the expiration check from §6 (`now >= expires_at`). For `make_key("mini", [{"role": "user", "content": "  Hi   there "}], temperature=0.0, max_tokens=50)`, passing `max_tokens=50, temperature=0.0` must produce the exact same 64-character hex digest.
    - |
      The plan:
      1. In `make_key`, create a new list of message dicts with `" ".join(msg["content"].strip().split())` for string content, wrap `model`, the cleaned messages, and `params` into a dict, dump it with `json.dumps(..., sort_keys=True)`, and return the SHA-256 `hexdigest()`.
      2. In `TTLCache`, initialize `self.ttl`, `self.hits = 0`, `self.misses = 0`, and a dict for entries. On `set(key, value, now)`, store `(value, now + self.ttl)`. On `get(key, now)`, delete expired entries (`now >= expires_at`), count hits/misses, and compute `hit_rate()` safely when total is `0`.
    - |
