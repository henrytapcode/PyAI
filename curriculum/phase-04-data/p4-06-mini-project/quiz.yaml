    vi:
      prompt: "Điền toán tử so sánh SQL vào trong `AVG(status ___ 'error')` để tính tỉ lệ lỗi `0.25`."
      explanation: "Trong SQLite, `status = 'error'` trả về `1` cho dòng lỗi và `0` cho dòng khác, nên `AVG(...)` chính là tỉ lệ request lỗi."

  - id: p4-06-q10
    type: output
    tags: [sql, pandas]
    difficulty: 2
    code: |
      import sqlite3
      import pandas as pd

      conn = sqlite3.connect(":memory:")
      df = pd.DataFrame({
          "model": ["zeta", "alpha", "beta"],
          "tokens": [500, 500, 900],
      })
      df.to_sql("requests", conn, index=False)
      out = pd.read_sql_query(
          "SELECT model FROM requests ORDER BY tokens DESC, model ASC",
          conn,
      )
      print(out["model"].tolist())
      conn.close()
    answer: "['beta', 'alpha', 'zeta']"
    en:
      prompt: "What does this code print?"
      explanation: "`ORDER BY tokens DESC` puts `beta` (`900`) first; `alpha` and `zeta` tie at `500`, and the secondary `model ASC` places `alpha` before `zeta`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`ORDER BY tokens DESC` đưa `beta` (`900`) lên đầu; `alpha` và `zeta` hòa nhau ở `500`, nên cột phụ `model ASC` xếp `alpha` trước `zeta`."

  - id: p4-06-q11
    type: mcq
    tags: [sql, pandas]
    difficulty: 2
    answer: 1
    en:
      prompt: "When is it better to aggregate log metrics in SQL rather than pure pandas `groupby()`?"
      options:
        - "When you need to draw a Matplotlib bar chart directly inside SQLite"
        - "When the logs already live in a SQL database so filtering and grouping happen before loading rows into Python RAM"
        - "When `rating` contains `NaN`, because pandas `groupby()` cannot ignore `NaN` in `.mean()`"
        - "When you want to mutate the input DataFrame in place"
      explanation: "Both SQL `GROUP BY` and pandas `groupby().agg()` ignore `NaN`/`NULL` in averages. SQL shines when data is stored in a database and you only want the small summary pulled into pandas."
    vi:
      prompt: "Khi nào tổng hợp chỉ số bằng SQL hợp lý hơn so với dùng thuần pandas `groupby()`?"
      options:
        - "Khi bạn cần vẽ biểu đồ cột Matplotlib trực tiếp bên trong SQLite"
        - "Khi log vốn đã nằm sẵn trong database SQL nên việc lọc và gom nhóm chạy ngay ở database trước khi tải dữ liệu vào RAM Python"
        - "Khi cột `rating` có `NaN`, vì `groupby()` của pandas không bỏ qua được `NaN` trong `.mean()`"
        - "Khi bạn muốn sửa trực tiếp `DataFrame` đầu vào"
      explanation: "Cả SQL `GROUP BY` lẫn pandas `groupby().agg()` đều bỏ qua `NULL`/`NaN` khi tính trung bình. SQL phát huy thế mạnh khi dữ liệu nằm sẵn trong database và bạn chỉ muốn kéo bảng tóm tắt gọn nhẹ về pandas."

  - id: p4-06-q12
