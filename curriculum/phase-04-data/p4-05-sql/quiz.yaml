questions:
  - id: p4-05-q01
    type: mcq
    tags: [sql]
    difficulty: 1
    answer: 1
    en:
      prompt: "What does `sqlite3.connect(\":memory:\")` create?"
      options:
        - "A permanent database file named `memory.db` in the current folder"
        - "A temporary SQLite database in RAM that disappears when the connection closes or the program exits"
        - "A connection to a remote PostgreSQL server"
        - "A pandas DataFrame stored on disk"
      explanation: "`\":memory:\"` tells SQLite to keep the database only in RAM for the lifetime of that connection; real apps pass a file path like `\"app.db\"` to persist data."
    vi:
      prompt: "`sqlite3.connect(\":memory:\")` tạo ra thứ gì?"
      options:
        - "Một file database vĩnh viễn tên `memory.db` trong thư mục hiện tại"
        - "Một database SQLite tạm thời trên RAM, tự biến mất khi đóng kết nối hoặc kết thúc chương trình"
        - "Một kết nối tới máy chủ PostgreSQL từ xa"
        - "Một pandas DataFrame lưu trên ổ đĩa"
      explanation: "`\":memory:\"` bảo SQLite giữ database chỉ trong RAM trong suốt vòng đời kết nối; ứng dụng thật truyền đường dẫn file như `\"app.db\"` để lưu lâu dài."

  - id: p4-05-q02
    type: output
    tags: [sql]
    difficulty: 1
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE models (id INTEGER PRIMARY KEY, name TEXT)")
      with conn:
          conn.executemany(
              "INSERT INTO models (name) VALUES (?)",
              [("mini",), ("gpt-4o",), ("claude",)],
          )
      print(conn.execute("SELECT COUNT(*) FROM models").fetchone())
      conn.close()
    answer: "(3,)"
    en:
      prompt: "What does this code print?"
      explanation: "Three rows are inserted into `models`, and `.fetchone()` on `SELECT COUNT(*)` returns a 1-element tuple `(3,)`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Ba dòng được chèn vào bảng `models`, và `.fetchone()` trên `SELECT COUNT(*)` trả về tuple một phần tử `(3,)`."

  - id: p4-05-q03
    type: fill
    tags: [sql]
    difficulty: 1
    code: |
      import sqlite3

      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE logs (user TEXT, tokens INTEGER)")
      with conn:
          conn.execute("INSERT INTO logs (user, tokens) VALUES (___, ___)", ("an", 120))
      print(conn.execute("SELECT user, tokens FROM logs").fetchall())
      conn.close()
    answer: ["?", "?"]
    en:
      prompt: "Fill in the SQLite placeholder character used twice in `VALUES (...)`."
      explanation: "Python's `sqlite3` module uses `?` as the parameter placeholder, matching the order of values in the tuple `(\"an\", 120)`."
    vi:
      prompt: "Điền ký tự placeholder của SQLite được dùng hai lần trong `VALUES (...)`."
      explanation: "Module `sqlite3` của Python dùng dấu `?` làm placeholder cho tham số, khớp đúng thứ tự các giá trị trong tuple `(\"an\", 120)`."

  - id: p4-05-q04
    type: mcq
    tags: [sql]
    difficulty: 1
    answer: 2
    en:
      prompt: "In `CREATE TABLE messages (id INTEGER PRIMARY KEY, user TEXT, text TEXT)`, what does `PRIMARY KEY` guarantee for `id`?"
      options:
        - "Every `text` value must be shorter than 255 characters"
        - "SQLite automatically sorts every `SELECT` query by `user`"
        - "Each row has a unique `id` that identifies that record and cannot be duplicated"
        - "The `id` column stores floating-point decimals"
      explanation: "A `PRIMARY KEY` uniquely identifies each row in a table, and SQLite auto-assigns sequential integers for `INTEGER PRIMARY KEY` when `id` is omitted on insert."
    vi:
      prompt: "Trong `CREATE TABLE messages (id INTEGER PRIMARY KEY, user TEXT, text TEXT)`, `PRIMARY KEY` đảm bảo điều gì cho cột `id`?"
      options:
        - "Mọi giá trị `text` phải ngắn hơn 255 ký tự"
        - "SQLite tự động sắp xếp mọi câu `SELECT` theo `user`"
        - "Mỗi dòng có một `id` duy nhất để định danh bản ghi đó và không thể trùng lặp"
        - "Cột `id` dùng để lưu số thực dấu phẩy động"
      explanation: "`PRIMARY KEY` định danh duy nhất từng dòng trong bảng, và với `INTEGER PRIMARY KEY` SQLite tự cấp số nguyên tăng dần khi bạn bỏ qua `id` lúc `INSERT`."

  - id: p4-05-q05
    type: output
    tags: [sql]
    difficulty: 1
    code: |
      import sqlite3
      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE scores (model TEXT, score REAL)")
      with conn:
          conn.executemany(
              "INSERT INTO scores (model, score) VALUES (?, ?)",
              [("mini", 0.72), ("gpt-4o", 0.91), ("claude", 0.88)],
          )
      rows = conn.execute(
          "SELECT model FROM scores WHERE score >= 0.80 ORDER BY score DESC"
      ).fetchall()
      print(rows)
      conn.close()
    answer: "[('gpt-4o',), ('claude',)]"
    en:
      prompt: "What does this code print?"
      explanation: "`WHERE score >= 0.80` keeps `gpt-4o` (0.91) and `claude` (0.88), and `ORDER BY score DESC` puts `gpt-4o` first; each row is a 1-tuple."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`WHERE score >= 0.80` giữ lại `gpt-4o` (0.91) và `claude` (0.88), và `ORDER BY score DESC` xếp `gpt-4o` trước; mỗi dòng là một tuple 1 phần tử."

  - id: p4-05-q06
    type: fill
    tags: [sql]
    difficulty: 2
    code: |
      import sqlite3

      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE logs (user TEXT, note TEXT)")
      with conn:
          conn.executemany("INSERT INTO logs (user, note) VALUES (?, ?)", [("an", None), ("binh", "ok")])
      rows = conn.execute("SELECT user FROM logs WHERE note ___ NULL ORDER BY user").fetchall()
      print(rows)
      conn.close()
    answer: ["IS"]
    en:
      prompt: "Fill in the SQL keyword to match rows where `note` is `NULL`."
      explanation: "In SQL, `= NULL` is never true because `NULL` means unknown; always test for missing values with `IS NULL`."
    vi:
      prompt: "Điền từ khóa SQL để lọc các dòng có cột `note` mang giá trị `NULL`."
      explanation: "Trong SQL, `= NULL` không bao giờ đúng vì `NULL` nghĩa là chưa biết; hãy luôn kiểm tra giá trị trống bằng `IS NULL`."

