  - id: p4-02-q14
    type: mcq
    tags: [pandas, debugging]
    difficulty: 3
    answer: 0
    code: |
      import pandas as pd
      df = pd.DataFrame({"x": [1, -2, 3], "y": [0, 0, 0]})
      df[df["x"] > 0]["y"] = 1
    en:
      prompt: "Why does `df[df[\"x\"] > 0][\"y\"] = 1` trigger a warning and leave `df` unchanged?"
      options:
        - "Chained indexing writes to a temporary copy instead of `df`; fix it with `df.loc[df[\"x\"] > 0, \"y\"] = 1`"
        - "pandas does not allow updating integer columns to `1`"
        - "`df[\"x\"] > 0` must be wrapped in `list(...)` before indexing"
        - "Assigning to a column requires `.reset_index(drop=True)` first"
      explanation: "Writing two `[...]` operations in a row creates a copy in the first step, so `[\"y\"] = 1` edits the copy and leaves `df` untouched. Use single-step `df.loc[mask, \"y\"] = 1`."
    vi:
      prompt: "Vì sao `df[df[\"x\"] > 0][\"y\"] = 1` gây cảnh báo và không làm thay đổi `df`?"
      options:
        - "Chained indexing ghi vào một bản sao tạm thay vì `df`; sửa bằng `df.loc[df[\"x\"] > 0, \"y\"] = 1`"
        - "pandas không cho phép cập nhật cột số nguyên thành `1`"
        - "Phải bọc `df[\"x\"] > 0` trong `list(...)` trước khi lập chỉ mục"
        - "Gán giá trị vào cột bắt buộc phải gọi `.reset_index(drop=True)` trước"
      explanation: "Viết hai cặp `[...]` nối tiếp tạo ra bản sao ở bước đầu, nên `[\"y\"] = 1` chỉ sửa bản sao đó và bỏ mặc `df`. Hãy dùng `df.loc[mask, \"y\"] = 1` trong một bước."

  - id: p4-02-q15
    type: mcq
    tags: [pandas, exceptions]
    difficulty: 3
    answer: 2
    code: |
      import pandas as pd
      df = pd.DataFrame({"model": ["a", "b", "c"], "score": [0.4, 0.9, 0.8]})
      high = df[df["score"] >= 0.8]
      print(high.loc[0, "model"])
    en:
      prompt: "Why does `high.loc[0, \"model\"]` raise `KeyError: 0`?"
      options:
        - "`loc` does not accept column names as the second argument"
        - "The `model` column was dropped when filtering `df`"
        - "Filtering kept the original row labels `[1, 2]`, so label `0` is no longer in `high.index`"
        - "`0` is reserved for column positions, not row positions"
      explanation: "Boolean filtering preserves original index labels (`1` and `2`), dropping row `0`. Because `.loc` looks up by label, `0` raises `KeyError`. Use `.iloc[0]` or `.reset_index(drop=True)`."
    vi:
      prompt: "Vì sao `high.loc[0, \"model\"]` gây lỗi `KeyError: 0`?"
      options:
        - "`.loc` không nhận tên cột làm đối số thứ hai"
        - "Cột `model` đã bị xóa khi lọc `df`"
        - "Phép lọc giữ nguyên nhãn hàng gốc `[1, 2]`, nên nhãn `0` không còn trong `high.index`"
        - "`0` chỉ dùng cho vị trí cột, không dùng cho hàng"
      explanation: "Lọc boolean giữ nguyên nhãn index gốc (`1` và `2`) và bỏ hàng `0`. Vì `.loc` tra theo nhãn nên `0` gây `KeyError`. Hãy dùng `.iloc[0]` hoặc `.reset_index(drop=True)`."

  - id: p4-02-q16
    type: parsons
    tags: [pandas, debugging]
    difficulty: 3
    lines:
