questions:
  - id: p8-01-q01
    type: mcq
    tags: [apis]
    difficulty: 1
    answer: 1
    en:
      prompt: "In `@app.get(\"/docs/{doc_id}\")` with `def read_doc(doc_id: int, limit: int = 3):`, what are `doc_id` and `limit` in `GET /docs/7?limit=2`?"
      options:
        - "Both `doc_id` and `limit` are JSON request body fields"
        - "`doc_id` is a path parameter and `limit` is a query parameter"
        - "`doc_id` is a query parameter and `limit` is a path parameter"
        - "Both `doc_id` and `limit` are HTTP status codes on the route"
      explanation: "`{doc_id}` sits inside the URL path (`/docs/7`), so it is a path parameter; `limit` is not in the path, so it is read as a query parameter (`?limit=2`)."
    vi:
      prompt: "Với `@app.get(\"/docs/{doc_id}\")` và `def read_doc(doc_id: int, limit: int = 3):`, `doc_id` và `limit` trong `GET /docs/7?limit=2` là gì?"
      options:
        - "Cả `doc_id` và `limit` đều là trường trong JSON request body"
        - "`doc_id` là path parameter còn `limit` là query parameter"
        - "`doc_id` là query parameter còn `limit` là path parameter"
        - "Cả `doc_id` và `limit` đều là mã trạng thái HTTP trên route"
      explanation: "`{doc_id}` nằm trong đường dẫn URL (`/docs/7`) nên là path parameter; `limit` không nằm trong đường dẫn nên được đọc như query parameter (`?limit=2`)."

  - id: p8-01-q02
    type: output
    tags: [apis]
    difficulty: 1
    code: |
      from fastapi import FastAPI
      from fastapi.testclient import TestClient

      app = FastAPI()


      @app.get("/health")
      def health():
          return {"status": "ok"}


      r = TestClient(app).get("/health")
      print(health()["status"], r.status_code)
    answer: "ok 200"
    en:
      prompt: "What does this code print?"
      explanation: "`@app.get(\"/health\")` keeps `health()` directly callable, so `health()[\"status\"]` is `\"ok\"`, and `TestClient(app).get(\"/health\")` returns status `200`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`@app.get(\"/health\")` giữ `health()` gọi trực tiếp được như hàm thường nên `health()[\"status\"]` là `\"ok\"`, còn `TestClient(app).get(\"/health\")` trả mã `200`."

  - id: p8-01-q03
    type: mcq
    tags: [apis, production]
    difficulty: 1
    answer: 2
    en:
      prompt: "Which `status_code` should you pass to `@app.post(\"/notes\", status_code=...)` when the endpoint creates a new record?"
      options:
        - "`200`, the standard code meaning a new item was stored"
        - "`404`, meaning the old record was replaced in memory"
        - "`201`, the HTTP status code meaning Created"
        - "`422`, meaning Pydantic validated the request body"
      explanation: "`201 Created` tells callers a new resource was created; `200` is the generic OK default, while `404` and `422` are client errors."
    vi:
      prompt: "Bạn nên truyền `status_code` nào vào `@app.post(\"/notes\", status_code=...)` khi endpoint tạo mới một bản ghi?"
      options:
        - "`200`, mã chuẩn báo hiệu một mục mới đã được lưu vào bộ nhớ"
        - "`404`, báo hiệu bản ghi cũ đã được thay thế trong bộ nhớ"
        - "`201`, mã trạng thái HTTP mang nghĩa Created (đã tạo mới)"
        - "`422`, báo hiệu Pydantic đã kiểm tra xong dữ liệu body"
      explanation: "`201 Created` báo cho phía gọi biết một tài nguyên mới đã được tạo; `200` là mặc định chung, còn `404` và `422` là mã lỗi từ phía client."

