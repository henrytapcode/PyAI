    - |
      Kế hoạch:
      1. Thêm `Field(min_length=1, max_length=200)` cho `question` và `Field(default=2, ge=1, le=5)` cho `top_k` trong `AskRequest`.
      2. Cài đặt `health()` trả về `{"status": "ok"}`.
