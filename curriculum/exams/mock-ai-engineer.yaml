  - id: mock3-q20
    type: output
    tags: [performance, production]
    difficulty: 2
    code: |
      from functools import lru_cache

      @lru_cache(maxsize=2)
      def embed_key(text):
          return len(text)

      for q in ["hi", "ok", "hi", "bye", "ok"]:
          embed_key(q)

      info = embed_key.cache_info()
      print(info.hits, info.misses, info.currsize)
