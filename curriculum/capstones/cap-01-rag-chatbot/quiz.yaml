      prompt: "In the FastAPI session service (`session_ttl=60.0`), `s1` opens at `t=0` and is idle until `t=60.0`, when a client posts to `/sessions/s1/messages`. What must happen?"
      options:
        - "Purge `s1` (`60.0 - 0.0 >= 60.0`) and return `404` without `bot.ask`"
        - "Keep `s1` alive because `60.0 - 0.0 > 60.0` is false and return `200`"
        - "Refresh `s1` `last_seen` to `60.0` first, then reply with `200`"
        - "Evict `s1` only if `max_sessions` is full, else return `422`"
      explanation: "Expiration runs at the start of every request using `clock() - last_seen >= session_ttl`; at `t=60.0`, `s1` is purged first and the route returns HTTP `404`."
    vi:
      prompt: "Trong dịch vụ phiên FastAPI (`session_ttl=60.0`), `s1` mở ở `t=0` và không hoạt động tới `t=60.0`, khi client gửi `POST /sessions/s1/messages`. Điều gì phải xảy ra?"
      options:
        - "Xóa `s1` (`60.0 - 0.0 >= 60.0`) và trả `404`, không gọi `bot.ask`"
        - "Giữ `s1` sống vì `60.0 - 0.0 > 60.0` là sai rồi trả về mã `200`"
        - "Cập nhật `last_seen` của `s1` thành `60.0` trước rồi trả về mã `200`"
        - "Chỉ xóa `s1` nếu chạm `max_sessions`, nếu không thì trả về mã `422`"
      explanation: "Bước dọn phiên hết hạn chạy đầu mỗi request với điều kiện `clock() - last_seen >= session_ttl`; ở `t=60.0`, `s1` bị xóa trước khi tra cứu nên route trả HTTP `404`."

flashcards:
  - id: cap-01-f01
    tags: [llm, rag]
    en:
      front: "Token-budgeted history with pinned system"
      back: "Keep the system prompt outside self.history; append each user/assistant turn pair and pop oldest turns from index 0 while total tokens exceed max_history_tokens and len(history) > 2."
    vi:
      front: "Lịch sử theo ngân sách token và ghim system"
      back: "Giữ system prompt bên ngoài self.history; thêm từng cặp lượt user/assistant và pop(0) lượt cũ nhất khi tổng token vượt max_history_tokens và len(history) > 2."

  - id: cap-01-f02
    tags: [rag, llm]
    en:
      front: "Deterministic follow-up rewriting"
      back: "Prepend the previous original user question before retrieval when a new query has <= 4 words or starts with 'what about', 'and', or 'how about'. Never store rewritten text as prev_user."
    vi:
      front: "Viết lại câu hỏi nối tiếp tất định"
      back: "Ghép câu hỏi gốc của lượt user trước đó vào trước khi truy xuất nếu câu mới có <= 4 từ hoặc mở đầu bằng 'what about', 'and', 'how about'. Không lưu chuỗi đã viết lại làm prev_user."

  - id: cap-01-f03
    tags: [rag, production]
    en:
      front: "Pre-LLM refusal gate"
      back: "When retrieve() returns no chunks >= min_score, return REFUSAL with sources=[] without calling client.chat(), and still record the turn pair in self.history."
    vi:
      front: "Cổng từ chối trước khi gọi LLM"
      back: "Khi retrieve() không trả về chunk nào đạt >= min_score, trả về REFUSAL với sources=[] mà không gọi client.chat(), đồng thời vẫn ghi cặp lượt vào self.history."

  - id: cap-01-f04
    tags: [evaluation, testing]
    en:
      front: "Golden dialog eval & turn priority"
      back: "Call make_bot() once per dialog to isolate history. Score each turn in order: no_refusal (when expected_source is None), else refused -> wrong_source -> missing_fact -> None."
    vi:
      front: "Eval golden dialog & thứ tự chấm lượt"
      back: "Gọi make_bot() một lần cho mỗi dialog để cô lập lịch sử. Chấm từng lượt theo thứ tự: no_refusal (khi expected_source là None), hoặc refused -> wrong_source -> missing_fact -> None."

  - id: cap-01-f05
    tags: [evaluation, production]
    en:
      front: "Baseline diff & regression gate"
      back: "Match turns by (dialog, turn) to compute fixed, broken, new, and pass_rate. Fail gate_ok whenever broken is non-empty or pass_rate < min_pass_rate."
    vi:
      front: "Đối chiếu baseline & cổng hồi quy"
      back: "Khớp các lượt theo (dialog, turn) để tính fixed, broken, new và pass_rate. Đánh trượt gate_ok bất cứ khi nào broken khác rỗng hoặc pass_rate < min_pass_rate."

  - id: cap-01-f06
    tags: [apis, production]
    en:
      front: "TTL & LRU session store"
      back: "Give each session its own bot/history and last_seen; purge now - last_seen >= session_ttl at the start of every request, evict smallest last_seen at max_sessions, and return 404 when missing/expired."
    vi:
      front: "Kho phiên TTL & LRU"
      back: "Cấp cho mỗi phiên bot/lịch sử và last_seen riêng; dọn now - last_seen >= session_ttl ở đầu mỗi request, loại phiên có last_seen nhỏ nhất khi chạm max_sessions và trả 404 khi thiếu hoặc hết hạn."
