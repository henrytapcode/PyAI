tags: [sql, pandas, plotting]
hints:
  en:
    - |
      Follow §4 and §5: in `model_report(df)`, write `df` to an in-memory SQLite table `"requests"` with `df.to_sql("requests", conn, index=False)`, run one `GROUP BY model` query via `pd.read_sql_query`, and close `conn`. In `plot_report(report)`, draw `ax.bar(report["model"].tolist(), report["total_tokens"].tolist())` and return `(fig, ax)`.
    - |
      Step-by-step plan:
      1. Open `conn = sqlite3.connect(":memory:")` and call `df.to_sql("requests", conn, index=False)`.
      2. Run `pd.read_sql_query(...)` with `COUNT(*) AS requests`, `SUM(tokens) AS total_tokens`, `ROUND(AVG(status = 'error'), 3) AS error_rate`, `ROUND(AVG(latency_ms), 1) AS avg_latency`, `ROUND(AVG(rating), 2) AS avg_rating`, `GROUP BY model`, `ORDER BY total_tokens DESC, model ASC`.
      3. Close `conn` and return the report `DataFrame`.
      4. In `plot_report(report)`, create `fig, ax = plt.subplots()`, call `ax.bar(...)`, set title `"Tokens by model"` and ylabel `"tokens"`, and return `(fig, ax)` without calling `plt.show()`.
