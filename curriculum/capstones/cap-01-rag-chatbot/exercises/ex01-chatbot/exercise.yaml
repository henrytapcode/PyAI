id: cap-01-ex01
kind: project
title:
  en: "Build the stateful multi-turn ChatBot"
  vi: "Xây dựng class ChatBot nhiều lượt có trạng thái"
difficulty: 3
tags: [llm, rag]
hints:
  en:
    - |
      Combine history trimming (§3) and follow-up rewriting (§4) inside a stateful `ChatBot` class while pinning the `system` prompt outside `self.history`. For example, after `bot.ask("How much does express delivery cost?")`, calling `bot.ask("What about free shipping?")` sets `rewritten` to `"How much does express delivery cost? What about free shipping?"` and returns `{"answer": "Free shipping applies on orders over 50 dollars. [1]", "sources": ["shipping.md"], "rewritten": "How much does express delivery cost? What about free shipping?"}`.
    - |
      Step-by-step plan:
      1. In `__init__`, store the configuration, call `build_index(docs, client)` once, and set `self.history = []`.
      2. In `ask`, strip `question` and raise `ValueError` if it is empty.
      3. Find the latest `"user"` content in `self.history`; if present and the new question has `<= 4` words, starts with the word `"and"`, or starts with `"what about "` or `"how about "` (case-insensitive), rewrite as `f"{prev_user} {question}"`.
      4. Call `retrieve(self.index, rewritten, self.client, self.k, self.min_score)`. If no hits are returned, set `answer = REFUSAL` and `sources = []` without calling `self.client.chat`.
      5. Otherwise call `self.client.chat` once with `temperature=0.0` and `[system_with_context, *self.history, {"role": "user", "content": rewritten}]`, then extract unique valid `[n]` sources (`1 <= n <= len(hits)`) in appearance order.
      6. Append the original `question` and `answer` to `self.history`, then pop from index `0` while `count_tokens(self.system_prompt) + sum(count_tokens(m["content"]) for m in self.history) > self.max_history_tokens` and `len(self.history) > 2`.
    - |
      Class skeleton:
      ```python
      class ChatBot:
          def __init__(
              self,
              docs,
              client,
              system_prompt=DEFAULT_SYSTEM,
              k=2,
              min_score=0.2,
              max_history_tokens=60,
          ):
              self.client = client
              self.system_prompt = system_prompt
              self.k = k
              self.min_score = min_score
              self.max_history_tokens = max_history_tokens
              self.index = build_index(docs, client)
              self.history = []

          def ask(self, question: str) -> dict:
              question = question.strip()
              if not question:
                  raise ValueError("question must not be empty")
              rewritten = ...  # rewrite using latest user turn in self.history
              hits = retrieve(self.index, rewritten, self.client, self.k, self.min_score)
              if not hits:
                  answer, sources = REFUSAL, []
              else:
                  ...  # call self.client.chat(..., temperature=0.0) and filter valid [n] sources
              self.history.append({"role": "user", "content": question})
              self.history.append({"role": "assistant", "content": answer})
              while (
                  len(self.history) > 2
                  and count_tokens(self.system_prompt)
                  + sum(count_tokens(m["content"]) for m in self.history)
                  > self.max_history_tokens
              ):
                  self.history.pop(0)
              return {"answer": answer, "sources": sources, "rewritten": rewritten}
      ```
  vi:
    - |
      Kết hợp cắt lịch sử theo ngân sách token (§3) và viết lại câu nối tiếp (§4) vào trong một class `ChatBot` có trạng thái, đồng thời ghim `system` prompt bên ngoài `self.history`. Ví dụ, sau `bot.ask("How much does express delivery cost?")`, gọi `bot.ask("What about free shipping?")` sẽ cho `rewritten` là `"How much does express delivery cost? What about free shipping?"` và trả về `{"answer": "Free shipping applies on orders over 50 dollars. [1]", "sources": ["shipping.md"], "rewritten": "How much does express delivery cost? What about free shipping?"}`.
    - |
      Kế hoạch từng bước:
      1. Trong `__init__`, lưu các tham số cấu hình, gọi `build_index(docs, client)` đúng một lần và khởi tạo `self.history = []`.
      2. Trong `ask`, `.strip()` `question` và raise `ValueError` nếu chuỗi sau khi cắt khoảng trắng bị rỗng.
      3. Tìm nội dung `"user"` gần nhất trong `self.history`; nếu có và câu mới có `<= 4` từ, từ đầu tiên (viết thường) là `"and"`, hoặc bắt đầu bằng `"what about "` hay `"how about "`, viết lại thành `f"{prev_user} {question}"`.
      4. Gọi `retrieve(self.index, rewritten, self.client, self.k, self.min_score)`. Nếu không có hit nào, gán `answer = REFUSAL` và `sources = []` mà không gọi `self.client.chat`.
      5. Ngược lại, gọi `self.client.chat` một lần với `temperature=0.0` và `[system_with_context, *self.history, {"role": "user", "content": rewritten}]`, rồi lọc ra các nguồn `[n]` hợp lệ (`1 <= n <= len(hits)`), không trùng, theo thứ tự xuất hiện.
      6. Thêm câu `question` gốc và `answer` vào `self.history`, rồi bỏ phần tử đầu (`pop(0)`) khi `count_tokens(self.system_prompt) + sum(count_tokens(m["content"]) for m in self.history) > self.max_history_tokens` và `len(self.history) > 2`.
    - |
      Khung class:
