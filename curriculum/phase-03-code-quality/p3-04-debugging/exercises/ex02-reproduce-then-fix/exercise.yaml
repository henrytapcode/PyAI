id: p3-04-ex02
kind: debug
title:
  en: "Debug: reproduce, then fix"
  vi: "Sửa lỗi: tái hiện rồi mới sửa"
difficulty: 2
tags: [debugging, testing, lists]
hints:
  en:
    - |
      This is the routine of §3: first **reproduce**, then fix. Try `last_n` by hand with small values of `n` (0, 1, 2) and compare each result with what you expect. Only one non-negative value of `n` gives a wrong answer. What does `-n` become when `n` is `0` (§3)? The smallest input that shows the bug has just one item.
    - |
      The plan:
      1. In `reproduce`, return a tuple `(items, n)` with one item in `items` and the value of `n` that breaks the function.
      2. In `last_n`, `-0` is the same as `0`, so `items[-0:]` is the whole list. Handle `n == 0` before the slice and return an empty list.
      3. A negative `n` makes no sense for "the last n items", so `raise ValueError` for it (the tests expect that).
    - |
      The shape:
      ```python
      def last_n(items, n):
          if n < 0:
              raise ValueError("n must not be negative")
          if n == 0:
              return ...
          return items[-n:]


      def reproduce():
          return [1], ...
      ```
      Replace each `...` with the value that fits.
  vi:
    - |
      Đây là quy trình ở §3: **tái hiện** trước, sửa sau. Hãy tự thử `last_n` bằng tay với các giá trị `n` nhỏ (0, 1, 2) và so sánh từng kết quả với điều bạn mong đợi. Chỉ một giá trị `n` không âm cho đáp án sai. `-n` thành gì khi `n` bằng `0` (§3)? Input nhỏ nhất làm lộ bug chỉ có một phần tử.
    - |
      Kế hoạch:
      1. Trong `reproduce`, trả về một tuple `(items, n)` với một phần tử trong `items` và giá trị `n` làm hỏng hàm.
      2. Trong `last_n`, `-0` bằng `0`, nên `items[-0:]` là cả list. Hãy xử lý `n == 0` trước lát cắt và trả về list rỗng.
      3. `n` âm không có nghĩa với "n phần tử cuối", nên hãy `raise ValueError` cho trường hợp đó (các test mong đợi như vậy).
    - |
      Hình dạng của lời giải:
      ```python
      def last_n(items, n):
          if n < 0:
              raise ValueError("n must not be negative")
          if n == 0:
              return ...
          return items[-n:]


      def reproduce():
          return [1], ...
      ```
      Thay từng `...` bằng giá trị phù hợp.
