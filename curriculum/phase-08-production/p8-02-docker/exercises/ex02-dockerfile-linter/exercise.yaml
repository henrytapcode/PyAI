id: p8-02-ex02
kind: code
title:
  en: "Write: Dockerfile parser and linter"
  vi: "Viết code: trình tách và kiểm lỗi Dockerfile"
difficulty: 2
tags: [production, packaging, strings]
hints:
  en:
    - |
      Extend `parse_dockerfile` from §2 (handling line continuations `\`) and loop over its `(inst, args)` pairs like the two-rule check in §7. For `"FROM python:latest\nCMD uvicorn main:app --host 127.0.0.1"`, `lint(...)` must return `["unpinned-base", "localhost-cmd"]`.
    - |
      The plan:
      1. In `parse_dockerfile`, iterate over lines, skip blank or `#` lines, buffer lines ending with `\` after stripping the trailing backslash, and split each complete line once on whitespace into an uppercase instruction and stripped arguments.
      2. In `lint`, parse the text first, then evaluate the four checks in fixed order (`unpinned-base`, `copy-before-install`, `secret-in-image`, `localhost-cmd`), appending each triggered code at most once.
    - |
      Use this skeleton for the parser and fixed-order checks:
      ```python
      def parse_dockerfile(text: str) -> list[tuple[str, str]]:
          instructions: list[tuple[str, str]] = []
          pending = ""
          for raw in text.splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.endswith("\\"):
                  ...
                  continue
              full = (pending + line).strip()
              pending = ""
              ...
          return instructions


      def lint(text: str) -> list[str]:
          rows = parse_dockerfile(text)
          codes: list[str] = []
          # Check unpinned-base, copy-before-install, secret-in-image, localhost-cmd in order
          ...
          return codes
      ```
  vi:
    - |
      Mở rộng `parse_dockerfile` ở §2 (xử lý thêm dòng nối `\`) rồi duyệt các cặp `(inst, args)` giống đoạn kiểm tra hai lỗi ở §7. Với `"FROM python:latest\nCMD uvicorn main:app --host 127.0.0.1"`, `lint(...)` phải trả về `["unpinned-base", "localhost-cmd"]`.
    - |
      Kế hoạch:
      1. Trong `parse_dockerfile`, duyệt từng dòng của văn bản, bỏ dòng trống hoặc dòng `#`, gom các dòng kết thúc bằng `\` sau khi cắt dấu `\`, rồi tách mỗi lệnh hoàn chỉnh một lần theo khoảng trắng thành tên lệnh viết hoa và phần đối số đã cắt khoảng trắng.
      2. Trong `lint`, tách Dockerfile trước, rồi kiểm tra lần lượt bốn quy tắc theo đúng thứ tự (`unpinned-base`, `copy-before-install`, `secret-in-image`, `localhost-cmd`), mỗi mã vi phạm chỉ thêm tối đa một lần.
    - |
      Dùng bộ khung dưới đây cho bộ tách và hàm kiểm lỗi theo thứ tự cố định:
