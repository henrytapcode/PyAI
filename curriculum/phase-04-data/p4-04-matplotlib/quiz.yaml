  - id: p4-04-f01
    tags: [plotting]
    code: "fig, ax = plt.subplots()"
    en: { front: "In matplotlib, what is the difference between `fig` and `ax`?", back: "`fig` (`Figure`) is the outer canvas; `ax` (`Axes`) is one individual chart inside it with its own x/y axes, title, and plotted artists." }
