      explanation: "Tạo `s` sau khi import `pandas`, xóa dấu phẩy và gọi `pd.to_numeric(..., errors=\"coerce\")`, gọi `dropna()` trước khi ép `\"int64\"`, rồi in `valid.tolist()`."

flashcards:
  - id: p5-05-f01
    tags: [model-evaluation, data-cleaning]
    code: |
      # escalations are logged AFTER resolution -> drop before building X
      X = df[["tokens", "error_count", "hours_since_deploy", "plan_code"]].to_numpy(dtype="float64")
    en:
      front: "What is target leakage, and what symptom gives it away?"
      back: "Target leakage happens when a feature encodes information only known *after* the true label is decided (like `escalated_to_oncall`). Its classic symptom is a suspiciously near-1.0 CV score that collapses in production."
    vi:
      front: "Target leakage là gì, và dấu hiệu nào giúp nhận ra nó?"
      back: "Target leakage xảy ra khi một cột feature chứa thông tin chỉ biết được *sau* khi đáp án đã ngã ngũ (như `escalated_to_oncall`). Dấu hiệu kinh điển là điểm CV cao gần 1.0 bất thường rồi sụp đổ khi chạy thực tế."

  - id: p5-05-f02
    tags: [model-evaluation]
    code: |
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.25, stratify=y, random_state=42
      )
    en:
      front: "What is a holdout set, and how many times should you evaluate on it?"
      back: "A holdout test set is split off before CV, scaling, or threshold tuning and scored **once** at the very end so no test information leaks into model or threshold choices."
    vi:
      front: "Tập holdout là gì, và nên chấm điểm trên nó bao nhiêu lần?"
      back: "Tập holdout test được tách riêng trước khi chạy CV, chuẩn hóa hay chỉnh ngưỡng và chỉ chấm **đúng một lần** ở bước cuối để không làm rò rỉ thông tin test vào lựa chọn mô hình hay ngưỡng."

  - id: p5-05-f03
    tags: [model-evaluation, sklearn]
    code: |
      oof_probs = cross_val_predict(pipe, X_train, y_train, cv=skf, method="predict_proba")[:, 1]
    en:
      front: "How do you tune a decision threshold without touching the test set?"
      back: "Use `cross_val_predict(pipe, X_train, y_train, cv=skf, method=\"predict_proba\")` to obtain out-of-fold probabilities on the training set, pick the threshold that meets your recall/precision goal, and apply it once to `X_test`."
    vi:
      front: "Làm sao chỉnh ngưỡng quyết định mà không chạm vào tập test?"
      back: "Dùng `cross_val_predict(pipe, X_train, y_train, cv=skf, method=\"predict_proba\")` lấy xác suất ngoài-fold trên tập train, chọn ngưỡng đạt mục tiêu recall/precision rồi áp đúng một lần lên `X_test`."

  - id: p5-05-f04
    tags: [model-evaluation, sklearn]
    code: |
      f1_safe = make_scorer(f1_score, zero_division=0)
      scores = cross_val_score(DummyClassifier(strategy="most_frequent"), X_train, y_train, cv=skf, scoring=f1_safe)
    en:
      front: "Why wrap `f1_score` with `make_scorer(f1_score, zero_division=0)` in CV?"
      back: "A majority-class `DummyClassifier` predicts zero positives, which makes `scoring=\"f1\"` emit `UndefinedMetricWarning`; `make_scorer(f1_score, zero_division=0)` returns `0.0` cleanly with no warnings."
    vi:
      front: "Vì sao cần bọc `f1_score` bằng `make_scorer(f1_score, zero_division=0)` trong CV?"
      back: "`DummyClassifier` đoán lớp đa số sẽ không dự đoán ca dương nào nên `scoring=\"f1\"` phát `UndefinedMetricWarning`; dùng `make_scorer(f1_score, zero_division=0)` trả về `0.0` sạch sẽ."

  - id: p5-05-f05
    tags: [model-evaluation]
    en:
      front: "When two models' CV F1 means differ by less than one standard deviation, what should you report?"
      back: "State that the gap is smaller than one fold-to-fold standard deviation (e.g. `0.709 +/- 0.092` vs `0.701 +/- 0.140`), so you cannot claim one model is clearly better on this dataset."
    vi:
      front: "Khi điểm CV F1 trung bình của hai mô hình chênh nhau nhỏ hơn một độ lệch chuẩn, cần báo cáo thế nào?"
      back: "Ghi rõ mức chênh nhỏ hơn một độ lệch chuẩn giữa các fold (ví dụ `0.709 +/- 0.092` so với `0.701 +/- 0.140`), nên không thể khẳng định mô hình nào tốt hơn hẳn trên bộ dữ liệu này."

  - id: p5-05-f06
    tags: [model-evaluation]
    en:
      front: "What four items belong in every honest classifier report?"
      back: "(1) The baseline score on the same metric, (2) test sample size and minority-class count, (3) CV `mean +/- std` (with any close-model warning), and (4) the single final test score at the train-chosen threshold."
    vi:
      front: "Bốn thông tin nào bắt buộc phải có trong một báo cáo phân loại trung thực?"
      back: "(1) Điểm baseline trên cùng metric, (2) cỡ mẫu test và số ca lớp hiếm, (3) `mean +/- std` của CV (kèm cảnh báo nếu hai mô hình sát nhau), và (4) kết quả chấm test một lần ở ngưỡng đã chọn từ tập train."
