  - id: p8-01-q12
    type: output
    tags: [production, apis]
    difficulty: 2
    code: |
      from fastapi import FastAPI
      from fastapi.testclient import TestClient
      from pyai_llm import FakeLLM
      from pydantic import BaseModel

      app = FastAPI()
      llm = FakeLLM(seed=0)


      class ChatIn(BaseModel):
          message: str


      @app.post("/chat")
      def chat(body: ChatIn):
          reply = llm.chat([{"role": "user", "content": body.message}])
          return {"tokens": reply.usage.total_tokens}


      r = TestClient(app).post("/chat", json={"message": "What is RAG?"})
      print(r.status_code, r.json()["tokens"])
    answer: "200 29"
    en:
      prompt: "What does this code print?"
      explanation: "`POST /chat` passes `\"What is RAG?\"` to `FakeLLM(seed=0)`, which reports `29` `total_tokens` (`8` prompt + `21` completion), and FastAPI returns status `200`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`POST /chat` gửi `\"What is RAG?\"` tới `FakeLLM(seed=0)`, trả về `29` `total_tokens` (`8` prompt + `21` completion), còn FastAPI trả mã `200`."

