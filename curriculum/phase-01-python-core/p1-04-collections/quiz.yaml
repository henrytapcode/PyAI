questions:
  - id: p1-04-q01
    type: mcq
    tags: [lists]
    difficulty: 1
    answer: 2
    code: |
      names = ["Lan", "Minh", "Hoa", "Nam"]
      print(names[-1])
    en:
      prompt: "What is printed?"
      options: ["Lan", "Hoa", "Nam", "An error"]
      explanation: "Negative indexes count from the end, so `-1` is the last item."
    vi:
      prompt: "Kết quả in ra là gì?"
      options: ["Lan", "Hoa", "Nam", "Lỗi"]
      explanation: "Chỉ số âm đếm từ cuối lên, nên `-1` là phần tử cuối cùng."

  - id: p1-04-q02
    type: output
    tags: [lists]
    difficulty: 1
    code: |
      nums = [10, 20, 30, 40, 50]
      print(nums[1:3])
    answer: "[20, 30]"
    en:
      prompt: "What does this code print?"
      explanation: "A slice includes the start index (1) but stops before the end index (3), so it takes indexes 1 and 2."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Slice lấy chỉ số bắt đầu (1) nhưng dừng trước chỉ số kết thúc (3), nên chỉ lấy vị trí 1 và 2."

  - id: p1-04-q03
    type: mcq
    tags: [lists]
    difficulty: 2
    answer: 1
    code: |
      scores = [3, 1, 2]
      ordered = sorted(scores)
    en:
      prompt: "After this code, what is `scores`?"
      options: ["[1, 2, 3]", "[3, 1, 2]", "None", "An error"]
      explanation: "`sorted()` returns a new sorted list and leaves the original unchanged."
    vi:
      prompt: "Sau đoạn code này, `scores` là gì?"
      options: ["[1, 2, 3]", "[3, 1, 2]", "None", "Lỗi"]
      explanation: "`sorted()` trả về một list mới đã sắp xếp và không thay đổi list gốc."

  - id: p1-04-q04
    type: fill
    tags: [dicts]
    difficulty: 1
    code: |
      ages = {"Lan": 21}
      print(ages.___("Minh", 0))  # 0
    answer: ["get"]
    en:
      prompt: "Fill in the blank so it prints 0 instead of crashing."
      explanation: "`.get(key, default)` returns the default when the key is missing; `ages[\"Minh\"]` would raise `KeyError`."
    vi:
      prompt: "Điền vào chỗ trống để in ra 0 thay vì bị lỗi."
      explanation: "`.get(key, default)` trả về giá trị mặc định khi key không tồn tại; `ages[\"Minh\"]` sẽ báo `KeyError`."

  - id: p1-04-q05
    type: output
    tags: [dicts, loops]
    difficulty: 2
    code: |
      d = {"a": 1, "b": 2}
      d["c"] = 3
      d["a"] = 10
      total = 0
      for key, value in d.items():
          total = total + value
      print(total)
    answer: "15"
    en:
      prompt: "What does this code print?"
      explanation: "After the changes d is {'a': 10, 'b': 2, 'c': 3}. The loop adds the values: 10 + 2 + 3 = 15."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Sau khi sửa, d là {'a': 10, 'b': 2, 'c': 3}. Vòng lặp cộng các value: 10 + 2 + 3 = 15."

  - id: p1-04-q06
    type: parsons
    tags: [dicts, loops]
    difficulty: 2
    lines:
      - "counts = {}"
      - "for word in [\"hi\", \"ai\", \"hi\"]:"
      - "    counts[word] = counts.get(word, 0) + 1"
      - "print(counts)"
    en:
      prompt: "Put the lines in order so the program prints `{'hi': 2, 'ai': 1}`."
      explanation: "Create the empty dict first, then loop over the words and update the counts, and print once the loop is done."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `{'hi': 2, 'ai': 1}`."
      explanation: "Tạo dict rỗng trước, rồi lặp qua các từ và cập nhật số đếm, cuối cùng in sau khi vòng lặp kết thúc."

  - id: p1-04-q07
    type: mcq
    tags: [dicts]
    difficulty: 2
    answer: 3
    code: |
      d = {"x": 1}
      print(d["y"])
    en:
      prompt: "What happens when this code runs?"
      options: ["It prints 0", "It prints None", "It prints 1", "It crashes with KeyError"]
      explanation: "Reading a missing key with `[]` raises `KeyError`. Only `.get()` returns a default instead."
    vi:
      prompt: "Điều gì xảy ra khi chạy đoạn code này?"
      options: ["In ra 0", "In ra None", "In ra 1", "Báo lỗi KeyError"]
      explanation: "Đọc key không tồn tại bằng `[]` sẽ báo `KeyError`. Chỉ `.get()` mới trả về giá trị mặc định."

  - id: p1-04-q08
    type: fill
    tags: [lists, loops]
    difficulty: 2
    code: |
      scores = [4, 8, 6]
      best = scores[0]
      for s in scores:
          if s ___ best:
              best = s
      print(best)  # 8
    answer: [[">", ">="]]
    en:
      prompt: "Fill in the blank so the code finds the largest score."
      explanation: "Whenever a score is greater than the best so far, it becomes the new best. (`>=` also works here, it just replaces `best` with an equal value; `>` is the usual choice.)"
    vi:
      prompt: "Điền vào chỗ trống để code tìm ra điểm lớn nhất."
      explanation: "Mỗi khi một điểm lớn hơn điểm tốt nhất hiện có, nó trở thành điểm tốt nhất mới."

  - id: p1-04-q09
    type: mcq
    tags: [lists]
    difficulty: 1
    answer: 1
    en:
      prompt: "How do you add 5 to the end of the list `nums`?"
      options: ["`nums.add(5)`", "`nums.append(5)`", "`nums.push(5)`", "`nums.insert(5)`"]
      explanation: "`append` is the list method that adds one item to the end. `add` and `push` do not exist for lists, and `insert` is a different method that does not fit here."
    vi:
      prompt: "Làm sao thêm số 5 vào cuối list `nums`?"
      options: ["`nums.add(5)`", "`nums.append(5)`", "`nums.push(5)`", "`nums.insert(5)`"]
      explanation: "`append` là method của list để thêm một phần tử vào cuối. `add` và `push` không có ở list, còn `insert` là một method khác, không phù hợp ở đây."

  - id: p1-04-q10
    type: output
    tags: [lists]
    difficulty: 1
    code: |
      words = ["a", "b", "c"]
      print("b" in words, "z" in words)
    answer: "True False"
    en:
      prompt: "What does this code print?"
      explanation: "`in` checks whether a value is somewhere in the list. `\"b\"` is there, `\"z\"` is not."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`in` kiểm tra xem một giá trị có nằm đâu đó trong list không. `\"b\"` có trong list, `\"z\"` thì không."

  - id: p1-04-q11
    type: fill
    tags: [lists]
    difficulty: 2
    code: |
      nums = [3, 1, 2]
      print(sorted(nums) ___ [1, 2, 3])
    answer: [["==", ">=", "<="]]
    en:
      prompt: "Fill in the operator so the code prints `True`."
      explanation: "`sorted(nums)` returns the new list `[1, 2, 3]`. `==` compares the contents of two lists, and they are equal, so it prints `True`. (`>=` and `<=` also print `True` for equal lists, but `==` is the one that means \"are they equal?\".)"
    vi:
      prompt: "Điền toán tử vào chỗ trống để code in ra `True`."
      explanation: "`sorted(nums)` trả về list mới `[1, 2, 3]`. `==` so sánh nội dung hai list, và hai list bằng nhau nên in ra `True`. (`>=` và `<=` cũng in `True` với hai list bằng nhau, nhưng `==` mới là toán tử có nghĩa \"chúng có bằng nhau không?\".)"

  - id: p1-04-q12
    type: parsons
    tags: [lists]
    difficulty: 2
    lines:
      - "scores = [5, 9, 7]"
      - "ranked = sorted(scores)"
      - "best = ranked[-1]"
      - "print(best)"
    en:
      prompt: "Put the lines in order so the program prints `9`."
      explanation: "Each line uses the variable made by the line above: `ranked` needs `scores`, and `best` needs `ranked`. Reading `scores[-1]` without sorting would print 7."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `9`."
      explanation: "Mỗi dòng dùng biến do dòng trên tạo ra: `ranked` cần `scores`, còn `best` cần `ranked`. Nếu lấy `scores[-1]` mà không sắp xếp thì sẽ in ra 7."

  - id: p1-04-q13
    type: mcq
    tags: [lists]
    difficulty: 3
    answer: 1
    code: |
      a = [1, 2]
      b = a
      b.append(3)
    en:
      prompt: "After this code runs, what is `a`?"
      options: ["`[1, 2]`", "`[1, 2, 3]`", "`[3]`", "An error"]
      explanation: "`b = a` does not copy the list. Both names point to the same list, so `append` through `b` also changes what `a` sees. Write `b = a[:]` for an independent copy."
    vi:
      prompt: "Sau khi chạy đoạn code này, `a` là gì?"
      options: ["`[1, 2]`", "`[1, 2, 3]`", "`[3]`", "Lỗi"]
      explanation: "`b = a` không sao chép list. Cả hai tên cùng trỏ đến một list, nên `append` qua `b` cũng làm thay đổi những gì `a` thấy. Muốn có bản sao độc lập, hãy viết `b = a[:]`."

  - id: p1-04-q14
    type: output
    tags: [lists]
    difficulty: 3
    code: |
      items = [3, 1, 2]
      result = items.sort()
      print(result, items)
    answer: "None [1, 2, 3]"
    en:
      prompt: "What does this code print?"
      explanation: "`list.sort()` sorts the list in place and returns `None`. `sorted(items)` would return a new list instead. So `result = items.sort()` stores `None`, not the sorted list."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`list.sort()` sắp xếp list ngay tại chỗ và trả về `None`. `sorted(items)` thì trả về list mới. Vì vậy `result = items.sort()` lưu `None`, không phải list đã sắp xếp."

  - id: p1-04-q15
    type: mcq
    tags: [dicts, loops]
    difficulty: 3
    answer: 1
    en:
      prompt: "Which line adds 1 to `counts[word]` when `word` is not in the dict yet?"
      options: ["`counts[word] += 1`", "`counts[word] = counts.get(word, 0) + 1`", "`counts.get(word) += 1`", "`counts[word] = counts.get(word) + 1`"]
      explanation: "`counts[word] += 1` reads the missing key first, so it raises `KeyError`. `.get(word)` with no default returns `None`, and `None + 1` fails. `counts.get(word) += 1` is not even valid Python (a `SyntaxError`), because you cannot assign to a function call. `.get(word, 0)` supplies the starting count."
    vi:
      prompt: "Dòng nào cộng 1 vào `counts[word]` khi `word` chưa có trong dict?"
      options: ["`counts[word] += 1`", "`counts[word] = counts.get(word, 0) + 1`", "`counts.get(word) += 1`", "`counts[word] = counts.get(word) + 1`"]
      explanation: "`counts[word] += 1` đọc key chưa có trước nên báo `KeyError`. `.get(word)` không có giá trị mặc định sẽ trả về `None`, và `None + 1` bị lỗi. `counts.get(word) += 1` thậm chí không hợp lệ (gây `SyntaxError`), vì không thể gán giá trị cho một lời gọi hàm. `.get(word, 0)` cung cấp số đếm bắt đầu."

  - id: p1-04-q16
    type: parsons
    tags: [dicts, loops]
    difficulty: 3
    lines:
      - 'rows = [("Minh", 7), ("Lan", 9), ("Hoa", 8)]'
      - 'best_name, best_score = rows[0]'
      - 'for name, score in rows:'
      - '    if score > best_score:'
      - '        best_name, best_score = name, score'
      - 'print(best_name)'
    en:
      prompt: "Put the lines in order so the program prints `Lan`."
      explanation: "The best starts as the first row, the loop compares each score with it, and only then is the result printed. Every line needs the one before it, and the `if` must sit inside the loop."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `Lan`."
      explanation: "Người đứng đầu ban đầu là dòng đầu tiên, vòng lặp so sánh từng điểm với nó, rồi mới in kết quả. Mỗi dòng cần dòng đứng trước, và `if` phải nằm trong vòng lặp."

flashcards:
  - id: p1-04-f01
    tags: [lists]
    code: 'names = ["Lan", "Minh", "Hoa"]'
    en: { front: "What are `names[0]` and `names[-1]`?", back: "`names[0]` is the first item (\"Lan\"), `names[-1]` is the last (\"Hoa\"). Indexes start at 0." }
    vi: { front: "`names[0]` và `names[-1]` là gì?", back: "`names[0]` là phần tử đầu (\"Lan\"), `names[-1]` là phần tử cuối (\"Hoa\"). Chỉ số bắt đầu từ 0." }
  - id: p1-04-f02
    tags: [lists]
    en: { front: "What does the slice `items[1:3]` return?", back: "Items at index 1 and 2. The start is included, the stop is not." }
    vi: { front: "Slice `items[1:3]` trả về gì?", back: "Các phần tử ở chỉ số 1 và 2. Lấy điểm bắt đầu, không lấy điểm dừng." }
  - id: p1-04-f03
    tags: [lists]
    en: { front: "`sorted(x)` vs sorting in place?", back: "`sorted(x)` returns a new sorted list and leaves `x` unchanged. `x.sort()` sorts `x` itself and returns `None`." }
    vi: { front: "`sorted(x)` khác sắp xếp tại chỗ thế nào?", back: "`sorted(x)` trả về một list mới đã sắp xếp và không thay đổi `x`. `x.sort()` sắp xếp chính `x` và trả về `None`." }
  - id: p1-04-f04
    tags: [dicts]
    en: { front: "`d[key]` vs `d.get(key, 0)`?", back: "`d[key]` raises `KeyError` if the key is missing. `d.get(key, 0)` returns 0 instead." }
    vi: { front: "`d[key]` khác `d.get(key, 0)` thế nào?", back: "`d[key]` báo `KeyError` nếu thiếu key. `d.get(key, 0)` trả về 0 thay vào đó." }
  - id: p1-04-f05
    tags: [dicts, loops]
    code: 'for k, v in d.items():'
    en: { front: "How do you loop over a dict's keys and values together?", back: "`for key, value in d.items():`" }
    vi: { front: "Làm sao lặp qua cả key và value của dict?", back: "`for key, value in d.items():`" }
  - id: p1-04-f06
    tags: [lists]
    code: |
      a = [1, 2]
      b = a
    en: { front: "After `b = a` with lists, what happens when you change `b`?", back: "`a` changes too: both names point to the same list. Use `b = a[:]` for an independent copy." }
    vi: { front: "Với list, sau `b = a` thì điều gì xảy ra khi đổi `b`?", back: "`a` cũng đổi: hai tên cùng trỏ đến một list. Dùng `b = a[:]` để có bản sao độc lập." }
