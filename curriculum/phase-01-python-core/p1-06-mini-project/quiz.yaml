questions:
  - id: p1-06-q01
    type: mcq
    tags: [dicts]
    difficulty: 1
    answer: 2
    code: |
      student = {"name": "An", "scores": [8, 7.5, 9]}
    en:
      prompt: "Which expression gives the number `7.5`?"
      options: ["student[1]", "student.scores[1]", "student[\"scores\"][1]", "student[\"scores\", 1]"]
      explanation: "Look up the key `\"scores\"` in the dict to get the list, then take index 1 of the list."
    vi:
      prompt: "Biểu thức nào cho ra số `7.5`?"
      options: ["student[1]", "student.scores[1]", "student[\"scores\"][1]", "student[\"scores\", 1]"]
      explanation: "Tra khóa `\"scores\"` trong dict để lấy list, rồi lấy phần tử ở chỉ số 1 của list."

  - id: p1-06-q02
    type: output
    tags: [functions, lists]
    difficulty: 1
    code: |
      def average(scores):
          if not scores:
              return 0.0
          return sum(scores) / len(scores)

      print(average([6, 8]), average([]))
    answer: "7.0 0.0"
    en:
      prompt: "What does this code print?"
      explanation: "`sum([6, 8]) / 2` is `7.0` (division always gives a float). The empty list hits the early return, giving `0.0`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`sum([6, 8]) / 2` là `7.0` (phép chia luôn cho float). List rỗng chạm vào `return` sớm nên cho `0.0`."

  - id: p1-06-q03
    type: mcq
    tags: [conditions]
    difficulty: 2
    answer: 1
    code: |
      def letter_grade(avg):
          if avg >= 5.5:
              return "C"
          if avg >= 7:
              return "B"
          return "F"
    en:
      prompt: "What does `letter_grade(9)` return?"
      options: ["\"B\"", "\"C\"", "\"F\"", "\"A\""]
      explanation: "The first condition `avg >= 5.5` is already true for 9, so it returns `\"C\"` and never reaches the `B` check. Order the checks from the highest threshold down."
    vi:
      prompt: "`letter_grade(9)` trả về gì?"
      options: ["\"B\"", "\"C\"", "\"F\"", "\"A\""]
      explanation: "Điều kiện đầu `avg >= 5.5` đã đúng với 9 nên hàm trả về `\"C\"` và không bao giờ tới phép kiểm tra `B`. Hãy kiểm tra từ ngưỡng cao nhất xuống."

  - id: p1-06-q04
    type: fill
    tags: [loops, dicts]
    difficulty: 2
    code: |
      grades = ["B", "A", "B"]
      counts = {"A": 0, "B": 0}
      for grade in ___:
          counts[grade] ___ 1
      print(counts)
    answer: ["grades", ["+=", "+= "]]
    en:
      prompt: "Fill in the blanks so the code counts each grade and prints `{'A': 1, 'B': 2}`."
      explanation: "Loop over `grades`, and for each one add 1 to its counter with `+=`."
    vi:
      prompt: "Điền vào chỗ trống để code đếm từng loại điểm và in ra `{'A': 1, 'B': 2}`."
      explanation: "Duyệt qua `grades`, và với mỗi phần tử cộng 1 vào bộ đếm của nó bằng `+=`."

  - id: p1-06-q05
    type: parsons
    tags: [functions, loops]
    difficulty: 2
    lines:
      - "def total(scores):"
      - "    result = 0"
      - "    for score in scores:"
      - "        result += score"
      - "    return result"
      - "print(total([8, 7.5, 9]))"
    en:
      prompt: "Put the lines in order to define `total` and print `24.5`."
      explanation: "Define the function header, start the accumulator, loop and add, then `return` after the loop (dedented). Call it last."
    vi:
      prompt: "Sắp xếp các dòng để định nghĩa `total` và in ra `24.5`."
      explanation: "Viết dòng khai báo hàm, khởi tạo biến cộng dồn, lặp và cộng, rồi `return` sau vòng lặp (thụt lề ra ngoài). Gọi hàm ở cuối."

  - id: p1-06-q06
    type: output
    tags: [lists, functions]
    difficulty: 2
    code: |
      def by_length(word):
          return len(word)

      print(sorted(["pear", "fig", "banana"], key=by_length))
    answer: "['fig', 'pear', 'banana']"
    en:
      prompt: "What does this code print?"
      explanation: "`sorted` calls `by_length` on each word and sorts by the result: 3, 4, 6. The original strings are what end up in the list."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`sorted` gọi `by_length` trên từng từ và sắp xếp theo kết quả: 3, 4, 6. Trong list vẫn là các chuỗi gốc."

  - id: p1-06-q07
    type: mcq
    tags: [functions]
    difficulty: 2
    answer: 0
    code: |
      def double(x):
          print(x * 2)

      result = double(4)
    en:
      prompt: "What is the value of `result`?"
      options: ["None", "8", "4", "An error"]
      explanation: "`double` prints 8 but has no `return`, so it returns `None`. In the project, `return` the answer so other code can use it."
    vi:
      prompt: "Giá trị của `result` là gì?"
      options: ["None", "8", "4", "Lỗi"]
      explanation: "`double` in ra 8 nhưng không có `return`, nên trả về `None`. Trong project, hãy `return` kết quả để code khác dùng được."

  - id: p1-06-q08
    type: mcq
    tags: [strings, conversion]
    difficulty: 1
    answer: 3
    code: |
      avg = 8.1666
      print(f"{avg:.2f}")
    en:
      prompt: "What is printed?"
      options: ["8.1666", "8", "8.1", "8.17"]
      explanation: "`:.2f` formats a float with exactly 2 decimals, rounding the last digit."
    vi:
      prompt: "Kết quả in ra là gì?"
      options: ["8.1666", "8", "8.1", "8.17"]
      explanation: "`:.2f` định dạng float với đúng 2 chữ số thập phân, có làm tròn chữ số cuối."

  - id: p1-06-q09
    type: mcq
    tags: [lists, functions]
    difficulty: 1
    answer: 2
    code: |
      def by_name(s):
          return s["name"]
    en:
      prompt: "Which call sorts the list `students` (a list of dicts) by `by_name`?"
      options: ["`sorted(students, by_name)`", "`students.key(by_name)`", "`sorted(students, key=by_name)`", "`sorted(students, key=by_name())`"]
      explanation: "`key=` must be named and takes the function itself, without parentheses. `by_name()` calls the function at once with no student, and `sorted(students, by_name)` is an error because the second argument must be named `key`."
    vi:
      prompt: "Lời gọi nào sắp xếp list `students` (list các dict) theo `by_name`?"
      options: ["`sorted(students, by_name)`", "`students.key(by_name)`", "`sorted(students, key=by_name)`", "`sorted(students, key=by_name())`"]
      explanation: "`key=` phải được ghi tên và nhận chính hàm đó, không có ngoặc. `by_name()` gọi hàm ngay lập tức mà không có student, còn `sorted(students, by_name)` bị lỗi vì đối số thứ hai phải được gọi là `key`."

  - id: p1-06-q10
    type: output
    tags: [dicts]
    difficulty: 1
    code: |
      letters = {"A": 0, "B": 0}
      letters["B"] += 2
      print(letters)
    answer: "{'A': 0, 'B': 2}"
    en:
      prompt: "What does this code print?"
      explanation: "`letters[\"B\"] += 2` reads the current value (0), adds 2, and stores the result. Only that one key changes."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`letters[\"B\"] += 2` đọc giá trị hiện tại (0), cộng 2 rồi lưu lại. Chỉ key đó thay đổi."

  - id: p1-06-q11
    type: parsons
    tags: [functions, lists]
    difficulty: 2
    lines:
      - "scores = [8, 7.5, 9]"
      - "total = sum(scores)"
      - "avg = total / len(scores)"
      - 'print(f"{avg:.2f}")'
    en:
      prompt: "Put the lines in order so the program prints `8.17`."
      explanation: "Each line uses the variable from the line above: `total` needs `scores`, `avg` needs `total`, and the print needs `avg`. Formatting happens last, on the finished number."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `8.17`."
      explanation: "Mỗi dòng dùng biến của dòng trên: `total` cần `scores`, `avg` cần `total`, và lệnh in cần `avg`. Định dạng làm ở bước cuối, trên số đã tính xong."

  - id: p1-06-q12
    type: fill
    tags: [lists, functions]
    difficulty: 2
    code: |
      def by_avg(row):
          return row["avg"]

      rows = [{"name": "Zoe", "avg": 7.0}, {"name": "An", "avg": 9.0}]
      print(sorted(rows, ___=by_avg)[0]["name"])
    answer: ["key"]
    en:
      prompt: "Fill in the keyword so the code prints `Zoe`."
      explanation: "`key=` tells `sorted` which value to compare. Without it, Python tries to compare two dicts directly and fails with `TypeError`."
    vi:
      prompt: "Điền tên từ khóa để code in ra `Zoe`."
      explanation: "`key=` cho `sorted` biết giá trị nào dùng để so sánh. Không có nó, Python cố so sánh trực tiếp hai dict và báo `TypeError`."

  - id: p1-06-q13
    type: output
    tags: [conversion]
    difficulty: 3
    code: |
      print(round(2.5), round(3.5))
    answer: "2 4"
    en:
      prompt: "What does this code print?"
      explanation: "`round()` sends an exact half to the nearest even whole number (banker's rounding), so 2.5 becomes 2 and 3.5 becomes 4. Do not assume it always rounds .5 up."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`round()` làm tròn các số đúng giữa (.5) về số nguyên chẵn gần nhất (kiểu làm tròn banker), nên 2.5 thành 2 và 3.5 thành 4. Đừng nghĩ rằng nó luôn làm tròn .5 lên."

  - id: p1-06-q14
    type: mcq
    tags: [lists, functions]
    difficulty: 3
    answer: 1
    en:
      prompt: "Which key puts the highest `avg` first, and sorts equal averages by `name` from A to Z?"
      options: ['`row["avg"]`', '`(-row["avg"], row["name"])`', '`(row["name"], -row["avg"])`', '`(row["avg"], -row["name"])`']
      explanation: "Negating `avg` flips the order, so the highest comes first. Tuples compare the first value and use the second only on a tie. `(name, -avg)` sorts by name first, and negating a string raises `TypeError`."
    vi:
      prompt: "Key nào đưa `avg` cao nhất lên đầu, và xếp các điểm bằng nhau theo `name` từ A đến Z?"
      options: ['`row["avg"]`', '`(-row["avg"], row["name"])`', '`(row["name"], -row["avg"])`', '`(row["avg"], -row["name"])`']
      explanation: "Đổi dấu `avg` làm đảo thứ tự nên điểm cao nhất lên trước. Tuple so sánh giá trị đầu và chỉ dùng giá trị thứ hai khi bằng nhau. `(name, -avg)` xếp theo tên trước, còn đổi dấu một chuỗi gây `TypeError`."

  - id: p1-06-q15
    type: mcq
    tags: [functions, conditions]
    difficulty: 3
    answer: 2
    en:
      prompt: "Which change makes `average([])` return `0.0` instead of crashing?"
      options: ["Wrap the division in `print(...)`", "Change `/` to `//`", "Add `if not scores: return 0.0` at the top", "Add `if scores == None: return 0.0` at the top"]
      explanation: "`[]` counts as false, so `if not scores` catches it before the division. `print` does not stop the division by zero and returns `None`, `//` still divides by zero, and `[]` is not `None`, so `== None` never matches."
    vi:
      prompt: "Thay đổi nào làm `average([])` trả về `0.0` thay vì bị lỗi?"
      options: ["Bọc phép chia trong `print(...)`", "Đổi `/` thành `//`", "Thêm `if not scores: return 0.0` ở đầu hàm", "Thêm `if scores == None: return 0.0` ở đầu hàm"]
      explanation: "`[]` được coi là False, nên `if not scores` bắt được trước khi chia. `print` không ngăn lỗi chia cho 0 và trả về `None`, `//` vẫn chia cho 0, còn `[]` không phải `None` nên `== None` không khớp."

  - id: p1-06-q16
    type: parsons
    tags: [functions, loops, lists]
    difficulty: 3
    lines:
      - "def best_name(students):"
      - '    best = students[0]'
      - "    for student in students:"
      - '        if student["avg"] > best["avg"]:'
      - "            best = student"
      - '    return best["name"]'
      - 'print(best_name([{"name": "An", "avg": 8.2}, {"name": "Binh", "avg": 9.0}, {"name": "Chi", "avg": 6.5}]))'
    en:
      prompt: "Put the lines in order so the program prints `Binh`."
      explanation: "The function must be defined before it is called. `best` must be set before the loop compares with it, and `return` must come after the loop, or the function stops at the first student."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `Binh`."
      explanation: "Hàm phải được định nghĩa trước khi gọi. `best` phải được gán trước khi vòng lặp so sánh với nó, và `return` phải đứng sau vòng lặp, nếu không hàm sẽ dừng ở học sinh đầu tiên."

flashcards:
  - id: p1-06-f01
    tags: [dicts]
    code: 'student = {"name": "An", "scores": [8, 9]}'
    en: { front: "How do you read the scores list from this dict?", back: "`student[\"scores\"]`. Use the key in square brackets." }
    vi: { front: "Đọc list điểm từ dict này thế nào?", back: "`student[\"scores\"]`. Dùng khóa trong ngoặc vuông." }
  - id: p1-06-f02
    tags: [functions]
    en: { front: "`return` vs `print` in a function?", back: "`return` hands a value back to the caller. `print` only shows text and the function returns `None`." }
    vi: { front: "`return` khác `print` trong hàm thế nào?", back: "`return` trả giá trị về cho nơi gọi. `print` chỉ hiện chữ và hàm trả về `None`." }
  - id: p1-06-f03
    tags: [conditions]
    en: { front: "How do you order `if` checks for grade thresholds?", back: "From the highest threshold down. The first true condition wins, so each check needs one comparison." }
    vi: { front: "Sắp xếp các `if` cho ngưỡng xếp loại thế nào?", back: "Từ ngưỡng cao nhất xuống thấp. Điều kiện đúng đầu tiên thắng, nên mỗi lần chỉ cần một phép so sánh." }
  - id: p1-06-f04
    tags: [lists]
    code: |
      def sort_key(row):
          return (-row["avg"], row["name"])
    en: { front: "What order does `sorted(rows, key=sort_key)` give?", back: "Highest `avg` first; rows with an equal `avg` are ordered by `name` (A to Z). Tuples are compared one value at a time." }
    vi: { front: "`sorted(rows, key=sort_key)` cho thứ tự nào?", back: "`avg` cao nhất đứng trước; các dòng bằng `avg` được xếp theo `name` (A đến Z). Tuple được so sánh từng giá trị một." }
  - id: p1-06-f05
    tags: [functions, conditions]
    en: { front: "Why guard `sum(xs) / len(xs)` for an empty list?", back: "`len([])` is 0, so the division raises `ZeroDivisionError`. Check `if not xs:` first and return a safe value." }
    vi: { front: "Vì sao phải kiểm tra list rỗng trước `sum(xs) / len(xs)`?", back: "`len([])` bằng 0 nên phép chia gây `ZeroDivisionError`. Kiểm tra `if not xs:` trước và trả về giá trị an toàn." }
  - id: p1-06-f06
    tags: [conversion]
    en: { front: "Does `round()` always round `.5` up?", back: "No. Exact halves go to the nearest even whole number: `round(2.5)` is 2 and `round(3.5)` is 4. Use `:.2f` only to format for display." }
    vi: { front: "`round()` có luôn làm tròn `.5` lên không?", back: "Không. Số đúng giữa được làm tròn về số nguyên chẵn gần nhất: `round(2.5)` là 2 và `round(3.5)` là 4. Chỉ dùng `:.2f` để hiển thị." }
