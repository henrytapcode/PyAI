    vi: { front: "Nên chuẩn hóa các nhãn lộn xộn khi nào so với bước `groupby` hoặc `drop_duplicates`?", back: "Hãy cắt khoảng trắng, chuyển chữ thường và thống nhất dấu nối (`_ -> -`) **trước** khi loại trùng hay gom nhóm để các biến thể như `\" GPT-4o\"` và `\"gpt_4o\"` gộp đúng thành một." }
  - id: p4-06-f02
    tags: [data-cleaning, pandas]
    code: |
      df["tokens"] = pd.to_numeric(df["tokens"].astype(str).str.replace(",", "", regex=False), errors="coerce")
      df = df.dropna(subset=["tokens"]).reset_index(drop=True)
