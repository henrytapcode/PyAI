  - id: p4-02-q10
    type: mcq
    tags: [pandas]
    difficulty: 2
    answer: 0
    en:
      prompt: "What does calling `.reset_index(drop=True)` after filtering and sorting a DataFrame do?"
      options:
        - "Renumbers the row index to `0, 1, 2, ...` and discards the old index labels"
        - "Deletes the first column of the DataFrame"
        - "Sorts the DataFrame rows back into their original order"
        - "Removes duplicate rows from the DataFrame"
      explanation: "`.reset_index(drop=True)` builds a clean `0, 1, 2, ...` index and uses `drop=True` so the old index is thrown away instead of becoming a new column."
    vi:
      prompt: "Gọi `.reset_index(drop=True)` sau khi lọc và sắp xếp DataFrame có tác dụng gì?"
      options:
        - "Đánh lại index hàng thành `0, 1, 2, ...` và bỏ luôn nhãn index cũ"
        - "Xóa cột đầu tiên của DataFrame"
        - "Sắp xếp lại các hàng DataFrame về thứ tự ban đầu"
        - "Loại bỏ các hàng bị trùng lặp khỏi DataFrame"
      explanation: "`.reset_index(drop=True)` tạo lại index sạch từ `0, 1, 2, ...` và dùng `drop=True` để bỏ index cũ thay vì thêm nó thành một cột mới."

