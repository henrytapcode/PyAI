tags: [model-evaluation, sklearn]
hints:
  en:
    - |
      Follow §4 and §6: in `evaluate_models(X, y, seed)`, run 5-fold `StratifiedKFold(n_splits=5, shuffle=True, random_state=seed)` on `"baseline"`, `"logreg"`, and `"tree"` using `make_scorer(f1_score, zero_division=0)`. In `write_report(results, n_test)`, format one line per model, find the best non-baseline model, append `"test size: <n_test>"`, and add the warning line if the top two non-baseline models are within one `std`.
      For `{"baseline": (0.0, 0.0), "logreg": (0.709, 0.092), "tree": (0.701, 0.14)}`, `write_report(..., 58)` returns 6 lines ending with `"warning: logreg and tree differ by less than one std"`.
    - |
      Step-by-step plan:
      1. In `evaluate_models`, create a 5-fold stratified splitter seeded with `seed` and a zero-division-safe F1 scorer.
      2. Loop over the three named models (`"baseline"`, `"logreg"`, `"tree"`), compute `cross_val_score`, and store `(mean, std)` rounded to 3 decimals as plain Python floats.
      3. In `write_report`, filter out `"baseline"` to collect all non-baseline models; raise `ValueError` if none exist.
      4. Build the output list with one formatted F1 line per model in `results` order, then `"best: <name>"` (highest mean, alphabetical tie-breaker), then `"test size: <n_test>"`.
      5. If at least two non-baseline models exist, sort them by descending mean (alphabetical tie-breaker) and append the warning line whenever their mean gap is strictly less than the larger of their two standard deviations.
    - |
