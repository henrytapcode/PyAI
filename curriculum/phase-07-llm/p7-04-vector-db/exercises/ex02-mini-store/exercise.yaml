  vi:
    - |
      Bài này kết hợp `VectorStore` ở §2, lọc trước metadata ở §3 và `delete()` cùng upsert ở §4. Khi thêm `["c1"]`, `["cheap car rental"]` rồi ghi đè `"c1"` bằng `["fast laptop repair"]`, `len(store)` vẫn là `1`; tìm kiếm với `where={"lang": ["en", "vi"]}` lọc theo tập giá trị hợp lệ.
    - |
      Kế hoạch:
      1. Lưu các danh sách song song cho ID, văn bản và metadata cùng một tập ID đã thấy và ma trận NumPy khởi đầu rỗng.
      2. Trong `add`, kiểm tra độ dài bằng nhau và từ chối ID trùng ngay trong cùng lô; gọi `embed` một lần cho cả lô văn bản, ghi đè tại chỗ các ID đã có và chỉ nối thêm bản ghi mới vào danh sách lẫn ma trận.
      3. Trong `search`, trả về danh sách rỗng ngay nếu kho rỗng hoặc giới hạn không dương; lọc các chỉ số thỏa `where` (kiểm tra khóa tồn tại trong metadata rồi khớp phần tử hoặc nằm trong danh sách), sau đó nhân hàng đã lọc với vector câu hỏi, sắp xếp giảm dần ổn định và làm tròn ba chữ số thập phân.
      4. Trong `delete`, báo lỗi khóa nếu thiếu ID; ngược lại xóa mục khỏi mọi danh sách song song và bỏ hàng tương ứng khỏi ma trận.
    - |
