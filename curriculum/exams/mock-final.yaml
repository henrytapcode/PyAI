id: mock-final
kind: mock
title:
  en: "Mock exam: Final full-stack Python & AI"
  vi: "Thi thử: Tổng hợp Python & AI"
description:
  en: "40 interview-style questions across Phases 1–8, weighted toward Deep Learning, LLMs, RAG, Agents, and Production AI systems. Aim for 80% or more."
  vi: "40 câu hỏi kiểu phỏng vấn xuyên suốt Phase 1–8, tập trung nhiều vào Deep Learning, LLM, RAG, Agent và hệ thống AI Production. Mục tiêu từ 80% trở lên."
duration_min: 60
pass_score: 0.8
questions:
  # ---- P1-P3: Python fundamentals, data structures, OOP, testing (8 questions)
  - id: final-q01
    type: output
    tags: [lists, scope]
    difficulty: 2
    code: |
      grid = [[0] * 2] * 2
      grid[0][1] = 7
      print(grid)
    answer: "[[0, 7], [0, 7]]"
    en:
      prompt: "What does this list-multiplication snippet print?"
      explanation: "`[[0] * 2] * 2` repeats references to the exact same inner list object, so mutating `grid[0][1]` also updates `grid[1][1]`. Use `[[0] * 2 for _ in range(2)]` when you need independent rows."
    vi:
      prompt: "Đoạn code nhân list này in ra gì?"
      explanation: "`[[0] * 2] * 2` lặp lại tham chiếu đến cùng một list con duy nhất, nên sửa `grid[0][1]` cũng làm thay đổi `grid[1][1]`. Hãy dùng `[[0] * 2 for _ in range(2)]` khi bạn cần các hàng độc lập."

  - id: final-q02
    type: mcq
    tags: [dicts, exceptions]
    difficulty: 2
    answer: 2
    code: |
      counts = {}
      for tag in ["rag", "llm", "rag"]:
          counts[tag] = counts.___(tag, 0) + 1
    en:
      prompt: "Which dict method safely returns `0` when `tag` is missing without mutating `counts` during the lookup?"
      options:
        - "Call `counts.pop(tag, 0)` to read the current count"
        - "Call `counts.setdefault(tag, 0)` before adding one"
        - "Call `counts.get(tag, 0)` to supply a default value"
        - "Call `counts.keys(tag, 0)` to check key membership"
      explanation: "`dict.get(key, default)` returns `default` when `key` is absent without modifying the dictionary or raising `KeyError`. `pop` removes existing keys, `setdefault` mutates the dict on lookup, and `keys()` takes no arguments."
    vi:
      prompt: "Phương thức dict nào trả về an toàn giá trị `0` khi thiếu `tag` mà không làm thay đổi `counts` trong lúc tra cứu?"
      options:
        - "Gọi `counts.pop(tag, 0)` để đọc số đếm hiện tại"
        - "Gọi `counts.setdefault(tag, 0)` trước khi cộng thêm một"
        - "Gọi `counts.get(tag, 0)` để cung cấp giá trị mặc định"
        - "Gọi `counts.keys(tag, 0)` để kiểm tra khóa tồn tại"
      explanation: "`dict.get(key, default)` trả về `default` khi thiếu `key` mà không sửa dictionary hay gây `KeyError`. `pop` sẽ xóa khóa đang có, `setdefault` ghi thêm vào dict ngay lúc tra cứu, còn `keys()` không nhận tham số."

  - id: final-q03
    type: fill
    tags: [comprehensions, strings]
    difficulty: 2
    code: |
      raw = ["  RAG ", "", "  ", "LLM\n"]
      clean = [t.strip().lower() for t in raw if t.___()]
      print(clean)
    answer: ["strip"]
    en:
      prompt: "Fill in the string method in the `if` filter so whitespace-only entries are dropped and `clean` prints `['rag', 'llm']`."
      explanation: "Calling `t.strip()` in the comprehension guard returns `\"\"` (falsy) for empty or whitespace-only strings, filtering them out before `t.strip().lower()` runs."
    vi:
      prompt: "Điền tên phương thức chuỗi trong điều kiện `if` để loại bỏ các mục chỉ chứa khoảng trắng và `clean` in ra `['rag', 'llm']`."
      explanation: "Gọi `t.strip()` ở điều kiện lọc của comprehension sẽ trả về `\"\"` (giá trị falsy) cho chuỗi rỗng hoặc toàn khoảng trắng, giúp loại chúng trước khi chạy `t.strip().lower()`."

  - id: final-q04
    type: parsons
    tags: [iterators, functions]
    difficulty: 2
    lines:
      - "def batch_items(items, size):"
      - "    for i in range(0, len(items), size):"
      - "        yield items[i : i + size]"
      - "batches = list(batch_items([1, 2, 3, 4, 5], 2))"
      - "print(batches)"
    en:
      prompt: "Arrange these lines to define a generator `batch_items` that yields fixed-size chunks and prints `[[1, 2], [3, 4], [5]]`."
      explanation: "Define `batch_items`, loop with step `size`, `yield` each slice, materialize the generator with `list(...)`, and `print(batches)`."
    vi:
      prompt: "Sắp xếp các dòng sau để định nghĩa generator `batch_items` trả về từng lô kích thước cố định và in ra `[[1, 2], [3, 4], [5]]`."
      explanation: "Định nghĩa `batch_items`, lặp với bước nhảy `size`, `yield` từng lát cắt, chuyển generator thành list bằng `list(...)` rồi `print(batches)`."

  - id: final-q05
    type: output
    tags: [decorators, closures]
    difficulty: 3
    code: |
      def count_calls(fn):
          calls = 0
          def wrapper(*args):
              nonlocal calls
              calls += 1
              return fn(*args), calls
          return wrapper

      @count_calls
      def double(x):
          return x * 2

      print(double(3), double(5))
    answer: "(6, 1) (10, 2)"
    en:
      prompt: "What does this decorator print when `double` is called twice?"
      explanation: "`calls` lives in `count_calls`'s closure and is updated across invocations via `nonlocal calls`, so the first call returns `(6, 1)` and the second returns `(10, 2)`."
    vi:
      prompt: "Decorator này in ra gì khi `double` được gọi hai lần?"
      explanation: "`calls` nằm trong closure của `count_calls` và được cập nhật qua các lần gọi nhờ `nonlocal calls`, nên lần gọi đầu trả về `(6, 1)` và lần thứ hai trả về `(10, 2)`."

  - id: final-q06
    type: mcq
    tags: [dataclasses, typing]
    difficulty: 2
    answer: 1
    code: |
      from dataclasses import dataclass, field

      @dataclass
      class Document:
          text: str
          tags: list[str] = field(default_factory=list)
    en:
      prompt: "Why does `Document` use `field(default_factory=list)` instead of `tags: list[str] = []`?"
      options:
        - "Because `list[str]` cannot be type-checked at runtime"
        - "Because a bare `[]` would be shared across all instances"
        - "Because `default_factory` freezes the list as immutable"
        - "Because dataclasses disallow any mutable field types"
      explanation: "Using `= []` would share one mutable list across every `Document` instance, so `@dataclass` raises a `ValueError`. `field(default_factory=list)` creates a fresh list per instance."
    vi:
      prompt: "Vì sao `Document` dùng `field(default_factory=list)` thay vì `tags: list[str] = []`?"
      options:
        - "Vì `list[str]` không thể kiểm tra kiểu dữ liệu lúc chạy"
        - "Vì viết `[]` trực tiếp sẽ dùng chung một list cho mọi instance"
        - "Vì `default_factory` khóa cứng list thành kiểu bất biến"
        - "Vì dataclass không cho phép dùng bất kỳ kiểu dữ liệu mutable nào"
      explanation: "Viết `= []` sẽ khiến mọi instance `Document` dùng chung một list, nên `@dataclass` chặn lại bằng `ValueError`. `field(default_factory=list)` tạo một list mới cho mỗi instance."

  - id: final-q07
    type: fill
    tags: [context-managers, exceptions]
    difficulty: 3
    code: |
      from contextlib import contextmanager

      events = []

      @contextmanager
      def open_session():
          events.append("open")
          ___:
              yield "ok"
          ___:
              events.append("close")

      try:
          with open_session() as s:
              events.append(s)
              raise ValueError("boom")
      except ValueError:
          pass
      print(events)
    answer: ["try", "finally"]
    en:
      prompt: "Fill in the two keywords so `open_session` always records `'close'` even when the `with` block raises `ValueError`."
      explanation: "Wrapping `yield` in `try ... finally` guarantees the cleanup code after `yield` runs whether the `with` block succeeds or raises an exception, printing `['open', 'ok', 'close']`."
    vi:
      prompt: "Điền hai từ khóa để `open_session` luôn ghi nhận `'close'` ngay cả khi khối `with` ném ra `ValueError`."
      explanation: "Bọc `yield` trong `try ... finally` đảm bảo code dọn dẹp sau `yield` luôn chạy dù khối `with` thành công hay gặp ngoại lệ, in ra `['open', 'ok', 'close']`."

  - id: final-q08
    type: mcq
    tags: [testing, fixtures]
    difficulty: 2
    answer: 0
    en:
      prompt: "When writing unit tests for an AI service that calls an external LLM API and `time.time()`, what is the cleanest testing strategy?"
      options:
        - "Inject a fake LLM client and fake clock via fixtures"
        - "Call the live API with a small timeout in CI"
        - "Skip assertions on latency and non-deterministic text"
        - "Hardcode `time.sleep(0)` to stabilize real API calls"
      explanation: "Dependency injection with a fake client and fake clock makes tests fast, deterministic, and offline-safe without weakening assertions or relying on external network state."
    vi:
      prompt: "Khi viết unit test cho dịch vụ AI có gọi API LLM bên ngoài và `time.time()`, chiến lược kiểm thử sạch nhất là gì?"
      options:
        - "Truyền client LLM giả và đồng hồ giả qua fixture"
        - "Gọi API thật với timeout ngắn trong hệ thống CI"
        - "Bỏ qua assertion cho độ trễ và văn bản ngẫu nhiên"
        - "Gọi `time.sleep(0)` để ổn định kết quả API thật"
      explanation: "Tiêm phụ thuộc (dependency injection) bằng client giả và đồng hồ giả giúp test chạy nhanh, tất định và không cần mạng mà vẫn giữ nguyên các assertion chặt chẽ."

  # ---- P4: NumPy, Pandas, data cleaning, SQL (4 questions)
  - id: final-q09
    type: output
    tags: [numpy]
    difficulty: 2
    code: |
      import numpy as np

      scores = np.array([0.4, 0.85, 0.62, 0.91])
      labels = np.where(scores >= 0.7, 1, 0)
      print(labels.sum(), labels.tolist())
    answer: "2 [0, 1, 0, 1]"
    en:
      prompt: "What does this vectorized thresholding snippet print?"
      explanation: "`np.where(scores >= 0.7, 1, 0)` maps `0.85` and `0.91` to `1` and the others to `0`, giving `[0, 1, 0, 1]` with sum `2`."
    vi:
      prompt: "Đoạn code phân ngưỡng vector hóa này in ra gì?"
      explanation: "`np.where(scores >= 0.7, 1, 0)` ánh xạ `0.85` và `0.91` thành `1` và các phần tử còn lại thành `0`, cho ra `[0, 1, 0, 1]` với tổng bằng `2`."

  - id: final-q10
    type: mcq
    tags: [data-cleaning, pandas]
    difficulty: 3
    answer: 3
    code: |
      df["age"] = df["age"].fillna(df["age"].mean())
      X_train, X_test, y_train, y_test = train_test_split(df[["age"]], df["y"])
    en:
      prompt: "What bug is present in this preprocessing snippet?"
      options:
        - "`fillna` mutates `y_train` labels into floats"
        - "`train_test_split` drops rows that were imputed"
        - "Column `age` must be converted to strings first"
        - "Computing the global mean before splitting leaks test data"
      explanation: "Calculating `df[\"age\"].mean()` on the entire dataset before `train_test_split` leaks test distribution information into training features. Fit the imputer on `X_train` only, then transform `X_test`."
    vi:
      prompt: "Đoạn code tiền xử lý này mắc lỗi gì?"
      options:
        - "`fillna` biến nhãn `y_train` thành kiểu float"
        - "`train_test_split` tự động xóa các dòng đã điền khuyết"
        - "Cột `age` phải được ép sang kiểu chuỗi trước"
        - "Tính trung bình trên toàn bộ dữ liệu trước khi chia gây rò rỉ dữ liệu test"
      explanation: "Tính `df[\"age\"].mean()` trên cả tập dữ liệu trước `train_test_split` làm rò rỉ thông tin phân phối của tập test vào tập train. Bạn phải fit bộ điền khuyết chỉ trên `X_train`, rồi mới transform `X_test`."

  - id: final-q11
