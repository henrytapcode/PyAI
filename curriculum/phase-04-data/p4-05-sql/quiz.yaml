      WHERE score > 0.8 AND model LIKE 'gpt%'
      ORDER BY score DESC
      LIMIT 5
    en: { front: "What is the difference between `.fetchall()` and `.fetchone()`, and why add `ORDER BY`?", back: "`.fetchall()` returns a list of row tuples; `.fetchone()` returns the first tuple or `None`. Add `ORDER BY` whenever row order matters because SQL tables are unordered." }
    vi: { front: "`.fetchall()` và `.fetchone()` khác nhau thế nào, và vì sao cần thêm `ORDER BY`?", back: "`.fetchall()` trả về list các tuple dòng; `.fetchone()` trả về tuple đầu tiên hoặc `None`. Luôn thêm `ORDER BY` khi cần thứ tự xác định vì bảng SQL không có thứ tự mặc định." }
  - id: p4-05-f04
