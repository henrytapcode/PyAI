  # ---- cleaning
  - id: p4-test-q07
    type: mcq
    tags: [data-cleaning, pandas, conversion]
    difficulty: 2
    answer: 3
    code: |
      import pandas as pd

      s = pd.Series(["1,200", "300"])
      nums = pd.to_numeric(s, errors="coerce")
    en:
      prompt: "What values end up in `nums`?"
      options:
        - "`[1200.0, 300.0]`, because `errors=\"coerce\"` strips commas automatically"
        - "It raises `ValueError` when it sees `\"1,200\"`"
        - "`[\"1,200\", \"300\"]`, left unchanged as strings"
        - "`[NaN, 300.0]`, because `pd.to_numeric` does not parse commas and `errors=\"coerce\"` turns `\"1,200\"` into `NaN`"
      explanation: "`pd.to_numeric` expects plain number strings; with `errors=\"coerce\"`, any string it cannot parse (including `\"1,200\"`) becomes `NaN` instead of crashing. Remove commas with `.str.replace(\",\", \"\", regex=False)` first."
    vi:
      prompt: "Biến `nums` sẽ chứa các giá trị nào?"
      options:
        - "`[1200.0, 300.0]`, vì `errors=\"coerce\"` tự động xóa dấu phẩy"
        - "Báo lỗi `ValueError` ngay khi gặp `\"1,200\"`"
        - "`[\"1,200\", \"300\"]`, giữ nguyên dạng chuỗi"
        - "`[NaN, 300.0]`, vì `pd.to_numeric` không tự hiểu dấu phẩy và `errors=\"coerce\"` biến `\"1,200\"` thành `NaN`"
      explanation: "`pd.to_numeric` chỉ nhận chuỗi số thuần; với `errors=\"coerce\"`, mọi chuỗi không đọc được (kể cả `\"1,200\"`) đều thành `NaN` thay vì làm sập chương trình. Cần xóa dấu phẩy bằng `.str.replace(\",\", \"\", regex=False)` trước."

