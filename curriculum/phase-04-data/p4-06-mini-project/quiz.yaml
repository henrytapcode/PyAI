    en: { front: "Why must you call `.dropna(subset=[\"tokens\"])` before `.astype(\"int64\")`?", back: "Standard `\"int64\"` cannot store `NaN`; casting before dropping missing rows raises `IntCastingNaNError`." }
    vi: { front: "Vì sao phải gọi `.dropna(subset=[\"tokens\"])` trước khi gọi `.astype(\"int64\")`?", back: "Kiểu số nguyên `\"int64\"` không chứa được `NaN`; nếu ép kiểu trước khi bỏ dòng thiếu sẽ gặp lỗi `IntCastingNaNError`." }
