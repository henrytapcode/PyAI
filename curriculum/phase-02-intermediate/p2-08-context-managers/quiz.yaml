    vi: { front: "`with` đảm bảo điều gì?", back: "Phần dọn dẹp luôn chạy khi khối kết thúc, dù kết thúc bình thường hay bằng lỗi. File được đóng, timer được dừng, setting được khôi phục." }
  - id: p2-08-f02
    tags: [context-managers, classes]
    code: "class M:\n    def __enter__(self):\n        return self\n\n    def __exit__(self, exc_type, exc_value, traceback):\n        return False"
    en: { front: "What are `__enter__` and `__exit__`?", back: "The two methods of a context manager. `__enter__` runs when the block starts and its return value goes to `as`. `__exit__` runs when the block ends and receives the error details." }
    vi: { front: "`__enter__` và `__exit__` là gì?", back: "Hai method của một context manager. `__enter__` chạy khi khối bắt đầu và giá trị trả về của nó đi vào `as`. `__exit__` chạy khi khối kết thúc và nhận thông tin lỗi." }
  - id: p2-08-f03
    tags: [context-managers, exceptions]
    en: { front: "What does it mean when `__exit__` returns `True`?", back: "The error from the body is suppressed and the program continues after the `with` block. Return `False` or `None` to let the error go on. Hide only the error you expect." }
    vi: { front: "`__exit__` trả về `True` nghĩa là gì?", back: "Lỗi từ phần thân bị suppress và chương trình chạy tiếp sau khối `with`. Trả về `False` hoặc `None` để lỗi đi tiếp. Chỉ giấu đúng loại lỗi bạn chờ." }
  - id: p2-08-f04
    tags: [context-managers]
    code: "@contextmanager\ndef tag():\n    print(\"start\")\n    try:\n        yield\n    finally:\n        print(\"end\")"
    en: { front: "How do you write a context manager with `@contextmanager`?", back: "Write a generator function with one `yield`. The code before `yield` is the setup, the value after `yield` goes to `as`, and the clean-up goes after `yield` inside `finally`." }
    vi: { front: "Viết context manager bằng `@contextmanager` như thế nào?", back: "Viết một hàm generator có một `yield`. Code trước `yield` là phần chuẩn bị, giá trị sau `yield` đi vào `as`, và phần dọn dẹp nằm sau `yield`, bên trong `finally`." }
  - id: p2-08-f05
    tags: [context-managers, exceptions]
    en: { front: "Why wrap `yield` in `try/finally`?", back: "An error in the body is raised at the `yield` line. Without `try/finally` the clean-up after `yield` is skipped. With `finally` it runs every time and the error still goes on." }
    vi: { front: "Vì sao bọc `yield` trong `try/finally`?", back: "Lỗi trong phần thân được raise ngay tại dòng `yield`. Không có `try/finally` thì phần dọn dẹp sau `yield` bị bỏ qua. Có `finally` thì nó chạy mọi lần và lỗi vẫn đi tiếp." }
  - id: p2-08-f06
    tags: [context-managers]
    code: "with a, b:\n    ..."
    en: { front: "In what order are `with a, b:` entered and exited?", back: "Entered left to right (`a`, then `b`) and exited right to left (`b`, then `a`). The last one entered is cleaned up first." }
    vi: { front: "`with a, b:` vào và thoát theo thứ tự nào?", back: "Vào từ trái sang phải (`a` rồi `b`) và thoát từ phải sang trái (`b` rồi `a`). Manager vào sau cùng được dọn dẹp đầu tiên." }
