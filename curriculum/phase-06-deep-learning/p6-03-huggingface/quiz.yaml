      explanation: "Truyền `padding=True` để cân bằng độ dài các câu trong batch và `return_tensors=\"pt\"` để nhận về tensor PyTorch thay vì list Python."

  - id: p6-03-q09
    type: fill
    tags: [huggingface, pytorch]
    difficulty: 2
    code: |
      import torch

      id2label = {0: "NEGATIVE", 1: "POSITIVE"}
      logits = torch.tensor([[3.0, -1.0], [-2.0, 2.5]])
      probs = torch.___(logits, dim=1)
      pred_ids = logits.___(dim=1)
      print([id2label[i] for i in pred_ids.tolist()], round(probs[0, 0].item(), 3))
    answer: ["softmax", "argmax"]
    en:
      prompt: "Fill in the two PyTorch operations that convert raw `logits` to probabilities and pick the winning class index per row."
      explanation: "Apply `torch.softmax(logits, dim=1)` to turn each row of logits into probabilities summing to 1, and `logits.argmax(dim=1)` to pick the highest-scoring index."
    vi:
      prompt: "Điền tên hai hàm PyTorch dùng để đổi `logits` thô thành xác suất và chọn chỉ số lớp thắng cuộc ở từng hàng."
      explanation: "Gọi `torch.softmax(logits, dim=1)` để biến từng hàng logits thành xác suất có tổng bằng 1, và `logits.argmax(dim=1)` để lấy chỉ số có điểm cao nhất."

  - id: p6-03-q10
    type: mcq
    tags: [huggingface]
    difficulty: 2
    answer: 3
    en:
      prompt: "What happens if you pass `model(batch)` instead of `model(**batch)` where `batch` is the `BatchEncoding` returned by `tokenizer(..., return_tensors=\"pt\")`?"
      options:
        - "PyTorch unpacks `input_ids` and `attention_mask` automatically for you"
        - "The model automatically applies softmax and returns probabilities"
        - "The tokenizer re-runs with `padding=True` and `truncation=True`"
        - "Passes the mapping as `input_ids` and raises a `TypeError`"
      explanation: "`batch` is a dict-like mapping, so `**batch` is required to unpack `input_ids=...` and `attention_mask=...` as keyword arguments."
    vi:
      prompt: "Điều gì xảy ra nếu bạn gọi `model(batch)` thay vì `model(**batch)` với `batch` là `BatchEncoding` do `tokenizer(..., return_tensors=\"pt\")` trả về?"
      options:
        - "PyTorch tự động bung `input_ids` và `attention_mask` giúp bạn"
        - "Model tự động áp dụng hàm softmax và trả về xác suất từng lớp"
        - "Tokenizer tự chạy lại câu với `padding=True` và `truncation=True`"
        - "Truyền cả dict vào tham số `input_ids` và gây `TypeError`"
      explanation: "`batch` là một mapping giống dict, nên phải viết `**batch` để bung thành các tham số có tên `input_ids=...` và `attention_mask=...`."

  - id: p6-03-q11
