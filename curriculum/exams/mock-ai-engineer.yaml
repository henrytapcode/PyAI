id: mock-ai-engineer
kind: mock
title:
  en: "Mock exam: AI Engineer"
  vi: "Thi thử: AI Engineer"
description:
  en: "24 interview-style questions on Deep Learning, PyTorch, Hugging Face, LLMs, RAG, Agents, Evals, FastAPI, Docker, caching, and monitoring. Aim for 80% or more."
  vi: "24 câu hỏi kiểu phỏng vấn về Deep Learning, PyTorch, Hugging Face, LLM, RAG, Agent, đánh giá mô hình, FastAPI, Docker, caching và giám sát hệ thống. Mục tiêu từ 80% trở lên."
duration_min: 35
pass_score: 0.8
questions:
  # ---- dl / pytorch / huggingface (6)
  - id: mock3-q01
    type: mcq
    tags: [pytorch, dl]
    difficulty: 2
    answer: 1
    en:
      prompt: "Before running inference on a trained PyTorch classifier in production, why should you call `model.eval()` and wrap the forward pass in `with torch.no_grad():`?"
      options:
        - "To compile the model weights into C++ bytecode for faster CPU execution"
        - "To switch Dropout/BatchNorm to inference mode and skip tracking gradients"
        - "To move all model parameters from CPU memory onto the primary GPU"
        - "To zero out stale parameter gradients left over from the previous batch"
      explanation: "`model.eval()` switches layers like Dropout and BatchNorm to deterministic inference behavior, while `torch.no_grad()` disables autograd graph construction, reducing memory usage and speeding up the forward pass."
    vi:
      prompt: "Trước khi chạy suy luận trên một mô hình phân loại PyTorch đã huấn luyện trong production, vì sao bạn nên gọi `model.eval()` và bọc lượt truyền xuôi trong `with torch.no_grad():`?"
      options:
        - "Để biên dịch trọng số mô hình sang bytecode C++ giúp CPU chạy nhanh hơn"
        - "Để chuyển Dropout/BatchNorm sang chế độ suy luận và bỏ qua việc lưu gradient"
        - "Để di chuyển toàn bộ tham số mô hình từ bộ nhớ CPU sang GPU chính"
        - "Để đặt lại về 0 các gradient cũ còn sót lại từ batch huấn luyện trước"
      explanation: "`model.eval()` chuyển các lớp như Dropout và BatchNorm sang hành vi suy luận ổn định, còn `torch.no_grad()` tắt việc dựng đồ thị autograd, giúp giảm bộ nhớ tiêu thụ và tăng tốc lượt truyền xuôi."

  - id: mock3-q02
    type: mcq
    tags: [pytorch, dl]
    difficulty: 2
    answer: 2
    en:
      prompt: "In a standard PyTorch training loop, what happens if you forget to call `optimizer.zero_grad()` before `loss.backward()` on each batch?"
      options:
        - "PyTorch raises a `RuntimeError` because `backward()` requires empty `.grad` buffers"
        - "The optimizer skips updating weights because the learning rate resets to zero"
        - "New gradients are added onto previous gradients, causing incorrect step sizes"
        - "The loss value becomes `NaN` immediately on the very first training batch"
      explanation: "PyTorch accumulates gradients into `.grad` by default (useful for gradient accumulation across micro-batches). Without `optimizer.zero_grad()`, gradients from earlier batches keep summing up and distort parameter updates."
    vi:
      prompt: "Trong vòng lặp huấn luyện PyTorch chuẩn, điều gì xảy ra nếu bạn quên gọi `optimizer.zero_grad()` trước `loss.backward()` ở mỗi batch?"
      options:
        - "PyTorch báo lỗi `RuntimeError` vì `backward()` yêu cầu bộ đệm `.grad` rỗng"
        - "Bộ tối ưu hóa bỏ qua bước cập nhật trọng số do tốc độ học bị đặt về 0"
        - "Gradient mới bị cộng dồn vào gradient cũ, làm sai lệch bước cập nhật trọng số"
        - "Giá trị hàm mất mát lập tức biến thành `NaN` ngay ở batch huấn luyện đầu tiên"
      explanation: "Mặc định PyTorch cộng dồn gradient vào `.grad` (hữu ích khi tích lũy gradient qua nhiều micro-batch). Nếu thiếu `optimizer.zero_grad()`, gradient các batch trước tiếp tục cộng dồn và làm lệch hướng cập nhật."

  - id: mock3-q03
    type: output
    tags: [dl, numpy]
    difficulty: 2
    code: |
      import numpy as np

      x = np.array([2.0, -1.0])
      W = np.array([[1.0, 0.5], [-2.0, 1.0]])
      b = np.array([0.0, 0.5])
      hidden = np.maximum(0.0, x @ W + b)
      print(hidden.tolist(), int(np.argmax(hidden)))
    answer: "[4.0, 0.5] 0"
    en:
      prompt: "This NumPy snippet mirrors a single linear layer followed by ReLU activation (`y = max(0, xW + b)`). What does it print?"
      explanation: "`x @ W` computes `[2*1 + (-1)*(-2), 2*0.5 + (-1)*1] = [4.0, 0.0]`. Adding `b = [0.0, 0.5]` gives `[4.0, 0.5]`, ReLU keeps both positive values, and `argmax` returns index `0`."
    vi:
      prompt: "Đoạn code NumPy này mô phỏng một lớp tuyến tính theo sau bởi hàm kích hoạt ReLU (`y = max(0, xW + b)`). Đoạn code in ra gì?"
      explanation: "`x @ W` tính ra `[2*1 + (-1)*(-2), 2*0.5 + (-1)*1] = [4.0, 0.0]`. Cộng `b = [0.0, 0.5]` được `[4.0, 0.5]`, ReLU giữ nguyên hai giá trị dương và `argmax` trả về chỉ số `0`."

  - id: mock3-q04
    type: mcq
    tags: [huggingface, dl]
    difficulty: 2
    answer: 0
    en:
      prompt: "When batching variable-length sentences with a Hugging Face tokenizer (`padding=True, truncation=True`), why must you pass `attention_mask` into the model?"
      options:
        - "So self-attention ignores pad tokens added to match the longest sequence"
        - "So the tokenizer knows which special `[CLS]` and `[SEP]` tokens to strip"
        - "So the model converts string labels into integer class IDs during training"
        - "So CUDA allocates fixed-size memory pages only for non-empty text batches"
      explanation: "Shorter sequences in a batch are padded with `[PAD]` tokens to form a rectangular tensor. `attention_mask` marks real tokens as `1` and pad tokens as `0` so attention weights do not attend to meaningless padding."
    vi:
      prompt: "Khi gom batch các câu có độ dài khác nhau bằng tokenizer của Hugging Face (`padding=True, truncation=True`), vì sao bạn cần truyền `attention_mask` vào mô hình?"
      options:
        - "Để cơ chế self-attention bỏ qua các token đệm được thêm cho bằng câu dài nhất"
        - "Để tokenizer biết cần loại bỏ các token đặc biệt `[CLS]` và `[SEP]` nào"
        - "Để mô hình chuyển đổi nhãn dạng chuỗi thành ID lớp số nguyên khi huấn luyện"
        - "Để CUDA cấp phát các trang bộ nhớ kích thước cố định cho các batch có chữ"
      explanation: "Các câu ngắn hơn trong batch được chèn thêm token `[PAD]` để tạo tensor hình chữ nhật. `attention_mask` đánh dấu token thật là `1` và token đệm là `0` để lớp attention không chú ý vào phần đệm vô nghĩa."

  - id: mock3-q05
    type: fill
    tags: [dl, ml-math, numpy]
    difficulty: 3
    code: |
      import numpy as np

      logits = np.array([1000.0, 1001.0, 999.0])
      shifted = logits - np.___(logits)
      probs = np.exp(shifted) / np.sum(np.exp(shifted))
      print([round(float(p), 3) for p in probs])
    answer: ["max"]
    en:
      prompt: "To prevent floating-point overflow when computing softmax on large logits, fill in the NumPy function so `probs` prints `[0.245, 0.665, 0.09]`."
      explanation: "Subtracting `np.max(logits)` shifts the largest logit to `0.0` (making `exp(0.0) = 1.0`), which prevents `exp(1000)` from overflowing to `inf` while leaving the softmax probabilities mathematically identical."
    vi:
      prompt: "Để tránh tràn số dấu phẩy động khi tính softmax trên các logit lớn, điền tên hàm NumPy để `probs` in ra `[0.245, 0.665, 0.09]`."
      explanation: "Trừ đi `np.max(logits)` đưa giá trị logit lớn nhất về `0.0` (làm `exp(0.0) = 1.0`), giúp tránh lỗi `exp(1000)` tràn thành `inf` mà vẫn giữ nguyên xác suất softmax về mặt toán học."

  - id: mock3-q06
    type: mcq
    tags: [huggingface, dl]
    difficulty: 3
    answer: 3
    en:
      prompt: "Why is LoRA (Low-Rank Adaptation) widely used to fine-tune large language models instead of updating all model weights?"
      options:
        - "It removes the need for a tokenizer by operating directly on raw UTF-8 bytes"
        - "It replaces the transformer architecture with a faster linear regression head"
        - "It guarantees zero catastrophic forgetting without needing any validation set"
        - "It freezes base weights and trains small adapter matrices, cutting VRAM needs"
      explanation: "LoRA freezes the pretrained weights and injects trainable low-rank matrices (`A` and `B`) into target layers. Training only those small adapters dramatically lowers optimizer memory and checkpoint size."
    vi:
      prompt: "Vì sao LoRA (Low-Rank Adaptation) được dùng phổ biến để tinh chỉnh mô hình ngôn ngữ lớn thay vì cập nhật toàn bộ trọng số?"
      options:
        - "Nó bỏ qua bước dùng tokenizer bằng cách xử lý trực tiếp trên byte UTF-8 thô"
        - "Nó thay thế kiến trúc transformer bằng một lớp hồi quy tuyến tính nhanh hơn"
        - "Nó đảm bảo không bao giờ quên kiến thức cũ mà không cần tập kiểm định"
        - "Nó đóng băng trọng số gốc và chỉ huấn luyện ma trận adapter nhỏ, giảm VRAM"
      explanation: "LoRA đóng băng trọng số tiền huấn luyện và chèn các ma trận hạng thấp (`A` và `B`) có thể huấn luyện vào các lớp đích. Chỉ cập nhật các adapter nhỏ này giúp giảm mạnh bộ nhớ optimizer và kích thước checkpoint."

  # ---- llm / rag / agents / evals (10)
  - id: mock3-q07
    type: mcq
    tags: [llm]
    difficulty: 1
    answer: 1
    en:
      prompt: "You are building an LLM pipeline that extracts structured invoice dates and totals into JSON. Which temperature setting is most appropriate and why?"
      options:
        - "High temperature (`1.2`), so the model explores creative formatting styles"
        - "Low temperature (`0.0`), so token sampling stays focused and repeatable"
        - "Medium temperature (`0.7`), so the model balances accuracy and randomness"
        - "Negative temperature (`-1.0`), so the API disables the context window limit"
      explanation: "Lower temperature sharpens the next-token probability distribution. `temperature=0.0` makes extraction tasks nearly deterministic and consistent, whereas higher values introduce unnecessary randomness."
    vi:
      prompt: "Bạn đang xây dựng pipeline LLM trích xuất ngày và tổng tiền hóa đơn sang JSON. Mức `temperature` nào phù hợp nhất và vì sao?"
      options:
        - "Mức `temperature` cao (`1.2`), để mô hình thử nghiệm nhiều kiểu định dạng sáng tạo"
        - "Mức `temperature` thấp (`0.0`), để việc lấy mẫu token tập trung và lặp lại ổn định"
        - "Mức `temperature` trung bình (`0.7`), để mô hình cân bằng độ chính xác và ngẫu nhiên"
        - "Mức `temperature` âm (`-1.0`), để API tắt giới hạn kích thước cửa sổ ngữ cảnh"
      explanation: "`temperature` thấp làm phân phối xác suất token tiếp theo dốc hơn. Đặt `temperature=0.0` giúp tác vụ trích xuất ổn định và nhất quán, trong khi giá trị cao gây ra độ ngẫu nhiên không cần thiết."

  - id: mock3-q08
    type: output
    tags: [llm, json]
    difficulty: 2
    code: |
      import json

      raw = '{"intent": "refund", "confidence": 0.92}'
      data = json.loads(raw)
      ok = isinstance(data.get("intent"), str) and data.get("confidence", 0) >= 0.8
      print(data["intent"], ok)
    answer: "refund True"
    en:
      prompt: "After receiving a JSON string from a structured-output LLM call, what does this validation check print?"
      explanation: "`json.loads(raw)` parses the JSON into a Python dict. `data['intent']` is `'refund'` (a `str`), and `0.92 >= 0.8` is `True`, so it prints `refund True`."
    vi:
      prompt: "Sau khi nhận được chuỗi JSON từ một lời gọi LLM có đầu ra cấu trúc, đoạn kiểm tra hợp lệ này in ra gì?"
      explanation: "`json.loads(raw)` phân tích chuỗi JSON thành dict Python. `data['intent']` là `'refund'` (kiểu `str`), và `0.92 >= 0.8` đúng là `True`, nên kết quả là `refund True`."

  - id: mock3-q09
    type: fill
    tags: [rag, loops]
    difficulty: 2
    code: |
      def chunk_words(words, size, overlap):
          step = size - ___
          return [words[i:i + size] for i in range(0, len(words), step)]

      tokens = ["a", "b", "c", "d", "e", "f"]
      print(chunk_words(tokens, size=4, overlap=2))
    answer: ["overlap"]
    en:
      prompt: "Complete the sliding-window chunker for a RAG ingestion pipeline so `chunk_words(tokens, size=4, overlap=2)` prints `[['a', 'b', 'c', 'd'], ['c', 'd', 'e', 'f'], ['e', 'f']]`."
      explanation: "With `size=4` and `overlap=2`, each chunk advances by `step = size - overlap = 2` words so consecutive chunks share `2` overlapping words at the boundary."
    vi:
      prompt: "Hoàn thành hàm chia đoạn dạng cửa sổ trượt cho pipeline nạp dữ liệu RAG để `chunk_words(tokens, size=4, overlap=2)` in ra `[['a', 'b', 'c', 'd'], ['c', 'd', 'e', 'f'], ['e', 'f']]`."
      explanation: "Với `size=4` và `overlap=2`, mỗi đoạn dịch chuyển `step = size - overlap = 2` từ để các đoạn liên tiếp gối đầu nhau đúng `2` từ ở phần ranh giới."

  - id: mock3-q10
    type: output
    tags: [rag, numpy]
    difficulty: 2
    code: |
      import numpy as np

      query = np.array([1.0, 0.0])
      docs = np.array([
          [0.0, 2.0],
          [3.0, 0.0],
          [1.0, 1.0],
      ])
      norms = np.linalg.norm(docs, axis=1) * np.linalg.norm(query)
      scores = (docs @ query) / norms
      best_idx = int(np.argmax(scores))
      print(best_idx, round(float(scores[best_idx]), 2))
    answer: "1 1.0"
    en:
      prompt: "This RAG retriever ranks 3 document embeddings against a query embedding using cosine similarity. What does it print?"
      explanation: "Document 0 (`[0, 2]`) is orthogonal to `query` (`0.0`), document 1 (`[3, 0]`) points in the exact same direction (`3 / (3 * 1) = 1.0`), and document 2 (`[1, 1]`) has score `~0.71`. `argmax` picks index `1` with score `1.0`."
    vi:
      prompt: "Bộ truy xuất RAG này xếp hạng 3 vector embedding tài liệu theo câu truy vấn bằng độ tương đồng cosine. Đoạn code in ra gì?"
      explanation: "Tài liệu 0 (`[0, 2]`) vuông góc với `query` (`0.0`), tài liệu 1 (`[3, 0]`) cùng hướng hoàn toàn (`3 / (3 * 1) = 1.0`), còn tài liệu 2 (`[1, 1]`) đạt `~0.71`. `argmax` chọn chỉ số `1` với điểm `1.0`."

  - id: mock3-q11
    type: mcq
    tags: [rag]
    difficulty: 3
    answer: 2
    en:
      prompt: "In a RAG system for technical support docs, when does hybrid search (combining BM25 keyword search and dense vector search) outperform vector-only search?"
      options:
        - "When all documents are shorter than a single sentence with no punctuation"
        - "When the embedding model has more parameters than the generator LLM"
        - "When user queries contain exact error codes, SKUs, or rare identifiers"
        - "When the vector database stores fewer than ten total document chunks"
      explanation: "Dense embeddings capture semantic meaning well but can blur exact lexical matches like `ERR_4091` or product SKUs. BM25 excels at exact token matches, so combining both improves recall on technical queries."
    vi:
      prompt: "Trong hệ thống RAG cho tài liệu hỗ trợ kỹ thuật, khi nào tìm kiếm kết hợp (hybrid search giữa từ khóa BM25 và vector dày đặc) vượt trội hơn tìm kiếm chỉ dùng vector?"
      options:
        - "Khi mọi tài liệu đều ngắn hơn một câu đơn và không chứa dấu câu nào"
        - "Khi mô hình embedding có số lượng tham số lớn hơn mô hình LLM sinh văn bản"
        - "Khi câu truy vấn chứa mã lỗi chính xác, mã SKU hoặc định danh hiếm gặp"
        - "Khi cơ sở dữ liệu vector lưu trữ ít hơn mười đoạn tài liệu tổng cộng"
      explanation: "Vector embedding nắm bắt ngữ nghĩa tốt nhưng dễ làm mờ các chuỗi khớp chính xác như `ERR_4091` hay mã SKU. BM25 mạnh về khớp từ khóa chính xác, nên kết hợp cả hai giúp tăng độ phủ cho truy vấn kỹ thuật."

  - id: mock3-q12
    type: parsons
    tags: [rag, llm]
    difficulty: 2
    lines:
      - "def build_rag_prompt(query, chunks):"
      - '    context = "\n".join(f"[{i}] {c}" for i, c in enumerate(chunks, 1))'
