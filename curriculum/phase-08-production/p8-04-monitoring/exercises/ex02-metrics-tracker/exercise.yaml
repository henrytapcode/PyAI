id: p8-04-ex02
kind: code
title:
  en: "Write: MetricsTracker for cost, p95 latency, and alerts"
  vi: "Viết code: lớp MetricsTracker theo dõi chi phí, độ trễ p95 và cảnh báo"
difficulty: 2
tags: [production, performance, classes]
hints:
  en:
    - |
      Combine the token cost formula from §4, log aggregation from §5, and threshold rules from §6 inside `MetricsTracker`. Every call to `record(...)`—even when `ok=False`—must be saved and its cost returned (`record(250.0, 1000, 500)` returns `0.002` at prices `0.001` and `0.002`).
    - |
      The plan:
      1. Store the two token prices and an empty list for incoming request metrics during initialization.
      2. In `record`, compute the request's dollar cost from prompt and completion token counts, append the latency, cost, and status flag, and return that cost.
      3. In `summary`, return the zeroed dictionary when nothing is recorded yet; otherwise sort latencies for the nearest-rank 95th percentile, divide failed count by total count for error rate, and round total cost to six decimal places.
      4. In `alerts`, fetch the summary and append matching alert codes in fixed order, keeping budget exceeded and budget warning mutually exclusive.
    - |
      Follow this control-flow skeleton inside `MetricsTracker` and fill in the core computations:
      ```python
      class MetricsTracker:
          def __init__(self, price_in_per_1k: float, price_out_per_1k: float) -> None:
              self.price_in_per_1k = price_in_per_1k
              self.price_out_per_1k = price_out_per_1k
              self._records = []

          def summary(self) -> dict[str, float | int]:
              if not self._records:
                  return {"count": 0, "error_rate": 0.0, "p95_ms": 0.0, "total_cost": 0.0}
              # compute error_rate, nearest-rank p95_ms, and total_cost rounded to 6 decimals
              ...

          def alerts(
              self,
              max_p95_ms: float,
              budget: float,
              warn_ratio: float = 0.8,
          ) -> list[str]:
              stats = self.summary()
              triggered: list[str] = []
              if stats["p95_ms"] > max_p95_ms:
                  triggered.append("p95-latency")
              if stats["total_cost"] > budget:
                  triggered.append("budget-exceeded")
              elif ...:
                  triggered.append("budget-warning")
              if ...:
                  triggered.append("error-rate")
              return triggered
      ```
  vi:
    - |
      Kết hợp công thức tính chi phí ở §4, tổng hợp log ở §5 và kiểm tra ngưỡng ở §6 bên trong `MetricsTracker`. Mọi lời gọi `record(...)`—kể cả khi `ok=False`—đều phải được lưu lại và trả về chi phí (`record(250.0, 1000, 500)` trả `0.002` với đơn giá `0.001` và `0.002`).
    - |
      Kế hoạch:
      1. Lưu hai đơn giá token và khởi tạo một danh sách rỗng để chứa bản ghi các request.
      2. Trong `record`, tính chi phí từ số token đầu vào/đầu ra, lưu bộ ba độ trễ, chi phí và cờ trạng thái rồi trả về chi phí đó.
      3. Trong `summary`, trả về dictionary toàn số 0 nếu chưa có bản ghi; ngược lại sắp xếp độ trễ để lấy phân vị 95 theo nearest-rank, chia số lỗi cho tổng số request, và làm tròn tổng chi phí tới 6 chữ số thập phân.
      4. Trong `alerts`, gọi `summary()` và nối các mã cảnh báo theo đúng thứ tự quy định, đảm bảo cảnh báo vượt ngân sách và cảnh báo sắp hết ngân sách loại trừ lẫn nhau.
    - |
      Dùng bộ khung luồng điều khiển sau cho `MetricsTracker` và tự hoàn thiện phần tính toán lõi:
      ```python
      class MetricsTracker:
          def __init__(self, price_in_per_1k: float, price_out_per_1k: float) -> None:
              self.price_in_per_1k = price_in_per_1k
