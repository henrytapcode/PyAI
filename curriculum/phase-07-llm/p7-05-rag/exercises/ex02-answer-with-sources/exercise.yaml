id: p7-05-ex02
kind: code
title:
  en: "Code: retrieve, ground, and extract verified sources"
  vi: "Viết code: truy xuất, dựng prompt có căn cứ và trích nguồn hợp lệ"
difficulty: 2
tags: [rag, llm, numpy]
hints:
  en:
    - |
      This combines retrieval (§3), grounded prompting (§4), citation checking (§5), and the score threshold (§6). Given chunks about refunds and shipping and `"How many days do refunds take?"`, it returns `{"answer": "Refunds are issued within 30 days of purchase. [1]", "sources": ["refunds.md"]}`.
    - |
      The plan:
      1. Return the fallback dictionary with empty sources right away if the chunk list is empty or `k` is not positive.
      2. Embed all chunk texts in one batch, embed the question, compute dot-product scores, and sort descending with a stable sort to keep the top `k` indexes.
      3. Check the highest score first: if it falls below `min_score`, return the fallback dictionary immediately without calling chat.
      4. Build a system message containing grounding rules plus a `Context:` line followed by numbered `[1]`, `[2]` lines for the top hits, paired with a user message holding the question.
      5. Call chat, scan the reply text for bracketed integer citations, keep only numbers within the hit count bounds, and map them to unique source names in order of appearance.
    - |
      Function skeleton:
      ```python
      import re
      import numpy as np


      def answer_with_sources(
          question: str,
          chunks: list[dict],
          client,
          k: int = 2,
          min_score: float = 0.2,
      ) -> dict:
          if not chunks or k <= 0:
              return {"answer": "I don't know.", "sources": []}
          doc_vecs = np.array(client.embed([c["text"] for c in chunks]), dtype=float)
          q_vec = np.array(client.embed([question])[0], dtype=float)
          scores = doc_vecs @ q_vec
          order = np.argsort(-scores, kind="stable")[:k]
          if float(scores[int(order[0])]) < min_score:
              return {"answer": "I don't know.", "sources": []}
          hits = [chunks[int(i)] for i in order]
          messages = ...
          answer = client.chat(messages).content or ""
          sources: list[str] = []
          for raw in re.findall(r"\[(\d+)\]", answer):
              idx = int(raw) - 1
              if 0 <= idx < len(hits) and hits[idx]["source"] not in sources:
                  sources.append(hits[idx]["source"])
          return {"answer": answer, "sources": sources}
      ```
  vi:
    - |
      Bài này kết hợp truy xuất (§3), prompt có căn cứ (§4), kiểm trích dẫn (§5) và ngưỡng điểm (§6). Với các chunk về đổi trả, giao hàng và câu hỏi `"How many days do refunds take?"`, hàm trả về `{"answer": "Refunds are issued within 30 days of purchase. [1]", "sources": ["refunds.md"]}`.
    - |
      Kế hoạch:
      1. Trả về ngay dictionary mặc định kèm danh sách nguồn rỗng nếu danh sách chunk trống hoặc `k` không dương.
      2. Embed toàn bộ văn bản chunk trong một lô, embed câu hỏi, tính điểm tích vô hướng rồi sắp xếp giảm dần ổn định để lấy top `k` chỉ số.
      3. Kiểm tra điểm cao nhất trước: nếu nhỏ hơn `min_score`, trả về câu trả lời mặc định ngay mà không gọi chat.
      4. Tạo tin nhắn hệ thống gồm quy tắc trả lời theo ngữ cảnh cùng dòng `Context:` theo sau bởi các dòng đánh số `[1]`, `[2]` của top `k` chunk, đi kèm tin nhắn người dùng chứa câu hỏi.
      5. Gọi chat, dò các nhãn số nguyên trong ngoặc vuông từ câu trả lời, chỉ giữ những số hợp lệ trong phạm vi số chunk đã đưa vào ngữ cảnh và ánh xạ sang tên nguồn không trùng theo thứ tự xuất hiện.
    - |
