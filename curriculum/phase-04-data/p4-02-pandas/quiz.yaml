  - id: p4-02-q06
    type: mcq
    tags: [pandas]
    difficulty: 2
    answer: 1
    en:
      prompt: "What is the main difference between `df.loc[...]` and `df.iloc[...]`?"
      options:
        - "`.loc` only selects columns, whereas `.iloc` only selects rows"
        - "`.loc` selects by row/column **labels**, whereas `.iloc` selects by 0-based integer **positions**"
        - "`.loc` modifies the DataFrame in place, whereas `.iloc` returns a read-only view"
        - "`.loc` works only on string columns, whereas `.iloc` works only on integers"
      explanation: "Think of `loc` as label-based lookup and `iloc` as integer-position lookup (always counting `0, 1, 2, ...` from the top)."
    vi:
      prompt: "Sự khác nhau chính giữa `df.loc[...]` và `df.iloc[...]` là gì?"
      options:
        - "`.loc` chỉ chọn được cột, còn `.iloc` chỉ chọn được hàng"
        - "`.loc` chọn theo **nhãn** hàng/cột, còn `.iloc` chọn theo **vị trí** số nguyên bắt đầu từ `0`"
        - "`.loc` sửa trực tiếp DataFrame tại chỗ, còn `.iloc` trả về bản chỉ đọc"
        - "`.loc` chỉ dùng cho cột chuỗi, còn `.iloc` chỉ dùng cho số nguyên"
      explanation: "Hãy nhớ `loc` tra theo nhãn, còn `iloc` tra theo vị trí số nguyên (luôn đếm `0, 1, 2, ...` từ đầu bảng)."

