  # ---- llm-api
  - id: p7-test-q01
    type: output
    tags: [llm]
    difficulty: 1
    code: |
      from pyai_llm import Usage

      turns = [Usage(120, 30, 150), Usage(200, 50, 250)]
      in_tok = sum(u.prompt_tokens for u in turns)
      out_tok = sum(u.completion_tokens for u in turns)
      cost = (in_tok * 0.50 + out_tok * 1.50) / 1_000_000
      print(in_tok, out_tok, round(cost, 6))
    answer: "320 80 0.00028"
    en:
      prompt: "What does this token-cost calculation print?"
      explanation: "Summing `prompt_tokens` (`120 + 200 = 320`) and `completion_tokens` (`30 + 50 = 80`) yields `(320 * 0.50 + 80 * 1.50) / 1_000_000 = 280 / 1_000_000 = 0.00028` USD."
    vi:
      prompt: "Đoạn code tính chi phí token này in ra gì?"
      explanation: "Cộng `prompt_tokens` (`120 + 200 = 320`) và `completion_tokens` (`30 + 50 = 80`) cho ra `(320 * 0.50 + 80 * 1.50) / 1_000_000 = 280 / 1_000_000 = 0.00028` USD."

  - id: p7-test-q02
    type: mcq
    tags: [llm]
    difficulty: 3
    answer: 0
    code: |
      import time

      def send(client, msgs):
          for attempt in range(3):
              try:
                  return client.chat(msgs)
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(0.5 * 2 ** attempt)
    en:
      prompt: "When `msgs = [{\"role\": \"bot\", \"content\": \"hi\"}]`, why is `except Exception:` a bug in `send`?"
      options:
        - "It retries a permanent `ValueError` three times with backoff"
        - "It skips retrying `RateLimitError` on the first two attempts"
        - "It converts the invalid role string into `'assistant'` silently"
        - "It halves the sleep delay after each failed `chat` attempt"
      explanation: "An invalid role like `'bot'` raises a permanent `ValueError` that fails identically on every retry; catching broad `Exception` wastes exponential backoff sleeps instead of failing fast, whereas only transient errors like `RateLimitError` should be retried."
    vi:
      prompt: "Khi `msgs = [{\"role\": \"bot\", \"content\": \"hi\"}]`, vì sao `except Exception:` trong `send` là một lỗi?"
      options:
        - "Nó thử lại lỗi `ValueError` cố định ba lần kèm backoff"
        - "Nó bỏ qua không thử lại `RateLimitError` ở hai lần đầu"
        - "Nó tự đổi tên vai trò bị sai thành `'assistant'` âm thầm"
        - "Nó giảm một nửa thời gian chờ sau mỗi lần gọi thất bại"
      explanation: "Tên role sai như `'bot'` ném `ValueError` cố định và sẽ lỗi y hệt ở mọi lần thử lại; bắt chung `Exception` làm mất thời gian chờ exponential backoff thay vì báo lỗi ngay, trong khi chỉ lỗi tạm thời như `RateLimitError` mới nên retry."

  # ---- structured-output
  - id: p7-test-q03
    type: fill
    tags: [llm, json]
    difficulty: 2
    code: |
      import json

      raw = 'Note:\n{"priority": "high", "seats": 3}\nDone.'
      data = json.loads(raw[raw.index("{") : raw.rindex("}") + 1])
      schema = {
          "required": ["priority", "seats"],
          "enum": ("low", "medium", "high"),
      }
      has_req = all(k in data for k in schema["___"])
      valid_type = isinstance(data["seats"], int) and not isinstance(data["seats"], ___)
      valid_enum = data["priority"] in schema["___"]
      print(has_req and valid_type and valid_enum)
    answer: ["required", "bool", "enum"]
    en:
      prompt: "Fill in the three blanks to check required fields, reject booleans masquerading as integers, and enforce the `enum` list."
      explanation: "Check `schema['required']` for missing keys, guard `isinstance(..., int)` with `not isinstance(..., bool)` because `bool` subclasses `int`, and verify `data['priority'] in schema['enum']`."
    vi:
      prompt: "Điền vào ba chỗ trống để kiểm tra các trường bắt buộc, chặn `bool` giả làm `int` và ràng buộc giá trị `enum`."
      explanation: "Duyệt `schema['required']` để phát hiện khóa thiếu, chặn `bool` bằng `not isinstance(..., bool)` vì `bool` kế thừa `int`, và kiểm tra `data['priority'] in schema['enum']`."

  - id: p7-test-q04
    type: mcq
    tags: [llm, json]
    difficulty: 1
    answer: 2
    en:
      prompt: "A structured-output parser extracts `{\"priority\": \"urgent\"}`, which fails an `enum` check (`low`/`medium`/`high`). Which recovery flow handles this cleanly?"
      options:
        - "Map `'urgent'` to `'high'` silently without logging or retrying"
        - "Run `eval()` on the raw text inside an unbounded `while True` retry loop"
        - "Append the reply and error feedback, retry up to a cap, then fallback"
        - "Clear all prior turns and resend only the single word `'JSON'` on retry"
      explanation: "Appending the invalid `assistant` reply plus a `user` message explaining the schema error gives the model a chance to fix its JSON within a bounded retry count, and falling back safely avoids crashing if retries still fail."
    vi:
      prompt: "Bộ phân tích structured output tách được `{\"priority\": \"urgent\"}`, nhưng giá trị này sai quy định `enum` (`low`/`medium`/`high`). Quy trình xử lý nào sau đây là chuẩn?"
      options:
        - "Tự đổi `'urgent'` thành `'high'` âm thầm mà không ghi nhận hay thử lại"
        - "Chạy `eval()` trên chuỗi thô bên trong một vòng lặp `while True` vô hạn"
        - "Nối phản hồi và thông báo lỗi, retry có giới hạn rồi trả về fallback"
        - "Xóa toàn bộ hội thoại trước đó rồi chỉ gửi lại đúng một chữ `'JSON'`"
      explanation: "Nối phản hồi `assistant` bị sai kèm tin nhắn `user` nêu rõ lỗi giúp model tự sửa JSON trong số lượt retry giới hạn, và chuyển sang fallback an toàn nếu vẫn thất bại."

  # ---- embeddings
  - id: p7-test-q05
    type: output
    tags: [llm]
    difficulty: 1
    code: |
      import numpy as np

      D = np.array([[0.0, 1.0], [0.6, 0.8], [1.0, 0.0]])
      q = np.array([0.8, 0.6])
      scores = D @ q
      top2 = np.argsort(-scores, kind="stable")[:2]
      print(top2.tolist(), [round(float(scores[i]), 3) for i in top2])
    answer: "[1, 2] [0.96, 0.8]"
    en:
      prompt: "All rows in `D` and vector `q` are L2-normalized. What does this code print?"
      explanation: "For unit vectors, the dot product `D @ q` equals cosine similarity: `[0.6, 0.96, 0.8]`. Negating `scores` in `np.argsort` ranks indexes descending, giving top-2 indexes `[1, 2]` with scores `[0.96, 0.8]`."
    vi:
      prompt: "Mọi hàng của `D` và vector `q` đều đã chuẩn hóa L2. Đoạn code này in ra gì?"
      explanation: "Với vector đơn vị, tích vô hướng `D @ q` chính là cosine similarity: `[0.6, 0.96, 0.8]`. Đảo dấu `-scores` trong `np.argsort` xếp chỉ số giảm dần, cho top 2 là `[1, 2]` với điểm `[0.96, 0.8]`."

  - id: p7-test-q06
    type: mcq
    tags: [llm]
    difficulty: 2
    answer: 1
    en:
      prompt: "You tuned `min_score = 0.35` on Model A and then switch your embedding store to Model B. What should you do with `min_score`?"
      options:
        - "Keep `0.35` unchanged since cosine similarity always shares the same scale"
        - "Re-embed the corpus and re-measure `min_score` on Model B's dev scores"
        - "Multiply `0.35` by the ratio of Model B's `embed_dim` to Model A's"
        - "Set `min_score = 0.0` permanently so Model B never drops a valid hit"
      explanation: "Different embedding models produce incompatible vector spaces with different baseline cosine distributions, so you must re-embed the store and calibrate `min_score` empirically for the new model on dev data."
    vi:
      prompt: "Bạn đã chỉnh `min_score = 0.35` trên Model A rồi chuyển kho vector sang Model B. Bạn cần làm gì với `min_score`?"
      options:
        - "Giữ nguyên `0.35` vì điểm cosine của mọi model luôn cùng phân bố"
        - "Embed lại kho tài liệu và đo lại `min_score` trên tập dev của Model B"
        - "Nhân `0.35` với tỉ lệ số chiều `embed_dim` giữa Model B và Model A"
        - "Đặt `min_score = 0.0` cố định để Model B không bỏ sót tài liệu đúng"
      explanation: "Mỗi model embedding tạo ra một không gian vector với phân bố điểm cosine khác nhau, nên bạn bắt buộc phải embed lại kho tài liệu và đo lại ngưỡng `min_score` trên tập dev cho model mới."

  # ---- vector-db
  - id: p7-test-q07
    type: mcq
    tags: [rag]
    difficulty: 3
    answer: 3
    code: |
      import numpy as np

      ids = ["d1", "d2", "d3", "d4"]
      topics = ["billing", "billing", "shipping", "shipping"]
      scores = np.array([0.91, 0.85, 0.62, 0.58])
      top2 = np.argsort(-scores, kind="stable")[:2]
      hits = [ids[i] for i in top2 if topics[i] == "shipping"]
      print(hits)
    en:
      prompt: "This search requests `k=2` documents with `topic == 'shipping'`, yet prints `[]` even though `d3` and `d4` match. What fixes this bug?"
      options:
        - "Sort `scores` ascending before slicing the first two indexes"
        - "Replace `kind='stable'` with the default quicksort algorithm"
        - "Delete `d1` and `d2` permanently from the vector database first"
        - "Filter indexes by `topics[i] == 'shipping'` before taking `[:2]`"
      explanation: "Post-filtering checks `topics` after taking global top-2 (`d1`, `d2`), leaving zero `'shipping'` hits. Pre-filtering eligible indexes first and then ranking top-k ensures all `k` available matches are returned."
    vi:
      prompt: "Lệnh tìm kiếm này cần lấy `k=2` tài liệu có `topic == 'shipping'`, nhưng lại in `[]` dù có sẵn `d3` và `d4`. Cách sửa nào đúng?"
      options:
        - "Sắp xếp `scores` theo thứ tự tăng dần trước khi cắt hai phần tử đầu"
        - "Thay tham số `kind='stable'` bằng thuật toán sắp xếp mặc định"
        - "Xóa vĩnh viễn `d1` và `d2` khỏi vector database trước khi tìm"
        - "Lọc các chỉ số thỏa `topics[i] == 'shipping'` trước khi cắt `[:2]`"
      explanation: "Lọc sau (post-filter) kiểm tra `topics` sau khi đã lấy top 2 toàn kho (`d1`, `d2`), nên trả về rỗng. Lọc trước (pre-filter) các chỉ số hợp lệ rồi mới xếp hạng top-k giúp trả đủ `k` kết quả khớp."

  - id: p7-test-q08
    type: fill
    tags: [rag, json]
    difficulty: 2
    code: |
      import json
      import numpy as np

      ids = ["c1", "c2"]
      M = np.array([[1.0, 0.0], [0.0, 1.0]])
      doc_id, new_vec = "c2", [0.6, 0.8]
      if doc_id ___ ids:
          M[ids.index(doc_id)] = new_vec
      saved = json.___({"ids": ids, "vectors": M.___()})
