      3. Trả về không dạng số thực ngay nếu một trong hai độ dài bằng không để tránh phép chia cho không.
      4. Chia tích vô hướng của hai vector cho tích hai độ dài rồi làm tròn đến ba chữ số thập phân.
    - |
