  - id: p4-04-q10
    type: output
    tags: [plotting]
    difficulty: 2
    code: |
      import matplotlib.pyplot as plt
      fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(8, 3))
      ax1.plot([1, 2], [0.8, 0.5])
      ax2.bar(["mini", "pro"], [0.4, 2.5])
      plt.xlabel("model")
      print(repr(ax1.get_xlabel()), repr(ax2.get_xlabel()))
    answer: "'' 'model'"
    en:
      prompt: "What does this code print?"
      explanation: "`plt.xlabel(...)` only updates the currently active (last) axes `ax2`, leaving `ax1.get_xlabel()` as `''`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`plt.xlabel(...)` chỉ đặt nhãn cho axes đang hoạt động (cuối cùng) là `ax2`, nên `ax1.get_xlabel()` vẫn là chuỗi rỗng `''`."

  - id: p4-04-q11
    type: mcq
    tags: [plotting]
    difficulty: 2
    answer: 0
    en:
      prompt: "What happens if you call `ax.legend()` after plotting lines without any `label=` argument?"
      options:
        - "Matplotlib emits a warning (\"No artists with labels found to put in legend\") and draws an empty legend"
        - "Matplotlib raises a `KeyError` and stops the script"
        - "Matplotlib automatically names the lines using the Python variable names"
        - "Matplotlib refuses to draw the lines at all"
      explanation: "Without `label=` strings, `ax.legend()` finds no labeled artists, logs a `UserWarning`, and creates an empty legend box."
    vi:
      prompt: "Điều gì xảy ra nếu bạn gọi `ax.legend()` sau khi vẽ các đường mà không truyền tham số `label=`?"
      options:
        - "Matplotlib phát cảnh báo (\"No artists with labels found to put in legend\") và vẽ hộp chú thích rỗng"
        - "Matplotlib báo lỗi `KeyError` và dừng chương trình"
        - "Matplotlib tự lấy tên biến Python làm nhãn"
        - "Matplotlib không vẽ các đường nữa"
      explanation: "Khi không có `label=`, `ax.legend()` không tìm thấy đối tượng nào có nhãn nên phát `UserWarning` và tạo hộp chú thích trống."

