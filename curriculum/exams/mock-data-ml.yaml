  - id: mock2-q22
    type: mcq
    tags: [model-evaluation, data-prep]
    difficulty: 3
    answer: 2
    code: |
      from sklearn.linear_model import LogisticRegression
      from sklearn.model_selection import cross_val_score
      from sklearn.preprocessing import StandardScaler

      X_s = StandardScaler().fit_transform(X)
      scores = cross_val_score(LogisticRegression(), X_s, y, cv=5, scoring="f1")
    en:
      prompt: "In a code review, a candidate shares this CV snippet. What is the bug and how do you fix it?"
      options:
        - "CV score is too pessimistic; fix by setting `shuffle=False` in CV"
        - "CV crashes on unscaled `y`; fix by scaling `y` alongside `X` first"
        - "CV score is optimistic due to fold leakage; fix using `make_pipeline`"
        - "Logistic regression ignores scaling; fix by dropping `StandardScaler`"
      explanation: "Fitting `StandardScaler` on all of `X` before `cross_val_score` leaks every validation fold's mean and std into training, inflating CV scores. Wrapping `make_pipeline(StandardScaler(), LogisticRegression())` fits the scaler inside each training fold separately."
    vi:
      prompt: "Khi review code, một ứng viên viết đoạn CV như trên. Lỗi nằm ở đâu và cách sửa đúng là gì?"
      options:
        - "Điểm CV bị bi quan quá mức; sửa bằng cách đặt `shuffle=False`"
        - "CV lỗi vì `y` chưa chuẩn hóa; sửa bằng cách chuẩn hóa cả `y`"
        - "Điểm CV bị lạc quan do rò rỉ giữa các fold; sửa bằng `make_pipeline`"
        - "Logistic regression bỏ qua thang đo; sửa bằng cách xóa `StandardScaler`"
      explanation: "Fit `StandardScaler` trên toàn bộ `X` trước `cross_val_score` làm thống kê của các fold kiểm tra rò rỉ vào tập train, đẩy điểm CV cao giả tạo. Dùng `make_pipeline(StandardScaler(), LogisticRegression())` giúp scaler chỉ fit riêng trong từng fold train."

