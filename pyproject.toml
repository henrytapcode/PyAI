[project]
name = "python-ai-platform-content"
version = "0.1.0"
description = "Curriculum tooling: validate, test and build bilingual Python for AI Engineer content"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "pytest>=8.2",
  "ruff>=0.6",
  "numpy==2.2.5",
  "pandas==2.3.3",
  "scikit-learn==1.7.0",
  "scipy==1.14.1",
  "matplotlib==3.9.2",
  "torch==2.15.0",
  "transformers==5.23.0",
  "fastapi==0.162.7",
  "pydantic==2.12.5",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "pyai-llm",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
pyai-llm = { path = "packages/pyai_llm", editable = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["curriculum"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Starters intentionally contain blanks (___) and unused args.
per-file-ignores = { "**/starter.py" = ["F821", "F841", "ARG001", "B018", "F401", "F811", "E401", "E701", "E702", "E711", "E712", "E713", "E714", "E722", "E731", "E741", "B006", "B007"], "**/examples/*.py" = ["E501"] }
