id: p6-01-ex02
kind: code
title:
  en: "Write: autograd slope and gradient descent"
  vi: "Viết code: tính độ dốc và gradient descent bằng autograd"
difficulty: 2
tags: [pytorch, dl]
hints:
  en:
    - |
      This follows §4 (`loss.backward()` and `.grad`) and §5 (`torch.no_grad()` and `.grad.zero_()`). For `xs = torch.tensor([1.0, 2.0])` and `ys = torch.tensor([3.0, 6.0])`, `slope_at(3.0, xs, ys)` returns `0.0` because `3.0 * xs` already matches `ys`.
    - |
      The plan:
      1. In `slope_at`, create a fresh scalar leaf tensor with gradient tracking enabled from `w_value`, compute the mean squared prediction error, run `loss.backward()`, and return the scalar gradient rounded to 3 decimals.
      2. In `fit_slope`, start with a tracked parameter tensor at zero, then repeat `steps` times: compute the same MSE loss and run `loss.backward()`.
      3. Update the parameter downward using its learning-rate-scaled gradient inside `torch.no_grad()`, clear the stored gradient before the next step, and return the rounded scalar parameter after the loop.
    - |
      The shape for `fit_slope` (use the same leaf-tensor and loss pattern for `slope_at`):
      ```python
      w = torch.tensor(0.0, requires_grad=True)
      for _ in range(steps):
          loss = ...
          loss.backward()
          with torch.no_grad():
              w -= lr * w.grad
          ...
      return round(w.item(), 3)
      ```
      Remember to create a fresh leaf tensor on every call to `slope_at` so gradients never carry over between calls.
  vi:
    - |
      Bài này đi theo §4 (`loss.backward()` và `.grad`) và §5 (`torch.no_grad()` và `.grad.zero_()`). Với `xs = torch.tensor([1.0, 2.0])` và `ys = torch.tensor([3.0, 6.0])`, `slope_at(3.0, xs, ys)` trả về `0.0` vì `3.0 * xs` đã khớp hoàn toàn `ys`.
    - |
      Kế hoạch:
      1. Trong `slope_at`, tạo một leaf tensor vô hướng mới có bật theo dõi gradient từ `w_value`, tính sai số bình phương trung bình (MSE), gọi `loss.backward()` rồi trả về giá trị gradient làm tròn 3 chữ số thập phân.
      2. Trong `fit_slope`, bắt đầu với một tham số bằng 0 có theo dõi gradient, rồi lặp `steps` lần: tính cùng công thức MSE và gọi `loss.backward()`.
      3. Trừ đi bước cập nhật theo learning rate và gradient bên trong `torch.no_grad()`, xóa gradient đang lưu trước vòng kế tiếp, và trả về tham số đã làm tròn 3 chữ số sau vòng lặp.
    - |
      Hình dạng của `fit_slope` (dùng cùng cách tạo leaf tensor và tính loss cho `slope_at`):
      ```python
      w = torch.tensor(0.0, requires_grad=True)
      for _ in range(steps):
          loss = ...
          loss.backward()
          with torch.no_grad():
              w -= lr * w.grad
          ...
      return round(w.item(), 3)
      ```
      Đừng quên tạo leaf tensor mới ở mỗi lần gọi `slope_at` để gradient không bị cộng dồn giữa các lần.
