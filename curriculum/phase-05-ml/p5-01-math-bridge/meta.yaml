id: p5-01-math-bridge
phase: p5
order: 1
kind: lesson
title:
  en: "Math bridge: vectors & gradients"
  vi: "Cầu nối toán: vector & gradient"
summary:
  en: "Build visual intuition for vectors, dot products, MSE loss, gradients, and gradient descent in NumPy without derivative proofs."
  vi: "Xây dựng trực giác bằng hình ảnh về vector, tích vô hướng, hàm loss MSE, gradient và gradient descent trong NumPy mà không cần chứng minh đạo hàm."
level: beginner
tags: [ml-math, numpy]
