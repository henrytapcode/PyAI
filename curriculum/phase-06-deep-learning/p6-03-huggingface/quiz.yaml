questions:
  - id: p6-03-q01
    type: mcq
    tags: [huggingface]
    difficulty: 1
    answer: 1
    en:
      prompt: "What do the special tokens `[CLS]` and `[SEP]` represent when a BERT/DistilBERT tokenizer encodes a single sentence?"
      options:
        - "Padding tokens added at the end to match the longest batch row"
        - "Start (`[CLS]`) and end (`[SEP]`) sequence boundary markers"
        - "Two output class labels representing `NEGATIVE` and `POSITIVE`"
        - "Uppercase letters that the uncased tokenizer could not convert"
      explanation: "`tokenizer(text)` wraps each encoded sentence with `[CLS]` at the beginning and `[SEP]` at the end, adding two tokens beyond `tokenizer.tokenize(text)`."
    vi:
      prompt: "Hai token đặc biệt `[CLS]` và `[SEP]` có vai trò gì khi tokenizer của BERT/DistilBERT mã hóa một câu đơn?"
      options:
        - "Các token đệm thêm vào cuối để khớp chiều dài câu dài nhất"
        - "Dấu mốc ranh giới đầu (`[CLS]`) và cuối (`[SEP]`) chuỗi"
        - "Hai nhãn lớp đầu ra đại diện cho `NEGATIVE` và `POSITIVE`"
        - "Các chữ cái viết hoa mà tokenizer uncased không chuyển được"
      explanation: "`tokenizer(text)` bọc mỗi câu bằng `[CLS]` ở đầu và `[SEP]` ở cuối, nên tạo ra nhiều hơn `tokenizer.tokenize(text)` đúng 2 token."

  - id: p6-03-q02
    type: output
    tags: [huggingface]
    difficulty: 1
    code: |
      from transformers import AutoTokenizer

      REPO = "distilbert/distilbert-base-uncased-finetuned-sst-2-english"
      REV = "714eb0fa89d2f80546fda750413ed43d93601a13"

      tok = AutoTokenizer.from_pretrained(REPO, revision=REV, local_files_only=True)
      text = "Chatbot logs!"
      print(len(tok.tokenize(text)), len(tok(text)["input_ids"]))
    answer: "4 6"
    en:
      prompt: "What does this code print?"
      explanation: "`tok.tokenize(\"Chatbot logs!\")` returns 4 subword pieces (`['chat', '##bot', 'logs', '!']`), whereas `tok(text)[\"input_ids\"]` adds `[CLS]` and `[SEP]` for a total of `6` IDs."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`tok.tokenize(\"Chatbot logs!\")` trả về 4 mảnh token (`['chat', '##bot', 'logs', '!']`), còn `tok(text)[\"input_ids\"]` gắn thêm `[CLS]` và `[SEP]` nên tổng cộng có `6` ID."

  - id: p6-03-q03
    type: mcq
    tags: [huggingface]
    difficulty: 1
    answer: 2
    en:
      prompt: "What does pinning `revision` to a specific commit hash in `from_pretrained()` guarantee?"
      options:
        - "Doubles the number of CPU threads allocated during model inference"
        - "Converts an uncased tokenizer into a case-sensitive tokenizer"
        - "Loads the exact same snapshot of weights, tokenizer, and outputs"
        - "Automatically fine-tunes the checkpoint on your local dataset"
      explanation: "A repository on Hugging Face Hub can receive new commits at any time; pinning `revision` ensures your code always loads the exact same snapshot and prevents future updates from silently changing outputs."
    vi:
      prompt: "Việc ghim `revision` vào một mã commit cụ thể khi gọi `from_pretrained()` đảm bảo điều gì?"
      options:
        - "Tăng gấp đôi số luồng CPU được cấp phát trong lúc suy đoán"
        - "Biến tokenizer uncased thành tokenizer phân biệt chữ hoa thường"
        - "Luôn nạp đúng cùng một bản chụp trọng số, tokenizer và đầu ra"
        - "Tự động fine-tune lại checkpoint trên dữ liệu cục bộ của bạn"
      explanation: "Một repo trên Hugging Face Hub có thể được cập nhật bất cứ lúc nào; ghim `revision` giúp code luôn nạp đúng cùng một bản chụp cố định và tránh việc thay đổi âm thầm ở đầu ra."

  - id: p6-03-q04
    type: output
    tags: [huggingface, pytorch]
    difficulty: 1
    code: |
      import torch

      logits = torch.tensor([[0.0, 0.0], [-2.0, 2.0]])
      probs = torch.softmax(logits, dim=1)
      print([round(v, 3) for v in probs[0].tolist()], probs.argmax(dim=1).tolist())
    answer: "[0.5, 0.5] [0, 1]"
    en:
      prompt: "What does this code print?"
      explanation: "Equal logits `[0.0, 0.0]` become equal softmax probabilities `[0.5, 0.5]` (tie goes to index `0` in `argmax`), and `[-2.0, 2.0]` peaks at index `1`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Hai logit bằng nhau `[0.0, 0.0]` sau softmax cho xác suất `[0.5, 0.5]` (`argmax` chọn chỉ số đầu tiên `0` khi hòa), còn `[-2.0, 2.0]` đạt đỉnh ở chỉ số `1`."

  - id: p6-03-q05
    type: parsons
    tags: [huggingface, pytorch]
    difficulty: 1
    lines:
      - "import torch"
      - "logits = torch.tensor([[-1.5, 1.5]])"
      - "probs = torch.softmax(logits, dim=1)"
      - "pred = probs.argmax(dim=1).item()"
      - "print(pred, round(probs[0, pred].item(), 3))"
    en:
      prompt: "Arrange these lines in order to turn raw `logits` into probabilities, pick the winning class index, and print `(pred, score)`."
      explanation: "Import `torch`, define `logits`, compute `probs` with `torch.softmax`, pick `pred` with `probs.argmax`, and print `pred` alongside its rounded probability `probs[0, pred]`."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để đổi `logits` thô thành xác suất, chọn chỉ số lớp thắng cuộc và in `(pred, score)`."
      explanation: "Import `torch`, tạo `logits`, tính `probs` bằng `torch.softmax`, lấy `pred` bằng `probs.argmax`, rồi in `pred` cùng xác suất đã làm tròn `probs[0, pred]`."

  - id: p6-03-q06
    type: mcq
    tags: [huggingface]
    difficulty: 2
    answer: 0
    en:
      prompt: "In a padded batch returned by `tokenizer(texts, padding=True, return_tensors=\"pt\")`, what do `1` and `0` in `attention_mask` mean?"
      options:
        - "`1` marks a real token and `0` marks padding added to match width"
        - "`1` marks `POSITIVE` tokens and `0` marks `NEGATIVE` tokens in text"
        - "`1` marks `[CLS]` and `[SEP]`, while `0` marks all regular words"
        - "`1` enables gradient tracking and `0` turns on `torch.no_grad()`"
      explanation: "Because shorter sentences are padded to match the longest sentence in the batch, `attention_mask` tells the model which positions contain real tokens (`1`) versus padding (`0`)."
    vi:
      prompt: "Trong một batch có padding từ `tokenizer(texts, padding=True, return_tensors=\"pt\")`, giá trị `1` và `0` trong `attention_mask` có nghĩa là gì?"
      options:
        - "`1` là token thật và `0` là phần đệm padding cho bằng chiều dài"
        - "`1` đánh dấu từ mang nghĩa `POSITIVE` và `0` đánh dấu từ `NEGATIVE`"
        - "`1` đánh dấu `[CLS]` và `[SEP]`, còn `0` đánh dấu mọi từ thường"
        - "`1` bật theo dõi gradient và `0` kích hoạt ngữ cảnh `torch.no_grad()`"
      explanation: "Vì các câu ngắn được đệm thêm cho bằng độ dài câu dài nhất trong batch, `attention_mask` báo cho model biết vị trí nào là token thật (`1`) và vị trí nào là phần đệm (`0`)."

  - id: p6-03-q07
    type: output
    tags: [huggingface]
    difficulty: 2
    code: |
      from transformers import AutoTokenizer

      REPO = "distilbert/distilbert-base-uncased-finetuned-sst-2-english"
      REV = "714eb0fa89d2f80546fda750413ed43d93601a13"

      tok = AutoTokenizer.from_pretrained(REPO, revision=REV, local_files_only=True)
      batch = tok(["Ok!", "Fast and helpful answer."], padding=True, return_tensors="pt")
      print(tuple(batch["input_ids"].shape), batch["attention_mask"][0].tolist())
    answer: "(2, 7) [1, 1, 1, 1, 0, 0, 0]"
    en:
      prompt: "What does this code print?"
      explanation: "\"Fast and helpful answer.\" has 5 tokens plus `[CLS]` and `[SEP]` (length `7`), while \"Ok!\" has 2 tokens plus `[CLS]` and `[SEP]` (4 real tokens followed by 3 padding `0`s)."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "\"Fast and helpful answer.\" có 5 token cộng thêm `[CLS]` và `[SEP]` (dài `7`), còn \"Ok!\" có 2 token cộng `[CLS]` và `[SEP]` (4 token thật và 3 số `0` padding)."

