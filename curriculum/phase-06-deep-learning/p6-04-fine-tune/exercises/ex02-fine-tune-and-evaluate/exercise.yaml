hints:
  en:
    - |
      Follow §4 and §5: `accuracy` and `predict` run inside `model.eval()` and `torch.no_grad()`, `fine_tune` uses `model.train()` with `AdamW`, and `pick_epoch` ranks `(epoch, val_acc, val_loss)` tuples. For `epochs=0`, `fine_tune` returns `[]` without touching weights, and `pick_epoch([(1, 0.9, 0.5), (2, 0.9, 0.3)])` returns `2`.
    - |
      Step-by-step plan:
      1. In `accuracy` and `predict`, call `model.eval()`, tokenize `texts` with padding, truncation, and PyTorch tensors, and run inference inside `torch.no_grad()`; `accuracy` compares argmax IDs with integer labels and rounds to 3 decimals, while `predict` maps IDs via `model.config.id2label`.
      2. In `fine_tune`, return an empty list immediately when `epochs <= 0`; otherwise tokenize once, build integer labels, create `torch.optim.AdamW`, and on each epoch switch to `model.train()`, clear gradients, compute loss with `labels=y`, backpropagate, step, and record the loss rounded to 4 decimals.
      3. In `pick_epoch`, scan the `(epoch, val_acc, val_loss)` entries to choose the highest `val_acc`, breaking ties by lowest `val_loss` and keeping earlier epochs on full ties.
    - |
