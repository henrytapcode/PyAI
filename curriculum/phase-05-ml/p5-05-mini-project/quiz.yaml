questions:
  - id: p5-05-q01
    type: mcq
    tags: [model-evaluation, data-cleaning]
    difficulty: 1
    answer: 2
    en:
      prompt: "In an end-to-end classification workflow, when should you split off the holdout `test` set?"
      options:
        - "After tuning the decision threshold on all rows with `cross_val_predict`"
        - "After fitting `StandardScaler` on the full feature matrix `X`"
        - "Right after cleaning `(X, y)`, before running cross-validation or choosing thresholds"
        - "Only after picking the winning model so `test` uses the same predictions"
      explanation: "Splitting off the holdout `test` set before CV, scaling, or threshold tuning keeps `test` completely unseen until the single final evaluation."
    vi:
      prompt: "Trong quy trình phân loại từ đầu đến cuối, bạn nên tách riêng tập holdout `test` ở thời điểm nào?"
      options:
        - "Sau khi chỉnh ngưỡng quyết định trên toàn bộ dữ liệu bằng `cross_val_predict`"
        - "Sau khi gọi `StandardScaler().fit` trên toàn bộ ma trận `X`"
        - "Ngay sau khi làm sạch thành `(X, y)`, trước khi chạy cross-validation hay chọn ngưỡng"
        - "Chỉ sau khi đã chọn được mô hình thắng cuộc"
      explanation: "Tách tập holdout `test` ngay trước khi chạy CV, chuẩn hóa hay chỉnh ngưỡng giúp giữ `test` hoàn toàn chưa từng thấy cho tới lần chấm cuối."

  - id: p5-05-q02
    type: output
    tags: [data-cleaning]
    difficulty: 1
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "ticket_id": ["t1", "t1", "t2"],
          "plan": [" PRO", "free", "Free "],
      })
      df = df.drop_duplicates(subset=["ticket_id"], keep="first")
      df["plan"] = df["plan"].astype(str).str.strip().str.lower()
      print(df["plan"].tolist())
    answer: "['pro', 'free']"
    en:
      prompt: "What does this code print?"
      explanation: "`drop_duplicates(..., keep=\"first\")` removes the second `'t1'` row (`'free'`), leaving `' PRO'` and `'Free '`, which strip and lowercase to `['pro', 'free']`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`drop_duplicates(..., keep=\"first\")` giữ dòng `'t1'` đầu tiên (`' PRO'`) và bỏ dòng `'t1'` thứ hai (`'free'`), sau đó cắt khoảng trắng và chuyển chữ thường thành `['pro', 'free']`."

  - id: p5-05-q03
    type: fill
    tags: [data-cleaning]
    difficulty: 1
    code: |
      import pandas as pd

      raw = pd.DataFrame({"ticket_id": ["t1", "t2"], "tokens": ["1,200", "300"]})
      clean = raw["tokens"].astype(str).str.replace(",", "", regex=False)
      nums = pd.to_numeric(clean, errors="___")
      print(nums.astype("___").tolist())
    answer: ["coerce", "int64"]
    en:
      prompt: "Fill in the `pd.to_numeric` error mode that turns invalid strings into `NaN`, and the 64-bit integer dtype string."
      explanation: "`errors=\"coerce\"` turns unparseable entries into `NaN` instead of crashing, and `\"int64\"` ensures identical 64-bit integer output across 32-bit and 64-bit platforms."
    vi:
      prompt: "Điền chế độ xử lý lỗi của `pd.to_numeric` để biến chuỗi lỗi thành `NaN`, và tên kiểu số nguyên 64-bit."
      explanation: "`errors=\"coerce\"` biến giá trị không đọc được thành `NaN` thay vì văng lỗi, còn `\"int64\"` giữ kiểu số nguyên 64-bit đồng nhất giữa môi trường 32-bit và 64-bit."

  - id: p5-05-q04
    type: mcq
    tags: [model-evaluation, data-cleaning]
    difficulty: 2
    answer: 1
    en:
      prompt: "Your support-ticket table includes `escalated_to_oncall`, a column logged only after an engineer reviews the ticket and decides it was urgent. Why must this column be dropped before training?"
      options:
        - "Because binary `0/1` columns cause `StandardScaler` to divide by zero"
        - "Because it is target leakage—a post-outcome field unavailable when a new ticket arrives"
        - "Because `DecisionTreeClassifier` only accepts continuous floating-point features"
        - "Because dropping it increases the size of the holdout test split"
      explanation: "Features recorded after the label is decided leak the answer during CV and training, yet are missing at prediction time for brand-new tickets."
    vi:
      prompt: "Bảng log ticket có cột `escalated_to_oncall` chỉ được ghi lại sau khi kỹ sư xem xét xong ticket. Vì sao bắt buộc phải bỏ cột này trước khi huấn luyện?"
      options:
        - "Vì cột `0/1` làm `StandardScaler` chia cho 0"
        - "Vì đó là target leakage—cột hậu kiểm không tồn tại vào lúc ticket mới gửi tới"
        - "Vì `DecisionTreeClassifier` chỉ nhận feature số thực liên tục"
        - "Vì bỏ cột này làm tập holdout test có nhiều dòng hơn"
      explanation: "Feature chỉ biết được sau khi đã có kết quả sẽ làm rò rỉ đáp án lúc huấn luyện và CV, nhưng lại không có mặt khi dự đoán ticket mới ngoài thực tế."

  - id: p5-05-q05
    type: mcq
    tags: [model-evaluation]
    difficulty: 2
    answer: 0
    en:
      prompt: "In 5-fold CV on the training split, `logreg` scores `0.709 +/- 0.092` F1 and `tree` scores `0.701 +/- 0.140` F1. Which conclusion is honest?"
      options:
        - "Both models beat the `0.000` baseline, but their `0.008` gap is smaller than one std so neither is clearly better"
        - "`logreg` is statistically proven superior to `tree` across all future ticket batches"
        - "`tree` should be discarded because its standard deviation exceeds `0.10`"
        - "The dataset must contain target leakage because both F1 scores exceed `0.70`"
      explanation: "When two models' mean CV scores differ by less than their fold-to-fold standard deviation (`0.008 < 0.140`), random fold noise could easily flip the ranking."
    vi:
      prompt: "Trong CV 5 fold trên tập train, `logreg` đạt F1 `0.709 +/- 0.092` còn `tree` đạt `0.701 +/- 0.140`. Kết luận nào là trung thực?"
      options:
        - "Hai mô hình đều vượt baseline `0.000`, nhưng mức chênh `0.008` nhỏ hơn một độ lệch chuẩn nên chưa thể khẳng định mô hình nào tốt hơn"
        - "`logreg` đã được chứng minh vượt trội hoàn toàn so với `tree` trên mọi dữ liệu tương lai"
        - "Phải loại bỏ `tree` vì độ lệch chuẩn của nó lớn hơn `0.10`"
        - "Dữ liệu chắc chắn bị target leakage vì hai điểm F1 đều trên `0.70`"
      explanation: "Khi hiệu hai giá trị trung bình CV nhỏ hơn độ lệch chuẩn giữa các fold (`0.008 < 0.140`), sự khác biệt nằm trong vùng dao động ngẫu nhiên giữa các lần chia fold."

  - id: p5-05-q06
    type: output
    tags: [model-evaluation, sklearn]
    difficulty: 2
    code: |
      import numpy as np
      from sklearn.dummy import DummyClassifier
      from sklearn.metrics import f1_score

      X = np.array([[100.0], [200.0], [300.0], [400.0], [500.0]])
      y = np.array([0, 0, 0, 0, 1])
      preds = DummyClassifier(strategy="most_frequent").fit(X, y).predict(X)
      print(round(float((preds == y).mean()), 3), round(float(f1_score(y, preds, zero_division=0)), 3))
    answer: "0.8 0.0"
    en:
      prompt: "What does this code print?"
      explanation: "`DummyClassifier(strategy=\"most_frequent\")` predicts `0` for all 5 rows, getting `4/5 = 0.8` accuracy while scoring `0.0` F1 on class `1`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`DummyClassifier(strategy=\"most_frequent\")` đoán `0` cho cả 5 hàng nên đạt accuracy `4/5 = 0.8`, nhưng F1 của lớp `1` bằng `0.0`."

  - id: p5-05-q07
    type: mcq
    tags: [model-evaluation, sklearn]
    difficulty: 2
    answer: 3
    en:
      prompt: "Why does `evaluate_models` pass `make_scorer(f1_score, zero_division=0)` to `cross_val_score`?"
      options:
        - "Because `cross_val_score` only supports regression metrics without `make_scorer`"
        - "Because `zero_division=0` forces `LogisticRegression` to balance class weights automatically"
        - "Because `StratifiedKFold` raises a `ValueError` unless F1 is wrapped in `make_scorer`"
        - "Because a `DummyClassifier` predicting all `0`s triggers `UndefinedMetricWarning` on F1 without `zero_division=0`"
      explanation: "When a fold has zero predicted positives (`TP + FP == 0`), default `f1_score` emits `UndefinedMetricWarning`; wrapping with `zero_division=0` returns `0.0` cleanly."
    vi:
      prompt: "Vì sao `evaluate_models` truyền `make_scorer(f1_score, zero_division=0)` vào `cross_val_score`?"
      options:
        - "Vì `cross_val_score` chỉ hỗ trợ metric hồi quy nếu không dùng `make_scorer`"
        - "Vì `zero_division=0` ép `LogisticRegression` tự động cân bằng trọng số lớp"
        - "Vì `StratifiedKFold` sẽ ném `ValueError` nếu F1 không được bọc bằng `make_scorer`"
        - "Vì `DummyClassifier` đoán toàn `0` sẽ phát `UndefinedMetricWarning` khi tính F1 nếu thiếu `zero_division=0`"
      explanation: "Khi một fold không có dự đoán dương nào (`TP + FP == 0`), `f1_score` mặc định sẽ cảnh báo chia 0; truyền `zero_division=0` giúp trả về `0.0` sạch sẽ."

  - id: p5-05-q08
    type: fill
    tags: [model-evaluation, sklearn]
    difficulty: 2
    code: |
      import numpy as np
      from sklearn.dummy import DummyClassifier
      from sklearn.metrics import f1_score, make_scorer
      from sklearn.model_selection import StratifiedKFold, cross_val_score

      X = np.array([[0.0], [0.2], [0.4], [0.6], [1.8], [2.0], [2.2], [2.4], [2.6], [2.8]])
      y = np.array([0, 0, 0, 0, 1, 1, 1, 1, 0, 1])
      skf = StratifiedKFold(n_splits=5, shuffle=True, random_state=0)
      f1_safe = make_scorer(f1_score, zero_division=___)
      scores = cross_val_score(DummyClassifier(strategy="most_frequent"), X, y, cv=skf, scoring=___)
      print(round(float(scores.mean()), 3))
    answer: ["0", "f1_safe"]
    en:
      prompt: "Fill in the `zero_division` value and the `scoring` variable name so 5-fold CV on the majority-class dummy returns `0.0` without warnings."
      explanation: "`zero_division=0` returns `0.0` when no positive predictions occur, and passing `scoring=f1_safe` applies that scorer across every fold."
    vi:
      prompt: "Điền giá trị `zero_division` và tên biến `scoring` để CV 5 fold của mô hình baseline trả về `0.0` không phát warning."
      explanation: "`zero_division=0` trả về `0.0` khi không có dự đoán dương, và `scoring=f1_safe` áp dụng bộ chấm điểm đó cho mọi fold."

  - id: p5-05-q09
    type: mcq
    tags: [data-cleaning]
    difficulty: 2
    answer: 2
    en:
      prompt: "In our ticket log cleaner, why do we drop the 5 rows missing numeric values before `train_test_split`, instead of filling them with the entire dataset's mean first?"
      options:
        - "Because `pandas.DataFrame.fillna` only works on string columns"
        - "Because `train_test_split` refuses to split arrays that have fewer than 250 rows"
        - "Because dropping 2% of rows avoids inventing values and prevents full-dataset mean leakage across the train/test split"
        - "Because `DecisionTreeClassifier` ignores rows with integers and only reads `NaN`"
      explanation: "Computing a column mean over all rows before splitting leaks test-set statistics into training; when only ~2% of rows are incomplete, dropping them cleanly avoids both fabrication and leakage."
    vi:
      prompt: "Trong bước làm sạch log ticket, vì sao ta bỏ 5 dòng thiếu số liệu trước `train_test_split` thay vì điền bằng trung bình của toàn bộ bảng?"
      options:
        - "Vì `pandas.DataFrame.fillna` chỉ hoạt động trên cột chuỗi"
        - "Vì `train_test_split` từ chối chia các mảng có ít hơn 250 dòng"
        - "Vì bỏ 2% số dòng vừa tránh bịa giá trị vừa tránh rò rỉ giá trị trung bình của tập test vào tập train"
        - "Vì `DecisionTreeClassifier` bỏ qua số nguyên và chỉ đọc `NaN`"
      explanation: "Tính trung bình trên toàn bộ dữ liệu trước lúc chia làm thống kê tập test lọt vào tập train; khi chỉ thiếu khoảng 2% số dòng, bỏ trực tiếp vừa gọn vừa sạch leakage."

