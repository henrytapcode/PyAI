  # ---- P5: Machine learning, math, sklearn, evaluation (6 questions)
  - id: final-q13
    type: mcq
    tags: [model-evaluation, ml]
    difficulty: 2
    answer: 1
    en:
      prompt: "A fraud classifier sees 99% legitimate transactions and 1% fraud. Why is raw accuracy a poor primary metric here?"
      options:
        - "Because accuracy requires calibrated probabilities first"
        - "Because a dummy all-negative model already scores 99%"
        - "Because accuracy cannot be computed on binary labels"
        - "Because accuracy penalizes false positives twice as much"
      explanation: "On a 99:1 imbalanced dataset, predicting the majority class for every input achieves 99% accuracy while catching zero fraud. Metrics like Precision, Recall, F1, or PR-AUC measure minority-class performance."
    vi:
      prompt: "Một mô hình phát hiện gian lận gặp 99% giao dịch hợp lệ và 1% gian lận. Vì sao accuracy thuần túy là thước đo chính kém cho bài toán này?"
      options:
        - "Vì accuracy yêu cầu xác suất phải được hiệu chuẩn trước"
        - "Vì một mô hình ngây thơ luôn đoán âm tính đã đạt 99%"
        - "Vì accuracy không thể tính được trên nhãn nhị phân"
        - "Vì accuracy phạt dương tính giả nặng gấp đôi bình thường"
      explanation: "Trên tập dữ liệu lệch 99:1, việc luôn đoán lớp đa số cho mọi đầu vào đã đạt 99% accuracy dù không bắt được ca gian lận nào. Các thước đo như Precision, Recall, F1 hoặc PR-AUC mới phản ánh đúng hiệu quả trên lớp thiểu số."

  - id: final-q14
    type: output
    tags: [ml-math, numpy]
    difficulty: 3
    code: |
      w, b, lr = 1.0, 0.0, 0.1
      x, y = 2.0, 5.0
      pred = w * x + b
      grad_w = 2 * (pred - y) * x
      w = w - lr * grad_w
      print(round(pred, 2), round(w, 2))
    answer: "2.0 2.2"
    en:
      prompt: "What does this single gradient-descent step on squared error `(w*x + b - y)**2` print?"
      explanation: "`pred` is `2.0`, so `grad_w = 2 * (2.0 - 5.0) * 2.0 = -12.0`. Updating `w = 1.0 - 0.1 * (-12.0)` yields `2.2`."
    vi:
      prompt: "Bước cập nhật gradient descent đơn lẻ trên sai số bình phương `(w*x + b - y)**2` này in ra gì?"
      explanation: "`pred` bằng `2.0`, nên `grad_w = 2 * (2.0 - 5.0) * 2.0 = -12.0`. Cập nhật `w = 1.0 - 0.1 * (-12.0)` cho kết quả `2.2`."

  - id: final-q15
    type: mcq
    tags: [sklearn, supervised-learning]
    difficulty: 3
    answer: 2
    en:
      prompt: "Why should you wrap `StandardScaler()` and `LogisticRegression()` inside a `sklearn.pipeline.Pipeline` before running `cross_val_score`?"
      options:
        - "It reduces the number of folds automatically"
        - "It converts sparse matrices into dense tensors"
        - "It fits the scaler inside each training fold only"
        - "It tunes regularization `C` without extra code"
      explanation: "A `Pipeline` fits `StandardScaler` exclusively on each CV training split and applies those statistics to the validation split, preventing validation-fold data leakage."
    vi:
      prompt: "Vì sao bạn nên bọc `StandardScaler()` và `LogisticRegression()` vào `sklearn.pipeline.Pipeline` trước khi chạy `cross_val_score`?"
      options:
        - "Nó tự động giảm số lượng fold kiểm định chéo"
        - "Nó chuyển đổi ma trận thưa thành tensor dày đặc"
        - "Nó chỉ fit bộ chuẩn hóa trên phần train của từng fold"
        - "Nó tự động tối ưu tham số `C` mà không cần thêm code"
      explanation: "`Pipeline` đảm bảo `StandardScaler` chỉ học mean/std trên phần train của mỗi fold cross-validation rồi mới biến đổi phần validation, tránh rò rỉ dữ liệu giữa các fold."

  - id: final-q16
    type: fill
    tags: [model-evaluation]
    difficulty: 2
    code: |
      tp, fp, fn = 9, 1, 6
      precision = tp / (tp + ___)
      recall = tp / (tp + ___)
      f1 = 2 * precision * recall / (precision + recall)
      print(round(precision, 2), round(recall, 2), round(f1, 2))
    answer: ["fp", "fn"]
    en:
      prompt: "Fill in the two confusion-matrix terms so `precision`, `recall`, and `f1` print `0.9 0.6 0.72`."
      explanation: "Precision is `tp / (tp + fp)` (`9 / 10 = 0.9`) and Recall is `tp / (tp + fn)` (`9 / 15 = 0.6`), yielding harmonic mean `F1 = 0.72`."
    vi:
      prompt: "Điền hai thành phần của ma trận nhầm lẫn để `precision`, `recall` và `f1` in ra `0.9 0.6 0.72`."
      explanation: "Precision là `tp / (tp + fp)` (`9 / 10 = 0.9`) và Recall là `tp / (tp + fn)` (`9 / 15 = 0.6`), cho trung bình điều hòa `F1 = 0.72`."

  - id: final-q17
    type: mcq
    tags: [supervised-learning, ml]
    difficulty: 2
    answer: 0
    en:
      prompt: "Your model achieves 99% accuracy on the training set but only 68% on the validation set. Which diagnosis and fix is most appropriate?"
      options:
        - "High variance (overfitting); add regularization or more data"
        - "High bias (underfitting); increase model depth and features"
        - "Data leakage; remove the validation set completely"
        - "Label noise; switch accuracy to mean squared error"
      explanation: "A large gap between high training performance and low validation performance indicates overfitting (high variance). Stronger regularization, simpler models, or more diverse training data help close the gap."
    vi:
      prompt: "Mô hình của bạn đạt 99% accuracy trên tập train nhưng chỉ đạt 68% trên tập validation. Chẩn đoán và hướng xử lý nào phù hợp nhất?"
      options:
        - "Phương sai cao (overfitting); tăng regularization hoặc thêm dữ liệu"
        - "Độ chệch cao (underfitting); tăng độ sâu mô hình và số feature"
        - "Rò rỉ dữ liệu; xóa hoàn toàn tập validation đi"
        - "Nhiễu nhãn; đổi thước đo accuracy sang sai số bình phương"
      explanation: "Khoảng cách lớn giữa điểm train rất cao và điểm validation thấp là dấu hiệu overfitting (high variance). Tăng regularization, đơn giản hóa mô hình hoặc bổ sung dữ liệu train đa dạng sẽ giúp giảm khoảng cách này."

  - id: final-q18
    type: output
    tags: [ml-math, numpy]
    difficulty: 3
    code: |
      import numpy as np

      weights = np.array([3.0, -4.0])
      mse = 0.5
      lam = 0.1
      total_loss = mse + lam * float(np.sum(weights ** 2))
      print(round(total_loss, 2))
    answer: "3.0"
    en:
      prompt: "What does this L2-regularized loss calculation print?"
