      explanation: "Import `sqlite3`, open `:memory:`, create `reqs`, insert rows before running the `GROUP BY` error-rate query, and print the result."
    vi:
      prompt: "Sắp xếp các dòng để thêm hai request cho model `'a'` rồi in ra `[('a', 0.5)]`."
      explanation: "Import `sqlite3`, mở `:memory:`, tạo bảng `reqs`, thêm dữ liệu trước khi chạy truy vấn `GROUP BY` tính tỉ lệ lỗi và in kết quả."

