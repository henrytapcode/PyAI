  - id: iv-44
    topic: scope
    level: mid
    kind: coding
    code: |
      funcs = [lambda: i for i in range(3)]
      print([f() for f in funcs])
    en:
      question: "What does this print, and how do you get `[0, 1, 2]`?"
      answer: |
        It prints `[2, 2, 2]`. A closure remembers the variable `i`, not its value at the time the lambda was created. Python looks `i` up when the lambda is called, and by then the loop has finished with `i == 2`. This is called late binding.
        Fix by binding the current value as a default argument:
        ```python
        funcs = [lambda i=i: i for i in range(3)]
        ```
        or with `functools.partial`. The same trap appears when you create callbacks or tasks in a loop.
      tip: "State 'closures capture variables, not values' in your first sentence, then show the default-argument fix. It shows you understand scope, not only syntax."
    vi:
      question: "Đoạn code này in ra gì, và làm sao để có `[0, 1, 2]`?"
      answer: |
        Nó in `[2, 2, 2]`. Closure nhớ biến `i`, không phải giá trị của `i` lúc tạo lambda. Python tra `i` khi lambda được gọi, và lúc đó vòng lặp đã xong với `i == 2`. Đây gọi là late binding.
        Sửa bằng cách gán giá trị hiện tại làm tham số mặc định:
        ```python
        funcs = [lambda i=i: i for i in range(3)]
        ```
        hoặc dùng `functools.partial`. Cái bẫy tương tự xuất hiện khi tạo callback hoặc task trong vòng lặp.
      tip: "Câu đầu nói ngay 'closure bắt biến chứ không bắt giá trị', rồi đưa cách sửa bằng default argument. Cho thấy bạn hiểu scope chứ không chỉ cú pháp."

