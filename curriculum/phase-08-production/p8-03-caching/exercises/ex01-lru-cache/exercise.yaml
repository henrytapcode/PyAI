id: p8-03-ex01
kind: fill
title:
  en: "Fill: LRU cache with OrderedDict"
  vi: "Điền khuyết: LRU cache dùng OrderedDict"
difficulty: 1
tags: [production, performance, dicts]
hints:
  en:
    - |
      Review `LRUCache` in §5. An `OrderedDict` keeps keys from oldest (front) to most recently used (back): with `maxsize=2`, calling `set("a", 1)`, `set("b", 2)`, `peek("a")`, then `set("c", 3)` leaves `"a"` at the front so `"a"` is evicted and `evictions` becomes `1`.
    - |
      The plan:
      1. In `peek`, read from the underlying dictionary without altering key order or hit/miss counts.
      2. In `get`, when a key hits, move it to the most-recent end before returning its value.
      3. In `set`, when the cache grows past `maxsize`, remove the oldest entry from the front and bump the eviction counter by one.
    - |
      For `peek(key)`, read from `self._data` using the dictionary method that returns `None` instead of raising `KeyError`. On capacity overflow in `set`:
      ```python
      if len(self._data) > self.maxsize:
          self._data.popitem(last=...)
          self.evictions += ...
      ```
      Remember that `OrderedDict.popitem` removes from the oldest end when `last` is `False`.
  vi:
    - |
      Xem lại lớp `LRUCache` ở §5. `OrderedDict` giữ các key theo thứ tự từ cũ nhất (ở đầu) tới mới dùng nhất (ở cuối): với `maxsize=2`, gọi `set("a", 1)`, `set("b", 2)`, `peek("a")` rồi `set("c", 3)` giữ nguyên `"a"` ở đầu nên `"a"` bị loại bỏ và `evictions` bằng `1`.
    - |
      Kế hoạch:
      1. Trong `peek`, tra cứu từ điển bên trong mà không làm đổi thứ tự key hay các bộ đếm hit/miss.
      2. Trong `get`, khi trúng cache, đẩy key về cuối (mới dùng nhất) trước khi trả về giá trị.
      3. Trong `set`, khi số phần tử vượt `maxsize`, xóa phần tử lâu chưa dùng nhất ở đầu và tăng biến đếm eviction thêm một.
    - |
      Với `peek(key)`, hãy đọc từ `self._data` bằng phương thức của dict trả về `None` khi thiếu key thay vì ném `KeyError`. Khi cache vượt sức chứa trong `set`:
      ```python
      if len(self._data) > self.maxsize:
          self._data.popitem(last=...)
          self.evictions += ...
      ```
      Nhớ rằng `OrderedDict.popitem` xóa ở đầu cũ nhất khi `last` nhận giá trị `False`.
