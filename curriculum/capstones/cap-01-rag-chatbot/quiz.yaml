        - "So history and rewrites from one dialog never leak into another"
        - "Because `make_bot()` deletes and rebuilds the entire source FAQ list"
        - "So `FakeLLM` resets every embedding vector to zeros per turn"
      explanation: "Each golden dialog simulates an independent conversation; reusing one `ChatBot` across dialogs would contaminate turn 1 of dialog 2 with history from dialog 1."
    vi:
      prompt: "Vì sao `run_dialog_eval(make_bot, dialogs)` phải gọi `make_bot()` tạo bot mới cho từng dialog?"
      options:
        - "Vì `ChatBot.ask` khóa cứng chỉ mục vector sau đúng hai lượt hỏi đáp"
        - "Để lịch sử và câu viết lại của dialog trước không rò sang dialog sau"
        - "Vì `make_bot()` tự động xóa và tạo lại toàn bộ danh sách tài liệu FAQ"
        - "Để `FakeLLM` đặt lại toàn bộ vector embedding về không sau mỗi lượt"
      explanation: "Mỗi golden dialog mô phỏng một cuộc trò chuyện độc lập; dùng chung một `ChatBot` sẽ làm lượt 1 của dialog sau bị nhiễu bởi lịch sử của dialog trước."

  - id: cap-01-q10
    type: mcq
    tags: [evaluation, production]
