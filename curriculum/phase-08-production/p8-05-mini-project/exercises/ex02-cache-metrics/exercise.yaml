id: p8-05-ex02
kind: project
title:
  en: "Extend: add TTL cache, error handling, and metrics"
  vi: "Mở rộng: thêm TTL cache, xử lý lỗi và metric"
difficulty: 3
tags: [production, rag, apis, testing, performance]
hints:
  en:
    - |
      Combine §4 (Part 3: response caching) and §5 (Part 4: metrics) of this lesson with the `try / except / finally` error-recording pattern from `p8-04-monitoring` §7. On 0 records, `GET /metrics` returns `{"requests": 0, "cache_hit_rate": 0.0, "error_rate": 0.0, "p95_ms": 0.0, "total_cost": 0.0}`.
    - |
      The plan:
      1. Inside `create_app`, initialize the in-memory TTL store and the list of metric records alongside the pre-embedded corpus vectors.
      2. Build a cache key by normalizing whitespace in the question, pairing it with `top_k` in sorted JSON, and hashing with SHA-256.
      3. In `ask`, record the start time from `clock()`, initialize `status` to `"error"` and `cost` to `0.0`, and run cache lookup / retrieval / generation inside a `try / except / finally` block.
      4. On `RateLimitError`, skip storing anything in the cache and raise an HTTP `503` `HTTPException`, while `finally` still appends the latency and `"error"` status to the metric records.
      5. In `metrics`, accept an optional integer `last` validated with `Query(default=None, ge=1)`, slice the tail records when given, and compute `requests`, `cache_hit_rate`, `error_rate`, nearest-rank `p95_ms`, and rounded `total_cost` in that exact order.
    - |
      Follow this error-safe control-flow skeleton inside `create_app`:
      ```python
      @app.post("/ask")
      def ask(body: AskRequest) -> dict[str, object]:
          t0 = clock()
          status, cost, cached = "error", 0.0, False
          try:
              # check TTL cache; on miss run embed/retrieval/chat and store in cache
              ...
              status = "ok"
          except RateLimitError as exc:
              raise HTTPException(status_code=503, detail="model busy, retry later") from exc
          finally:
              records.append({"latency_ms": ..., "cost": cost, "cached": cached, "status": status})
          return {**payload, "usage": {"prompt_tokens": p_tok, "completion_tokens": c_tok}, "cached": cached}

      @app.get("/metrics")
      def metrics(last: int | None = Query(default=None, ge=1)) -> dict[str, object]:
          window = records if last is None else records[-last:]
          if not window:
              return {"requests": 0, "cache_hit_rate": 0.0, "error_rate": 0.0, "p95_ms": 0.0, "total_cost": 0.0}
          ...
      ```
  vi:
    - |
      Kết hợp §4 (Part 3: cache phản hồi) và §5 (Part 4: metric) trong bài này với mẫu `try / except / finally` ghi nhận lỗi ở `p8-04-monitoring` §7. Khi chưa có bản ghi nào, `GET /metrics` trả về `{"requests": 0, "cache_hit_rate": 0.0, "error_rate": 0.0, "p95_ms": 0.0, "total_cost": 0.0}`.
    - |
      Kế hoạch:
      1. Trong `create_app`, khởi tạo bộ lưu trữ TTL trong RAM và danh sách bản ghi metric bên cạnh các vector tài liệu đã embed sẵn.
      2. Tạo cache key bằng cách chuẩn hóa khoảng trắng câu hỏi, ghép cùng `top_k` thành JSON đã sắp xếp khóa rồi băm SHA-256.
      3. Trong `ask`, lấy mốc thời gian đầu bằng `clock()`, đặt sẵn `status` là `"error"` và `cost` là `0.0`, rồi bọc phần tra cache / truy xuất / sinh câu trả lời trong `try / except / finally`.
      4. Khi gặp `RateLimitError`, không ghi vào cache mà ném `HTTPException` mã `503`, trong khi nhánh `finally` vẫn lưu độ trễ và trạng thái `"error"` vào danh sách metric.
      5. Trong `metrics`, nhận tham số tùy chọn `last` kiểm tra bằng `Query(default=None, ge=1)`, cắt phần đuôi danh sách khi có tham số, rồi tính `requests`, `cache_hit_rate`, `error_rate`, `p95_ms` theo nearest-rank và `total_cost` làm tròn đúng theo thứ tự khóa đó.
    - |
      Dùng bộ khung luồng điều khiển an toàn trước lỗi sau đây trong `create_app`:
      ```python
      @app.post("/ask")
      def ask(body: AskRequest) -> dict[str, object]:
          t0 = clock()
          status, cost, cached = "error", 0.0, False
          try:
              # kiểm tra TTL cache; nếu trượt thì embed/truy xuất/chat và lưu vào cache
              ...
              status = "ok"
          except RateLimitError as exc:
              raise HTTPException(status_code=503, detail="model busy, retry later") from exc
          finally:
              records.append({"latency_ms": ..., "cost": cost, "cached": cached, "status": status})
          return {**payload, "usage": {"prompt_tokens": p_tok, "completion_tokens": c_tok}, "cached": cached}

      @app.get("/metrics")
      def metrics(last: int | None = Query(default=None, ge=1)) -> dict[str, object]:
          window = records if last is None else records[-last:]
          if not window:
              return {"requests": 0, "cache_hit_rate": 0.0, "error_rate": 0.0, "p95_ms": 0.0, "total_cost": 0.0}
          ...
      ```
