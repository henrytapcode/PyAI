  - id: p6-03-q13
    type: mcq
    tags: [huggingface]
    difficulty: 2
    answer: 1
    en:
      prompt: "When should you write the step-by-step `tokenizer` + `model` code instead of calling `pipeline()`?"
      options:
        - "Whenever you want `pipeline()` to download another model mid-request"
        - "When you need raw `logits`, custom padding, or weight fine-tuning"
        - "Whenever your input batch contains fewer than five English texts"
        - "Only when the repository has no matching `AutoTokenizer` class"
      explanation: "`pipeline()` is great for quick inference, while explicit `tokenizer` + `model` code gives access to raw logits, custom batching, and training loops (`p6-04-fine-tune`)."
    vi:
      prompt: "Khi nào bạn nên tự viết từng bước `tokenizer` + `model` thay vì gọi `pipeline()`?"
      options:
        - "Mỗi khi muốn `pipeline()` tải thêm model khác giữa lúc xử lý"
        - "Khi cần `logits` thô, chỉnh padding hoặc fine-tune trọng số"
        - "Mỗi khi danh sách đầu vào có ít hơn năm câu tiếng Anh ngắn"
        - "Chỉ khi kho lưu trữ không có sẵn lớp `AutoTokenizer` đi kèm"
      explanation: "`pipeline()` rất tiện để chạy thử nhanh, còn tự viết `tokenizer` + `model` giúp bạn lấy được logits thô, kiểm soát batch và viết vòng lặp fine-tune (`p6-04-fine-tune`)."

  - id: p6-03-q14
    type: fill
    tags: [huggingface, pytorch]
    difficulty: 3
    code: |
      import torch

      def predict_labels(logits: torch.Tensor, id2label: dict[int, str]) -> list[tuple[str, float]]:
          probs = torch.softmax(logits, dim=___)
          pred_ids = logits.argmax(dim=___)
          return [
              (id2label[idx], round(prob_row[idx], 3))
              for prob_row, idx in zip(probs.tolist(), pred_ids.tolist())
          ]

      out = predict_labels(torch.tensor([[-2.0, 2.0]]), {0: "NEGATIVE", 1: "POSITIVE"})
      print(out)
    answer: [["1", "-1"], ["1", "-1"]]
    en:
      prompt: "Fill in the `dim` argument for both `torch.softmax` and `argmax` so each sentence row is scored across classes."
      explanation: "For a 2D tensor of shape `(N, num_classes)`, `dim=1` (or `dim=-1`) runs across the class columns for each sentence row."
    vi:
      prompt: "Điền giá trị `dim` cho cả `torch.softmax` và `argmax` để tính xác suất và chọn lớp theo từng hàng câu."
      explanation: "Với tensor 2D có shape `(N, số_lớp)`, `dim=1` (hoặc `dim=-1`) tính dọc theo các cột lớp của từng hàng câu."

  - id: p6-03-q15
    type: mcq
    tags: [huggingface]
    difficulty: 3
    answer: 2
    en:
      prompt: "The SST-2 sentiment pipeline returns `{'label': 'POSITIVE', 'score': 0.996}` on `\"Oh wonderful, another crash right before the demo.\"`. Why does that happen, and what should you do before deploying it?"
      options:
        - "Tokenizer skipped `[CLS]`/`[SEP]`; pass `add_special_tokens=True` to fix sarcasm"
        - "Softmax guarantees any score above `0.95` is accurate, so the sentence is positive"
        - "A 2-class model forces one bucket on sarcasm; test on your own labelled sample"
        - "Calling `model.train()` during inference lowers the confidence score below `0.5`"
      explanation: "A high softmax score only reflects the gap between the two raw logits, not real-world correctness. Measure precision and recall on your own domain examples before trusting or fine-tuning the model."
    vi:
      prompt: "Pipeline cảm xúc SST-2 trả về `{'label': 'POSITIVE', 'score': 0.996}` cho câu `\"Oh wonderful, another crash right before the demo.\"`. Vì sao lại thế và bạn cần làm gì trước khi đưa vào dùng?"
      options:
        - "Tokenizer quên `[CLS]`/`[SEP]`; hãy truyền `add_special_tokens=True` để sửa mỉa mai"
        - "Softmax đảm bảo mọi điểm trên `0.95` luôn đúng, nên câu này chắc chắn là tích cực"
        - "Model 2 lớp ép chọn một nhãn với câu mỉa mai; cần đo trên mẫu có nhãn của bạn"
        - "Gọi `model.train()` khi suy luận (inference) sẽ kéo điểm xác suất giảm xuống dưới mức `0.5`"
      explanation: "Điểm softmax cao chỉ phản ánh độ chênh giữa hai logit thô chứ không chứng minh dự đoán đúng thực tế. Hãy đo precision và recall trên dữ liệu của bạn trước khi tin dùng hoặc fine-tune."

