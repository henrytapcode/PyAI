  - id: p6-04-q11
    type: mcq
    tags: [dl, huggingface]
    difficulty: 2
    answer: 1
    en:
      prompt: "How should you decide how many epochs to fine-tune your classifier?"
      options:
        - "Train for several epoch counts and pick the one with the highest accuracy on the test split"
        - "Watch accuracy and loss on the validation split, pick the epoch count there, and touch the test split only once at the end"
        - "Always stop after 1 epoch so the pretrained weights never change"
        - "Keep training until training loss hits `0.000` regardless of validation accuracy"
      explanation: "Selecting epochs on the test split leaks test information into your design choice; use validation to choose hyperparameters and evaluate test once at the end."
    vi:
      prompt: "Bạn nên chọn số epoch khi fine-tune bộ phân loại như thế nào?"
      options:
        - "Thử nhiều số epoch rồi chọn mức cho accuracy cao nhất trên tập test"
        - "Theo dõi accuracy và loss trên tập validation để chốt số epoch, và chỉ chạm tập test đúng một lần ở cuối"
        - "Luôn dừng sau đúng 1 epoch để trọng số nền không thay đổi"
        - "Train tiếp cho tới khi train loss chạm `0.000` bất kể điểm validation"
      explanation: "Nhìn tập test để chọn số epoch làm rò rỉ thông tin tập test vào thiết kế; hãy dùng tập validation để chọn siêu tham số và chỉ chấm test một lần cuối cùng."

  - id: p6-04-q12
    type: output
    tags: [pytorch]
    difficulty: 2
    code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(0)
      net = nn.Sequential(nn.Linear(4, 4), nn.Dropout(0.5))
      x = torch.ones(2, 4)
      net.train()
      with torch.no_grad():
          same_train = torch.equal(net(x), net(x))
      net.eval()
      with torch.no_grad():
          same_eval = torch.equal(net(x), net(x))
      print(same_train, same_eval)
    answer: "False True"
    en:
      prompt: "What does this code print?"
      explanation: "With `net.train()`, `nn.Dropout(0.5)` randomly zeroes different entries on each call (`False`); with `net.eval()`, dropout is disabled so both calls return identical outputs (`True`)."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Ở chế độ `net.train()`, `nn.Dropout(0.5)` tắt ngẫu nhiên các phần tử khác nhau qua từng lần gọi (`False`); khi bật `net.eval()`, dropout ngừng hoạt động nên hai lần chạy ra kết quả giống hệt (`True`)."

