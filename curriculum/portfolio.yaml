# Portfolio projects shown on /portfolio, listed by increasing difficulty (the validator checks the order).
# Each one is something you can put on a CV and talk about in an interview.
# `lesson` links to the project lesson; capstones without a lesson show as "coming soon".
projects:
  - id: grade-report
    lesson: p1-06-mini-project
    phase: p1
    difficulty: 1
    tags: [functions, lists, dicts]
    title: { en: "Grade report generator", vi: "Trình tạo bảng điểm" }
    pitch:
      en: "Turn raw student scores into a clean report: averages, letter grades, best and worst performers. The same shape as any small reporting script you will write at work."
      vi: "Biến điểm thô của học sinh thành một bảng báo cáo gọn gàng: điểm trung bình, xếp loại, người cao nhất và thấp nhất. Đây cũng là khung của mọi script báo cáo nhỏ bạn sẽ viết khi đi làm."
    cv_bullet:
      en: "Built a Python reporting tool that turns raw score data into a ranked, formatted summary (averages, letter grades, top/bottom performers), verified by automated tests."
      vi: "Xây dựng công cụ báo cáo bằng Python, chuyển dữ liệu điểm thô thành bảng tổng hợp có xếp hạng và định dạng (điểm trung bình, xếp loại, nhóm cao/thấp nhất), được kiểm chứng bằng test tự động."
    skills: ["Python functions", "lists & dicts", "string formatting", "sorting with key="]
    stretch:
      en: ["Read the scores from a CSV file", "Export the report as Markdown", "Add a histogram of grades with text bars"]
      vi: ["Đọc điểm từ file CSV", "Xuất báo cáo ra Markdown", "Thêm biểu đồ phân bố điểm bằng thanh ký tự"]

  - id: expense-tracker
    lesson: p2-09-mini-project
    phase: p2
    difficulty: 2
    tags: [dataclasses, json, context-managers]
    title: { en: "Expense tracker", vi: "Ứng dụng quản lý chi tiêu" }
    pitch:
      en: "Record expenses, save them to JSON and get monthly and per-category summaries. You model real data with dataclasses and handle bad input safely, which is daily work for any backend or data engineer."
      vi: "Ghi lại các khoản chi, lưu ra JSON và xem tổng hợp theo tháng và theo danh mục. Bạn mô hình hóa dữ liệu thật bằng dataclass và xử lý dữ liệu lỗi an toàn, việc hằng ngày của kỹ sư backend hay data."
    cv_bullet:
      en: "Developed an expense tracker that models transactions with dataclasses, persists them to JSON with input validation, and produces monthly and per-category spending summaries."
      vi: "Phát triển ứng dụng quản lý chi tiêu: mô hình hóa giao dịch bằng dataclass, lưu trữ JSON có kiểm tra dữ liệu đầu vào, và tổng hợp chi tiêu theo tháng và theo danh mục."
    skills: ["dataclasses", "type hints", "JSON persistence", "context managers", "error handling"]
    stretch:
      en: ["Add a budget per category with warnings", "Import a bank-statement CSV", "Wrap it in a small command-line interface with argparse"]
      vi: ["Thêm ngân sách cho từng danh mục kèm cảnh báo", "Nhập file CSV sao kê ngân hàng", "Bọc thành giao diện dòng lệnh nhỏ bằng argparse"]

  - id: text-toolkit
    lesson: p3-05-mini-project
    phase: p3
    difficulty: 3
    tags: [testing, logging, data-prep]
    title: { en: "Text-cleaning toolkit for AI datasets", vi: "Bộ công cụ làm sạch văn bản cho dữ liệu AI" }
    pitch:
      en: "Every LLM and NLP project starts with messy text. Build a small, well-tested module that normalises whitespace and Unicode, removes duplicates and masks emails and phone numbers, with logging so you can see what it changed."
      vi: "Mọi dự án LLM và NLP đều bắt đầu từ văn bản lộn xộn. Hãy xây một module nhỏ, có test kỹ, để chuẩn hóa khoảng trắng và Unicode, bỏ trùng lặp, che email và số điện thoại, kèm logging để biết nó đã sửa gì."
    cv_bullet:
      en: "Built a text-normalisation toolkit for NLP datasets (whitespace/Unicode cleanup, de-duplication, PII masking) with parametrized pytest suites, fixtures and structured logging."
      vi: "Xây dựng bộ công cụ chuẩn hóa văn bản cho dữ liệu NLP (làm sạch khoảng trắng/Unicode, khử trùng lặp, che thông tin cá nhân) với bộ test pytest parametrize, fixture và logging có cấu trúc."
    skills: ["pytest", "fixtures & parametrize", "logging", "regular expressions", "clean code with ruff"]
    stretch:
      en: ["Publish it as an installable package with uv", "Add a CLI that cleans a whole folder", "Measure how many rows each rule changed"]
      vi: ["Đóng gói để cài được bằng uv", "Thêm CLI làm sạch cả một thư mục", "Đo mỗi quy tắc đã sửa bao nhiêu dòng"]

  - id: data-analysis
    lesson: p4-06-mini-project
    phase: p4
    difficulty: 3
    tags: [data]
    title: { en: "Exploratory data analysis report", vi: "Báo cáo phân tích dữ liệu khám phá" }
    pitch:
      en: "Take a real public dataset, clean it with Pandas, answer three business questions with numbers and charts, and write up what you found."
      vi: "Lấy một bộ dữ liệu công khai thật, làm sạch bằng Pandas, trả lời ba câu hỏi kinh doanh bằng số liệu và biểu đồ, rồi viết lại những gì bạn phát hiện."
    cv_bullet:
      en: "Performed exploratory analysis of a public dataset with Pandas and Matplotlib: cleaned missing and inconsistent values, aggregated key metrics and presented findings with charts."
      vi: "Phân tích khám phá một bộ dữ liệu công khai bằng Pandas và Matplotlib: xử lý giá trị thiếu và không nhất quán, tổng hợp chỉ số chính và trình bày kết quả bằng biểu đồ."
    skills: ["NumPy", "Pandas", "Matplotlib", "SQL basics", "data cleaning"]

  - id: ml-classifier
    lesson: p5-05-mini-project
    phase: p5
    difficulty: 4
    tags: [ml, evaluation]
    title: { en: "Support-ticket classifier", vi: "Bộ phân loại ticket hỗ trợ" }
    pitch:
      en: "Route customer messages to the right team with scikit-learn. You learn the workflow that matters more than the model: a clean train/test split, a baseline, and honest evaluation."
      vi: "Phân loại tin nhắn khách hàng về đúng bộ phận bằng scikit-learn. Bạn học quy trình quan trọng hơn cả mô hình: chia train/test đúng cách, có baseline và đánh giá trung thực."
    cv_bullet:
      en: "Trained and evaluated a scikit-learn text classifier for routing support tickets, comparing against a baseline with cross-validation, precision/recall and confusion-matrix analysis."
      vi: "Huấn luyện và đánh giá bộ phân loại văn bản bằng scikit-learn để định tuyến ticket hỗ trợ, so sánh với baseline qua cross-validation, precision/recall và ma trận nhầm lẫn."
    skills: ["scikit-learn", "train/test split", "cross-validation", "precision & recall"]

  - id: rag-qa
    lesson: p7-09-mini-project-rag
    phase: p7
    difficulty: 4
    tags: [rag, llm]
    title: { en: "Documentation Q&A with RAG", vi: "Hỏi đáp tài liệu bằng RAG" }
    pitch:
      en: "Answer questions about a set of FAQ documents with an LLM that cites its sources and refuses when context is missing. Chunking, embeddings, vector search and grounded prompts: the most requested skill in AI engineering job posts."
      vi: "Trả lời câu hỏi về một bộ tài liệu FAQ bằng LLM có trích dẫn nguồn và từ chối khi thiếu thông tin. Chia đoạn, embedding, tìm kiếm vector và prompt có căn cứ: kỹ năng được tuyển nhiều nhất trong các tin tuyển AI Engineer."
    cv_bullet:
      en: "Built a retrieval-augmented Q&A system over FAQ documents: chunking, embeddings, in-memory NumPy vector search, grounded answers with [n] citations and refusals, evaluated across dev and held-out test splits."
      vi: "Xây dựng hệ thống hỏi đáp tăng cường truy xuất (RAG) trên tài liệu FAQ: chia đoạn, embedding, tìm kiếm vector trong RAM bằng NumPy, trả lời có trích dẫn [n] và từ chối khi thiếu căn cứ, được đánh giá trên tập dev và held-out test."
    skills: ["embeddings", "NumPy vector search", "prompting", "RAG", "evals"]

  - id: tool-agent
    lesson: p7-10-mini-project-agent
    phase: p7
    difficulty: 5
    tags: [agents, llm]
    title: { en: "Tool-using assistant agent", vi: "Agent trợ lý dùng tool" }
    pitch:
      en: "An order-support agent that looks up orders, tracks shipments, checks refund policy and gates side-effect refunds behind an approval callback, with step, repeat and token-budget limits plus scenario tests."
      vi: "Một agent hỗ trợ đơn hàng biết tra cứu đơn, theo dõi vận chuyển, kiểm tra chính sách hoàn tiền và chặn lệnh hoàn tiền qua cổng duyệt, có giới hạn số bước, chống lặp, ngân sách token và bộ kịch bản kiểm thử."
    cv_bullet:
      en: "Implemented a bounded tool-using support agent with an allowlisted toolbox, input validation, step/repeat/budget limits, code-controlled approval gates with audit logs, and deterministic scenario tests."
      vi: "Triển khai agent hỗ trợ dùng tool có giới hạn an toàn: toolbox theo allowlist, kiểm tra đầu vào, giới hạn bước/chống lặp/ngân sách token, cổng duyệt cho thao tác có tác dụng phụ kèm nhật ký kiểm tra và bộ kịch bản test tất định."
    skills: ["tool use", "allowlisted toolbox", "agent loops", "approval gates", "scenario testing"]

  - id: rag-service
    lesson: p8-05-mini-project
    phase: p8
    difficulty: 5
    tags: [rag, production, apis, testing]
    title: { en: "Production RAG service with FastAPI", vi: "Dịch vụ RAG với FastAPI chuẩn production" }
    pitch:
      en: "Wrap your RAG pipeline in a testable FastAPI service with an app factory, /ask citations and refusals, an in-memory TTL cache, RateLimitError 503 handling, /metrics (p95 latency, cost, hit rate, error rate), and a Dockerfile—verified with TestClient and FakeClock."
      vi: "Đưa pipeline RAG thành dịch vụ FastAPI kiểm thử được với app factory, /ask có trích dẫn và từ chối, TTL cache trong RAM, xử lý RateLimitError trả 503, /metrics (độ trễ p95, chi phí, tỉ lệ cache hit, tỉ lệ lỗi) và Dockerfile—kiểm chứng bằng TestClient và FakeClock."
    cv_bullet:
      en: "Built a FastAPI RAG service via an isolated app factory with one-time document indexing, cited /ask responses and low-score refusals, TTL response caching, 503 RateLimitError handling, /metrics tracking (p95 latency, cost, cache hit rate, error rate), a Dockerfile, and deterministic TestClient + FakeClock tests."
      vi: "Xây dựng dịch vụ RAG bằng FastAPI qua app factory cô lập trạng thái: đánh chỉ mục tài liệu một lần, /ask có trích dẫn và từ chối khi điểm thấp, TTL cache phản hồi, xử lý RateLimitError trả 503, /metrics (độ trễ p95, chi phí, tỉ lệ cache hit, tỉ lệ lỗi), Dockerfile và bộ test tất định bằng TestClient cùng FakeClock."
    skills: ["FastAPI", "app factory", "TTL caching", "monitoring & metrics", "TestClient & FakeClock", "Dockerfile"]
    stretch:
      en:
        - "Swap FakeLLM for a real LLM client loading API keys from .env via pydantic-settings"
        - "Move the in-memory TTL cache to Redis so multiple uvicorn workers share hits"
        - "Export latency and token metrics to OpenTelemetry"
      vi:
        - "Thay FakeLLM bằng client LLM thật đọc API key từ .env qua pydantic-settings"
        - "Chuyển TTL cache từ RAM sang Redis để nhiều worker uvicorn dùng chung cache"
        - "Xuất các metric độ trễ và token sang OpenTelemetry"

  - id: cap-rag-chatbot
    lesson: cap-01-rag-chatbot
    phase: p8
    difficulty: 5
    tags: [rag, evaluation, production, apis, testing]
    title: { en: "Capstone: RAG chatbot with evals", vi: "Capstone: RAG chatbot có eval" }
    pitch:
      en: "Upgrade single-turn FAQ RAG into a stateful multi-turn chatbot (follow-up rewriting, token-budgeted history, [n] citations and refusals), guard changes with a golden dialog eval regression gate, and expose a FastAPI session service accepting any bot with ask()—verified with stub bots via TestClient and FakeClock and wired to ChatBot when run live."
      vi: "Nâng cấp RAG hỏi-đáp một lượt thành chatbot nhiều lượt có trạng thái (viết lại câu nối tiếp, lịch sử theo ngân sách token, trích dẫn [n] và từ chối an toàn), chặn hồi quy bằng cổng eval golden dialog, và mở dịch vụ phiên FastAPI nhận bất kỳ bot nào có ask()—kiểm thử bằng bot giả qua TestClient cùng FakeClock và nối với ChatBot khi chạy thật."
    cv_bullet:
      en: "Built a multi-turn RAG chatbot (deterministic follow-up rewriting, pinned-system token-budgeted history, [n] citation validation, and unanswerable refusals), a golden dialog regression gate (fixed/broken vs. baseline), and a FastAPI TTL/LRU session service accepting any ask()-compatible bot (verified with stub bots via TestClient and FakeClock, wired to ChatBot in production)."
      vi: "Xây dựng chatbot RAG nhiều lượt (viết lại câu nối tiếp tất định, lịch sử theo ngân sách token ghim system prompt, kiểm tra trích dẫn [n] và từ chối ngoài phạm vi), cổng chống hồi quy bằng golden dialog (fixed/broken so baseline), và dịch vụ phiên FastAPI quản lý TTL/LRU nhận bất kỳ bot nào có ask() (kiểm thử bằng bot giả qua TestClient cùng FakeClock, nối với ChatBot khi chạy thật)."
    skills: ["multi-turn RAG", "query rewriting", "token budgeting", "dialog evals", "FastAPI sessions", "TestClient & FakeClock"]
    stretch:
      en:
        - "Swap the deterministic rewriter for an LLM contextualizer using an API key loaded from .env to resolve pronoun follow-ups"
        - "Persist sessions in Redis hashes with EXPIRE TTL so multiple uvicorn workers share session state"
        - "Stream tokens over Server-Sent Events (SSE) from POST /sessions/{id}/messages"
      vi:
        - "Thay bộ viết lại tất định bằng LLM viết lại ngữ cảnh đọc API key từ .env để xử lý các câu hỏi nối tiếp dùng đại từ"
        - "Lưu phiên vào Redis hash kèm lệnh EXPIRE để nhiều worker uvicorn dùng chung trạng thái phiên"
        - "Stream từng token qua Server-Sent Events (SSE) từ endpoint POST /sessions/{id}/messages"

  - id: cap-tool-agent
    lesson: cap-02-tool-agent
    phase: p8
    difficulty: 5
    tags: [agents, production, logging, llm]
    title: { en: "Capstone: production tool agent", vi: "Capstone: agent dùng tool cho production" }
    pitch:
      en: "Harden a tool-using agent for production: enforce per-request tool allowlists, write-cap policies, and destructive confirmation gates with full audit logs; guard the agent loop with idempotent FakeClock backoff retries and hard token/USD budgets; and emit JSONL trace spans for nearest-rank p95 latency and budget reporting."
      vi: "Gia cố agent dùng tool cho production: áp đặt allowlist tool theo request, trần chính sách ghi và cổng xác nhận thao tác hủy kèm audit log; bảo vệ vòng lặp agent bằng retry backoff idempotent với FakeClock cùng ngân sách token/USD cứng; và xuất span trace JSONL để báo cáo độ trễ p95 nearest-rank và mức dùng ngân sách."
    cv_bullet:
      en: "Hardened a production tool-using agent with per-request allowlist scoping, risk-tiered policy caps and confirmation gates, idempotent exponential-backoff retries with hard token/cost budgets, and JSONL trace span aggregation (p95 latency, retry counts, and budget utilization)."
      vi: "Gia cố agent dùng tool cho production với phân quyền allowlist theo request, trần chính sách theo mức rủi ro và cổng xác nhận, retry backoff lũy tiến cho lệnh idempotent kèm ngân sách token/chi phí cứng, và tổng hợp span trace JSONL (độ trễ p95, số lần retry và mức dùng ngân sách)."
    skills: ["scoped tool permissions", "audit logging", "idempotent retries", "cost budgeting", "JSONL trace spans", "p95 reporting"]
    stretch:
      en:
        - "Add per-tool circuit breakers that trip into denied_policy for 60s after 3 consecutive tool_error failures"
        - "Export TraceRecorder spans to OpenTelemetry and ship batches to Jaeger or Grafana Tempo"
        - "Persist ScopedRegistry.audit_log entries to an append-only SQLite table for compliance audits"
      vi:
        - "Thêm circuit breaker theo từng tool để ngắt sang denied_policy trong 60 giây sau 3 lỗi tool_error liên tiếp"
        - "Xuất các span của TraceRecorder sang OpenTelemetry và gửi theo lô về Jaeger hoặc Grafana Tempo"
        - "Lưu các bản ghi ScopedRegistry.audit_log vào bảng SQLite append-only để phục vụ kiểm toán"
