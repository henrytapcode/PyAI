  # ---- numpy
  - id: p4-test-q01
    type: mcq
    tags: [numpy, lists]
    difficulty: 1
    answer: 2
    code: |
      import numpy as np

      py_a = [1, 2]
      py_b = [3, 4]
      np_a = np.array([1, 2])
      np_b = np.array([3, 4])
    en:
      prompt: "What is the difference between `py_a + py_b` and `np_a + np_b`?"
      options:
        - "`py_a + py_b` adds element by element (`[4, 6]`), whereas `np_a + np_b` joins the two arrays (`[1 2 3 4]`)"
        - "Both `py_a + py_b` and `np_a + np_b` return `[4, 6]`"
        - "`py_a + py_b` joins the two lists (`[1, 2, 3, 4]`), whereas `np_a + np_b` adds element by element (`[4 6]`)"
        - "`np_a + np_b` raises a `TypeError` because arrays cannot use `+`"
      explanation: "On Python `list` objects, `+` concatenates them end to end. On NumPy arrays, `+` performs vectorised element-wise addition."
    vi:
      prompt: "Sự khác nhau giữa `py_a + py_b` và `np_a + np_b` là gì?"
      options:
        - "`py_a + py_b` cộng từng phần tử (`[4, 6]`), còn `np_a + np_b` nối hai mảng (`[1 2 3 4]`)"
        - "Hai biểu thức `py_a + py_b` và `np_a + np_b` đều cho ra `[4, 6]`"
        - "`py_a + py_b` nối hai list lại (`[1, 2, 3, 4]`), còn `np_a + np_b` cộng từng phần tử tương ứng (`[4 6]`)"
        - "`np_a + np_b` gây lỗi `TypeError` vì mảng không dùng được toán tử `+`"
      explanation: "Trên `list` Python, toán tử `+` ghép hai danh sách nối tiếp nhau. Trên mảng NumPy, `+` thực hiện phép cộng vector hóa theo từng phần tử."

  - id: p4-test-q02
    type: fill
    tags: [numpy, data]
    difficulty: 2
    code: |
      import numpy as np

      # 3 days (rows) x 2 models (columns)
      tokens = np.array([[100, 300], [200, 400], [150, 250]])
      per_model = tokens.sum(axis=___)
      print(per_model.tolist())  # [450, 950]
    answer: ["0"]
    en:
      prompt: "Fill in the `axis` value to compute the total tokens for each of the 2 models (`[450, 950]`)."
      explanation: "Because the 2 models are columns, `axis=0` aggregates down each column (collapsing the 3 day rows) to return `[450, 950]`. `axis=1` would sum across each day instead."
    vi:
      prompt: "Điền giá trị `axis` để tính tổng token cho từng trong 2 model (`[450, 950]`)."
      explanation: "Vì 2 model nằm ở các cột nên `axis=0` cộng dọc theo từng cột (gộp 3 hàng ngày) để trả về `[450, 950]`. Dùng `axis=1` sẽ cộng ngang theo từng ngày."

  - id: p4-test-q03
    type: output
    tags: [numpy, booleans]
    difficulty: 2
    code: |
      import numpy as np

      latencies = np.array([120, 250, 410, 180, 520])
      kept = latencies[(latencies >= 150) & (latencies <= 450)]
      print(kept.tolist())
    answer: "[250, 410, 180]"
    en:
      prompt: "What does this code print?"
      explanation: "Each comparison is wrapped in parentheses and combined with `&`, producing a boolean mask that keeps values between `150` and `450` inclusive: `250`, `410`, and `180`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Mỗi phép so sánh được bọc trong ngoặc đơn và nối bằng `&`, tạo boolean mask giữ lại các giá trị từ `150` đến `450` (tính cả hai đầu): `250`, `410` và `180`."

  # ---- pandas
  - id: p4-test-q04
    type: output
    tags: [pandas]
    difficulty: 3
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "model": ["mini", "base", "pro"],
          "score": [0.60, 0.90, 0.85],
      })
      top = df[df["score"] >= 0.80].sort_values("score")
      print(top.iloc[0]["model"], top.loc[1, "model"])
    answer: "pro base"
    en:
      prompt: "What does this code print?"
      explanation: "Filtering keeps labels `1` (`base`, `0.90`) and `2` (`pro`, `0.85`), and sorting ascending puts `pro` at integer position `0` (`iloc[0]`) while `base` still keeps its original label `1` (`loc[1]`)."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Phép lọc giữ lại nhãn `1` (`base`, `0.90`) và `2` (`pro`, `0.85`), rồi sắp xếp tăng dần đưa `pro` lên vị trí số `0` (`iloc[0]`) trong khi `base` vẫn giữ nhãn gốc `1` (`loc[1]`)."

  - id: p4-test-q05
    type: mcq
    tags: [pandas, data]
    difficulty: 2
    answer: 1
    code: |
      import pandas as pd

      df = pd.DataFrame({
          "model": ["mini", "pro", "mini"],
          "tokens": [100, 400, 300],
      })
      summary = df.groupby("model")["tokens"].agg(["count", "mean"])
    en:
      prompt: "What is stored in `summary`?"
      options:
        - "A 3-row DataFrame matching `df`'s original rows with two extra columns"
        - "A 2-row DataFrame indexed by `model` (`mini`, `pro`) with columns `count` and `mean`"
        - "A 1D Series containing four numbers in a single list"
        - "It raises `ValueError` because `agg()` only accepts one aggregation name"
      explanation: "`groupby(\"model\")[\"tokens\"].agg([\"count\", \"mean\"])` splits rows by unique `model`, applies both functions to each group's `tokens`, and combines the results into a table with one row per model and columns `count` and `mean`."
    vi:
      prompt: "Biến `summary` lưu kết quả gì?"
      options:
        - "Một DataFrame 3 hàng giữ nguyên các hàng gốc của `df` kèm thêm hai cột mới"
        - "Một DataFrame 2 hàng có index là `model` (`mini`, `pro`) cùng hai cột `count` và `mean`"
        - "Một Series 1 chiều chứa bốn con số trong một list duy nhất"
        - "Gây lỗi `ValueError` vì `agg()` chỉ nhận một tên hàm tổng hợp mỗi lần"
      explanation: "`groupby(\"model\")[\"tokens\"].agg([\"count\", \"mean\"])` tách các hàng theo từng `model` duy nhất, áp dụng cả hai phép tính lên cột `tokens` của mỗi nhóm rồi gộp thành bảng có một hàng cho mỗi model với hai cột `count` và `mean`."

