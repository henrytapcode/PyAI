id: p8-04-ex01
kind: fill
title:
  en: "Fill: nearest-rank percentile and latency report"
  vi: "Điền khuyết: tính percentile nearest-rank và báo cáo độ trễ"
difficulty: 1
tags: [production, performance, lists]
hints:
  en:
    - |
      Review nearest-rank percentiles in §3: sort a copy of the list first, find the 1-based rank by rounding `p / 100 * n` up, and read the corresponding element from the sorted list. For `[10, 20, 30, 40]` with `p=50`, the rank is `2`, so the result is `20.0`.
    - |
      The plan:
      1. Build a sorted copy of `values` so the caller's original list stays untouched.
      2. Compute the integer 1-based rank by taking the ceiling of the percentage fraction times the list length.
      3. Convert that 1-based rank to a 0-based index to look up the element in the sorted list.
      4. In `latency_report`, reuse `percentile` to compute the 95th percentile alongside `p50` and `max`.
    - |
      Focus on converting the 1-based rank into a 0-based index in `percentile`:
      ```python
      def percentile(values: list[float], p: float) -> float:
          ordered = ...(values)
          if not values or p <= 0 or p > 100:
              raise ValueError("values must be non-empty and p must be in (0, 100]")
          rank = math....(p / 100 * len(ordered))
          # rank is 1-based; Python list indices start at 0
          return float(ordered[...])
      ```
  vi:
    - |
      Xem lại phần nearest-rank ở §3: sắp xếp thành một bản sao trước, tính hạng bắt đầu từ 1 bằng cách làm tròn lên `p / 100 * n`, rồi lấy phần tử tương ứng trong danh sách đã sắp xếp. Với `[10, 20, 30, 40]` và `p=50`, hạng là `2` nên kết quả là `20.0`.
    - |
      Kế hoạch:
      1. Tạo một bản sao đã sắp xếp của `values` để không làm đổi danh sách gốc của người gọi.
      2. Tính hạng nguyên bắt đầu từ 1 bằng cách làm tròn lên tỉ lệ phần trăm nhân với độ dài danh sách.
      3. Đổi hạng bắt đầu từ 1 sang chỉ số bắt đầu từ 0 để truy cập phần tử trong danh sách đã sắp xếp.
      4. Trong `latency_report`, gọi lại `percentile` cho mốc 95 bên cạnh `p50` và `max`.
    - |
      Tập trung vào bước đổi hạng 1-based sang chỉ số 0-based trong `percentile`:
      ```python
      def percentile(values: list[float], p: float) -> float:
          ordered = ...(values)
          if not values or p <= 0 or p > 100:
              raise ValueError("values must be non-empty and p must be in (0, 100]")
          rank = math....(p / 100 * len(ordered))
          # rank bắt đầu từ 1; chỉ số list trong Python bắt đầu từ 0
          return float(ordered[...])
      ```
