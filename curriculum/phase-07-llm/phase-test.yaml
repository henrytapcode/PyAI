      dev_runs = [
          {"cfg": ("words", 2, 0.2), "hit": 3, "facts": 2, "refusal": 1},
          {"cfg": ("sent", 2, 0.3), "hit": 4, "facts": 4, "refusal": 2},
          {"cfg": ("sent", 3, 0.1), "hit": 4, "facts": 4, "refusal": 0},
      ]
      winner = max(dev_runs, key=lambda r: (r["facts"], r["refusal"], r["hit"]))["cfg"]
      test_rows = [
          {"hit": True, "facts": True, "refusal": None},
          {"hit": True, "facts": False, "refusal": None},
          {"hit": None, "facts": None, "refusal": True},
      ]
      hits = sum(1 for r in test_rows if r["hit"] is True)
      facts = sum(1 for r in test_rows if r["facts"] is True)
      refusals = sum(1 for r in test_rows if r["refusal"] is True)
      print(winner, f"hit={hits}/2 facts={facts}/2 refusal={refusals}/1")
    answer: "('sent', 2, 0.3) hit=2/2 facts=1/2 refusal=1/1"
    en:
      prompt: "What does this dev-selection and single held-out test reporting snippet print?"
      explanation: "Comparing candidate `(chunk, k, min_score)` settings on `dev_runs` picks `('sent', 2, 0.3)` because it ties on `facts=4` and wins the `refusal=2` tie-breaker. Evaluating that single winner once on `test_rows` yields `hit=2/2`, `facts=1/2`, and `refusal=1/1`."
    vi:
