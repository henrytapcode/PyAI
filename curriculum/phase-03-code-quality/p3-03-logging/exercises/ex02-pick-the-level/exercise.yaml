id: p3-03-ex02
kind: fill
title:
  en: "Fill: pick the right level"
  vi: "Điền chỗ trống: chọn đúng level"
difficulty: 1
tags: [logging, functions]
hints:
  en:
    - |
      Look at the level table in §2: each row says what a level is for ("use it for"). The comment next to each blank describes a situation: "a detail for bug hunting", "odd, but we carry on", "the operation failed". Your job is to match each situation to one row of that table.
    - |
      The plan:
      1. Read the three comments one by one.
      2. For each one, find the row in the §2 table whose "use it for" column describes the same kind of event.
      3. Write only the method name in place of `___` (the method has the same name as the level, in lower case, such as `logger.info(...)`).
    - |
      The shape:
      ```python
      logger.debug("reply has %d characters", len(reply))
      ...
      logger.___("empty reply, retrying (attempt %d)", attempt)
      ...
      logger.___("giving up after %d attempts", attempt)
      ```
      The first line is filled in as an example of a "detail for bug hunting". For the other two, ask: does the program carry on, or did the operation fail?
  vi:
    - |
      Hãy nhìn bảng level ở §2: mỗi dòng nói level đó dùng để làm gì (cột "use it for"). Comment bên cạnh mỗi chỗ trống mô tả một tình huống: "chi tiết để tìm lỗi", "lạ, nhưng vẫn chạy tiếp", "thao tác thất bại". Việc của bạn là ghép từng tình huống với một dòng của bảng đó.
    - |
      Kế hoạch:
      1. Đọc lần lượt ba comment.
      2. Với mỗi cái, tìm dòng trong bảng §2 mà cột "use it for" mô tả cùng loại sự kiện.
      3. Chỉ viết tên method vào chỗ của `___` (method có cùng tên với level, viết thường, như `logger.info(...)`).
    - |
      Hình dạng của lời giải:
      ```python
      logger.debug("reply has %d characters", len(reply))
      ...
      logger.___("empty reply, retrying (attempt %d)", attempt)
      ...
      logger.___("giving up after %d attempts", attempt)
      ```
      Dòng đầu được điền sẵn làm ví dụ cho "chi tiết để tìm lỗi". Với hai dòng còn lại, hãy hỏi: chương trình vẫn đi tiếp, hay thao tác đã thất bại?
