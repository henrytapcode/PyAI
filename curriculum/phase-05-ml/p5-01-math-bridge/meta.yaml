duration_min: 14
outcomes:
  en:
    - "Vectors and the dot product in NumPy"
    - "A gradient as the downhill direction"
    - "Gradient descent on a straight line"
    - "Tune the learning rate by watching how loss changes"
  vi:
    - "Vector và tích vô hướng trong NumPy"
    - "Gradient là hướng xuống dốc"
    - "Gradient descent cho một đường thẳng"
    - "Chọn learning rate bằng cách quan sát sự thay đổi của loss"
review_by: "2027-11-01"
