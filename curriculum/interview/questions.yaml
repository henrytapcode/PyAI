  - id: iv-06
    topic: decorators
    level: mid
    kind: concept
    code: |
      import functools
      import time

      def timed(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              start = time.perf_counter()
              result = func(*args, **kwargs)
              print(f"{func.__name__}: {time.perf_counter() - start:.3f}s")
              return result
          return wrapper
    en:
      question: "What is a decorator? Explain the example."
      answer: |
        A decorator is a function that takes a function and returns a new function with extra behaviour around it. Writing `@timed` above `def f()` is shorthand for `f = timed(f)`.
        In the example, `wrapper` records the time, calls the original function with the same `*args, **kwargs` (so it fits any signature), prints the duration, and returns the original result. `functools.wraps` copies the original name and docstring so debugging and help text still make sense.
        Typical uses: logging, timing, retries, caching (`functools.lru_cache`), and permission checks in web frameworks. A decorator that takes arguments, like `@retry(times=3)`, needs one more nesting level.
      tip: "Show you can desugar `@timed` to `f = timed(f)` and explain `wraps`. Naming a practical use (retry, cache) makes it concrete."
    vi:
      question: "Decorator là gì? Giải thích ví dụ."
      answer: |
        Decorator là hàm nhận vào một hàm và trả về hàm mới có thêm hành vi bao quanh. Viết `@timed` phía trên `def f()` là cách viết gọn của `f = timed(f)`.
        Trong ví dụ, `wrapper` ghi lại thời gian, gọi hàm gốc với cùng `*args, **kwargs` (nên hợp với mọi chữ ký), in thời lượng rồi trả về kết quả gốc. `functools.wraps` sao chép tên và docstring của hàm gốc để debug và help vẫn có ý nghĩa.
        Dùng phổ biến cho logging, đo thời gian, retry, cache (`functools.lru_cache`) và kiểm tra quyền trong web framework. Decorator có tham số, như `@retry(times=3)`, cần thêm một tầng lồng nhau.
      tip: "Cho thấy bạn khai triển được `@timed` thành `f = timed(f)` và giải thích `wraps`. Nêu một ứng dụng thực tế (retry, cache) để câu trả lời cụ thể."

  - id: iv-35
    topic: decorators
    level: mid
    kind: coding
    code: |
      @retry(times=3, delay=1.0)
      def call_api():
          ...
    en:
      question: "Write the `retry` decorator used above. It should retry a failing function with exponential backoff."
      answer: |
        ```python
        import functools
        import time

        def retry(times=3, delay=1.0, exceptions=(Exception,)):
            def decorator(func):
                @functools.wraps(func)
                def wrapper(*args, **kwargs):
                    for attempt in range(1, times + 1):
                        try:
                            return func(*args, **kwargs)
                        except exceptions:
                            if attempt == times:
                                raise          # give up, keep the original error
                            time.sleep(delay * 2 ** (attempt - 1))  # 1s, 2s, 4s...
                return wrapper
            return decorator
        ```
        Three layers: `retry(...)` takes the settings, `decorator` takes the function, `wrapper` runs it. Retry only errors that can succeed later (timeouts, 429, 5xx), not bugs like `ValueError`. In real projects consider the `tenacity` library, and add random jitter so many clients do not retry at the same moment.
      tip: "Be ready to explain why there are three nested functions. Mentioning which exceptions to retry, a retry limit and jitter shows production thinking."
    vi:
      question: "Viết decorator `retry` được dùng ở trên. Nó phải thử lại hàm bị lỗi với exponential backoff."
      answer: |
        ```python
        import functools
        import time

        def retry(times=3, delay=1.0, exceptions=(Exception,)):
            def decorator(func):
                @functools.wraps(func)
                def wrapper(*args, **kwargs):
                    for attempt in range(1, times + 1):
                        try:
                            return func(*args, **kwargs)
                        except exceptions:
                            if attempt == times:
                                raise          # bỏ cuộc, giữ nguyên lỗi gốc
                            time.sleep(delay * 2 ** (attempt - 1))  # 1s, 2s, 4s...
                return wrapper
            return decorator
        ```
        Ba tầng: `retry(...)` nhận cấu hình, `decorator` nhận hàm, `wrapper` chạy hàm. Chỉ retry những lỗi có thể thành công về sau (timeout, 429, 5xx), không retry lỗi lập trình như `ValueError`. Trong dự án thật hãy cân nhắc thư viện `tenacity`, và thêm jitter ngẫu nhiên để nhiều client không retry cùng một lúc.
      tip: "Hãy sẵn sàng giải thích vì sao có ba hàm lồng nhau. Nhắc đến loại exception cần retry, giới hạn số lần và jitter cho thấy tư duy production."

  - id: iv-36
