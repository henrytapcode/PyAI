  # ---- sql
  - id: p4-test-q13
    type: mcq
    tags: [sql]
    difficulty: 2
    answer: 2
    code: |
      import sqlite3

      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE runs (model TEXT, score REAL)")
      target = "gpt-4o"
    en:
      prompt: "Which statement safely queries rows where `model` equals `target` using a SQLite parameter?"
      options:
        - "`conn.execute(\"SELECT score FROM runs WHERE model = ?\", target)`"
        - "`conn.execute(\"SELECT score FROM runs WHERE model = ?\", (target))`"
        - "`conn.execute(\"SELECT score FROM runs WHERE model = ?\", (target,))`"
        - "`conn.execute(f\"SELECT score FROM runs WHERE model = '{target}'\")`"
      explanation: "SQLite's `?` placeholder expects a sequence (such as a tuple) of parameters. Without the trailing comma, `(target)` is just the string `\"gpt-4o\"` (6 characters for 1 `?`), causing `ProgrammingError`; `(target,)` is a 1-element tuple, and f-strings risk syntax errors or SQL injection."
    vi:
      prompt: "Câu lệnh nào truy vấn an toàn các dòng có `model` bằng `target` bằng tham số của SQLite?"
      options:
        - "`conn.execute(\"SELECT score FROM runs WHERE model = ?\", target)`"
        - "`conn.execute(\"SELECT score FROM runs WHERE model = ?\", (target))`"
        - "`conn.execute(\"SELECT score FROM runs WHERE model = ?\", (target,))`"
        - "`conn.execute(f\"SELECT score FROM runs WHERE model = '{target}'\")`"
      explanation: "Placeholder `?` của SQLite yêu cầu một tuple (hoặc chuỗi phần tử) chứa tham số. Thiếu dấu phẩy, `(target)` chỉ là chuỗi `\"gpt-4o\"` (6 ký tự cho 1 dấu `?`), gây lỗi `ProgrammingError`; `(target,)` mới là tuple một phần tử, còn f-string dễ lỗi cú pháp và dính SQL injection."

  - id: p4-test-q14
    type: mcq
    tags: [sql]
    difficulty: 3
    answer: 1
    code: |
      SELECT model, ROUND(AVG(score), 2)
      FROM runs
      WHERE score >= 0.5
      GROUP BY model
      HAVING COUNT(*) >= 2
      ORDER BY model
    en:
      prompt: "You want to exclude individual runs with `score < 0.5`, then report only models that still have at least 2 runs. Why must `score >= 0.5` stay in `WHERE` and `COUNT(*) >= 2` go in `HAVING`?"
      options:
        - "`HAVING` runs before `WHERE`, so `COUNT(*)` is ready for `WHERE` to use"
        - "`WHERE` filters individual rows before `GROUP BY` builds the groups, whereas `HAVING` filters whole groups after `COUNT(*)` is calculated"
        - "`WHERE` only accepts numeric comparisons and `HAVING` only accepts `>=`"
        - "Moving `COUNT(*) >= 2` into `WHERE` gives the exact same result"
      explanation: "SQL executes `FROM` -> `WHERE` -> `GROUP BY` -> `HAVING` -> `SELECT` -> `ORDER BY`. Filtering out bad rows in `WHERE` happens before grouping, while `HAVING` can inspect group aggregates like `COUNT(*)`."
    vi:
      prompt: "Bạn muốn loại bỏ từng lần chạy có `score < 0.5`, rồi chỉ báo cáo những model còn ít nhất 2 lần chạy. Vì sao `score >= 0.5` phải đặt trong `WHERE` còn `COUNT(*) >= 2` phải đặt trong `HAVING`?"
      options:
        - "`HAVING` chạy trước `WHERE`, nên `COUNT(*)` đã có sẵn cho `WHERE` dùng"
        - "`WHERE` lọc từng dòng riêng lẻ trước khi `GROUP BY` tạo nhóm, còn `HAVING` lọc cả nhóm sau khi đã tính `COUNT(*)`"
        - "`WHERE` chỉ nhận phép so sánh số, còn `HAVING` chỉ nhận dấu `>=`"
        - "Chuyển `COUNT(*) >= 2` vào `WHERE` vẫn cho kết quả y hệt"
      explanation: "SQL chạy theo thứ tự `FROM` -> `WHERE` -> `GROUP BY` -> `HAVING` -> `SELECT` -> `ORDER BY`. Lọc dòng hỏng ở `WHERE` diễn ra trước khi gom nhóm, còn `HAVING` kiểm tra các hàm tổng hợp của nhóm như `COUNT(*)`."

  - id: p4-test-q15
    type: output
    tags: [sql]
    difficulty: 1
    code: |
      import sqlite3

      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE chats (id INTEGER, rating INTEGER)")
      conn.executemany(
          "INSERT INTO chats (id, rating) VALUES (?, ?)",
          [(1, 5), (2, None), (3, 4)],
      )
      rows = conn.execute(
          "SELECT id FROM chats WHERE rating IS NULL ORDER BY id"
      ).fetchall()
      print(rows)
      conn.close()
    answer: "[(2,)]"
    en:
      prompt: "What does this code print?"
      explanation: "Python `None` becomes SQL `NULL`, and `WHERE rating IS NULL` matches only row `2`, returning a list with the 1-element tuple `[(2,)]`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`None` trong Python trở thành `NULL` trong SQL, và `WHERE rating IS NULL` chỉ khớp với dòng `2`, trả về list chứa tuple một phần tử `[(2,)]`."

