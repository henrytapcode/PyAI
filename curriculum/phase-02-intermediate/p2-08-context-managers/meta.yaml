id: p2-08-context-managers
phase: p2
order: 8
kind: lesson
title:
  en: "Context managers"
  vi: "Context manager"
summary:
  en: "Use the with statement for guaranteed clean-up, and write your own context managers as a class or with contextlib."
  vi: "Dùng câu lệnh with để luôn dọn dẹp, và tự viết context manager bằng class hoặc bằng contextlib."
level: beginner
tags: [context-managers, files, exceptions]
prerequisites: [p2-07-decorators, p2-03-inheritance, p1-09-files, p1-10-exceptions]
duration_min: 12
outcomes:
  en:
    - "Explain what with guarantees, even when an error happens"
    - "Write a class with __enter__ and __exit__ and say when returning True hides an error"
    - "Write a manager with @contextmanager, yield and try/finally"
    - "Build a timer and a temporary setting"
  vi:
    - "Giải thích with đảm bảo điều gì, kể cả khi có lỗi"
    - "Viết class có __enter__ và __exit__ và biết khi nào trả về True làm lỗi bị giấu"
    - "Viết manager bằng @contextmanager, yield và try/finally"
    - "Xây dựng timer và setting tạm thời"
review_by: "2027-10-01"
further_reading:
