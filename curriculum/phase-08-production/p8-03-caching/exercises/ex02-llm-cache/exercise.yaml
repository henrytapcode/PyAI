title:
  en: "Write: LLM cache key builder and TTL cache"
  vi: "Viết code: hàm tạo cache key cho LLM và TTL cache"
difficulty: 2
tags: [production, performance, llm]
hints:
  en:
    - |
      Combine the key builder from §3 (`json.dumps(..., sort_keys=True)` + `hashlib.sha256`) with the expiration check from §6 (`now >= expires_at`). For `make_key("mini", [{"role": "user", "content": "  Hi   there "}], temperature=0.0, max_tokens=50)`, passing `max_tokens=50, temperature=0.0` must produce the exact same 64-character hex digest.
    - |
      The plan:
      1. In `make_key`, copy each message dict so you never mutate the caller's list, collapse whitespace in string content, bundle `model`, the cleaned messages, and `params` into one dict, serialize with sorted keys, and return the SHA-256 hex digest.
      2. In `TTLCache`, validate positive `ttl`, initialize hit/miss counters and a storage dict, store `(value, now + ttl)` on `set`, and on `get` treat missing or expired entries as misses (deleting expired ones).
      3. In `hit_rate()`, divide hits by total lookups while returning `0.0` if no lookups occurred yet.
    - |
