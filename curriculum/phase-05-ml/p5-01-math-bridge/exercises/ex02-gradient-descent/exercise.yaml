    - |
      This follows §3 (MSE loss) and §5 (gradient descent for `w` and `b`). For `xs = np.array([1.0, 2.0])` and `ys = np.array([3.0, 5.0])`, `mse(2.0, 1.0, xs, ys)` is `0.0` because `2.0 * xs + 1.0` matches `ys` exactly.
    - |
      The plan:
      1. Inside `mse`, compute `pred = w * xs + b` and return `float(np.mean((pred - ys) ** 2))`.
      2. Inside `fit_line`, start with `w = 0.0` and `b = 0.0`.
      3. Repeat `steps` times: compute `pred`, then `grad_w` and `grad_b` using the formulas in the prompt, then update `w -= lr * grad_w` and `b -= lr * grad_b`.
      4. Return `(round(float(w), 3), round(float(b), 3))`.
    - |
      The shape for `fit_line`:
      ```python
      w, b = 0.0, 0.0
      for _ in range(steps):
          pred = ...
          grad_w = ...
          grad_b = ...
          w = w - lr * grad_w
          b = b - lr * grad_b
      return (round(float(w), 3), round(float(b), 3))
      ```
      Remember to also finish `mse(w, b, xs, ys)` above `fit_line` so both functions return built-in Python floats.
