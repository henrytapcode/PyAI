description:
  en: "16 questions covering PyTorch tensors and autograd, training loops with DataLoader, Hugging Face tokenizers and models, and end-to-end fine-tuning."
  vi: "16 câu hỏi về tensor và autograd trong PyTorch, vòng lặp huấn luyện với DataLoader, tokenizer và model Hugging Face, cùng quy trình fine-tune hoàn chỉnh."
