id: p7-04-ex02
kind: code
title:
  en: "Write: build MiniStore with upsert, list filter, and delete"
  vi: "Viết code: xây MiniStore có upsert, lọc danh sách và xóa"
difficulty: 2
tags: [llm, numpy, oop]
hints:
  en:
    - |
      This combines `VectorStore` from §2, metadata pre-filtering from §3, and `delete()`/`add()` upsert notes from §4. Adding `["c1"]`, `["cheap car rental"]`, updating `"c1"` to `["fast laptop repair"]` keeps `len(store) == 1`, and searching `"affordable vehicle"` with `where={"lang": ["en", "vi"]}` returns matching IDs.
    - |
      The plan:
      1. Store parallel lists for IDs, texts, and metadata dictionaries alongside a set of seen IDs and a NumPy matrix that starts empty.
      2. In `add`, validate equal lengths and reject duplicate IDs within the incoming batch; embed all texts once, overwrite existing IDs in place, and append/stack only new records.
      3. In `search`, return early if empty or non-positive limit; filter records using exact matching or list membership after verifying the key exists in metadata, then score matching rows against the query vector and take stable top-k rounded to three decimals.
      4. In `delete`, raise a key error if the ID is missing; otherwise remove the entry from all parallel lists and delete that row from the matrix.
    - |
      Class skeleton with core spots left as `...`:
      ```python
