  # ---- rag
  - id: p7-test-q09
    type: parsons
    tags: [rag, llm]
    difficulty: 2
    lines:
      - "from pyai_llm import FakeLLM, cosine"
      - 'client, q = FakeLLM(embed_dim=256), "How many days do refunds take?"'
      - "qv = client.embed([q])[0]"
      - 'best = max(["Shipping takes 5 days.", "Refunds take 30 days."], key=lambda t: cosine(client.embed([t])[0], qv))'
      - "sys_msg = f\"Context:\\n[1] {best}\\nOnly use context; say I don't know if missing.\""
      - 'resp = client.chat([{"role": "system", "content": sys_msg}, {"role": "user", "content": q}])'
      - "print(resp.content)"
    en:
      prompt: "Arrange these lines in order to embed a query, pick the top chunk by cosine similarity, build a grounded `Context:` prompt, and print the RAG answer."
      explanation: "Import `FakeLLM` and `cosine`, create `client` and `q`, embed `q` into `qv`, select `best` via `cosine(..., qv)`, format the `Context:` system prompt, call `client.chat(...)`, and print `resp.content`."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để embed câu hỏi, chọn chunk cao điểm nhất theo cosine similarity, dựng prompt `Context:` có quy tắc bám nguồn và in câu trả lời RAG."
      explanation: "Import `FakeLLM` và `cosine`, tạo `client` và `q`, embed `q` thành `qv`, chọn `best` qua `cosine(..., qv)`, dựng system prompt có `Context:`, gọi `client.chat(...)` rồi in `resp.content`."

  - id: p7-test-q10
    type: output
    tags: [rag]
    difficulty: 2
    code: |
      doc = "Returns take 30 days.\n\nKeep your receipt.\n\nShipping is free over $50."
      chunks, cur = [], []
      for para in doc.split("\n\n"):
          if cur and len((" ".join(cur + [para])).split()) > 7:
              chunks.append(" ".join(cur))
              cur = [para]
          else:
              cur.append(para)
      if cur:
          chunks.append(" ".join(cur))
      best_score, min_score = 0.18, 0.30
      reply = "I don't know." if best_score < min_score else "CALL_LLM"
      print(len(chunks), chunks[0], "|", reply)
    answer: "2 Returns take 30 days. Keep your receipt. | I don't know."
    en:
      prompt: "What does this paragraph-chunking and `min_score` gating snippet print?"
      explanation: "Paragraphs 1 and 2 together total `7` words (`<= 7`), forming chunk 0, while paragraph 3 (`5` words) would make `12 > 7` and starts chunk 1 (`len(chunks) == 2`). Since `best_score = 0.18 < 0.30`, the pipeline skips calling the LLM and returns `\"I don't know.\"`."
    vi:
      prompt: "Đoạn code gom chunk theo đoạn và chặn theo ngưỡng `min_score` này in ra gì?"
      explanation: "Đoạn 1 và 2 gộp lại có `7` từ (`<= 7`) nên thành chunk 0, còn đoạn 3 (`5` từ) sẽ vượt `7` nên tách sang chunk 1 (`len(chunks) == 2`). Do `best_score = 0.18 < 0.30`, pipeline bỏ qua lời gọi LLM và trả `\"I don't know.\"`."

  - id: p7-test-q11
    type: mcq
    tags: [rag]
    difficulty: 3
    answer: 0
    code: |
      import re

      hits = [{"source": "faq.md"}, {"source": "terms.md"}]
      reply = "See policy [0] and [2]."
      sources = [hits[int(n) - 1]["source"] for n in re.findall(r"\[(\d+)\]", reply) if int(n) <= len(hits)]
      print(sources)
    en:
      prompt: "This citation extractor prints `['terms.md', 'terms.md']` for `'See policy [0] and [2].'` instead of ignoring `[0]`. What causes this bug?"
      options:
        - "Without `1 <= int(n)`, `[0]` gives index `-1` and reads the last hit"
        - "The regex `r'\\[(\\d+)\\]'` skips `[0]` and matches `[2]` twice instead"
        - "Python list comprehensions evaluate `int(n) - 1` from right to left"
        - "Using `len(hits)` without subtracting `1` duplicates the final item"
      explanation: "Checking only `int(n) <= len(hits)` allows `0`: `int('0') - 1` evaluates to `-1`, which Python treats as the last element (`hits[-1] == 'terms.md'`). Citations must satisfy `1 <= int(n) <= len(hits)`."
    vi:
      prompt: "Bộ trích dẫn này in `['terms.md', 'terms.md']` cho `'See policy [0] and [2].'` thay vì bỏ qua `[0]`. Nguyên nhân lỗi là gì?"
      options:
        - "Thiếu `1 <= int(n)` khiến `[0]` thành chỉ số `-1` và lấy nhầm mục cuối"
        - "Regex `r'\\[(\\d+)\\]'` bỏ qua `[0]` rồi khớp trùng `[2]` thành hai lần"
        - "List comprehension trong Python duyệt `int(n) - 1` từ phải sang trái"
        - "Dùng `len(hits)` mà không trừ `1` làm nhân đôi phần tử đứng cuối danh sách"
      explanation: "Chỉ kiểm tra `int(n) <= len(hits)` đã để lọt số `0`: `int('0') - 1` ra `-1`, khiến Python lấy phần tử cuối (`hits[-1] == 'terms.md'`). Cần ràng buộc đầy đủ `1 <= int(n) <= len(hits)`."

  # ---- tool-use
  - id: p7-test-q12
    type: parsons
    tags: [llm, agents]
    difficulty: 2
    lines:
      - "from pyai_llm import FakeLLM"
      - 'resp = FakeLLM().chat([{"role": "user", "content": "What is eta for ''A1''?"}], tools=[{"name": "get_eta", "description": "eta", "parameters": {"type": "object", "properties": {"id": {"type": "string"}}, "required": ["id"]}}])'
      - "tc = resp.tool_calls[0]"
      - 'msgs = [{"role": "user", "content": "What is eta for ''A1''?"}, {"role": "assistant", "content": None, "tool_calls": [{"id": tc.id, "name": tc.name, "arguments": tc.arguments}]}]'
      - 'out = {"get_eta": lambda id: f"ETA {id}: 2d"}[msgs[-1]["tool_calls"][0]["name"]](**tc.arguments)'
      - 'msgs.append({"role": "tool", "tool_call_id": tc.id, "content": out})'
      - 'print([m["role"] for m in msgs], FakeLLM().chat(msgs).content)'
    en:
      prompt: "Arrange these lines in order to run one full tool-call round (call `chat`, get `tool_calls[0]`, store `user` and `assistant` in `msgs`, dispatch via allowlist, append `tool` with `tool_call_id`, and print the final reply)."
      explanation: "Import `FakeLLM`, call `chat` with the tool schema to get `resp`, take `tc = resp.tool_calls[0]`, initialize `msgs` with `user` and `assistant` (`tool_calls`), dispatch via the allowlist reading `msgs[-1]['tool_calls'][0]` to get `out`, append the `tool` message referencing `tc.id`, and print the roles plus second `chat(msgs)` reply."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự cho một lượt tool call hoàn chỉnh (gọi `chat`, lấy `tool_calls[0]`, lưu `user` và `assistant` vào `msgs`, chạy tool qua allowlist, nối message `tool` có `tool_call_id`, rồi gọi chat lần hai và in kết quả)."
      explanation: "Import `FakeLLM`, gọi `chat` kèm tool schema lấy `resp`, lấy `tc = resp.tool_calls[0]`, khởi tạo `msgs` gồm `user` và `assistant` (`tool_calls`), chạy hàm qua allowlist đọc `msgs[-1]['tool_calls'][0]` lấy `out`, nối message `tool` gắn `tc.id`, và cuối cùng in danh sách role cùng phản hồi lần hai."

  - id: p7-test-q13
    type: mcq
    tags: [llm, agents]
    difficulty: 3
    answer: 2
    code: |
      MAX_REFUND = 100.0
      state = {"user_confirmed": False}
      model_args = {"order_id": "1042", "amount": 250.0, "confirmed": True}

      def can_refund(args: dict, app_state: dict) -> bool:
          return args.get("confirmed", False) and args["amount"] <= MAX_REFUND
    en:
      prompt: "A prompt-injected chunk tricked the model into proposing `model_args`. Why is `can_refund` unsafe even though it checks `MAX_REFUND`?"
      options:
        - "It compares `amount` with `<=` rather than strict `<` against `MAX_REFUND`"
        - "It uses `args.get('confirmed', False)` rather than raising a `KeyError`"
        - "It trusts `args['confirmed']` instead of `app_state['user_confirmed']`"
        - "It accepts `order_id` as a string instead of casting it to an integer"
      explanation: "Tool arguments generated by a model are untrusted input: prompt injection or model mistakes can set `confirmed=True` inside `args`, so confirmation flags and limits must always be read from code-owned `app_state`."
    vi:
      prompt: "Một đoạn tài liệu bị gài prompt injection đã khiến model đề xuất `model_args` như trên. Vì sao `can_refund` vẫn mất an toàn dù đã kiểm tra `MAX_REFUND`?"
      options:
        - "Hàm so sánh `amount` bằng `<=` thay vì dùng dấu `<` chặt chẽ với `MAX_REFUND`"
        - "Hàm dùng `args.get('confirmed', False)` thay vì để chương trình ném `KeyError`"
        - "Hàm tin vào `args['confirmed']` thay vì kiểm tra `app_state['user_confirmed']`"
