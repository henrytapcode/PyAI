questions:
  - id: p6-04-q01
    type: mcq
    tags: [huggingface, dl]
    difficulty: 1
    answer: 2
    en:
      prompt: "Why does BERT-Tiny get roughly `0.5` accuracy on ticket classification right after loading with `num_labels=2`?"
      options:
        - "Because `local_files_only=True` loads only half of the model layers"
        - "Because the tokenizer skips half of the words until fine-tuning finishes"
        - "Because the new 2-class `classifier` head is initialised with random weights"
        - "Because `AdamW` freezes the encoder weights before training begins"
      explanation: "The pretrained BERT-Tiny body understands English, but the 2-class `classifier` head was newly created with random weights, so before fine-tuning its predictions are essentially random guesses (~0.5 on two balanced classes)."
    vi:
      prompt: "Vì sao BERT-Tiny chỉ đạt accuracy khoảng `0.5` trên bài toán phân loại ticket ngay sau khi nạp với `num_labels=2`?"
      options:
        - "Vì `local_files_only=True` chỉ nạp một nửa số tầng của model"
        - "Vì tokenizer bỏ qua một nửa số từ cho tới khi fine-tune xong"
        - "Vì lớp `classifier` 2 lớp mới gắn thêm được khởi tạo với trọng số ngẫu nhiên"
        - "Vì `AdamW` đóng băng phần encoder trước khi bắt đầu huấn luyện"
      explanation: "Phần thân BERT-Tiny đã biết tiếng Anh, nhưng lớp đầu phân loại `classifier` vừa được tạo mới với trọng số ngẫu nhiên, nên trước khi fine-tune nó đoán gần như ngẫu nhiên (~0.5 với hai lớp cân bằng)."

  - id: p6-04-q02
    type: output
    tags: [pytorch, huggingface]
    difficulty: 1
    code: |
      import torch

      logits = torch.tensor([[2.1, -0.4], [-1.0, 1.5], [0.8, 0.2], [0.1, 0.9]])
      labels = torch.tensor([0, 1, 1, 1], dtype=torch.int64)
      preds = logits.argmax(dim=1)
      acc = round(float((preds == labels).float().mean().item()), 3)
      print(acc)
    answer: "0.75"
    en:
      prompt: "What does this code print?"
      explanation: "`logits.argmax(dim=1)` gives `[0, 1, 0, 1]`, which matches `labels = [0, 1, 1, 1]` on 3 out of 4 rows (`3 / 4 = 0.75`)."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`logits.argmax(dim=1)` cho `[0, 1, 0, 1]`, khớp với `labels = [0, 1, 1, 1]` ở 3 trên 4 hàng (`3 / 4 = 0.75`)."

  - id: p6-04-q03
    type: mcq
    tags: [huggingface]
    difficulty: 1
    answer: 1
    en:
      prompt: "When loading BERT-Tiny with `num_labels=2`, what do `UNEXPECTED` (`cls.*`) and `MISSING` (`classifier.*`) in the `LOAD REPORT` mean?"
      options:
        - "The checkpoint file is corrupted and must be downloaded again"
        - "The unused pretraining heads (`cls.*`) were skipped and a fresh `classifier` head was randomly initialised"
        - "The tokenizer vocabulary is missing two special tokens `[CLS]` and `[SEP]`"
        - "Only CPU weights were loaded and GPU weights were left uninitialised"
      explanation: "BERT-Tiny was pretrained to predict masked words (`cls.*`), so those task-specific weights are `UNEXPECTED` for classification and ignored, while `classifier.*` is `MISSING` from the checkpoint and newly created with random weights."
    vi:
      prompt: "Khi nạp BERT-Tiny với `num_labels=2`, hai trạng thái `UNEXPECTED` (`cls.*`) và `MISSING` (`classifier.*`) trong `LOAD REPORT` có nghĩa là gì?"
      options:
        - "File checkpoint bị hỏng và phải tải lại từ đầu"
        - "Các tầng đầu của tác vụ pretrain cũ (`cls.*`) được bỏ qua và một đầu `classifier` mới được khởi tạo ngẫu nhiên"
        - "Bảng từ vựng của tokenizer bị thiếu hai token đặc biệt `[CLS]` và `[SEP]`"
        - "Chỉ trọng số CPU được nạp còn trọng số GPU bị bỏ trống"
      explanation: "BERT-Tiny vốn được pretrain để đoán từ bị che (`cls.*`), nên các trọng số đó thừa (`UNEXPECTED`) với bài toán phân loại và bị bỏ qua, còn `classifier.*` chưa có trong checkpoint (`MISSING`) nên được tạo mới ngẫu nhiên."

  - id: p6-04-q04
    type: fill
    tags: [pytorch, huggingface]
    difficulty: 1
    code: |
      import torch
      import torch.nn as nn

      torch.manual_seed(0)
      head = nn.Linear(4, 2)
      optimizer = torch.optim.___(head.parameters(), lr=___)
      print(type(optimizer).__name__, optimizer.defaults["lr"])
    answer: ["AdamW", "0.0005"]
    en:
      prompt: "Fill in the optimizer class name used for fine-tuning and a small learning rate of `0.0005`."
      explanation: "Fine-tuning transformers commonly uses `torch.optim.AdamW` with a small learning rate such as `0.0005` (`5e-4`)."
    vi:
      prompt: "Điền tên lớp optimizer thường dùng khi fine-tune và learning rate nhỏ `0.0005`."
      explanation: "Khi fine-tune transformer ta thường dùng `torch.optim.AdamW` với learning rate nhỏ như `0.0005` (`5e-4`)."

  - id: p6-04-q05
    type: parsons
    tags: [pytorch]
    difficulty: 1
    lines:
      - "import torch"
      - "w = torch.ones(2, 2, requires_grad=True)"
      - "loss = torch.nn.CrossEntropyLoss()(w, torch.zeros(2, dtype=torch.int64))"
      - "loss.backward()"
      - "torch.optim.AdamW([w], lr=5e-4).step()"
      - "print(round(float(w[0, 0].item()), 4))"
    en:
      prompt: "Arrange these lines in order to compute cross-entropy loss on a weight tensor, run one `AdamW` step, and print the updated entry."
      explanation: "Import `torch`, create weight tensor `w` with gradients enabled, compute cross-entropy `loss`, run `loss.backward()`, take one `AdamW` `.step()`, and print the updated scalar."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để tính cross-entropy loss trên tensor trọng số, chạy một bước `AdamW` và in phần tử đã cập nhật."
      explanation: "Import `torch`, tạo tensor trọng số `w` bật gradient, tính cross-entropy `loss`, gọi `loss.backward()`, chạy một bước `AdamW` `.step()` rồi in giá trị sau cập nhật."

  - id: p6-04-q06
    type: mcq
    tags: [huggingface, dl]
    difficulty: 2
    answer: 0
    en:
      prompt: "Why do we use a small learning rate (like `5e-4`) when fine-tuning a pretrained transformer instead of a large one (like `1e-1`)?"
      options:
        - "To avoid overwriting the pretrained English weights in the base encoder and collapsing predictions"
        - "Because `AdamW` raises a `ValueError` if `lr` is greater than `0.01`"
        - "Because smaller learning rates reduce the number of parameters in `model.parameters()`"
        - "To keep `tokenizer(..., truncation=True)` from cutting long tickets"
      explanation: "A huge step like `1e-1` wrecks the pretrained representations learned by the base model, causing loss to spike and predictions to collapse onto one class."
    vi:
      prompt: "Vì sao ta dùng learning rate nhỏ (như `5e-4`) khi fine-tune model transformer đã train sẵn thay vì giá trị lớn (như `1e-1`)?"
      options:
        - "Để tránh phá hỏng kiến thức tiếng Anh đã học sẵn ở phần thân model và làm dự đoán sụp đổ về một lớp"
        - "Vì `AdamW` sẽ ném `ValueError` nếu `lr` lớn hơn `0.01`"
        - "Vì learning rate nhỏ làm giảm số tham số trong `model.parameters()`"
        - "Để ngăn `tokenizer(..., truncation=True)` cắt bớt các ticket dài"
      explanation: "Bước nhảy quá lớn như `1e-1` phá hủy các biểu diễn ngôn ngữ có sẵn trong model nền, khiến loss vọt lên và model đoán kẹt toàn một lớp."

