    code: |
      from pyai_llm import FakeLLM, RateLimitError

      client = FakeLLM(script=["5 days"], fail_times=1)
      cache, metrics = {}, []


      def ask(q, score):
          if q in cache:
              metrics.append(("ok", True, 0.0))
              return
          if score < 0.2:
              metrics.append(("ok", False, 0.0))
              return
          status, cost = "error", 0.0
          try:
              cache[q] = client.chat([{"role": "user", "content": q}]).content
              cost, status = 0.01, "ok"
          except RateLimitError:
              pass
          finally:
              metrics.append((status, False, cost))


      for q, s in [("refund", 0.8), ("refund", 0.8), ("crypto", 0.1), ("refund", 0.8)]:
          ask(q, s)
      print([(m[0], m[1]) for m in metrics], round(sum(m[2] for m in metrics), 2))
    answer: "[('error', False), ('ok', False), ('ok', False), ('ok', True)] 0.01"
    en:
      prompt: "What does this simplified RAG `/ask` pipeline print?"
      explanation: "Call 1 hits `RateLimitError`, skips caching, and logs `('error', False)` with cost `0.0`. Call 2 retries, calls `client.chat` once (`0.01`), caches `'refund'`, and logs `('ok', False)`. Call 3 refuses (`score < 0.2`) without calling `chat`, and Call 4 hits cache with cost `0.0` (`('ok', True)`)."
    vi:
      prompt: "Pipeline `/ask` rút gọn của dịch vụ RAG này in ra gì?"
      explanation: "Lần 1 gặp `RateLimitError`, không cache và ghi `('error', False)` với chi phí `0.0`. Lần 2 retry gọi `client.chat` một lần (`0.01`), lưu cache `'refund'` và ghi `('ok', False)`. Lần 3 từ chối (`score < 0.2`) không gọi `chat`, còn lần 4 trúng cache với chi phí `0.0` (`('ok', True)`)."

