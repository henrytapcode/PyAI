  - id: p4-test-q12
    type: output
    tags: [plotting, pandas]
    difficulty: 2
    code: |
      import matplotlib.pyplot as plt
      import pandas as pd

      hist = pd.DataFrame({
          "epoch": [1, 2, 3],
          "train": [0.9, 0.5, 0.3],
          "val": [0.95, 0.6, 0.5],
