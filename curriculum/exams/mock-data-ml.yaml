  - id: mock2-q11
    type: output
    tags: [sql]
    difficulty: 3
    code: |
      import sqlite3

      conn = sqlite3.connect(":memory:")
      conn.execute("CREATE TABLE feedback (model TEXT, rating INTEGER)")
      with conn:
          conn.executemany(
              "INSERT INTO feedback (model, rating) VALUES (?, ?)",
              [("mini", 4), ("mini", None), ("pro", 5), ("pro", 4), ("alpha", 3), ("alpha", 4)],
          )
      rows = conn.execute("""
          SELECT model, ROUND(AVG(rating), 2)
          FROM feedback
          WHERE rating IS NOT NULL
          GROUP BY model
          HAVING COUNT(*) >= 2
          ORDER BY model ASC
      """).fetchall()
      print(rows)
      conn.close()
    answer: "[('alpha', 3.5), ('pro', 4.5)]"
    en:
      prompt: "You want average ratings for models that have at least 2 non-null user ratings. What does this query print?"
      explanation: "`WHERE rating IS NOT NULL` drops `(\"mini\", None)` before `GROUP BY`, leaving `mini` with `COUNT(*) = 1` so `HAVING COUNT(*) >= 2` filters it out. Both `alpha` (`3.5`) and `pro` (`4.5`) remain, sorted alphabetically by `ORDER BY model ASC`."
    vi:
      prompt: "Bạn muốn tính điểm đánh giá trung bình cho những model có ít nhất 2 lượt chấm hợp lệ (không rỗng). Đoạn truy vấn này in ra gì?"
      explanation: "`WHERE rating IS NOT NULL` loại dòng `(\"mini\", None)` trước khi `GROUP BY`, khiến `mini` chỉ còn `COUNT(*) = 1` và bị `HAVING COUNT(*) >= 2` loại bỏ. Hai model `alpha` (`3.5`) và `pro` (`4.5`) được giữ lại và sắp theo thứ tự chữ cái nhờ `ORDER BY model ASC`."

