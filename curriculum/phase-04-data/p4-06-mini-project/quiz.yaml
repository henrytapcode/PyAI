    en: { front: "How does `AVG(status = 'error')` compute the error rate in SQLite?", back: "In SQLite, a boolean comparison returns `1` when true and `0` when false, so the average of `0`s and `1`s is the exact error rate." }
    vi: { front: "Vì sao `AVG(status = 'error')` tính được tỉ lệ lỗi trong SQLite?", back: "Trong SQLite, phép so sánh trả về `1` khi đúng và `0` khi sai, nên trung bình cộng của dãy `0` và `1` chính là tỉ lệ lỗi." }
