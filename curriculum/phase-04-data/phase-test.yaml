    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`df.dropna(...)` trả về một DataFrame mới và giữ nguyên `df` vì kết quả không được gán lại (`df = df.dropna(...)`). Do đó `df` vẫn còn đủ `3` hàng."

  - id: p4-test-q09
    type: parsons
    tags: [data-cleaning, pandas]
    difficulty: 3
    lines:
      - "import pandas as pd"
      - 'df = pd.DataFrame({"user": ["an", "an", "an"], "score": [9, 4, 2]})'
      - 'df = df[df["score"].between(1, 5)]'
      - 'df = df.drop_duplicates(subset=["user"], keep="first")'
      - 'print(df["score"].tolist())'
    en:
      prompt: "Put the lines in order to discard scores outside `1..5` before keeping the first entry per user, printing `[4]`."
      explanation: "Filter valid scores (`1..5`) **before** calling `drop_duplicates(subset=[\"user\"], keep=\"first\")`. If you deduplicate first, the invalid score `9` is kept as `\"an\"`'s only row and then removed by `between(1, 5)`, leaving `[]`."
    vi:
      prompt: "Sắp xếp các dòng để loại bỏ điểm ngoài khoảng `1..5` trước khi giữ dòng đầu tiên của mỗi người dùng, in ra `[4]`."
      explanation: "Hãy lọc khoảng điểm hợp lệ (`1..5`) **trước** khi gọi `drop_duplicates(subset=[\"user\"], keep=\"first\")`. Nếu loại trùng trước, giá trị sai `9` sẽ được giữ làm dòng duy nhất của `\"an\"` rồi bị `between(1, 5)` xóa mất, khiến kết quả thành `[]`."

