  - id: p5-test-q14
    type: output
    tags: [model-evaluation, sklearn]
    difficulty: 2
    code: |
      import numpy as np
      from sklearn.metrics import precision_score, recall_score

      probs = np.array([0.9, 0.6, 0.4, 0.35, 0.1])
      y_true = np.array([1, 1, 0, 1, 0])
      for t in [0.7, 0.3]:
          preds = (probs >= t).astype("int64")
          p = round(float(precision_score(y_true, preds)), 3)
          r = round(float(recall_score(y_true, preds)), 3)
          print(t, p, r)
    answer: "0.7 1.0 0.333\n0.3 0.75 1.0"
    en:
      prompt: "What does this code print?"
      explanation: "At threshold `0.7`, `preds = [1, 0, 0, 0, 0]` (`TP=1, FP=0, FN=2`) gives precision `1.0` and recall `0.333`. Lowering the threshold to `0.3` sets `preds = [1, 1, 1, 1, 0]` (`TP=3, FP=1, FN=0`), raising recall to `1.0` while lowering precision to `0.75`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Ở ngưỡng `0.7`, `preds = [1, 0, 0, 0, 0]` (`TP=1, FP=0, FN=2`) cho precision (độ chuẩn khi báo dương) `1.0` và recall (độ nhạy, tức tỉ lệ bắt được) `0.333`. Hạ ngưỡng xuống `0.3` tạo `preds = [1, 1, 1, 1, 0]` (`TP=3, FP=1, FN=0`), giúp recall tăng lên `1.0` nhưng precision giảm xuống `0.75`."

