  - id: p8-01-f03
    tags: [typing, apis]
    code: |
      class AskRequest(BaseModel):
          question: str = Field(min_length=1, max_length=200)
          top_k: int = Field(default=3, ge=1, le=5)
    en:
      front: "What happens if a `POST` body fails a Pydantic `Field(...)` constraint?"
      back: "FastAPI stops before the route function runs and automatically returns HTTP `422` with `detail` entries showing `loc` and `type`."
    vi:
      front: "Điều gì xảy ra nếu JSON body gửi lên vi phạm ràng buộc `Field(...)` của Pydantic?"
      back: "FastAPI dừng trước khi chạy hàm xử lý và tự trả về mã HTTP `422` kèm danh sách `detail` ghi rõ `loc` và `type`."

  - id: p8-01-f04
    tags: [apis]
    en:
      front: "When should you return `422`, `400`, `404`, and `201`?"
      back: "`201` when creating a resource, `404` when an ID is missing, `400` when valid JSON breaks a business rule, and `422` for automatic schema/type failures."
    vi:
      front: "Khi nào dùng mã `422`, `400`, `404` và `201`?"
      back: "`201` khi tạo mới bản ghi, `404` khi thiếu ID, `400` khi JSON đúng kiểu nhưng sai quy tắc nghiệp vụ, và `422` cho lỗi kiểu/schema tự động."

  - id: p8-01-f05
    tags: [apis, production]
    en:
      front: "Why should an API never return `{\"error\": ...}` with status `200`?"
      back: "HTTP clients and monitoring tools check `status_code` first and will treat a `200` response as a successful call."
    vi:
      front: "Vì sao API không bao giờ nên trả `{\"error\": ...}` kèm mã `200`?"
      back: "Client HTTP và hệ thống monitoring đọc `status_code` trước nên sẽ coi phản hồi `200` là một lượt gọi thành công."

  - id: p8-01-f06
    tags: [testing, apis]
    code: |
      r = client.post("/ask", json={"question": "What is RAG?"})
    en:
      front: "How does `TestClient(app)` test FastAPI endpoints, and why use `json=`?"
      back: "`TestClient(app)` calls your app in-process with no open port; pass `json=` (not `data=`) so the payload is sent as a JSON request body."
    vi:
      front: "`TestClient(app)` kiểm thử endpoint thế nào và vì sao phải dùng `json=`?"
      back: "`TestClient(app)` gọi app ngay trong cùng process mà không mở port; luôn truyền `json=` (không dùng `data=`) để gửi dữ liệu dạng JSON request body."
