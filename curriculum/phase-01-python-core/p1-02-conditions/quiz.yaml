questions:
  - id: p1-02-q01
    type: mcq
    tags: [conditions]
    difficulty: 1
    answer: 2
    en:
      prompt: "Which line is a correct `if` statement?"
      options: ["if x > 5", "if x > 5;", "if x > 5:", "if (x > 5) then:"]
      explanation: "An `if` line must end with a colon `:`. The indented lines below it form the block."
    vi:
      prompt: "Dòng nào là câu lệnh `if` đúng?"
      options: ["if x > 5", "if x > 5;", "if x > 5:", "if (x > 5) then:"]
      explanation: "Dòng `if` phải kết thúc bằng dấu hai chấm `:`. Các dòng thụt lề bên dưới tạo thành khối code."

  - id: p1-02-q02
    type: output
    tags: [conditions]
    difficulty: 1
    code: |
      n = 7
      if n % 2 == 0:
          print("even")
      else:
          print("odd")
    answer: "odd"
    en:
      prompt: "What does this code print?"
      explanation: "`7 % 2` is 1, so `n % 2 == 0` is False and the `else` branch runs."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`7 % 2` bằng 1, nên `n % 2 == 0` là False và nhánh `else` được chạy."

  - id: p1-02-q03
    type: output
    tags: [conditions]
    difficulty: 2
    code: |
      score = 75
      if score >= 50:
          print("pass")
      elif score >= 70:
          print("good")
      else:
          print("fail")
    answer: "pass"
    en:
      prompt: "What does this code print?"
      explanation: "Only the first True branch runs. `75 >= 50` is True, so `elif score >= 70` is never checked. Put the stricter check first."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Chỉ nhánh True đầu tiên được chạy. `75 >= 50` đúng, nên `elif score >= 70` không bao giờ được kiểm tra. Hãy đặt điều kiện chặt hơn lên trước."

  - id: p1-02-q04
    type: mcq
    tags: [booleans]
    difficulty: 2
    answer: 1
    code: |
      age = 30
      is_student = False
      print(age < 25 or is_student)
    en:
      prompt: "What is printed?"
      options: ["True", "False", "30", "An error"]
      explanation: "`age < 25` is False and `is_student` is False. `or` needs at least one True, so the result is False."
    vi:
      prompt: "Kết quả in ra là gì?"
      options: ["True", "False", "30", "Lỗi"]
      explanation: "`age < 25` là False và `is_student` cũng False. `or` cần ít nhất một vế True, nên kết quả là False."

  - id: p1-02-q05
    type: fill
    tags: [booleans, conditions]
    difficulty: 2
    code: |
      age = 20
      has_id = True
      if age >= 18 ___ has_id:
          print("Enter")
    answer: ["and"]
    en:
      prompt: "Fill in the blank so the person enters only if they are an adult AND have an ID."
      explanation: "`and` requires both conditions to be True."
    vi:
      prompt: "Điền vào chỗ trống để người đó chỉ được vào khi đủ tuổi VÀ có giấy tờ."
      explanation: "`and` yêu cầu cả hai điều kiện đều True."

  - id: p1-02-q06
    type: parsons
    tags: [conditions]
    difficulty: 2
    lines:
      - "temperature = 12"
      - "if temperature < 15:"
      - "    print(\"Take a jacket\")"
      - "else:"
      - "    print(\"T-shirt weather\")"
    en:
      prompt: "Put the lines in order so the program prints `Take a jacket`."
      explanation: "Create the variable first, then the `if` line (ending with `:`), its indented block, then `else` with its own indented block."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `Take a jacket`."
      explanation: "Tạo biến trước, rồi đến dòng `if` (kết thúc bằng `:`) cùng khối thụt lề, sau đó là `else` với khối thụt lề riêng."

  - id: p1-02-q07
    type: output
    tags: [booleans, conditions]
    difficulty: 2
    code: |
      name = ""
      if name:
          print("has name")
      else:
          print("empty")
      print(bool("0"))
    answer: |-
      empty
      True
    en:
      prompt: "What does this code print?"
      explanation: "The empty string is falsy, so `else` runs. But `\"0\"` is a non-empty string, so `bool(\"0\")` is True."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Chuỗi rỗng được coi là False nên `else` chạy. Nhưng `\"0\"` là chuỗi không rỗng nên `bool(\"0\")` là True."

  - id: p1-02-q08
    type: mcq
    tags: [conditions, booleans]
    difficulty: 3
    answer: 0
    en:
      prompt: "Which condition checks that `x` is between 1 and 10 (inclusive)?"
      options: ["1 <= x <= 10", "x >= 1 or x <= 10", "x > 1 and x < 10", "not (x >= 1 and x <= 10)"]
      explanation: "`1 <= x <= 10` is exactly 'x >= 1 and x <= 10'. Using `or` accepts every number, and `>`/`<` would exclude 1 and 10."
    vi:
      prompt: "Điều kiện nào kiểm tra `x` nằm trong khoảng từ 1 đến 10 (gồm cả hai đầu)?"
      options: ["1 <= x <= 10", "x >= 1 or x <= 10", "x > 1 and x < 10", "not (x >= 1 and x <= 10)"]
      explanation: "`1 <= x <= 10` chính là 'x >= 1 and x <= 10'. Dùng `or` sẽ chấp nhận mọi số, còn `>`/`<` sẽ loại 1 và 10."

  - id: p1-02-q09
    type: mcq
    tags: [conditions]
    difficulty: 1
    answer: 2
    code: |
      age = 18
      if age = 18:
          print("adult")
    en:
      prompt: "What happens when you run this code?"
      options: ["It prints \"adult\"", "It prints nothing", "A SyntaxError, so nothing runs", "A NameError"]
      explanation: "`=` assigns a value, but an `if` needs a condition that gives True or False. `if age = 18:` is not valid Python, so Python refuses to run the file at all. Use `==` to compare."
    vi:
      prompt: "Chuyện gì xảy ra khi chạy đoạn code này?"
      options: ["In ra \"adult\"", "Không in gì", "SyntaxError, nên không có gì chạy", "NameError"]
      explanation: "`=` dùng để gán giá trị, còn `if` cần một điều kiện cho ra True hoặc False. `if age = 18:` không hợp lệ trong Python, nên Python từ chối chạy cả file. Dùng `==` để so sánh."

  - id: p1-02-q10
    type: output
    tags: [booleans]
    difficulty: 2
    code: |
      a = True
      b = False
      print(not a or b, a and not b)
    answer: "False True"
    en:
      prompt: "What does this code print?"
      explanation: "`not` is applied before `and` and `or`. So `not a or b` is `(not a) or b`, which is `False or False` = False. And `a and not b` is `True and True` = True."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`not` được áp dụng trước `and` và `or`. Nên `not a or b` là `(not a) or b`, tức `False or False` = False. Còn `a and not b` là `True and True` = True."

  - id: p1-02-q11
    type: fill
    tags: [booleans, conditions]
    difficulty: 1
    code: |
      is_raining = False
      if ___ is_raining:
          print("Go outside")  # Go outside
    answer: ["not"]
    en:
      prompt: "Fill in the blank so the code prints `Go outside`."
      explanation: "`not` flips False to True, so `not is_raining` is True when it is not raining."
    vi:
      prompt: "Điền vào chỗ trống để code in ra `Go outside`."
      explanation: "`not` đảo False thành True, nên `not is_raining` là True khi trời không mưa."

  - id: p1-02-q12
    type: fill
    tags: [conditions]
    difficulty: 2
    code: |
      n = -3
      if n > 0:
          sign = "positive"
      ___ n == 0:
          sign = "zero"
      ___:
          sign = "negative"
      print(sign)  # negative
    answer: ["elif", "else"]
    en:
      prompt: "Fill in both blanks so the chain of checks prints `negative`."
      explanation: "`elif` continues the same chain, so only one branch runs. `else` has no condition: it catches everything that did not match above."
    vi:
      prompt: "Điền vào hai chỗ trống để chuỗi kiểm tra in ra `negative`."
      explanation: "`elif` tiếp tục cùng một chuỗi kiểm tra, nên chỉ một nhánh chạy. `else` không có điều kiện: nó bắt mọi trường hợp chưa khớp ở trên."

  - id: p1-02-q13
    type: parsons
    tags: [conditions]
    difficulty: 2
    lines:
      - 'score = 95'
      - 'if score >= 90:'
      - '    grade = "A"  # 90 and above'
      - 'elif score >= 70:'
      - '    grade = "C"  # 70 to 89'
      - 'else:'
      - '    grade = "F"  # below 70'
      - 'print(grade)  # A'
    en:
      prompt: "Put the lines in order so the program prints `A`."
      explanation: "The chain must go `if`, then `elif`, then `else`, with each block directly under its line (the comments tell you which block belongs to which check). The strictest check `>= 90` must come first: if `>= 70` were first, 95 would be caught there and the program would print `C`. `print` comes after the whole chain."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `A`."
      explanation: "Chuỗi phải đi theo thứ tự `if`, rồi `elif`, rồi `else`, mỗi khối nằm ngay dưới dòng của nó (comment cho biết khối nào thuộc phép kiểm tra nào). Phép kiểm tra khắt khe nhất `>= 90` phải đứng đầu: nếu `>= 70` đứng trước thì 95 bị bắt ở đó và chương trình in ra `C`. `print` đặt sau toàn bộ chuỗi."

  - id: p1-02-q14
    type: parsons
    tags: [operators, conditions]
    difficulty: 3
    lines:
      - 'points = 4'
      - 'points = points * 3'
      - 'points = points - 5'
      - 'print(points > 5 and points < 10)'
    en:
      prompt: "Put the lines in order so the program prints `True`."
      explanation: "Each line changes `points` using the value the line above left behind. Subtracting 5 before multiplying gives 4 → -1 → -3, which prints False. Multiply first: 4 → 12 → 7, and 7 is between 5 and 10."
    vi:
      prompt: "Sắp xếp các dòng để chương trình in ra `True`."
      explanation: "Mỗi dòng đổi `points` dựa trên giá trị mà dòng phía trên để lại. Nếu trừ 5 trước khi nhân 3 thì 4 → -1 → -3, và kết quả là False. Nhân trước: 4 → 12 → 7, và 7 nằm giữa 5 và 10."

  - id: p1-02-q15
    type: output
    tags: [conditions]
    difficulty: 3
    code: |
      n = 15
      if n % 3 == 0:
          print("Fizz")
      if n % 5 == 0:
          print("Buzz")
      if n % 3 == 0 and n % 5 == 0:
          print("FizzBuzz")
    answer: |-
      Fizz
      Buzz
      FizzBuzz
    en:
      prompt: "What does this code print?"
      explanation: "These are three separate `if` lines, not one chain, so every condition that is True runs. With `elif` instead, only `Fizz` would print."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Đây là ba câu `if` riêng, không phải một chuỗi, nên mọi điều kiện đúng đều chạy. Nếu dùng `elif`, chỉ có `Fizz` được in."

  - id: p1-02-q16
    type: mcq
    tags: [booleans, conditions]
    difficulty: 3
    answer: 1
    code: |
      x = 0
      if x == 0 or x == 1 and False:
          print("reached")
      else:
          print("skipped")
    en:
      prompt: "What does this code do?"
      options: ["It prints \"skipped\"", "It prints \"reached\"", "It crashes with an error", "It prints nothing"]
      explanation: "`and` binds tighter than `or`, so the condition is `(x == 0) or ((x == 1) and False)`. The left side is True and `or` needs only one True, so the `if` block runs."
    vi:
      prompt: "Đoạn code này làm gì?"
      options: ["In ra \"skipped\"", "In ra \"reached\"", "Chương trình bị lỗi", "Không in gì"]
      explanation: "`and` có độ ưu tiên cao hơn `or`, nên điều kiện là `(x == 0) or ((x == 1) and False)`. Vế trái là True và `or` chỉ cần một vế True, nên khối `if` chạy."

flashcards:
  - id: p1-02-f01
    tags: [conditions]
    code: |
      if x > 0:
          print("positive")
    en: { front: "What two things does an `if` line need?", back: "A condition and a colon `:` at the end. The block below must be indented (4 spaces)." }
    vi: { front: "Dòng `if` cần hai thứ gì?", back: "Một điều kiện và dấu hai chấm `:` ở cuối. Khối code bên dưới phải thụt lề (4 dấu cách)." }
  - id: p1-02-f02
    tags: [conditions]
    en: { front: "How does `elif` choose a branch?", back: "Python checks from top to bottom and runs only the first branch whose condition is True." }
    vi: { front: "`elif` chọn nhánh như thế nào?", back: "Python kiểm tra từ trên xuống dưới và chỉ chạy nhánh đầu tiên có điều kiện True." }
  - id: p1-02-f03
    tags: [booleans]
    en: { front: "`and` vs `or` vs `not`?", back: "`and`: both True. `or`: at least one True. `not`: flips True/False." }
    vi: { front: "`and`, `or`, `not` khác nhau thế nào?", back: "`and`: cả hai True. `or`: ít nhất một True. `not`: đảo True/False." }
  - id: p1-02-f04
    tags: [booleans]
    en: { front: "Which values count as False in an `if`?", back: "`0`, `0.0` and `\"\"` (empty string). Non-empty text like `\"0\"` is True." }
    vi: { front: "Những giá trị nào được coi là False trong `if`?", back: "`0`, `0.0` và `\"\"` (chuỗi rỗng). Chuỗi không rỗng như `\"0\"` là True." }
  - id: p1-02-f05
    tags: [operators, conditions]
    en: { front: "`=` vs `==`?", back: "`=` assigns a value to a variable. `==` compares two values and gives True/False." }
    vi: { front: "`=` khác `==` thế nào?", back: "`=` gán giá trị cho biến. `==` so sánh hai giá trị và cho ra True/False." }
  - id: p1-02-f06
    tags: [conditions, booleans]
    code: "if x == 1 or x == 2:"
    en: { front: "Why must `or` have a full comparison on both sides?", back: "`x == 1 or 2` means `(x == 1) or 2`. Since `2` is truthy, the whole test is always True. Write `x == 1 or x == 2`." }
    vi: { front: "Vì sao `or` phải có so sánh đầy đủ ở cả hai vế?", back: "`x == 1 or 2` nghĩa là `(x == 1) or 2`. Vì `2` là giá trị truthy nên cả điều kiện luôn True. Hãy viết `x == 1 or x == 2`." }
