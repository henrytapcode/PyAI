  - id: mock3-q24
    type: mcq
    tags: [production, logging, system-design]
    difficulty: 2
    answer: 2
    en:
      prompt: "Why should an AI service alert on `p95` or `p99` latency rather than relying solely on average (mean) latency?"
      options:
        - "Because average latency cannot be computed without storing raw prompt text"
        - "Because `p95` automatically excludes all HTTP `500` errors from dashboards"
        - "Because slow tail requests can hurt many users while the mean still looks fast"
        - "Because `p95` is always lower than the mean when traffic spikes occur"
      explanation: "Fast cached responses pull the mean down, hiding severe tail latency experienced by 1-in-20 or 1-in-100 requests (such as long uncached LLM generations or cold starts). Monitoring `p95`/`p99` exposes these user-facing slowdowns."
    vi:
      prompt: "Vì sao một dịch vụ AI nên đặt cảnh báo theo độ trễ `p95` hoặc `p99` thay vì chỉ dựa vào độ trễ trung bình (mean)?"
      options:
        - "Vì không thể tính độ trễ trung bình nếu không lưu toàn bộ nội dung prompt thô"
        - "Vì `p95` tự động loại bỏ toàn bộ các lỗi HTTP `500` ra khỏi bảng theo dõi"
        - "Vì các request chậm ở phần đuôi gây hại cho người dùng dù trung bình vẫn nhanh"
        - "Vì `p95` luôn nhỏ hơn giá trị trung bình mỗi khi lưu lượng truy cập tăng vọt"
      explanation: "Các request trúng cache chạy rất nhanh kéo giá trị trung bình xuống, che giấu tình trạng chậm nghiêm trọng ở 5% hoặc 1% request chậm nhất (ví dụ sinh văn bản dài chưa cache). Theo dõi `p95`/`p99` giúp phát hiện đúng các điểm nghẽn này."
