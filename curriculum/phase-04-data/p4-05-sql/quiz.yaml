    en: { front: "Why should you wrap inserts in `with conn:` and use `?` placeholders?", back: "`with conn:` auto-commits on success (or rolls back on error), and `?` placeholders handle quotes safely and prevent SQL injection. Don't forget the comma in 1-item tuples like `(\"an\",)`." }
    vi: { front: "Vì sao nên bọc thao tác chèn trong `with conn:` và dùng placeholder `?`?", back: "`with conn:` tự động commit khi thành công (hoặc rollback khi lỗi), còn placeholder `?` xử lý dấu nháy an toàn và chặn SQL injection. Đừng quên dấu phẩy ở tuple 1 phần tử như `(\"an\",)`." }
  - id: p4-05-f03
