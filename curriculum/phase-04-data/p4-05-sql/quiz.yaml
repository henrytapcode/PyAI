    en: { front: "How do `WHERE` and `HAVING` differ in SQL?", back: "`WHERE` filters individual rows *before* `GROUP BY` forms groups; `HAVING` filters whole groups *after* `GROUP BY` computes aggregates like `COUNT(*)` and `AVG(...)`." }
    vi: { front: "`WHERE` và `HAVING` khác nhau thế nào trong SQL?", back: "`WHERE` lọc từng dòng *trước khi* `GROUP BY` gom nhóm; `HAVING` lọc cả nhóm *sau khi* `GROUP BY` đã tính các hàm tổng hợp như `COUNT(*)` và `AVG(...)`." }
