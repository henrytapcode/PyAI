      explanation: "Calls: `'hi'` (miss, cache `[hi]`), `'ok'` (miss, `[hi, ok]`), `'hi'` (hit, `[ok, hi]`), `'bye'` (miss, evicts `'ok'`, `[hi, bye]`), `'ok'` (miss, evicts `'hi'`, `[bye, ok]`). Total: `1` hit, `4` misses, `currsize=2`."
    vi:
      prompt: "Bạn bọc một hàm phụ trợ tất định bằng `lru_cache(maxsize=2)`. Sau 5 lần gọi này, `cache_info()` in ra gì?"
      explanation: "Các lần gọi: `'hi'` (miss, cache `[hi]`), `'ok'` (miss, `[hi, ok]`), `'hi'` (hit, `[ok, hi]`), `'bye'` (miss, đẩy `'ok'`, `[hi, bye]`), `'ok'` (miss, đẩy `'hi'`, `[bye, ok]`). Tổng cộng: `1` hit, `4` miss, `currsize=2`."

  - id: mock3-q21
    type: mcq
    tags: [performance, llm, system-design]
    difficulty: 3
    answer: 3
    en:
      prompt: "How does a semantic cache differ from an exact-match prompt cache in an LLM gateway?"
      options:
        - "It only caches HTTP `422` errors rather than successful model completions"
        - "It bypasses the embedding step and compares raw byte lengths of prompts"
        - "It guarantees identical answers by requiring exact character-by-character match"
        - "It embeds incoming queries and reuses a cached answer above a similarity cutoff"
      explanation: "Exact-match caching hashes the normalized prompt string and model settings. Semantic caching computes an embedding for the query and returns a cached response when cosine similarity exceeds a high threshold (e.g., `0.95`), trading minor semantic risk for higher hit rates."
    vi:
      prompt: "Semantic cache (bộ nhớ đệm ngữ nghĩa) khác gì so với cache khớp chính xác prompt trong một LLM gateway?"
      options:
        - "Nó chỉ lưu cache các lỗi HTTP `422` thay vì các câu trả lời thành công"
        - "Nó bỏ qua bước tạo embedding và chỉ so sánh độ dài byte thô của prompt"
        - "Nó đảm bảo câu trả lời giống hệt bằng cách yêu cầu khớp từng ký tự"
        - "Nó tạo embedding cho truy vấn và dùng lại kết quả cũ khi vượt ngưỡng tương đồng"
      explanation: "Cache khớp chính xác băm chuỗi prompt đã chuẩn hóa cùng cấu hình mô hình. Semantic cache tạo vector embedding cho truy vấn và trả về kết quả cũ khi độ tương đồng cosine vượt ngưỡng cao (ví dụ `0.95`), đánh đổi chút rủi ro ngữ nghĩa để tăng tỉ lệ trúng cache."

