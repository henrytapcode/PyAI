  - id: p4-06-q14
    type: mcq
    tags: [pandas, data-cleaning]
    difficulty: 3
    answer: 2
    en:
      prompt: "In a cleaned report, `gpt-4o` has `4000` tokens, `853.3 ms` latency, `0.5` error rate, and `4.5` rating, while `mini` has `900` tokens, `210.0 ms` latency, `0.0` error rate, and `4.0` rating. Which action follows directly from the report?"
      options:
        - "Retire `mini` immediately because its rating is `0.5` points lower than `gpt-4o`"
        - "Ignore `gpt-4o`'s errors because its average rating is highest"
        - "Prioritise optimising `gpt-4o` (caching, retries, or routing simple prompts to `mini`) because it drives the most tokens, slowest latency, and highest error rate"
        - "Delete rows where `status == 'error'` before running the report so `gpt-4o` looks faster"
      explanation: "A usage report drives engineering priorities: `gpt-4o` accounts for the largest token spend, worst latency, and 50% failures, while `mini` is fast and reliable enough to take simple traffic."
    vi:
      prompt: "Trong báo cáo sau khi làm sạch, `gpt-4o` có `4000` token, độ trễ `853.3 ms`, tỉ lệ lỗi `0.5`, rating `4.5`; còn `mini` có `900` token, độ trễ `210.0 ms`, tỉ lệ lỗi `0.0`, rating `4.0`. Hành động nào rút ra hợp lý nhất từ báo cáo?"
      options:
        - "Loại bỏ `mini` ngay vì rating của nó thấp hơn `gpt-4o` `0.5` điểm"
        - "Bỏ qua các lỗi của `gpt-4o` vì điểm đánh giá trung bình của nó cao nhất"
        - "Ưu tiên tối ưu `gpt-4o` (cache, retry hoặc chuyển bớt prompt đơn giản sang `mini`) vì nó chiếm nhiều token nhất, chậm nhất và lỗi cao nhất"
        - "Xóa các dòng `status == 'error'` trước khi lập báo cáo để số liệu `gpt-4o` đẹp hơn"
      explanation: "Báo cáo nhằm định hướng tối ưu kỹ thuật: `gpt-4o` đang gánh chi phí token cao nhất, chậm nhất và lỗi tới 50%, trong khi `mini` nhanh và ổn định nên có thể nhận bớt các tác vụ đơn giản."

  - id: p4-06-q15
    type: output
    tags: [sql]
    difficulty: 3
    code: |
      import sqlite3
      import pandas as pd

      conn = sqlite3.connect(":memory:")
      df = pd.DataFrame({
          "model": ["gpt-4o", "gpt-4o", "mini"],
          "latency_ms": [800.0, float("nan"), 200.0],
          "rating": [float("nan"), float("nan"), 4.0],
      })
      df.to_sql("requests", conn, index=False)
      rep = pd.read_sql_query(
          "SELECT model, ROUND(AVG(latency_ms), 1) AS lat, ROUND(AVG(rating), 2) AS rat "
          "FROM requests GROUP BY model ORDER BY model ASC",
          conn,
      )
      print(float(rep.loc[0, "lat"]), pd.isna(rep.loc[0, "rat"]))
      conn.close()
    answer: "800.0 True"
    en:
      prompt: "What does this code print?"
      explanation: "For `gpt-4o` (index `0` sorted alphabetically), `AVG(latency_ms)` ignores the `NaN` (`NULL`) and averages only `800.0` (`800.0`). Since both ratings are `NULL`, `AVG(rating)` returns `NULL`, which `pd.read_sql_query` reads as `NaN` (`pd.isna(...)` is `True`)."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Với `gpt-4o` (index `0` khi xếp theo chữ cái), `AVG(latency_ms)` bỏ qua `NaN` (`NULL`) nên trung bình chỉ tính trên `800.0` (`800.0`). Vì cả hai `rating` đều là `NULL`, `AVG(rating)` trả về `NULL`, và `pd.read_sql_query` đọc thành `NaN` (`pd.isna(...)` là `True`)."

