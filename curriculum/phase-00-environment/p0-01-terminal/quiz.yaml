questions:
  - id: p0-01-q01
    type: mcq
    tags: [setup]
    difficulty: 1
    answer: 0
    en:
      prompt: "What does `pwd` print in a terminal?"
      options:
        - "The current working directory path"
        - "The list of running Python scripts"
        - "The active Python interpreter version"
        - "The contents of the parent directory"
      explanation: "`pwd` stands for 'print working directory' and shows the folder you are currently inside."
    vi:
      prompt: "Lệnh `pwd` trong terminal in ra gì?"
      options:
        - "Đường dẫn thư mục làm việc hiện tại"
        - "Danh sách các script Python đang chạy"
        - "Phiên bản Python interpreter hiện tại"
        - "Nội dung của thư mục cha ngay phía trên"
      explanation: "`pwd` là viết tắt của 'print working directory', hiển thị thư mục mà bạn đang đứng."

  - id: p0-01-q02
    type: mcq
    tags: [files]
    difficulty: 1
    answer: 2
    en:
      prompt: "In a relative path, what does `..` mean?"
      options:
        - "The current working folder"
        - "The system root directory"
        - "One folder up (the parent)"
        - "The user's home directory"
      explanation: "`.` refers to the current folder, while `..` moves one level up to the parent folder."
    vi:
      prompt: "Trong đường dẫn tương đối, `..` có nghĩa là gì?"
      options:
        - "Thư mục làm việc hiện tại"
        - "Thư mục gốc của hệ thống"
        - "Lùi lên một thư mục (thư mục cha)"
        - "Thư mục cá nhân của người dùng"
      explanation: "`.` chỉ thư mục hiện tại, còn `..` lùi lên một cấp tới thư mục cha."

  - id: p0-01-q03
    type: output
    tags: [files, stdlib]
    difficulty: 1
    code: |
      from pathlib import PurePosixPath
      p = PurePosixPath("/home/alex/app/src/main.py")
      print(p.parent.name, p.name)
    answer: "src main.py"
    en:
      prompt: "What does this code print?"
      explanation: "`p.parent` is `/home/alex/app/src`, whose `.name` is `src`, and `p.name` is `main.py`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`p.parent` là `/home/alex/app/src` có `.name` là `src`, còn `p.name` là `main.py`."

  - id: p0-01-q04
    type: fill
    tags: [strings]
    difficulty: 1
    code: |
      cmd = "  python  app.py --fast  "
      tokens = cmd.strip().___()
      print(tokens[0], tokens[1])
    answer: ["split"]
    en:
      prompt: "Fill in the method name to split `cmd` into whitespace-separated tokens."
      explanation: "Calling `.split()` with no arguments splits on any run of whitespace and returns a list of tokens."
    vi:
      prompt: "Điền tên phương thức để tách `cmd` thành các token theo khoảng trắng."
      explanation: "Gọi `.split()` không truyền tham số sẽ tách theo mọi khoảng trắng liên tiếp và trả về danh sách token."

  - id: p0-01-q05
    type: mcq
    tags: [setup]
    difficulty: 1
    answer: 1
    en:
      prompt: "Which terminal exit code means a command finished with no errors?"
      options:
        - "1"
        - "0"
        - "-1"
        - "255"
      explanation: "By convention across Windows, macOS, and Linux, exit code `0` means success and any non-zero code signals an error."
    vi:
      prompt: "Mã thoát (exit code) nào báo hiệu lệnh đã chạy thành công không có lỗi?"
      options:
        - "1"
        - "0"
        - "-1"
        - "255"
      explanation: "Theo quy ước trên cả Windows, macOS và Linux, exit code `0` nghĩa là thành công và mọi số khác `0` báo hiệu có lỗi."

  - id: p0-01-q06
    type: parsons
    tags: [files, lists]
    difficulty: 2
    lines:
      - "stack = [\"home\", \"alex\", \"app\"]"
      - "stack.pop()"
      - "stack.append(\"data\")"
      - "print(\"/\" + \"/\".join(stack))"
    en:
      prompt: "Order the lines to simulate `cd ../data` from `/home/alex/app` and print `/home/alex/data`."
      explanation: "Start with `stack`, pop `app` for `..`, append `data`, then join and print the final path."
    vi:
      prompt: "Sắp xếp các dòng để mô phỏng `cd ../data` từ `/home/alex/app` và in ra `/home/alex/data`."
      explanation: "Khởi tạo `stack`, `pop()` để bỏ `app` khi gặp `..`, `append(\"data\")`, rồi nối chuỗi và in kết quả."

  - id: p0-01-q07
    type: output
    tags: [strings, lists]
    difficulty: 2
    code: |
      argv = ["train.py", "--epochs", "5", "--lr", "0.01"]
      print(argv[0], len(argv[1:]))
    answer: "train.py 4"
    en:
      prompt: "What does this code print?"
      explanation: "`argv[0]` is the script name `train.py`, and `argv[1:]` has the 4 remaining argument tokens."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`argv[0]` là tên script `train.py`, còn `argv[1:]` chứa 4 token tham số còn lại."

  - id: p0-01-q08
    type: mcq
    tags: [setup, files]
    difficulty: 2
    answer: 3
    en:
      prompt: "How should you run `cd` on a folder named `my project` with a space?"
      options:
        - "cd my project"
        - "cd my/project"
        - "cd .. my project"
        - "cd \"my project\""
      explanation: "Without quotes, the shell splits `my` and `project` into two arguments. Wrapping the name in quotes keeps it as one path."
    vi:
      prompt: "Bạn nên dùng lệnh `cd` thế nào với thư mục tên `my project` có dấu cách?"
      options:
        - "cd my project"
        - "cd my/project"
        - "cd .. my project"
        - "cd \"my project\""
      explanation: "Nếu không có dấu ngoặc kép, shell tách `my` và `project` thành hai tham số. Bọc trong dấu ngoặc kép để giữ nguyên một đường dẫn."

  - id: p0-01-q09
    type: fill
    tags: [files, strings]
    difficulty: 2
    code: |
      files = ["README.md", "app.py", "utils.py"]
      py_files = [f for f in files if f.___(".py")]
      print(len(py_files))  # 2
    answer: ["endswith"]
    en:
      prompt: "Fill in the string method to keep only files with the `.py` extension."
      explanation: "`str.endswith(\".py\")` returns `True` only for filenames ending in `.py`."
    vi:
      prompt: "Điền phương thức chuỗi để chỉ giữ lại các file có đuôi `.py`."
      explanation: "`str.endswith(\".py\")` chỉ trả về `True` cho các tên file kết thúc bằng `.py`."

  - id: p0-01-q10
    type: parsons
    tags: [strings, exceptions]
    difficulty: 2
    lines:
      - "raw = \"  python app.py  \""
      - "tokens = raw.strip().split()"
      - "script = tokens[1]"
      - "print(script.endswith(\".py\"))"
    en:
      prompt: "Put the lines in order to extract `app.py` from `raw` and print `True`."
      explanation: "Define `raw`, split it into `tokens`, read `tokens[1]` as `script`, then check `.endswith(\".py\")`."
    vi:
      prompt: "Sắp xếp các dòng để tách `app.py` từ `raw` và in ra `True`."
      explanation: "Khai báo `raw`, tách thành `tokens`, lấy `tokens[1]` vào `script`, rồi kiểm tra `.endswith(\".py\")`."

  - id: p0-01-q11
    type: mcq
    tags: [files]
    difficulty: 2
    answer: 1
    en:
      prompt: "Which command creates a new folder named `data` in both PowerShell and bash?"
      options:
        - "touch data"
        - "mkdir data"
        - "cd data"
        - "pwd data"
      explanation: "`mkdir` (make directory) creates a new folder on Windows PowerShell, macOS, and Linux."
    vi:
      prompt: "Lệnh nào tạo thư mục mới tên `data` trên cả PowerShell lẫn bash?"
      options:
        - "touch data"
        - "mkdir data"
        - "cd data"
        - "pwd data"
      explanation: "`mkdir` (make directory) tạo thư mục mới trên cả Windows PowerShell, macOS và Linux."

  - id: p0-01-q12
    type: output
    tags: [files, lists]
    difficulty: 2
    code: |
      stack = ["home"]
      for step in ["..", "..", "etc"]:
          if step == "..":
              if stack:
                  stack.pop()
          else:
              stack.append(step)
      print("/" + "/".join(stack))
    answer: "/etc"
    en:
      prompt: "What does this code print?"
      explanation: "The first `..` pops `home`, the second `..` clamps at `/` because `stack` is empty, and `etc` is appended."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`..` đầu tiên lấy `home` ra, `..` thứ hai dừng ở `/` vì `stack` đã rỗng, rồi `etc` được thêm vào."

  - id: p0-01-q13
    type: fill
    tags: [files, stdlib]
    difficulty: 2
    code: |
      from pathlib import PurePosixPath
      root = PurePosixPath("/home/alex")
      script = root ___ "src" ___ "run.py"
      print(script)  # /home/alex/src/run.py
    answer: ["/", "/"]
    en:
      prompt: "Fill in the operator used by `PurePosixPath` to join path segments."
      explanation: "`pathlib` overloads the `/` operator to join folder and file names cleanly."
    vi:
      prompt: "Điền toán tử mà `PurePosixPath` dùng để nối các đoạn đường dẫn."
      explanation: "`pathlib` nạp chồng toán tử `/` để nối tên thư mục và file một cách gọn gàng."

  - id: p0-01-q14
    type: parsons
    tags: [files, strings]
    difficulty: 3
    lines:
      - "entries = [\"src/a.py\", \"src_old/b.py\"]"
      - "hits = [e for e in entries if e.startswith(\"src/\")]"
      - "summary = f\"{len(hits)}: {hits[0]}\""
      - "print(summary)"
    en:
      prompt: "Order the lines so `summary` is `1: src/a.py` without matching `src_old/b.py`."
      explanation: "Define `entries`, filter with `startswith(\"src/\")` into `hits`, format `summary`, then print `summary`."
    vi:
      prompt: "Sắp xếp các dòng để `summary` là `1: src/a.py` mà không khớp nhầm `src_old/b.py`."
      explanation: "Khai báo `entries`, lọc bằng `startswith(\"src/\")` vào `hits`, tạo chuỗi `summary` rồi in `summary`."

  - id: p0-01-q15
    type: mcq
    tags: [setup, files]
    difficulty: 2
    answer: 0
    en:
      prompt: "Your `cwd` is `/proj` and `main.py` is inside `/proj/src/`. Which command runs it without changing `cwd`?"
      options:
        - "python src/main.py"
        - "cd src/main.py"
        - "python ../main.py"
        - "ls src/main.py"
      explanation: "Passing the relative path `src/main.py` to `python` runs the script from `/proj` without needing `cd`."
    vi:
      prompt: "`cwd` của bạn là `/proj` và `main.py` nằm trong `/proj/src/`. Lệnh nào chạy được file này mà không đổi `cwd`?"
      options:
        - "python src/main.py"
        - "cd src/main.py"
        - "python ../main.py"
        - "ls src/main.py"
      explanation: "Truyền đường dẫn tương đối `src/main.py` cho `python` sẽ chạy script ngay từ `/proj` mà không cần `cd`."

flashcards:
  - id: p0-01-f01
    tags: [setup]
    en: { front: "What is `cwd`?", back: "Current Working Directory — the folder your terminal is currently inside." }
    vi: { front: "`cwd` là gì?", back: "Current Working Directory — thư mục mà terminal của bạn đang đứng bên trong." }
  - id: p0-01-f02
    tags: [files]
    en: { front: "Absolute vs relative path?", back: "Absolute starts from root (`/` or `C:\\`). Relative starts from your `cwd`." }
    vi: { front: "Đường dẫn tuyệt đối và tương đối?", back: "Tuyệt đối bắt đầu từ gốc (`/` hoặc `C:\\`). Tương đối tính từ `cwd`." }
  - id: p0-01-f03
    tags: [files]
    en: { front: "What do `.` and `..` mean in paths?", back: "`.` is the current folder; `..` is the parent folder one level up." }
    vi: { front: "`.` và `..` trong đường dẫn nghĩa là gì?", back: "`.` là thư mục hiện tại; `..` là thư mục cha lùi lên một cấp." }
  - id: p0-01-f04
    tags: [setup]
    en: { front: "How do you list files and check `cwd` in PowerShell & bash?", back: "`ls` lists files and `pwd` prints the current working directory." }
    vi: { front: "Cách liệt kê file và xem `cwd` trong PowerShell & bash?", back: "`ls` liệt kê file và `pwd` in ra thư mục làm việc hiện tại." }
  - id: p0-01-f05
    tags: [setup]
    en: { front: "What does exit code `0` vs non-zero mean?", back: "`0` means success; any non-zero integer means an error occurred." }
    vi: { front: "Exit code `0` và khác `0` nghĩa là gì?", back: "`0` nghĩa là thành công; mọi số nguyên khác `0` đều báo lỗi." }
  - id: p0-01-f06
    tags: [files, stdlib]
    code: 'PurePosixPath("/home/alex") / "src" / "app.py"'
    en: { front: "How does `PurePosixPath` join paths?", back: "With the `/` operator, producing `/home/alex/src/app.py` without touching disk." }
    vi: { front: "`PurePosixPath` nối đường dẫn như thế nào?", back: "Dùng toán tử `/`, tạo ra `/home/alex/src/app.py` mà không đụng vào ổ đĩa." }
