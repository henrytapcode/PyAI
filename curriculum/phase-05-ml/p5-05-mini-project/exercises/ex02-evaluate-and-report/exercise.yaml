      Fill in the three `...` sections carefully.
  vi:
    - |
      Làm theo §4 và §6: trong `evaluate_models(X, y, seed)`, chạy `StratifiedKFold(n_splits=5, shuffle=True, random_state=seed)` 5 fold cho `"baseline"`, `"logreg"` và `"tree"` dùng `make_scorer(f1_score, zero_division=0)`. Trong `write_report(results, n_test)`, định dạng một dòng mỗi mô hình, chọn mô hình tốt nhất (không tính baseline), thêm `"test size: <n_test>"` và thêm dòng cảnh báo nếu hai mô hình tốt nhất chênh nhau nhỏ hơn một `std`.
      Với `{"baseline": (0.0, 0.0), "logreg": (0.709, 0.092), "tree": (0.701, 0.14)}`, `write_report(..., 58)` trả về 6 dòng kết thúc bằng `"warning: logreg and tree differ by less than one std"`.
    - |
      Kế hoạch từng bước:
      1. Trong `evaluate_models`, tạo bộ chia phân tầng 5 fold với hạt giống `seed` và bộ chấm F1 có `zero_division=0`.
      2. Lặp qua ba mô hình đúng tên (`"baseline"`, `"logreg"`, `"tree"`), gọi `cross_val_score` rồi lưu `(mean, std)` làm tròn 3 chữ số dưới dạng `float` Python.
      3. Trong `write_report`, lọc các mô hình không phải `"baseline"`; nếu không có mô hình nào thì ném `ValueError`.
      4. Tạo danh sách kết quả gồm một dòng F1 cho mỗi mô hình theo đúng thứ tự của `results`, tiếp theo là dòng `"best: <name>"` (mean cao nhất, hòa theo chữ cái) và dòng `"test size: <n_test>"`.
      5. Nếu có từ hai mô hình (ngoài baseline) trở lên, xếp hạng theo mean giảm dần (hòa theo chữ cái) và thêm dòng cảnh báo khi độ chênh mean nhỏ hơn hẳn độ lệch chuẩn lớn hơn trong hai mô hình đầu.
