id: p5-04-ex01
kind: fill
title:
  en: "Fill in: count confusion matrix cells"
  vi: "Điền khuyết: đếm bốn ô của confusion matrix"
difficulty: 1
tags: [model-evaluation, numpy]
hints:
  en:
    - |
      This applies the NumPy boolean mask counting from §2. For `y_true = np.array([1, 1, 0, 0])` and `y_pred = np.array([1, 0, 1, 0])`, you must return `{'tp': 1, 'fp': 1, 'fn': 1, 'tn': 1}`.
    - |
      The plan:
      1. Match true positives where both the actual label and the predicted label are positive (`1`).
      2. Match false positives where the actual label is negative (`0`) but the prediction is positive (`1`).
      3. Match false negatives where the actual label is positive (`1`) but the prediction is negative (`0`), and wrap the `.sum()` count in Python `int(...)`.
      4. Match true negatives where both the actual label and the predicted label are negative (`0`).
    - |
      The shape:
      ```python
      tp = int(((y_true == 1) & (y_pred == ...)).sum())
      fp = int(((y_true == ...) & (y_pred == 1)).sum())
      fn = ...(((y_true == 1) & (y_pred == 0)).sum())
      tn = int(((y_true == 0) & (... == 0)).sum())
      ```
      Remember that `.sum()` on a boolean array returns a NumPy integer scalar, so wrap each total in `int(...)`.
  vi:
    - |
      Bài này áp dụng cách đếm bằng boolean mask NumPy ở §2. Với `y_true = np.array([1, 1, 0, 0])` và `y_pred = np.array([1, 0, 1, 0])`, hàm phải trả về `{'tp': 1, 'fp': 1, 'fn': 1, 'tn': 1}`.
    - |
      Kế hoạch:
      1. Đếm true positive ở những vị trí cả nhãn thật lẫn nhãn dự đoán đều là lớp dương (`1`).
      2. Đếm false positive ở những vị trí nhãn thật là âm (`0`) nhưng mô hình lại đoán dương (`1`).
      3. Đếm false negative ở những vị trí nhãn thật là dương (`1`) nhưng mô hình đoán âm (`0`), rồi bọc kết quả `.sum()` trong `int(...)` của Python.
      4. Đếm true negative ở những vị trí cả nhãn thật lẫn nhãn dự đoán đều là lớp âm (`0`).
    - |
      Hình dạng của lời giải:
      ```python
      tp = int(((y_true == 1) & (y_pred == ...)).sum())
      fp = int(((y_true == ...) & (y_pred == 1)).sum())
      fn = ...(((y_true == 1) & (y_pred == 0)).sum())
      tn = int(((y_true == 0) & (... == 0)).sum())
      ```
      Nhớ rằng `.sum()` trên mảng boolean trả về scalar NumPy, nên cần bọc mỗi giá trị bằng `int(...)`.
