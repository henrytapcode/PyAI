    url: "https://docs.python.org/3/library/contextlib.html"
  - title: { en: "Python docs: the with statement", vi: "Python docs: câu lệnh with (EN)" }
    url: "https://docs.python.org/3/reference/compound_stmts.html#the-with-statement"
