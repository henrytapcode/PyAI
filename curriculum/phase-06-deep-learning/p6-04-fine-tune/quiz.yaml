flashcards:
  - id: p6-04-f01
    tags: [huggingface]
    code: |
      torch.manual_seed(0)
      model = AutoModelForSequenceClassification.from_pretrained(
          REPO, revision=REV, local_files_only=True,
          num_labels=2, id2label={0: "bug", 1: "billing"}, label2id={"bug": 0, "billing": 1},
      )
    en:
      front: "Why pass `num_labels`, `id2label`, and `label2id` after `torch.manual_seed(0)` when loading a base model?"
      back: "It attaches a fresh `classifier` head with 2 outputs and stores readable label names in `config.json`. Calling `torch.manual_seed(0)` right before loading makes the random head weights reproducible."
    vi:
      front: "Vì sao cần truyền `num_labels`, `id2label`, `label2id` sau `torch.manual_seed(0)` khi nạp model nền?"
      back: "Nó gắn thêm đầu `classifier` mới có 2 đầu ra và lưu tên nhãn dễ đọc vào `config.json`. Đặt `torch.manual_seed(0)` ngay trước khi nạp giúp trọng số ngẫu nhiên của đầu phân loại lặp lại được."

  - id: p6-04-f02
    tags: [huggingface]
    en:
      front: "What does `MISSING: classifier.weight / classifier.bias` in the `LOAD REPORT` tell you?"
      back: "The pretrained base model had no sequence classification head, so those weights were newly created at random — meaning you must fine-tune before using the model."
    vi:
      front: "Dòng `MISSING: classifier.weight / classifier.bias` trong `LOAD REPORT` cho biết điều gì?"
      back: "Model nền chưa từng có đầu phân loại chuỗi, nên các trọng số này vừa được khởi tạo ngẫu nhiên — nghĩa là bạn phải fine-tune trước khi dùng."

  - id: p6-04-f03
    tags: [huggingface, pytorch]
    code: |
      out = model(**train_batch, labels=train_y)
      out.loss.backward()
    en:
      front: "What does passing `labels=train_y` into a Hugging Face classification model do?"
      back: "The model computes cross-entropy loss internally against `train_y` and returns it as `out.loss`."
    vi:
      front: "Truyền `labels=train_y` vào model phân loại của Hugging Face có tác dụng gì?"
      back: "Model tự tính cross-entropy loss so với `train_y` ở bên trong và trả về trong `out.loss`."

  - id: p6-04-f04
    tags: [pytorch, dl]
    code: |
      optimizer = torch.optim.AdamW(model.parameters(), lr=5e-4)
    en:
      front: "Why does fine-tuning use `AdamW` with a small learning rate (e.g. `5e-4`)?"
      back: "A small step size adapts the new classification head and gently tunes the encoder without erasing the pretrained language knowledge."
    vi:
      front: "Vì sao fine-tune dùng `AdamW` với learning rate nhỏ (vd `5e-4`)?"
      back: "Bước cập nhật nhỏ giúp đầu phân loại mới học nhanh và tinh chỉnh nhẹ phần thân mà không xóa sạch kiến thức ngôn ngữ có sẵn."

  - id: p6-04-f05
    tags: [huggingface]
    code: |
      model.save_pretrained(folder)
      tokenizer.save_pretrained(folder)
      reloaded = AutoModelForSequenceClassification.from_pretrained(folder)
    en:
      front: "Why save both `model` and `tokenizer` with `save_pretrained()` into the same folder?"
      back: "So the reloaded model has its fine-tuned weights, `id2label` config, and the exact matching tokenizer vocabulary in one self-contained directory ready for serving."
    vi:
      front: "Vì sao lưu cả `model` lẫn `tokenizer` bằng `save_pretrained()` vào cùng một thư mục?"
      back: "Để lúc nạp lại, bạn có trọn vẹn trọng số đã fine-tune, cấu hình `id2label` và đúng bộ tokenizer đi kèm trong một thư mục gọn gàng sẵn sàng deploy."

  - id: p6-04-f06
    tags: [dl]
    en:
      front: "Why must you call `model.eval()` before evaluating or predicting with a transformer?"
      back: "Transformers contain dropout layers; without `model.eval()`, dropout stays active and two identical evaluation runs produce different logits and accuracies."
    vi:
      front: "Vì sao phải gọi `model.eval()` trước khi đánh giá hoặc dự đoán bằng transformer?"
      back: "Transformer có các tầng dropout; nếu quên `model.eval()`, dropout vẫn bật khiến hai lần đánh giá cùng một dữ liệu ra logits và accuracy khác nhau."
