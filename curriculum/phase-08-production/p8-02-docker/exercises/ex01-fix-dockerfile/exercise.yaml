id: p8-02-ex01
kind: debug
title:
  en: "Debug: fix the broken FastAPI Dockerfile"
  vi: "Sửa lỗi: khắc phục Dockerfile cho dịch vụ FastAPI"
difficulty: 1
tags: [production, packaging]
hints:
  en:
    - |
      Review §2, §3, §4, and §6 on Dockerfile structure, container networking, build cache invalidation, and smaller reproducible images.
    - |
      Group the four fixes into two areas:
      1. Build-time layers and base image: lock `FROM` to a concrete versioned Python tag, install dependencies before copying the rest of the project so code edits stay cached, and disable pip's wheel cache.
      2. Container startup: keep `CMD` in JSON array form and make `uvicorn` listen on all container network interfaces rather than loopback only.
    - |
      The trickiest bug is layer cache invalidation—splitting the copy step so `requirements.txt` is installed before the rest of your source code arrives:
      ```dockerfile
      COPY ... .
      RUN pip install ... -r requirements.txt
      COPY . .
      ```
      Check §3 and §6 as well for the pinned base tag version, pip cache flag, and non-loopback `CMD` host.
  vi:
    - |
      Xem lại §2, §3, §4 và §6 về cấu trúc Dockerfile, mạng trong container, thứ tự invalidation của build cache và cách làm image gọn, lặp lại được.
    - |
      Chia bốn lỗi cần sửa thành hai nhóm:
      1. Lúc build image: khóa `FROM` vào một tag có số phiên bản cụ thể, tách phần cài thư viện ra trước phần chép toàn bộ code để sửa code không làm mất cache cài gói, và tắt bộ nhớ đệm file `.whl` của pip.
      2. Lúc chạy container: giữ `CMD` dạng mảng JSON và cấu hình `uvicorn` lắng nghe mọi giao diện mạng trong container thay vì địa chỉ loopback nội bộ.
    - |
      Lỗi dễ vướng nhất là thứ tự làm trượt build cache—cần tách bước chép và cài `requirements.txt` lên trước bước chép toàn bộ mã nguồn:
      ```dockerfile
      COPY ... .
      RUN pip install ... -r requirements.txt
      COPY . .
      ```
      Đồng thời kiểm tra lại §3 và §6 cho tag có số phiên bản, cờ tắt cache pip và địa chỉ host không phải loopback trong `CMD`.
