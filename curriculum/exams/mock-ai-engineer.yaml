    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để định nghĩa hàm `build_rag_prompt`, định dạng các đoạn ngữ cảnh có đánh số và in ra prompt RAG hoàn chỉnh."
      explanation: "Định nghĩa `build_rag_prompt(query, chunks)` trước, tạo chuỗi `context` đánh số trước khi `return` prompt đã định dạng, sau đó gọi hàm `build_rag_prompt` rồi in kết quả."

  - id: mock3-q13
    type: mcq
    tags: [agents, llm]
    difficulty: 2
    answer: 0
    en:
      prompt: "In an LLM tool-calling workflow, what is the model's actual role when it decides a tool is needed?"
      options:
        - "It outputs a structured tool name and arguments for your app to execute"
        - "It opens a direct network socket from its weights to the external API"
        - "It compiles Python tool functions inside the GPU kernel during decoding"
        - "It bypasses your application code and writes directly to your database"
      explanation: "An LLM only generates tokens: when tool calling is enabled, it emits a structured tool name and JSON arguments. Your host application validates and executes the function, then sends the tool output back to the model."
    vi:
      prompt: "Trong quy trình gọi công cụ (tool-calling) của LLM, vai trò thực sự của mô hình là gì khi nó quyết định cần dùng một công cụ?"
      options:
        - "Nó sinh tên công cụ và tham số có cấu trúc để ứng dụng của bạn thực thi"
        - "Nó tự mở kết nối mạng trực tiếp từ trọng số mô hình tới API bên ngoài"
        - "Nó biên dịch các hàm Python ngay trong nhân GPU trong quá trình giải mã"
        - "Nó bỏ qua mã nguồn ứng dụng của bạn và ghi thẳng vào cơ sở dữ liệu"
      explanation: "LLM chỉ sinh token: khi bật tool calling, nó xuất ra tên công cụ và tham số JSON có cấu trúc. Ứng dụng chủ của bạn kiểm tra, thực thi hàm đó rồi gửi kết quả công cụ lại cho mô hình."

  - id: mock3-q14
    type: output
    tags: [agents, loops]
    difficulty: 3
    code: |
      tools = {"double": lambda x: x * 2, "add_one": lambda x: x + 1}
      plan = [("double", 5), ("add_one", None)]
      value = None
      for step, (name, arg) in enumerate(plan, 1):
          if step > 2:
              break
          arg_val = value if arg is None else arg
          value = tools[name](arg_val)
      print(value)
    answer: "11"
    en:
      prompt: "This snippet simulates an agent executing a two-step tool plan with a step-limit guard. What does it print?"
      explanation: "Step 1 calls `tools['double'](5)` to set `value = 10`. Step 2 sees `arg is None`, passes the previous `value` (`10`) to `tools['add_one'](10)`, and prints `11`."
    vi:
      prompt: "Đoạn code này mô phỏng một agent thực thi kế hoạch gọi công cụ 2 bước kèm giới hạn số bước. Đoạn code in ra gì?"
      explanation: "Bước 1 gọi `tools['double'](5)` cho `value = 10`. Bước 2 thấy `arg is None` nên truyền `value` trước đó (`10`) vào `tools['add_one'](10)`, rồi in ra `11`."

  - id: mock3-q15
    type: mcq
    tags: [evaluation, rag]
    difficulty: 3
    answer: 3
    en:
      prompt: "Your RAG evaluation suite shows Recall@5 is `0.94`, but Faithfulness (groundedness) is only `0.48`. What does this combination indicate?"
      options:
        - "The vector index is missing documents, so retrieval cannot find answers"
        - "The embedding model is too slow to meet the latency budget in production"
        - "The tokenizer is truncating user queries before they reach the database"
        - "The retriever finds relevant chunks, but the LLM still hallucinates claims"
      explanation: "High Recall@5 means the right context chunks are reaching the prompt, while low Faithfulness means the generator is inventing or contradicting facts not supported by those retrieved chunks."
    vi:
