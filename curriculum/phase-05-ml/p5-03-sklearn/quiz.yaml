questions:
  - id: p5-03-q01
    type: mcq
    tags: [sklearn, supervised-learning]
    difficulty: 1
    answer: 1
    en:
      prompt: "What does `model.score(X, y)` return in `scikit-learn`?"
      options:
        - "A list of predicted labels for every row in `X`"
        - "Accuracy for classifiers, or R^2 for regressors"
        - "The number of training iterations taken during `.fit()`"
        - "Always the Mean Squared Error (MSE) regardless of model type"
      explanation: "In `scikit-learn`, `.score(X, y)` predicts on `X` and compares against `y`, returning accuracy for classification estimators and R^2 (where `1.0` is a perfect fit) for regression estimators."
    vi:
      prompt: "Hàm `model.score(X, y)` trong `scikit-learn` trả về gì?"
      options:
        - "Danh sách các nhãn dự đoán cho từng hàng của `X`"
        - "Accuracy đối với bộ phân loại, hoặc R^2 đối với bộ hồi quy"
        - "Số bước lặp đã chạy trong quá trình `.fit()`"
        - "Luôn là Mean Squared Error (MSE) bất kể loại mô hình nào"
      explanation: "Trong `scikit-learn`, `.score(X, y)` tự dự đoán trên `X` rồi so với `y`, trả về accuracy cho mô hình phân loại và R^2 (với `1.0` là khớp hoàn hảo) cho mô hình hồi quy."

  - id: p5-03-q02
    type: output
    tags: [sklearn, supervised-learning]
    difficulty: 1
    code: |
      import numpy as np
      from sklearn.linear_model import LinearRegression

      X = np.array([[1.0], [2.0], [3.0]])
      y = np.array([2.0, 4.0, 6.0])
      reg = LinearRegression().fit(X, y)
      print(np.round(reg.coef_, 3).tolist(), round(float(reg.intercept_), 3))
    answer: "[2.0] 0.0"
    en:
      prompt: "What does this code print?"
      explanation: "The points `(1, 2)`, `(2, 4)`, `(3, 6)` lie exactly on `y = 2x + 0`, so `reg.coef_` is `[2.0]` and `reg.intercept_` is `0.0`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Ba điểm `(1, 2)`, `(2, 4)`, `(3, 6)` nằm đúng trên đường `y = 2x + 0`, nên `reg.coef_` là `[2.0]` và `reg.intercept_` là `0.0`."

  - id: p5-03-q03
    type: fill
    tags: [sklearn, supervised-learning]
    difficulty: 1
    code: |
      import numpy as np
      from sklearn.linear_model import LogisticRegression

      X = np.array([[0.0], [1.0], [4.0], [5.0]])
      y = np.array([0, 0, 1, 1])
      clf = LogisticRegression().___(X, y)
      print(clf.___(np.array([[0.5], [4.5]])).tolist())
    answer: ["fit", "predict"]
    en:
      prompt: "Fill in the two estimator methods to train `clf` on `(X, y)` and predict labels for two new rows."
      explanation: "`.fit(X, y)` learns from the labelled training data, and `.predict(X_new)` outputs predicted class labels for new inputs."
    vi:
      prompt: "Điền tên hai phương thức của estimator để huấn luyện `clf` trên `(X, y)` và dự đoán nhãn cho hai hàng mới."
      explanation: "`.fit(X, y)` học từ dữ liệu train có nhãn, còn `.predict(X_new)` trả về nhãn lớp dự đoán cho đầu vào mới."

  - id: p5-03-q04
    type: mcq
    tags: [sklearn, supervised-learning]
    difficulty: 1
    answer: 2
    en:
      prompt: "Which statement about `LogisticRegression` is true?"
      options:
        - "It predicts continuous numbers like house prices and evaluates with R^2"
        - "It only works with `StandardScaler` and crashes on unscaled inputs"
        - "Despite 'Regression' in its name, it is a classification model"
        - "It builds a tree of if/else splits on each feature"
      explanation: "`LogisticRegression` is a linear classifier that predicts discrete class labels (`0`, `1`, ...), even though its historical name includes 'Regression'."
    vi:
      prompt: "Phát biểu nào sau đây đúng về `LogisticRegression`?"
      options:
        - "Nó dự đoán số liên tục như giá nhà và chấm điểm bằng R^2"
        - "Nó chỉ chạy được khi có `StandardScaler` và sẽ lỗi trên dữ liệu thô"
        - "Dù tên có chữ 'Regression', đây thực chất là một mô hình phân loại (classification)"
        - "Nó xây dựng một cây các quy tắc rẽ nhánh if/else trên từng feature"
      explanation: "`LogisticRegression` là mô hình phân loại tuyến tính dự đoán nhãn lớp rời rạc (`0`, `1`, ...), dù tên lịch sử của nó có chữ 'Regression'."

  - id: p5-03-q05
    type: parsons
    tags: [sklearn, supervised-learning]
    difficulty: 1
    lines:
      - "from sklearn.linear_model import LogisticRegression"
      - "model = LogisticRegression()"
      - "model.fit([[1.0], [2.0], [8.0], [9.0]], [0, 0, 1, 1])"
      - "preds = model.predict([[1.5], [8.5]])"
      - "print(preds.tolist())"
    en:
      prompt: "Arrange these lines in order to create a `LogisticRegression` estimator, fit it, predict on two new points, and print the list of predictions."
      explanation: "Import the class, instantiate `model`, call `.fit()` before `.predict()`, and print `preds.tolist()` last."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để khởi tạo `LogisticRegression`, huấn luyện, dự đoán trên hai điểm mới rồi in danh sách kết quả."
      explanation: "Import lớp, tạo `model`, gọi `.fit()` trước `.predict()` và cuối cùng in `preds.tolist()`."

  - id: p5-03-q06
    type: mcq
    tags: [sklearn, data-prep]
    difficulty: 2
    answer: 0
    en:
      prompt: "Why do we pass `stratify=y` to `train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)`?"
      options:
        - "To keep the same class proportions in both `y_train` and `y_test` as in `y`"
        - "To scale every feature column to mean 0 and standard deviation 1"
        - "To train a `DecisionTreeClassifier` faster on large datasets"
        - "To disable random shuffling so the last 25% of rows become the test set"
      explanation: "`stratify=y` performs stratified sampling so rare or imbalanced classes appear in `train` and `test` at the same ratio as in the full dataset."
    vi:
      prompt: "Vì sao ta truyền `stratify=y` vào `train_test_split(X, y, test_size=0.25, random_state=42, stratify=y)`?"
      options:
        - "Để giữ nguyên tỉ lệ các lớp trong cả `y_train` và `y_test` giống với `y` ban đầu"
        - "Để chuẩn hóa mọi cột feature về trung bình 0 và độ lệch chuẩn 1"
        - "Để huấn luyện `DecisionTreeClassifier` nhanh hơn trên dữ liệu lớn"
        - "Để tắt việc xáo trộn và lấy đúng 25% dòng cuối làm tập test"
      explanation: "`stratify=y` chia dữ liệu theo tầng để các lớp ít gặp hoặc mất cân bằng vẫn giữ đúng tỉ lệ ở cả tập train lẫn tập test."

  - id: p5-03-q07
    type: output
    tags: [sklearn, data-prep]
    difficulty: 2
    code: |
      import numpy as np
      from sklearn.model_selection import train_test_split

      X = np.arange(20, dtype=float).reshape(10, 2)
      y = np.array([0] * 8 + [1] * 2)
      _, _, _, y_test = train_test_split(X, y, test_size=0.5, random_state=42, stratify=y)
      print(np.bincount(y_test, minlength=2).tolist())
    answer: "[4, 1]"
    en:
      prompt: "What does this code print?"
      explanation: "`y` has 8 zeros and 2 ones (`4:1`). With `test_size=0.5` (5 rows) and `stratify=y`, `y_test` keeps 4 zeros and 1 one, so `np.bincount` returns `[4, 1]`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`y` có 8 số `0` và 2 số `1` (tỉ lệ `4:1`). Với `test_size=0.5` (5 dòng) và `stratify=y`, `y_test` giữ đúng 4 số `0` và 1 số `1`, nên `np.bincount` cho `[4, 1]`."

  - id: p5-03-q08
    type: fill
    tags: [sklearn, data-prep]
    difficulty: 2
    code: |
      import numpy as np
      from sklearn.preprocessing import StandardScaler

      X_train = np.array([[10.0], [20.0], [30.0]])
      X_test = np.array([[40.0]])
      scaler = StandardScaler()
      scaler.___(X_train)
      scaled = scaler.___(X_test)
      print(round(float(scaled[0, 0]), 3))
    answer: ["fit", "transform"]
    en:
      prompt: "Fill in the two `StandardScaler` methods so `X_test` is scaled using only statistics learned from `X_train`."
      explanation: "Call `scaler.fit(X_train)` (never on `X_test`) to learn the training mean and std, then `scaler.transform(X_test)` to apply them cleanly without data leakage."
    vi:
      prompt: "Điền hai phương thức của `StandardScaler` để chuẩn hóa `X_test` chỉ bằng thống kê học từ `X_train`."
      explanation: "Gọi `scaler.fit(X_train)` (tuyệt đối không fit trên `X_test`) để học trung bình và độ lệch chuẩn của train, rồi gọi `scaler.transform(X_test)` để tránh data leakage."

  - id: p5-03-q09
    type: mcq
    tags: [sklearn, data-prep]
    difficulty: 2
    answer: 3
    en:
      prompt: "A dataset has `tokens` ranging from `200` to `4000` and `error_rate` from `0.0` to `0.4`. Why does unscaled `KNeighborsClassifier` often perform poorly here?"
      options:
        - "KNN automatically drops columns whose values are smaller than `1.0`"
        - "KNN raises a `ValueError` when columns have different units"
        - "Unscaled `tokens` causes `KNeighborsClassifier` to switch into regression mode"
        - "Distance calculations are dominated by `tokens`, drowning out `error_rate`"
      explanation: "KNN measures Euclidean distance between rows: a difference of `500` in `tokens` completely overwhelms a difference of `0.2` in `error_rate` unless features are scaled."
    vi:
      prompt: "Một bộ dữ liệu có cột `tokens` từ `200` đến `4000` và cột `error_rate` từ `0.0` đến `0.4`. Vì sao `KNeighborsClassifier` không chuẩn hóa thường đoán kém trên dữ liệu này?"
      options:
        - "KNN tự động loại bỏ các cột có giá trị nhỏ hơn `1.0`"
        - "KNN ném lỗi `ValueError` khi các cột khác đơn vị đo"
        - "`tokens` chưa chuẩn hóa khiến `KNeighborsClassifier` tự chuyển sang chế độ regression"
        - "Phép tính khoảng cách bị `tokens` lấn át hoàn toàn, làm mờ đi tín hiệu từ `error_rate`"
      explanation: "KNN đo khoảng cách giữa các hàng: chênh lệch `500` ở `tokens` áp đảo hoàn toàn chênh lệch `0.2` ở `error_rate` nếu bạn không chuẩn hóa thang đo."

  - id: p5-03-q10
    type: output
    tags: [sklearn, data-prep]
    difficulty: 2
    code: |
      from sklearn.neighbors import KNeighborsClassifier
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      X_train = [[100.0, 0.1], [200.0, 0.2], [150.0, 0.8], [250.0, 0.9]]
      y_train = [0, 0, 1, 1]
      pipe = make_pipeline(StandardScaler(), KNeighborsClassifier(n_neighbors=1)).fit(X_train, y_train)
      print(list(pipe.named_steps), pipe.predict([[110.0, 0.85]]).tolist())
    answer: "['standardscaler', 'kneighborsclassifier'] [1]"
    en:
      prompt: "What does this code print?"
      explanation: "`make_pipeline` names steps using lowercase class names (`standardscaler` and `kneighborsclassifier`), and after scaling both features, `[110.0, 0.85]` is closest to `[150.0, 0.8]` (class `1`)."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`make_pipeline` đặt tên bước bằng tên class viết thường (`standardscaler` và `kneighborsclassifier`), và sau khi chuẩn hóa cả hai feature, `[110.0, 0.85]` gần `[150.0, 0.8]` (lớp `1`) nhất."

  - id: p5-03-q11
    type: parsons
    tags: [sklearn, data-prep]
    difficulty: 2
    lines:
      - "from sklearn import model_selection, pipeline, preprocessing, tree"
      - "X_tr, X_te, y_tr, y_te = model_selection.train_test_split([[0.0], [1.0], [2.0], [3.0], [8.0], [9.0], [10.0], [11.0]], [0, 0, 0, 0, 1, 1, 1, 1], test_size=0.25, random_state=0)"
      - "pipe = pipeline.make_pipeline(preprocessing.StandardScaler(), tree.DecisionTreeClassifier(random_state=0)).fit(X_tr, y_tr)"
      - "score = round(pipe.score(X_te, y_te), 3)"
      - "print(score)"
    en:
      prompt: "Arrange these lines in order to split the data, fit a `StandardScaler` + `DecisionTreeClassifier` pipeline on train, score it on test, and print the rounded accuracy."
      explanation: "Import the `sklearn` submodules, split into train/test, build and `.fit()` the pipeline on `(X_tr, y_tr)`, compute `score` on `(X_te, y_te)`, and print last."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để chia dữ liệu, huấn luyện pipeline `StandardScaler` + `DecisionTreeClassifier` trên tập train, chấm điểm trên tập test và in accuracy đã làm tròn."
      explanation: "Import các module con của `sklearn`, chia train/test, tạo và `.fit()` pipeline trên `(X_tr, y_tr)`, tính `score` trên `(X_te, y_te)` rồi in ở dòng cuối."

  - id: p5-03-q12
    type: mcq
    tags: [sklearn]
    difficulty: 2
    answer: 1
    en:
      prompt: "You pass a 1D NumPy array `np.array([1.0, 2.0, 3.0, 4.0])` as `X` into `LogisticRegression().fit(X, y)`. What happens and how do you fix it?"
      options:
        - "It raises `NotFittedError`; fix by calling `.score()` first"
        - "It raises `ValueError`; fix by reshaping `X` to 2D with `.reshape(-1, 1)`"
        - "It raises `TypeError`; fix by converting `X` to a Python list"
        - "It silently trains normally and returns accuracy `1.0`"
      explanation: "`scikit-learn` requires `X` to be a 2D array of shape `(n_samples, n_features)`; a 1D array raises `ValueError`, which `.reshape(-1, 1)` fixes."
    vi:
      prompt: "Bạn truyền mảng NumPy 1 chiều `np.array([1.0, 2.0, 3.0, 4.0])` làm `X` vào `LogisticRegression().fit(X, y)`. Điều gì xảy ra và sửa thế nào?"
      options:
        - "Báo lỗi `NotFittedError`; sửa bằng cách gọi `.score()` trước"
        - "Báo lỗi `ValueError`; sửa bằng cách chuyển `X` sang 2 chiều với `.reshape(-1, 1)`"
        - "Báo lỗi `TypeError`; sửa bằng cách đổi `X` thành Python list"
        - "Mô hình vẫn tự chạy bình thường và trả về accuracy `1.0`"
      explanation: "`scikit-learn` yêu cầu `X` phải là mảng 2D có shape `(n_samples, n_features)`; mảng 1D gây `ValueError` và cần sửa bằng `.reshape(-1, 1)`."

  - id: p5-03-q13
    type: output
    tags: [sklearn]
    difficulty: 3
    code: |
      from sklearn.exceptions import NotFittedError
      from sklearn.linear_model import LogisticRegression

      clf = LogisticRegression()
      try:
          clf.predict([[1.0], [2.0]])
      except NotFittedError as e:
          print(type(e).__name__)
          clf.fit([[0.0], [3.0]], [0, 1])
      print(clf.predict([[2.0]]).tolist())
    answer: "NotFittedError\n[1]"
    en:
      prompt: "What does this code print?"
      explanation: "Calling `clf.predict(...)` before `clf.fit(...)` raises `NotFittedError`, which the `except` block catches, prints, and then fits `clf` so the second `.predict([[2.0]])` prints `[1]`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "Gọi `clf.predict(...)` trước khi `.fit(...)` gây ra `NotFittedError`; khối `except` bắt lại, in tên lỗi rồi gọi `clf.fit(...)` nên lần `.predict([[2.0]])` sau in ra `[1]`."

  - id: p5-03-q14
    type: fill
    tags: [sklearn, evaluation]
    difficulty: 3
    code: |
      from sklearn.datasets import make_classification
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.tree import DecisionTreeClassifier

      X, y = make_classification(n_samples=20, n_features=4, random_state=0)
      X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, random_state=0, ___=y)
      pipe = make_pipeline(StandardScaler(), DecisionTreeClassifier(max_depth=3, random_state=0))
      pipe.___(X_tr, y_tr)
      print(round(pipe.score(X_te, y_te), 3))
    answer: ["stratify", "fit"]
    en:
      prompt: "Fill in the `train_test_split` keyword for class balance and the pipeline method that learns from training data."
      explanation: "`stratify=y` preserves class proportions in the split, and `pipe.fit(X_tr, y_tr)` fits both `StandardScaler` and `DecisionTreeClassifier` on train only."
    vi:
      prompt: "Điền tham số của `train_test_split` giúp giữ tỉ lệ lớp và phương thức của pipeline để học từ dữ liệu train."
      explanation: "`stratify=y` giữ nguyên tỉ lệ các lớp khi chia, còn `pipe.fit(X_tr, y_tr)` huấn luyện cả `StandardScaler` lẫn `DecisionTreeClassifier` chỉ trên tập train."

  - id: p5-03-q15
    type: mcq
    tags: [sklearn, evaluation]
    difficulty: 3
    answer: 2
    en:
      prompt: "Which workflow compares `LogisticRegression` and `DecisionTreeClassifier` fairly?"
      options:
        - "Scale the whole dataset with `StandardScaler().fit_transform(X)`, split 70/30, and pick the model with highest training accuracy"
        - "Give `LogisticRegression` `random_state=1` and `DecisionTreeClassifier` `random_state=2` in `train_test_split`, then compare test accuracy"
        - "Split once with a fixed `random_state` and `stratify=y`, wrap each model in `make_pipeline(StandardScaler(), model)`, fit on train, and pick by test accuracy"
        - "Fit an unrestricted tree (`max_depth=None`) and pick whichever model hits `1.0` on the training set first"
      explanation: "A fair comparison evaluates every candidate pipeline on the exact same held-out test split, prevents scaling leakage via `Pipeline`, and selects by test score rather than train score."
    vi:
      prompt: "Quy trình nào so sánh `LogisticRegression` và `DecisionTreeClassifier` một cách công bằng?"
      options:
        - "Chuẩn hóa toàn bộ `X` bằng `StandardScaler().fit_transform(X)`, chia 70/30 rồi chọn mô hình có train accuracy cao nhất"
        - "Dùng `random_state=1` cho `LogisticRegression` và `random_state=2` cho `DecisionTreeClassifier` trong `train_test_split`, rồi so test accuracy"
        - "Chia dữ liệu một lần với `random_state` cố định và `stratify=y`, bọc từng mô hình trong `make_pipeline(StandardScaler(), model)`, fit trên train rồi chọn theo test accuracy"
        - "Huấn luyện cây không giới hạn độ sâu (`max_depth=None`) và chọn mô hình nào đạt `1.0` trên tập train trước"
      explanation: "So sánh công bằng phải chấm mọi pipeline ứng viên trên cùng một tập test tách riêng, tránh rò rỉ dữ liệu chuẩn hóa bằng `Pipeline`, và chọn theo điểm test chứ không phải điểm train."

  - id: p5-03-q16
    type: parsons
    tags: [sklearn, data-prep]
    difficulty: 3
    lines:
      - "from sklearn import linear_model, preprocessing"
      - "scaler = preprocessing.StandardScaler()"
      - "X_tr_s = scaler.fit_transform([[0.0], [2.0], [4.0], [6.0]])"
      - "X_te_s = scaler.transform([[5.0]])"
      - "print(linear_model.LogisticRegression().fit(X_tr_s, [0, 0, 1, 1]).predict(X_te_s).tolist())"
    en:
      prompt: "Arrange these lines in order to fit `StandardScaler` on training features only, transform a test row without leakage, fit `LogisticRegression`, and print the prediction."
      explanation: "Import the submodules, create `scaler`, call `fit_transform` on train, call `transform` on test (which requires `scaler` to be fitted first), then fit `LogisticRegression` and predict on `X_te_s`."
    vi:
      prompt: "Sắp xếp các dòng sau theo đúng thứ tự để fit `StandardScaler` chỉ trên tập train, biến đổi hàng test không rò rỉ dữ liệu, huấn luyện `LogisticRegression` rồi in kết quả dự đoán."
      explanation: "Import các module con, tạo `scaler`, gọi `fit_transform` trên train, gọi `transform` trên test (bước này đòi hỏi `scaler` đã fit trước), rồi huấn luyện `LogisticRegression` và dự đoán trên `X_te_s`."

flashcards:
  - id: p5-03-f01
    tags: [sklearn, supervised-learning]
    code: |
      model = LogisticRegression(max_iter=1000)
      model.fit(X_train, y_train)
      preds = model.predict(X_test).tolist()
      acc = round(model.score(X_test, y_test), 3)
    en:
      front: "What are the three core methods shared by every `scikit-learn` estimator?"
      back: "`.fit(X_train, y_train)` learns from training data, `.predict(X_new)` outputs predictions, and `.score(X, y)` returns accuracy (classification) or R^2 (regression)."
    vi:
      front: "Ba phương thức cốt lõi mà mọi estimator trong `scikit-learn` dùng chung là gì?"
      back: "`.fit(X_train, y_train)` học từ tập train, `.predict(X_new)` dự đoán cho dữ liệu mới và `.score(X, y)` trả về accuracy (phân loại) hoặc R^2 (hồi quy)."

  - id: p5-03-f02
    tags: [sklearn, data-prep]
    code: |
      X_tr, X_te, y_tr, y_te = train_test_split(
          X, y, test_size=0.25, random_state=42, stratify=y
      )
    en:
      front: "What do `random_state` and `stratify=y` do in `train_test_split`?"
      back: "`random_state` fixes the shuffle seed for reproducibility; `stratify=y` keeps the same class proportions in both `train` and `test`."
    vi:
      front: "`random_state` và `stratify=y` trong `train_test_split` có tác dụng gì?"
      back: "`random_state` cố định hạt giống xáo trộn để kết quả lặp lại được; `stratify=y` giữ nguyên tỉ lệ các lớp ở cả tập `train` lẫn `test`."

  - id: p5-03-f03
    tags: [sklearn, supervised-learning]
    en:
      front: "How do `LogisticRegression`, `KNeighborsClassifier`, and `DecisionTreeClassifier` make predictions?"
      back: "`LogisticRegression` is a linear classifier (weighted sum + threshold); `KNeighborsClassifier` lets the `k` nearest points vote; `DecisionTreeClassifier` follows learned if/else rules."
    vi:
      front: "`LogisticRegression`, `KNeighborsClassifier` và `DecisionTreeClassifier` dự đoán theo nguyên lý nào?"
      back: "`LogisticRegression` là bộ phân loại tuyến tính (tổng có trọng số + ngưỡng); `KNeighborsClassifier` để `k` điểm gần nhất bỏ phiếu; `DecisionTreeClassifier` đi theo cây quy tắc if/else tự học."

  - id: p5-03-f04
    tags: [sklearn, data-prep]
    code: |
      scaler = StandardScaler()
      X_tr_s = scaler.fit_transform(X_train)
      X_te_s = scaler.transform(X_test)
    en:
      front: "Why do we call `fit_transform` on `X_train` and only `transform` on `X_test`?"
      back: "Calling `fit_transform` on `X_test` leaks test statistics (or re-centers test rows to a different scale); `transform(X_test)` reuses the mean and std learned strictly from `X_train`."
    vi:
      front: "Vì sao ta gọi `fit_transform` trên `X_train` nhưng chỉ gọi `transform` trên `X_test`?"
      back: "Gọi `fit_transform` trên `X_test` làm scaler học lại thống kê từ tập test (lệch thang đo / rò rỉ dữ liệu); `transform(X_test)` dùng lại đúng trung bình và độ lệch chuẩn của `X_train`."

  - id: p5-03-f05
    tags: [sklearn, data-prep]
    code: |
      pipe = make_pipeline(StandardScaler(), KNeighborsClassifier(n_neighbors=3))
      pipe.fit(X_train, y_train)
      acc = round(pipe.score(X_test, y_test), 3)
    en:
      front: "What problem does `make_pipeline(...)` solve?"
      back: "It chains preprocessing (`StandardScaler`) and the estimator into one object so `.fit` fits scaling on train only and `.predict`/`.score` transform new inputs automatically without leakage."
    vi:
      front: "`make_pipeline(...)` giải quyết vấn đề gì?"
      back: "Nó ghép bước tiền xử lý (`StandardScaler`) và mô hình thành một object duy nhất để `.fit` chỉ học chuẩn hóa từ train và `.predict`/`.score` tự động biến đổi đầu vào mới mà không rò rỉ dữ liệu."

  - id: p5-03-f06
    tags: [sklearn, evaluation]
    en:
      front: "What three rules make a comparison between two `scikit-learn` models fair?"
      back: "1) Use the exact same train/test split (`random_state`), 2) apply identical preprocessing inside a `Pipeline`, and 3) select the winner strictly by test score (never train score)."
    vi:
      front: "Ba quy tắc nào giúp so sánh hai mô hình `scikit-learn` một cách công bằng?"
      back: "1) Dùng chung một lần chia train/test (`random_state`), 2) tiền xử lý giống nhau bên trong `Pipeline`, và 3) chọn mô hình thắng theo điểm test (không bao giờ chọn theo điểm train)."
