  - id: p4-04-q14
    type: mcq
    tags: [plotting]
    difficulty: 3
    answer: 3
    en:
      prompt: "In a training-vs-validation loss line chart, `train_loss` keeps dropping from epoch 1 to 6 while `val_loss` reaches its minimum at epoch 4 and rises at epochs 5 and 6. What does this usually signal?"
      options:
        - "The learning rate is zero and the model is not updating"
        - "The dataset has duplicate columns"
        - "Matplotlib plotted the y-axis upside down"
        - "Overfitting: the model is memorising the training set instead of improving on unseen validation data"
      explanation: "When training loss keeps falling but validation loss climbs back up, the model is starting to overfit the training data."
    vi:
      prompt: "Trên biểu đồ đường so sánh loss, `train_loss` giảm liên tục từ epoch 1 đến 6 còn `val_loss` chạm đáy ở epoch 4 rồi tăng lại ở epoch 5 và 6. Điều này thường báo hiệu gì?"
      options:
        - "Tốc độ học bằng 0 nên mô hình không hề cập nhật"
        - "Dataset đang bị trùng tên cột"
        - "Matplotlib đang vẽ ngược trục y"
        - "Overfitting: mô hình bắt đầu học thuộc tập train thay vì làm tốt hơn trên dữ liệu validation mới"
      explanation: "Khi training loss tiếp tục giảm nhưng validation loss quay đầu tăng, mô hình đang có dấu hiệu overfit dữ liệu huấn luyện."

  - id: p4-04-q15
    type: output
    tags: [plotting, pandas]
    difficulty: 3
    code: |
      import matplotlib.pyplot as plt
      import pandas as pd
      df = pd.DataFrame({
          "model": ["mini", "pro", "mini", "base"],
          "cost": [0.20, 2.50, 0.30, 1.10],
      })
      totals = df.groupby("model")["cost"].sum().sort_values(ascending=False)
      fig, ax = plt.subplots()
      ax.bar(totals.index.tolist(), totals.tolist())
      print([t.get_text() for t in ax.get_xticklabels()])
    answer: "['pro', 'base', 'mini']"
    en:
      prompt: "What does this code print?"
      explanation: "`totals` sums to `pro: 2.50`, `base: 1.10`, `mini: 0.50`, so descending sorting orders the x-tick labels as `['pro', 'base', 'mini']`."
    vi:
      prompt: "Đoạn code này in ra gì?"
      explanation: "`totals` có tổng `pro: 2.50`, `base: 1.10`, `mini: 0.50`, nên sắp xếp giảm dần đặt nhãn trục x theo thứ tự `['pro', 'base', 'mini']`."

