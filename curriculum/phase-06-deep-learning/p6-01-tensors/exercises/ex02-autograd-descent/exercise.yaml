hints:
  en:
    - |
      This follows §4 (`loss.backward()` and `.grad`) and §5 (`torch.no_grad()` and `.grad.zero_()`). For `xs = torch.tensor([1.0, 2.0])` and `ys = torch.tensor([3.0, 6.0])`, `slope_at(3.0, xs, ys)` is `0.0` because `3.0 * xs` already matches `ys`.
    - |
      The plan:
      1. In `slope_at`, create a fresh leaf tensor `w = torch.tensor(float(w_value), requires_grad=True)`, compute `loss = ((w * xs - ys) ** 2).mean()`, call `loss.backward()`, and return `round(w.grad.item(), 3)`.
      2. In `fit_slope`, initialise `w = torch.tensor(0.0, requires_grad=True)`.
      3. Repeat `steps` times: compute the MSE loss, call `loss.backward()`, update `w -= lr * w.grad` inside `with torch.no_grad():`, and zero `w.grad` with `w.grad.zero_()`.
      4. After the loop, return `round(w.item(), 3)` as a Python `float`.
    - |
      The shape for `fit_slope`:
      ```python
      w = torch.tensor(0.0, requires_grad=True)
      for _ in range(steps):
          loss = ...
          loss.backward()
          with torch.no_grad():
              w -= ...
          ...
      return round(w.item(), 3)
      ```
      Remember to also implement `slope_at` with a fresh tensor on every call so gradients never carry over between calls.
  vi:
