questions:
  - id: p4-02-q01
    type: mcq
    tags: [pandas, data]
    difficulty: 1
    answer: 1
    code: |
      import pandas as pd
      df = pd.DataFrame({"model": ["gpt-4o", "claude"], "score": [0.9, 0.88]})
      col = df["score"]
    en:
      prompt: "What pandas object type is stored in `col`?"
      options: ["`DataFrame`", "`Series`", "`ndarray`", "`dict`"]
      explanation: "A DataFrame is a 2D table, and selecting a single column with `df[\"score\"]` returns a 1D `Series`."
    vi:
      prompt: "Biến `col` chứa đối tượng kiểu gì của pandas?"
      options: ["`DataFrame`", "`Series`", "`ndarray`", "`dict`"]
      explanation: "DataFrame là bảng 2 chiều, và khi chọn một cột đơn lẻ bằng `df[\"score\"]`, kết quả trả về là một `Series` 1 chiều."

